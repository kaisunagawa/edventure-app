<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JIROKU Studio</title>
  <meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#101417" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-iPOMe3E8jVgp/PepuDy7lJvw7L/QP97X5POfi+X1EVyDVQi8Kuv/MooNVB5OFXVN" src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F6F6F9; --card: #FFFFFF; --border: #E5E4EC;
      --text: #1C1B22; --sub: #78767F; --faint: #A5A3AE;
      --accent: #4F46E5; --accent-l: #EEF2FF; --accent-d: #4338CA;
      --green: #16A34A; --green-l: #ECFDF5;
      --amber: #D97706; --amber-l: #FFFBEB;
      --red: #DC2626; --red-l: #FEF2F2;
      --shadow: 0 1px 2px rgba(16,15,30,.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101014; --card: #1A1A21; --border: #2B2B35;
        --text: #F2F0F4; --sub: #9C9AA6; --faint: #6E6C78;
        --accent: #8B85F5; --accent-l: #23213A; --accent-d: #A5A0F8;
        --green: #4ADE80; --green-l: #14301F;
        --amber: #FBBF24; --amber-l: #322414;
        --red: #F87171; --red-l: #331A1A;
        --shadow: 0 1px 2px rgba(0,0,0,.3);
      }
    }
    body { font-family: 'DM Sans', -apple-system, "Hiragino Sans", sans-serif;
      background: var(--bg); color: var(--text); font-size: 14px;
      -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 16px; border: none; border-radius: 10px; background: var(--accent);
      color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
      white-space: nowrap; }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn.ghost { background: var(--card); border: 1px solid var(--border); color: var(--text); font-weight: 600; }
    .btn.sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
    .inp, select.inp, .txa { width: 100%; padding: 9px 11px; border: 1px solid var(--border);
      border-radius: 9px; background: var(--bg); color: var(--text); font-size: 13.5px;
      font-family: inherit; outline: none; }
    .inp:focus, .txa:focus { border-color: var(--accent); }
    .txa { resize: vertical; min-height: 64px; line-height: 1.65; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: var(--shadow); }
    .spin { width: 18px; height: 18px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .pill { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 11px;
      font-weight: 700; line-height: 1.5; white-space: nowrap; }
    /* 数値の桁がそろわないと比較しづらいので等幅にする */
    .num { font-variant-numeric: tabular-nums; }
    .bar { height: 4px; border-radius: 99px; background: var(--border); overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
    a { color: var(--accent); }

    /* 貢献フローは横に並べる。狭い画面で横スクロールにすると必ず見切れるので、
       折り返して全部見えるようにする（矢印は縦並びだと意味を成さないので消す） */
    .flow { display: flex; align-items: stretch; gap: 6px; }
    .flow > .step { flex: 1 1 0; min-width: 100px; }
    @media (max-width: 760px) {
      .flow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .flow > .arw { display: none; }
      .flow > .step { min-width: 0; }
      /* 最後の「JIROKUの行動へ」は2列ぶん使って、流れの終点だと分かるようにする */
      .flow > .step.last { grid-column: 1 / -1; }
    }
    /* 狭い画面では見出しと戻るボタンを縦に分ける（横に押し合って窮屈になる） */
    @media (max-width: 560px) { .hdr-title { flex: 1 1 100% !important; } }
  </style>
</head>
<body>
<div id="root"></div>
<script>
const html = htm.bind(React.createElement);
const { useState, useEffect, useMemo, useCallback } = React;

const GAS_URL = "https://script.google.com/macros/s/AKfycbzJ-QEpPVnmp-LFU5Jxww4VFP1qaseMtwCrzKxAA6ZULr1y3h_UeKzVdhHnl5ze57U/exec";

// ★ログインは本体と共有する★
//   Studioは同じオリジンに置くので、本体のセッションがそのまま使える。
//   ここで別のログインを作ると、入口が二つになって必ず片方が壊れる。
const SESSION_KEY = "jiroku_session";
const USER_KEY = "edventure_user";
const HOME_CACHE_KEY = "studio_home_cache_v1";
function getSession() { try { return localStorage.getItem(SESSION_KEY) || ""; } catch { return ""; } }
function getUser() { try { return JSON.parse(localStorage.getItem(USER_KEY) || "null"); } catch { return null; } }

async function api(action, params = {}) {
  const u = getUser();
  try {
    const r = await fetch(GAS_URL, {
      method: "POST", headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        action, studentEmail: (u && u.email) || "",
        token: getSession() || undefined, ...params })
    });
    return await r.json();
  } catch (e) { return { ok: false, error: "通信できませんでした" }; }
}

// ── 表示のきまり ───────────────────────────────
const RISK_STYLE = {
  "低": { c: "var(--green)", b: "var(--green-l)" },
  "中": { c: "var(--amber)", b: "var(--amber-l)" },
  "高": { c: "var(--red)",   b: "var(--red-l)" }
};
const CONC_STYLE = { "高": "var(--green)", "中": "var(--amber)", "低": "var(--faint)" };
const STATUS_LABEL = { candidate: "候補", scripted: "台本済み", posted: "投稿済み", archived: "見送り" };
// JIROKU本体の6分類。Studio側で別の名前を作らない（軸が増えると本人が混乱する）
const CLASS_LABEL = {
  GOAL_DIRECT: "目標直結", OPERATIONS: "運営", ASSET_BUILD: "資産構築",
  RECOVERY: "回復", RELATIONSHIP: "人間関係",
  RECOVERY_RELATIONSHIP: "回復", UNPLANNED_LEAKAGE: "計画外"
};
const PLATFORMS = [
  { key: "reels", label: "Instagramリール" },
  { key: "post", label: "Instagram通常投稿" },
  { key: "threads", label: "Threads" },
  { key: "x", label: "X（旧Twitter）" },
  { key: "tiktok", label: "TikTok" },
  { key: "shorts", label: "YouTube Shorts" }
];

function Pill({ children, color, bg }) {
  return html`<span class="pill" style=${{ color: color || "var(--sub)", background: bg || "var(--bg)" }}>${children}</span>`;
}

// ── 上部の集計 ─────────────────────────────────
function SummaryStrip({ s }) {
  if (!s) return null;
  const cells = [
    { k: "記録", v: s.log_total, sub: `直近${s.days}日` },
    { k: "発信候補", v: s.candidates, sub: `記録${s.source_used}件から` },
    { k: "台本済み", v: s.scripted, sub: s.rate_script === null ? "—" : `採用率 ${s.rate_script}%` },
    { k: "投稿済み", v: s.posted, sub: s.rate_post === null ? "—" : `投稿率 ${s.rate_post}%` },
    { k: "JIROKUへ還した", v: s.pushed_to_jiroku, sub: "タスク化" },
    { k: "要確認", v: s.needs_check, sub: "機密リスク", warn: s.needs_check > 0 }
  ];
  return html`
    <div style=${{ display: "grid", gap: "12px", gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))", marginBottom: "14px" }}>
      ${cells.map(c => html`
        <div key=${c.k} class="card" style=${{ padding: "14px 16px" }}>
          <div style=${{ fontSize: "11.5px", fontWeight: 700, color: "var(--sub)", marginBottom: "6px" }}>${c.k}</div>
          <div class="num" style=${{ fontSize: "26px", fontWeight: 800, lineHeight: 1.1,
              color: c.warn ? "var(--amber)" : "var(--text)" }}>${c.v}</div>
          <div style=${{ fontSize: "11px", color: "var(--faint)", marginTop: "4px" }}>${c.sub}</div>
        </div>`)}
    </div>`;
}

// 元記録 → 候補 → 台本 → 投稿 → JIROKUへ還す。
// ★最後の矢印まで描く★ 成果で終わらせると、ただのSNSツールになる。
function FlowRow({ s }) {
  if (!s) return null;
  const steps = [
    { l: "元記録", v: s.source_used },
    { l: "発信候補", v: s.candidates },
    { l: "台本", v: s.scripted },
    { l: "投稿", v: s.posted },
    { l: "JIROKUの行動へ", v: s.pushed_to_jiroku, last: true }
  ];
  return html`
    <div class="card" style=${{ padding: "16px 18px", marginBottom: "18px" }}>
      <div style=${{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "14px", flexWrap: "wrap" }}>
        <div style=${{ fontSize: "13px", fontWeight: 800 }}>記録から行動へ戻るまで</div>
        <${Pill} color="var(--accent)" bg="var(--accent-l)">JIROKU独自<//>
      </div>
      <div class="flow">
        ${steps.map((st, i) => html`
          <${React.Fragment} key=${st.l}>
            ${i > 0 && html`<div class="arw" style=${{ alignSelf: "center", color: "var(--faint)", fontSize: "15px", flex: "0 0 auto" }}>→</div>`}
            <div class=${"step" + (st.last ? " last" : "")} style=${{ textAlign: "center",
                background: st.last ? "var(--accent-l)" : "var(--bg)",
                border: st.last ? "1px solid var(--accent)" : "1px solid var(--border)",
                borderRadius: "11px", padding: "11px 8px" }}>
              <div class="num" style=${{ fontSize: "21px", fontWeight: 800,
                  color: st.last ? "var(--accent)" : "var(--text)", lineHeight: 1.15 }}>${st.v}</div>
              <div style=${{ fontSize: "11px", color: "var(--sub)", marginTop: "3px", fontWeight: 600 }}>${st.l}</div>
            </div>
          <//>`)}
      </div>
      <div style=${{ fontSize: "11.5px", color: "var(--faint)", marginTop: "11px", lineHeight: 1.6 }}>
        投稿して終わりにせず、分かったことをJIROKUのタスクに戻すところまでを一本の流れとして数えています。
      </div>
    </div>`;
}

// ── 候補の一覧 ─────────────────────────────────
function CandidateRow({ c, active, onSelect }) {
  const rs = RISK_STYLE[c.risk_level] || RISK_STYLE["中"];
  return html`
    <div onClick=${() => onSelect(c)}
      style=${{ padding: "13px 15px", borderRadius: "12px", cursor: "pointer",
        border: active ? "1.5px solid var(--accent)" : "1px solid var(--border)",
        background: active ? "var(--accent-l)" : "var(--card)", marginBottom: "9px" }}>
      <div style=${{ display: "flex", gap: "10px", alignItems: "flex-start", flexWrap: "wrap" }}>
        <div style=${{ flex: "1 1 240px", minWidth: 0 }}>
          <div style=${{ fontSize: "14px", fontWeight: 700, lineHeight: 1.5, marginBottom: "4px" }}>${c.title || c.hook}</div>
          <div style=${{ fontSize: "12px", color: "var(--sub)", lineHeight: 1.6,
              display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>${c.angle}</div>
          <div style=${{ display: "flex", gap: "5px", flexWrap: "wrap", marginTop: "8px" }}>
            ${c.tags.map(t => html`<${Pill} key=${t} color="var(--accent)" bg="var(--accent-l)">${t}<//>`)}
            ${c.status !== "candidate" && html`<${Pill} color="var(--sub)" bg="var(--bg)">${STATUS_LABEL[c.status]}<//>`}
          </div>
        </div>
        <div style=${{ flex: "0 0 auto", display: "flex", gap: "14px", alignItems: "flex-start" }}>
          <div style=${{ textAlign: "right", minWidth: "52px" }}>
            <div class="num" style=${{ fontSize: "19px", fontWeight: 800, lineHeight: 1.1 }}>${c.content_score}</div>
            <div style=${{ fontSize: "10px", color: "var(--faint)", marginTop: "2px" }}>スコア</div>
            <div class="bar" style=${{ marginTop: "5px", width: "52px" }}><i style=${{ width: c.content_score + "%" }}></i></div>
          </div>
          <div style=${{ textAlign: "right", minWidth: "58px" }}>
            <div style=${{ fontSize: "11px", fontWeight: 700, color: CONC_STYLE[c.concreteness] || "var(--sub)" }}>具体性 ${c.concreteness}</div>
            <div style=${{ marginTop: "6px" }}><${Pill} color=${rs.c} bg=${rs.b}>機密 ${c.risk_level}<//></div>
            <div style=${{ fontSize: "10.5px", color: "var(--faint)", marginTop: "6px" }}>元記録 ${c.source_log_ids.length}件</div>
          </div>
        </div>
      </div>
    </div>`;
}

// ── 元になった記録（紐付けが生きている証拠） ──────────
function SourceList({ sources, missing }) {
  if (!sources || !sources.length) {
    return html`<div style=${{ fontSize: "12.5px", color: "var(--faint)", lineHeight: 1.7 }}>
      元になった記録を特定できませんでした。</div>`;
  }
  return html`
    <div>
      ${sources.map(s => html`
        <div key=${s.log_id} style=${{ padding: "10px 12px", background: "var(--bg)",
            border: "1px solid var(--border)", borderRadius: "10px", marginBottom: "7px" }}>
          <div style=${{ display: "flex", gap: "8px", alignItems: "center", flexWrap: "wrap", marginBottom: "4px" }}>
            <span class="num" style=${{ fontSize: "11.5px", fontWeight: 700, color: "var(--sub)" }}>
              ${s.date}${s.time_block ? " " + String(s.time_block).slice(0, 5) : ""}</span>
            ${s.time_classification && html`<${Pill} color="var(--sub)" bg="var(--card)">${CLASS_LABEL[s.time_classification] || s.time_classification}<//>`}
            ${s.kind === "diary" && html`<${Pill} color="var(--accent)" bg="var(--accent-l)">日記<//>`}
            ${s.actual_minutes > 0 && html`<span class="num" style=${{ fontSize: "11px", color: "var(--faint)" }}>${s.actual_minutes}分</span>`}
          </div>
          <div style=${{ fontSize: "13px", fontWeight: 600, lineHeight: 1.5 }}>${s.task}</div>
          ${s.memo && html`<div style=${{ fontSize: "12.5px", color: "var(--sub)", lineHeight: 1.7, marginTop: "4px", whiteSpace: "pre-wrap" }}>${s.memo}</div>`}
        </div>`)}
      ${missing > 0 && html`<div style=${{ fontSize: "11.5px", color: "var(--amber)", marginTop: "6px" }}>
        ※ ${missing}件は記録が削除されているため表示できません</div>`}
    </div>`;
}

// ── 公開前チェック ──────────────────────────────
function PreflightCheck({ c }) {
  const ok = c.risk_level === "低";
  const items = [
    { l: "機密情報・個人情報の有無", ok: ok, note: c.risk_note },
    { l: "事実確認・数値の正確性", ok: null },
    { l: "第三者の名前が入っていないか", ok: ok },
    { l: "引用・著作権の確認", ok: null }
  ];
  return html`
    <div>
      ${items.map(it => html`
        <div key=${it.l} style=${{ display: "flex", gap: "8px", alignItems: "flex-start",
            padding: "7px 0", borderBottom: "1px solid var(--border)" }}>
          <span style=${{ flex: 1, fontSize: "12.5px", lineHeight: 1.6 }}>${it.l}</span>
          <${Pill} color=${it.ok === true ? "var(--green)" : "var(--amber)"}
                   bg=${it.ok === true ? "var(--green-l)" : "var(--amber-l)"}>
            ${it.ok === true ? "OK" : "要確認"}<//>
        </div>
        ${it.note && html`<div key=${it.l + "n"} style=${{ fontSize: "11.5px", color: "var(--amber)", padding: "5px 0 0", lineHeight: 1.6 }}>${it.note}</div>`}`)}
      <div style=${{ fontSize: "11px", color: "var(--faint)", marginTop: "9px", lineHeight: 1.7 }}>
        「要確認」は自動で判定しきれない項目です。出す前にご自身で見てください。
      </div>
    </div>`;
}

// ── ★JIROKUへ還す★ ここがループの最後の一歩 ─────────
function PushBack({ c, onDone, onToast }) {
  const [open, setOpen] = useState(false);
  const [title, setTitle] = useState("");
  const [saving, setSaving] = useState(false);
  useEffect(() => { setOpen(false); setTitle(""); }, [c.candidate_id]);

  const suggestions = useMemo(() => {
    const t = c.title || c.hook || "この発信";
    return [
      "「" + String(t).slice(0, 22) + "」を撮影する",
      "この切り口で使えそうな出来事を、今週もう1つ記録する",
      "投稿後の保存数を確認して、伸びた理由を書き残す"
    ];
  }, [c.candidate_id]);

  async function save() {
    const t = title.trim();
    if (!t) return;
    setSaving(true);
    const r = await api("studioPushToJiroku", { candidate_id: c.candidate_id, title: t });
    setSaving(false);
    if (r && r.ok) { onToast("JIROKUのタスクに追加しました（" + r.date + "）"); setOpen(false); setTitle(""); onDone && onDone(); }
    else onToast((r && r.error) || "追加できませんでした");
  }

  return html`
    <div class="card" style=${{ padding: "15px 16px", marginTop: "12px", borderColor: "var(--accent)" }}>
      <div style=${{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "4px", flexWrap: "wrap" }}>
        <div style=${{ fontSize: "13px", fontWeight: 800 }}>JIROKUへ還す</div>
        ${c.pushed_task_id && html`<${Pill} color="var(--green)" bg="var(--green-l)">追加済み<//>`}
      </div>
      <div style=${{ fontSize: "11.5px", color: "var(--sub)", lineHeight: 1.7, marginBottom: "11px" }}>
        気づいたことを、明日の行動として本体のタスクに戻します。
      </div>
      ${!open
        ? html`<button class="btn ghost sm" onClick=${() => setOpen(true)}>タスクにする</button>`
        : html`
        <div>
          <div style=${{ display: "flex", flexDirection: "column", gap: "6px", marginBottom: "10px" }}>
            ${suggestions.map(sg => html`
              <button key=${sg} class="btn ghost sm" onClick=${() => setTitle(sg)}
                style=${{ justifyContent: "flex-start", textAlign: "left", whiteSpace: "normal", lineHeight: 1.55 }}>${sg}</button>`)}
          </div>
          <textarea class="txa" style=${{ minHeight: "56px" }} value=${title}
            placeholder="タスクの内容" onInput=${e => setTitle(e.target.value)}></textarea>
          <div style=${{ display: "flex", gap: "8px", marginTop: "9px" }}>
            <button class="btn sm" disabled=${saving || !title.trim()} onClick=${save}>${saving ? "追加中…" : "タスクに追加"}</button>
            <button class="btn ghost sm" onClick=${() => setOpen(false)}>やめる</button>
          </div>
        </div>`}
    </div>`;
}

// ── 候補の詳細 ─────────────────────────────────
function Detail({ id, onClose, onChanged, onToast }) {
  const [c, setC] = useState(null);
  const [busy, setBusy] = useState(false);

  const load = useCallback(async () => {
    setC(null);
    const r = await api("studioGetCandidate", { candidate_id: id });
    if (r && r.ok) setC(r.data); else { onToast((r && r.error) || "読み込めませんでした"); onClose(); }
  }, [id]);
  useEffect(() => { load(); }, [load]);

  async function setStatus(st) {
    setBusy(true);
    const r = await api("studioUpdateCandidate", { candidate_id: id, status: st });
    setBusy(false);
    if (r && r.ok) { onToast(STATUS_LABEL[st] + "にしました"); onChanged(); load(); }
    else onToast((r && r.error) || "変更できませんでした");
  }

  if (!c) return html`
    <div class="card" style=${{ padding: "40px", display: "flex", justifyContent: "center" }}><div class="spin"></div></div>`;

  const b = c.body || {};
  const beats = Array.isArray(b.script_beats) ? b.script_beats : [];
  const rs = RISK_STYLE[c.risk_level] || RISK_STYLE["中"];

  return html`
    <div>
      <div style=${{ display: "flex", alignItems: "flex-start", gap: "10px", marginBottom: "13px" }}>
        <div style=${{ flex: 1, minWidth: 0 }}>
          <div style=${{ fontSize: "16px", fontWeight: 800, lineHeight: 1.5 }}>${c.title || c.hook}</div>
          <div style=${{ display: "flex", gap: "6px", flexWrap: "wrap", marginTop: "8px" }}>
            ${c.tags.map(t => html`<${Pill} key=${t} color="var(--accent)" bg="var(--accent-l)">${t}<//>`)}
            <${Pill} color=${rs.c} bg=${rs.b}>機密リスク ${c.risk_level}<//>
          </div>
        </div>
        <button class="btn ghost sm" onClick=${onClose} aria-label="閉じる">✕</button>
      </div>

      <div style=${{ display: "grid", gap: "10px", gridTemplateColumns: "repeat(auto-fit,minmax(88px,1fr))", marginBottom: "14px" }}>
        ${[["コンテンツスコア", c.content_score], ["共感スコア", c.empathy]].map(([l, v]) => html`
          <div key=${l} class="card" style=${{ padding: "11px 13px" }}>
            <div style=${{ fontSize: "10.5px", color: "var(--sub)", fontWeight: 700 }}>${l}</div>
            <div class="num" style=${{ fontSize: "20px", fontWeight: 800, lineHeight: 1.2 }}>${v}<span style=${{ fontSize: "11px", color: "var(--faint)", fontWeight: 600 }}> /100</span></div>
            <div class="bar" style=${{ marginTop: "6px" }}><i style=${{ width: v + "%" }}></i></div>
          </div>`)}
        <div class="card" style=${{ padding: "11px 13px" }}>
          <div style=${{ fontSize: "10.5px", color: "var(--sub)", fontWeight: 700 }}>具体性</div>
          <div style=${{ fontSize: "20px", fontWeight: 800, lineHeight: 1.2, color: CONC_STYLE[c.concreteness] }}>${c.concreteness}</div>
        </div>
        <div class="card" style=${{ padding: "11px 13px" }}>
          <div style=${{ fontSize: "10.5px", color: "var(--sub)", fontWeight: 700 }}>元記録</div>
          <div class="num" style=${{ fontSize: "20px", fontWeight: 800, lineHeight: 1.2 }}>${c.source_log_ids.length}<span style=${{ fontSize: "11px", color: "var(--faint)", fontWeight: 600 }}> 件</span></div>
        </div>
      </div>

      <div class="card" style=${{ padding: "15px 16px", marginBottom: "12px" }}>
        <div style=${{ fontSize: "12.5px", fontWeight: 800, marginBottom: "10px" }}>元になったJIROKUの記録</div>
        <${SourceList} sources=${c.sources} missing=${c.sources_missing} />
      </div>

      <div class="card" style=${{ padding: "15px 16px", marginBottom: "12px" }}>
        <div style=${{ fontSize: "12.5px", fontWeight: 800, marginBottom: "10px" }}>台本</div>
        <div style=${{ padding: "10px 12px", background: "var(--accent-l)", borderRadius: "10px", marginBottom: "10px" }}>
          <div style=${{ fontSize: "10.5px", fontWeight: 700, color: "var(--accent)", marginBottom: "3px" }}>フック（つかみ）</div>
          <div style=${{ fontSize: "13.5px", lineHeight: 1.7, fontWeight: 600 }}>${c.hook}</div>
        </div>
        ${beats.map((bt, i) => html`
          <div key=${i} style=${{ display: "flex", gap: "9px", padding: "8px 0", borderBottom: i < beats.length - 1 ? "1px solid var(--border)" : "none" }}>
            <span class="num" style=${{ flex: "0 0 20px", fontSize: "11px", fontWeight: 800, color: "var(--faint)", paddingTop: "2px" }}>${i + 1}</span>
            <span style=${{ fontSize: "13px", lineHeight: 1.75 }}>${bt}</span>
          </div>`)}
        ${b.post_text && html`<div style=${{ fontSize: "13px", lineHeight: 1.85, whiteSpace: "pre-wrap" }}>${b.post_text}</div>`}
        ${b.visual_idea && html`<div style=${{ marginTop: "10px", fontSize: "12.5px", color: "var(--sub)", lineHeight: 1.7 }}><b style=${{ color: "var(--text)" }}>画像案：</b>${b.visual_idea}</div>`}
        ${b.caption_idea && html`
          <div style=${{ marginTop: "12px", paddingTop: "12px", borderTop: "1px solid var(--border)" }}>
            <div style=${{ fontSize: "10.5px", fontWeight: 700, color: "var(--sub)", marginBottom: "5px" }}>キャプション案</div>
            <div style=${{ fontSize: "12.5px", lineHeight: 1.8, whiteSpace: "pre-wrap" }}>${b.caption_idea}</div>
          </div>`}
      </div>

      <div class="card" style=${{ padding: "15px 16px", marginBottom: "12px" }}>
        <div style=${{ fontSize: "12.5px", fontWeight: 800, marginBottom: "8px" }}>公開前チェック</div>
        <${PreflightCheck} c=${c} />
      </div>

      <div style=${{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
        <button class="btn sm" disabled=${busy} onClick=${() => setStatus("scripted")}>台本にした</button>
        <button class="btn ghost sm" disabled=${busy} onClick=${() => setStatus("posted")}>投稿した</button>
        <button class="btn ghost sm" disabled=${busy} onClick=${() => setStatus("candidate")}>候補に戻す</button>
        <button class="btn ghost sm" disabled=${busy} onClick=${() => setStatus("archived")}
          style=${{ color: "var(--sub)" }}>見送る</button>
      </div>

      <${PushBack} c=${c} onToast=${onToast} onDone=${() => { onChanged(); load(); }} />
    </div>`;
}

// ── Instagram連携の状態と、取れている数字 ──────────
// ★まだ繋いでいない段階でも、ここに何が起きるかが見えているべき★
//   「近日対応」とだけ書かれた枠は、何も伝えない。
function InstagramPanel({ ig, metrics, posts }) {
  if (!ig || !ig.owner) return null;

  if (!ig.connected) {
    return html`
      <div class="card" style=${{ padding: "15px 16px", marginBottom: "14px" }}>
        <div style=${{ display: "flex", alignItems: "center", gap: "9px", flexWrap: "wrap", marginBottom: "7px" }}>
          <div style=${{ fontSize: "13px", fontWeight: 800 }}>Instagram</div>
          <${Pill} color="var(--sub)" bg="var(--bg)">未連携<//>
        </div>
        <div style=${{ fontSize: "12px", color: "var(--sub)", lineHeight: 1.8 }}>
          ${ig.configured
            ? "連携の準備はできています。リンクを開いて許可すると、毎日この画面に数字が入ります。"
            : "Meta側のアプリを作ってIDを登録すると、リーチ・保存・フォロー増加を毎日自動で取り込めます。"}
        </div>
        ${ig.last_error && html`<div style=${{ fontSize: "11.5px", color: "var(--amber)", marginTop: "8px", lineHeight: 1.7 }}>前回のエラー：${ig.last_error}</div>`}
      </div>`;
  }

  const latest = (metrics && metrics.length) ? metrics[metrics.length - 1] : null;
  const top = (posts || []).slice().sort((a, b) => (Number(b.views) || 0) - (Number(a.views) || 0)).slice(0, 3);
  const n = (posts || []).length;

  return html`
    <div class="card" style=${{ padding: "15px 16px", marginBottom: "14px" }}>
      <div style=${{ display: "flex", alignItems: "center", gap: "9px", flexWrap: "wrap", marginBottom: "12px" }}>
        <div style=${{ fontSize: "13px", fontWeight: 800 }}>Instagram</div>
        <${Pill} color="var(--green)" bg="var(--green-l)">連携中<//>
        ${ig.username && html`<span style=${{ fontSize: "11.5px", color: "var(--sub)" }}>@${ig.username}</span>`}
        <div style=${{ flex: 1 }}></div>
        ${ig.days_left !== null && ig.days_left <= 12 && html`
          <${Pill} color="var(--amber)" bg="var(--amber-l)">接続の期限まで ${ig.days_left}日<//>`}
      </div>

      ${latest && html`
        <div style=${{ display: "grid", gap: "9px", gridTemplateColumns: "repeat(auto-fit,minmax(92px,1fr))", marginBottom: "12px" }}>
          ${[["フォロワー", latest.followers], ["リーチ", latest.reach], ["再生", latest.impressions], ["保存", latest.saves]]
            .filter(([, v]) => v !== "" && v !== null && v !== undefined)
            .map(([l, v]) => html`
              <div key=${l} style=${{ background: "var(--bg)", border: "1px solid var(--border)", borderRadius: "10px", padding: "10px 12px" }}>
                <div style=${{ fontSize: "10.5px", color: "var(--sub)", fontWeight: 700 }}>${l}</div>
                <div class="num" style=${{ fontSize: "18px", fontWeight: 800, lineHeight: 1.25 }}>${Number(v).toLocaleString()}</div>
              </div>`)}
        </div>`}

      ${top.length > 0 && html`
        <div>
          <div style=${{ fontSize: "11.5px", fontWeight: 700, color: "var(--sub)", marginBottom: "7px" }}>よく見られた投稿</div>
          ${top.map(p => html`
            <div key=${p.postId} style=${{ display: "flex", gap: "9px", alignItems: "baseline",
                padding: "7px 0", borderBottom: "1px solid var(--border)" }}>
              <span style=${{ flex: 1, fontSize: "12.5px", lineHeight: 1.6, minWidth: 0,
                  overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>${p.hook || "（キャプションなし）"}</span>
              <span class="num" style=${{ fontSize: "12px", fontWeight: 700, flex: "0 0 auto" }}>${Number(p.views || 0).toLocaleString()}</span>
              <span style=${{ fontSize: "10.5px", color: "var(--faint)", flex: "0 0 auto" }}>再生</span>
            </div>`)}
        </div>`}

      <div style=${{ fontSize: "11px", color: "var(--faint)", marginTop: "10px", lineHeight: 1.7 }}>
        ${n < 12
          ? "投稿" + n + "件ぶんの数字です。傾向を読むにはまだ足りないので、参考としてご覧ください。"
          : "投稿" + n + "件ぶんの数字です。"}
        ${ig.last_sync ? " 最終取得 " + String(ig.last_sync).slice(0, 10) : ""}
      </div>
    </div>`;
}

// ── 生成 ───────────────────────────────────────
function GenerateBar({ onDone, onToast, quota }) {
  const [platform, setPlatform] = useState("reels");
  // ★既定は5本★ 費用の約7割が入力で、本数を増やしてもほとんど増えない。
  //   1回で3本を2回押すより、5本を1回で出すほうが半額以下になる。
  const [count, setCount] = useState(5);
  // ★既定は7日★ 入力が費用の大半で、日数がそのまま効く（14日→7日でおよそ半分）
  const [days, setDays] = useState(7);
  const [busy, setBusy] = useState(false);
  const left = quota ? quota.left : null;
  const out = left !== null && left <= 0;

  async function run() {
    setBusy(true);
    const r = await api("generateSnsIdeas", { platform, count: String(count), days: String(days) });
    setBusy(false);
    if (r && r.ok) { onToast((r.data || []).length + "件の候補ができました"); onDone(); }
    else { onToast((r && r.error) || "生成できませんでした"); onDone(); }
  }

  return html`
    <div class="card" style=${{ padding: "14px 16px", marginBottom: "14px" }}>
     <div style=${{ display: "flex", gap: "10px", alignItems: "flex-end", flexWrap: "wrap" }}>
      <div style=${{ flex: "1 1 190px", minWidth: "160px" }}>
        <div style=${{ fontSize: "11px", fontWeight: 700, color: "var(--sub)", marginBottom: "5px" }}>出す先</div>
        <select class="inp" value=${platform} onChange=${e => setPlatform(e.target.value)}>
          ${PLATFORMS.map(p => html`<option key=${p.key} value=${p.key}>${p.label}</option>`)}
        </select>
      </div>
      <div style=${{ flex: "0 1 110px", minWidth: "96px" }}>
        <div style=${{ fontSize: "11px", fontWeight: 700, color: "var(--sub)", marginBottom: "5px" }}>本数</div>
        <select class="inp" value=${count} onChange=${e => setCount(Number(e.target.value))}>
          ${[2, 3, 5, 8].map(n => html`<option key=${n} value=${n}>${n}本</option>`)}
        </select>
      </div>
      <div style=${{ flex: "0 1 130px", minWidth: "110px" }}>
        <div style=${{ fontSize: "11px", fontWeight: 700, color: "var(--sub)", marginBottom: "5px" }}>さかのぼる</div>
        <select class="inp" value=${days} onChange=${e => setDays(Number(e.target.value))}>
          ${[7, 14, 30, 60].map(n => html`<option key=${n} value=${n}>${n}日</option>`)}
        </select>
      </div>
      <div style=${{ flex: "0 0 auto", display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "4px" }}>
        <button class="btn" disabled=${busy || out} onClick=${run} style=${{ height: "38px" }}>
          ${busy ? html`<${React.Fragment}><span class="spin" style=${{ borderColor: "rgba(255,255,255,.35)", borderTopColor: "#fff" }}></span>記録から探しています…<//>` : "記録から候補を作る"}
        </button>
        ${left !== null && html`
          <div style=${{ fontSize: "11px", color: out ? "var(--amber)" : "var(--faint)", whiteSpace: "nowrap" }}>
            ${out ? "今週の上限に達しました" : `今週あと ${left} 回`}
          </div>`}
      </div>
     </div>
     ${left !== null && html`
       <div style=${{ fontSize: "11.5px", color: "var(--sub)", lineHeight: 1.75,
           marginTop: "11px", paddingTop: "11px", borderTop: "1px solid var(--border)" }}>
         1回で複数本まとめて出せます。分けて押すより、まとめて出すほうが安く済みます（3本を2回＝約38円／8本を1回＝約30円）。
       </div>`}
    </div>`;
}

// ── 全体 ───────────────────────────────────────
function App() {
  const [user] = useState(getUser());
  const [list, setList] = useState(null);
  const [sum, setSum] = useState(null);
  const [sel, setSel] = useState(null);
  const [toast, setToast] = useState("");
  const [showArchived, setShowArchived] = useState(false);

  const onToast = useCallback(m => { setToast(m); setTimeout(() => setToast(""), 3200); }, []);

  const [ig, setIg] = useState(null);
  const [quota, setQuota] = useState(null);
  const [igMetrics, setIgMetrics] = useState([]);
  const [igPosts, setIgPosts] = useState([]);

  // ★通信は1回だけ★ GASは同じ人の呼び出しを順番に処理するので、
  //   5回に分けると待ち時間がそのまま5倍になる。サーバー側でまとめて返す。
  //   それでも往復に4秒前後かかる（Apps Scriptの下限）ので、
  //   前回の内容を先に描いてから裏で取り直す。待たされている感じを消すため。
  const apply = useCallback(d => {
    setList(d.candidates || []);
    setSum(d.summary || null);
    setIg(d.ig || null);
    setIgMetrics(Array.isArray(d.igMetrics) ? d.igMetrics : []);
    setIgPosts(Array.isArray(d.igPosts) ? d.igPosts : []);
    setQuota(d.quota || null);
  }, []);

  const reload = useCallback(async () => {
    const r = await api("studioHome", { limit: 80 });
    if (!r || !r.ok) { setList(l => l === null ? [] : l); return; }
    apply(r.data || {});
    try { localStorage.setItem(HOME_CACHE_KEY, JSON.stringify(r.data || {})); } catch {}
  }, [apply]);
  useEffect(() => {
    if (!user || !getSession()) return;
    try {
      const c = localStorage.getItem(HOME_CACHE_KEY);
      if (c) apply(JSON.parse(c));   // まず前回の内容を出す
    } catch {}
    reload();                        // そのうえで裏で取り直す
  }, [reload, apply]);

  // 本体にログインしていない端末では、ここで別ログインを作らず本体へ送る
  if (!user || !getSession()) {
    return html`
      <div style=${{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: "24px" }}>
        <div class="card" style=${{ padding: "30px 26px", maxWidth: "380px", textAlign: "center" }}>
          <div style=${{ fontSize: "18px", fontWeight: 800, marginBottom: "10px" }}>JIROKU Studio</div>
          <div style=${{ fontSize: "13px", color: "var(--sub)", lineHeight: 1.8, marginBottom: "18px" }}>
            JIROKU本体にログインしてから開いてください。ログインはひとつです。
          </div>
          <a class="btn" href="../index.html" style=${{ textDecoration: "none", color: "#fff" }}>JIROKUを開く</a>
        </div>
      </div>`;
  }

  const shown = (list || []).filter(c => showArchived ? true : c.status !== "archived");

  return html`
    <div style=${{ maxWidth: "1240px", margin: "0 auto", padding: "20px 16px 60px" }}>
      <div style=${{ display: "flex", alignItems: "center", gap: "11px", marginBottom: "18px", flexWrap: "wrap" }}>
        <div class="hdr-title" style=${{ flex: 1, minWidth: 0, display: "flex", alignItems: "center", gap: "11px" }}>
          <div style=${{ width: "32px", height: "32px", borderRadius: "9px", background: "var(--accent)",
              color: "#fff", display: "flex", alignItems: "center", justifyContent: "center",
              fontWeight: 800, fontSize: "14px", flex: "0 0 auto" }}>16</div>
          <div style=${{ minWidth: 0 }}>
            <div style=${{ fontSize: "17px", fontWeight: 800, lineHeight: 1.3 }}>JIROKU Studio</div>
            <div style=${{ fontSize: "11.5px", color: "var(--sub)", marginTop: "1px" }}>あなたの記録から、発信のたねを見つけます</div>
          </div>
        </div>
        <a class="btn ghost sm" href="../index.html" style=${{ textDecoration: "none" }}>JIROKUへ戻る</a>
      </div>

      <${SummaryStrip} s=${sum} />
      <${FlowRow} s=${sum} />
      <${InstagramPanel} ig=${ig} metrics=${igMetrics} posts=${igPosts} />
      <${GenerateBar} onDone=${reload} onToast=${onToast} quota=${quota} />

      <div style=${{ display: "grid", gap: "16px", gridTemplateColumns: sel ? "minmax(0,1fr) minmax(0,1fr)" : "1fr" }}
           class="studio-cols">
        <div>
          <div style=${{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "11px", flexWrap: "wrap" }}>
            <div style=${{ fontSize: "13.5px", fontWeight: 800 }}>発信候補</div>
            <div style=${{ fontSize: "11.5px", color: "var(--faint)" }}>${shown.length}件</div>
            <div style=${{ flex: 1 }}></div>
            <button class="btn ghost sm" onClick=${() => setShowArchived(v => !v)}>
              ${showArchived ? "見送りを隠す" : "見送りも見る"}</button>
          </div>
          ${list === null
            ? html`<div class="card" style=${{ padding: "40px", display: "flex", justifyContent: "center" }}><div class="spin"></div></div>`
            : shown.length === 0
            ? html`<div class="card" style=${{ padding: "34px 22px", textAlign: "center" }}>
                <div style=${{ fontSize: "13.5px", fontWeight: 700, marginBottom: "7px" }}>まだ候補がありません</div>
                <div style=${{ fontSize: "12.5px", color: "var(--sub)", lineHeight: 1.8 }}>
                  上の「記録から候補を作る」を押すと、JIROKUに書いたメモと日記から発信のたねを探します。</div>
              </div>`
            : shown.map(c => html`<${CandidateRow} key=${c.candidate_id} c=${c}
                active=${sel === c.candidate_id} onSelect=${x => setSel(x.candidate_id)} />`)}
        </div>
        ${sel && html`
          <div><${Detail} id=${sel} onClose=${() => setSel(null)}
            onChanged=${reload} onToast=${onToast} /></div>`}
      </div>

      ${toast && html`
        <div style=${{ position: "fixed", left: "50%", bottom: "26px", transform: "translateX(-50%)",
            background: "var(--text)", color: "var(--bg)", padding: "11px 18px", borderRadius: "11px",
            fontSize: "13px", fontWeight: 600, zIndex: 50, maxWidth: "90vw", textAlign: "center",
            boxShadow: "0 6px 22px rgba(0,0,0,.22)" }}>${toast}</div>`}
    </div>`;
}

// 画面が狭いときは2段組みをやめる（横に並べると、どちらも読めなくなる）
const style = document.createElement("style");
style.textContent = "@media (max-width: 860px) { .studio-cols { grid-template-columns: 1fr !important; } }";
document.head.appendChild(style);

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
