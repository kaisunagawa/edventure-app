                return html`<span style=${{flexShrink:0,fontSize:10.5,fontWeight:700,color:L.color,border:"1px solid "+L.color,borderRadius:20,padding:"1px 7px"}} title=${L.hint}>${L.icon}${L.label}</span>`; })()}
              ${dueOf(item)&&html`<span style=${{flexShrink:0,fontSize:10.5,color:quadrantOf(item).overdue?"#dc2626":"var(--sub)",fontWeight:quadrantOf(item).overdue?700:400}}>${dueLabel(dueOf(item), quadrantOf(item).overdue)}</span>`}
              ${estOf(item)>0&&html`<span style=${{flexShrink:0,fontSize:11,fontWeight:600,color:isDone(item)?"var(--sub)":"var(--accent)",background:isDone(item)?"var(--bg)":"var(--accent-l)",borderRadius:20,padding:"2px 8px",marginTop:1}}>⏱${estOf(item)}分</span>`}
            </button>
            </div>`;
          return html`
            ${incompleteItems.length>0
              ? incompleteItems.map((item,i)=>row(item, i<incompleteItems.length-1 || completedItems.length>0))
              : html`<div style=${{padding:"14px 16px",fontSize:12.5,color:"var(--sub)",borderBottom:completedItems.length>0?"1px solid var(--border)":"none"}}>🎉 未完了のタスクはありません。おつかれさまです！</div>`}
            ${completedItems.length>0&&html`
              <button onClick=${()=>setShowDoneTasks(v=>!v)}
                style=${{display:"flex",alignItems:"center",gap:8,width:"100%",background:"var(--bg)",border:"none",padding:"10px 16px",cursor:"pointer",fontFamily:"inherit",textAlign:"left",borderBottom:showDoneTasks?"1px solid var(--border)":"none"}}>
                <span style=${{fontSize:11,color:"var(--accent)",transform:showDoneTasks?"rotate(90deg)":"none",transition:"transform .15s"}}>▶</span>
                <span style=${{fontSize:12,fontWeight:700,color:"var(--sub)"}}>完了</span>
                <span style=${{fontSize:11,color:"#fff",background:"var(--accent)",borderRadius:20,padding:"1px 8px",fontWeight:600}}>${completedItems.length}</span>
              </button>
              ${showDoneTasks && completedItems.map((item,i)=>row(item, i<completedItems.length-1))}
            `}`;
        })()
        : (()=>{
          const COLS=[["todo","予定","📋","var(--sub)"],["doing","実行中","🔥","var(--accent)"],["done","完了","✅","var(--green,#1D9E75)"]];
          const order=["todo","doing","done"];
          const moveStatus=(task,dir)=>{ const i=order.indexOf(statusOf(task)); const n=Math.max(0,Math.min(2,i+dir)); if(n!==i) setStatus(task,order[n]); };
          const chip={fontSize:15,lineHeight:1,color:"var(--sub)",background:"var(--bg)",border:"1px solid var(--border)",borderRadius:8,width:26,height:24,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0};
          const stop=(fn)=>(e)=>{ e.stopPropagation(); fn(); };
          const card=(item)=>{
            const st=statusOf(item);
            return html`<div key=${item} draggable=${boardWide}
              onDragStart=${boardWide?(()=>setDragTask(item)):undefined} onDragEnd=${boardWide?(()=>setDragTask(null)):undefined}
              onClick=${()=>setDetailTask(item)}
              style=${{background:"var(--card)",border:`1px solid ${st==="doing"?"var(--accent)":"var(--border)"}`,borderRadius:10,padding:"10px 11px",marginBottom:8,cursor:"pointer",boxShadow:dragTask===item?"0 4px 14px rgba(0,0,0,0.15)":"none",opacity:dragTask===item?0.5:1,transition:"box-shadow .15s",display:"flex",alignItems:"center",gap:8}}>
              <span style=${{flex:1,minWidth:0,fontSize:13.5,color:st==="done"?"var(--sub)":"var(--text)",textDecoration:st==="done"?"line-through":"none",lineHeight:1.5,overflowWrap:"anywhere"}}>${item}</span>
              ${(()=>{ const q=quadrantOf(item); if(q.quadrant==="DEFER_OR_DELETE"&&!dueOf(item)&&q.isSuggestion) return ""; const L=taskLabel(q.importance,q.urgency);
                return html`<span style=${{flexShrink:0,fontSize:10.5,fontWeight:700,color:L.color,border:"1px solid "+L.color,borderRadius:20,padding:"1px 7px"}} title=${L.hint}>${L.icon}${L.label}</span>`; })()}
              ${dueOf(item)&&html`<span style=${{flexShrink:0,fontSize:10.5,color:quadrantOf(item).overdue?"#dc2626":"var(--sub)",fontWeight:quadrantOf(item).overdue?700:400}}>${dueLabel(dueOf(item), quadrantOf(item).overdue)}</span>`}
              ${estOf(item)>0&&html`<span style=${{flexShrink:0,fontSize:10.5,fontWeight:600,color:"var(--accent)",background:"var(--accent-l)",borderRadius:20,padding:"2px 7px"}}>⏱${estOf(item)}分</span>`}

              ${st!=="done"&&html`<button title="タイマーで計測" aria-label="計測" onClick=${stop(()=>goToTimerWith(item))}
                style=${{...chip,color:"#fff",background:"var(--accent)",border:"none",fontSize:13}}>⏱</button>`}
              ${st!=="todo"&&html`<button title="左の列へ" onClick=${stop(()=>moveStatus(item,-1))} style=${chip}>‹</button>`}
              ${st!=="done"&&html`<button title="右の列へ" onClick=${stop(()=>moveStatus(item,1))} style=${chip}>›</button>`}
            </div>`;
          };
          const column=([key,label,emoji,color])=>{
            const items=actionItems.filter(t=>statusOf(t)===key&&ctxVisible(t));
            return html`<div key=${key}
              onDragOver=${boardWide?(e=>{e.preventDefault();}):undefined}
              onDrop=${boardWide?(()=>{ if(dragTask){ setStatus(dragTask,key); setDragTask(null);} }):undefined}
              style=${{flex:boardWide?"1":"none",minWidth:0,background:"var(--bg)",borderRadius:12,padding:"10px 10px 4px",border:boardWide&&dragTask?"1.5px dashed var(--border)":"1.5px solid transparent"}}>
              <div style=${{display:"flex",alignItems:"center",gap:6,marginBottom:9,padding:"0 2px"}}>
                <span style=${{fontSize:12}}>${emoji}</span>
                <span style=${{fontSize:12,fontWeight:700,color:"var(--text)"}}>${label}</span>
                <span style=${{fontSize:10.5,color:"var(--sub)",fontWeight:600,background:"var(--card)",borderRadius:20,padding:"1px 7px"}}>${items.length}</span>
              </div>
              ${items.length===0
                ? html`<div style=${{fontSize:11,color:"var(--sub)",opacity:.7,padding:"6px 2px 10px"}}>${boardWide?"ここにドラッグ":"—"}</div>`
                : items.map(card)}
            </div>`;
          };
          return html`<div style=${{display:"flex",flexDirection:boardWide?"row":"column",gap:10,padding:"12px",alignItems:"stretch",overflowX:boardWide?"auto":"visible"}}>
            ${COLS.map(column)}
          </div>`;
        })()}
      <button onClick=${openAddTask}
        style=${{display:"flex",alignItems:"center",justifyContent:"center",gap:6,width:"100%",background:"none",border:"none",borderTop:"1px solid var(--border)",padding:"13px 16px",cursor:"pointer",color:"var(--accent)",fontSize:13,fontWeight:600,fontFamily:"inherit"}}>
        <span style=${{fontSize:16,lineHeight:1}}>＋</span> タスクを追加
      </button>
    </div>

    <!-- タスク詳細画面（Trello風カード詳細。状態変更・時間・メモ・計測・削除） -->
    ${detailTask!==null && ReactDOM.createPortal((()=>{
      const t=detailTask, st=statusOf(t);
      const STS=[["todo","予定","📋"],["doing","実行中","🔥"],["done","完了","✅"]];
      return html`<div style=${{position:"fixed",inset:0,height:"100dvh",background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:600}}
        onClick=${e=>{if(e.target===e.currentTarget)setDetailTask(null);}}>
        <div style=${{background:"var(--card)",width:"100%",maxWidth:520,borderRadius:"20px 20px 0 0",padding:"18px 20px calc(20px + env(safe-area-inset-bottom))",maxHeight:"88dvh",overflowY:"auto"}}>
          <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <span style=${{fontSize:11,fontWeight:700,color:"var(--sub)"}}>タスクの詳細</span>
            <button onClick=${()=>setDetailTask(null)} style=${{background:"none",border:"none",fontSize:22,color:"var(--sub)",cursor:"pointer",lineHeight:1}}>×</button>
          </div>
          <div style=${{fontSize:19,fontWeight:800,color:"var(--text)",lineHeight:1.4,marginBottom:16,overflowWrap:"anywhere"}}>${t}</div>

          <label class="form-lbl">状態</label>
          <div style=${{display:"flex",gap:8,marginBottom:16}}>
            ${STS.map(([k,lb,em])=>{
              const on=st===k;
              return html`<button key=${k} onClick=${()=>setStatus(t,k)}
                style=${{flex:1,padding:"10px 4px",borderRadius:10,border:`1.5px solid ${on?"var(--accent)":"var(--border)"}`,background:on?"var(--accent-l)":"transparent",color:on?"var(--accent)":"var(--sub)",fontSize:12.5,fontWeight:on?700:500,cursor:"pointer",fontFamily:"inherit"}}>${em} ${lb}</button>`;
            })}
          </div>

          <label class="form-lbl">重要度</label>
          <div style=${{display:"flex",gap:6,marginBottom:16}}>
            ${[["HIGH","高"],["MEDIUM","中"],["LOW","低"]].map(([v,lb])=>{
              const ik = idOfTitle(t);
              const cur = (ik && taskImportance[ik]) || taskImportance[t];
              const on = (cur||"MEDIUM")===v;
              const set = !!cur;
              return html`<button key=${v} onClick=${()=>setTaskImp(t, v)}
                style=${{flex:1,padding:"10px 4px",borderRadius:10,fontSize:12.5,cursor:"pointer",fontFamily:"inherit",
                         border:`1.5px solid ${on?"var(--accent)":"var(--border)"}`,
                         background:on?"var(--accent-l)":"transparent",
                         color:on?"var(--accent)":"var(--sub)",fontWeight:on?700:500,
                         opacity:(on&&!set)?0.65:1}}>${lb}</button>`;
            })}
          </div>
          ${!((idOfTitle(t)&&taskImportance[idOfTitle(t)])||taskImportance[t]) && html`<div style=${{fontSize:11.5,color:"var(--sub)",marginTop:-12,marginBottom:14}}>
            まだ決めていないので「中」として扱っています。押すと確定します。</div>`}

          <label class="form-lbl">期限</label>
          <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
            <input class="inp" type="date" value=${dueOf(t)}
              onInput=${e=>setTaskDueAt(t, e.target.value)} style=${{width:170,margin:0}}/>
            ${dueOf(t) && html`<button onClick=${()=>setTaskDueAt(t,"")}
              style=${{background:"none",border:"none",color:"var(--sub)",fontSize:12.5,cursor:"pointer",fontFamily:"inherit"}}>期限なしに戻す</button>`}
          </div>
          <div style=${{fontSize:11.5,color:"var(--sub)",marginBottom:16,lineHeight:1.8}}>
            ${(()=>{ const q=quadrantOf(t); const L=taskLabel(q.importance,q.urgency);
              return html`いまの分類：<b style=${{color:L.color}}>${L.icon} ${L.label}</b>（${L.hint}）<br/>
                緊急度は期限から自動で決まります。`; })()}
          </div>

          <label class="form-lbl">想定時間（分）</label>
          <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
            <input class="inp" type="number" inputmode="numeric" value=${estOf(t)} placeholder="例：25"
              onInput=${e=>setTaskTime(t, e.target.value)} style=${{width:110,margin:0,textAlign:"center"}}/>
            <span style=${{fontSize:12.5,color:"var(--sub)"}}>分（タイマーがこの時間で始まります）</span>
          </div>

          <label class="form-lbl">分類（仕事/プライベート）</label>
          <div style=${{display:"flex",gap:6,flexWrap:"wrap",marginBottom:16}}>
            ${[["UNSET","未設定"],["WORK","仕事"],["PERSONAL","プライベート"],["LEARNING","学び"],["HEALTH","健康"],["OTHER","その他"]].map(([v,lb])=>{
              const ck2 = idOfTitle(t);
              const cur = (ck2 && taskContext[ck2]) || taskContext[t] || "UNSET";
              const on = cur === v;
              return html`<button key=${v} onClick=${()=>setTaskCtx(t, v)}
                style=${{padding:"7px 12px",borderRadius:20,fontSize:12,cursor:"pointer",fontFamily:"inherit",
                         border:`1.5px solid ${on?"var(--accent)":"var(--border)"}`,
                         background:on?"var(--accent-l)":"transparent",
                         color:on?"var(--accent)":"var(--sub)",fontWeight:on?700:500}}>${lb}</button>`;
            })}
          </div>

          ${st!=="done"&&html`
            <label class="form-lbl">持ち越し</label>
            ${(()=>{ const cid=idOfTitle(t); const cnt=Number((cid&&taskCarry[cid])||0);
              return cnt>0 ? html`<div style=${{fontSize:11.5,color:"var(--sub)",marginBottom:6}}>これまでに${cnt}回持ち越しています</div>` : ""; })()}
            ${carryPick===null ? html`
              <div style=${{display:"flex",gap:8,marginBottom:16}}>
                <button onClick=${()=>{
                    const d=new Date(); d.setDate(d.getDate()+1);
                    setCarryPick(formatDateStr(d));
                  }}
                  style=${{flex:1,padding:"10px 4px",borderRadius:10,border:"1.5px solid var(--border)",background:"transparent",color:"var(--text)",fontSize:12.5,cursor:"pointer",fontFamily:"inherit"}}>明日へ持ち越す</button>
                <input class="inp" type="date" style=${{width:150,margin:0}}
                  onInput=${e=>{ if(e.target.value && e.target.value!==todayKey) setCarryPick(e.target.value); }}/>
              </div>`
            : html`
              <div style=${{background:"var(--bg)",borderRadius:10,padding:"12px 14px",marginBottom:16}}>
                <div style=${{fontSize:12.5,lineHeight:1.8,marginBottom:10}}>
                  ${todayKey} → <b>${carryPick}</b> へ持ち越します。<br/>
                  タスクは複製されず、同じタスクの日付が変わります。
                  ${(()=>{ const cid=idOfTitle(t); const cnt=Number((cid&&taskCarry[cid])||0);
                    return html`持ち越し回数は ${cnt} → ${cnt+1} になります。`; })()}
                </div>
                <div style=${{display:"flex",gap:8}}>
                  <button class="btn" style=${{flex:1,margin:0}} onClick=${()=>carryOverLocal(t, carryPick)}>持ち越す</button>
                  <button onClick=${()=>setCarryPick(null)}
                    style=${{flex:1,padding:"10px 4px",borderRadius:10,border:"1.5px solid var(--border)",background:"transparent",color:"var(--sub)",fontSize:12.5,cursor:"pointer",fontFamily:"inherit"}}>やめる</button>
                </div>
              </div>`}
          `}

          <label class="form-lbl">メモ</label>
          <textarea class="inp" placeholder="このタスクのメモ・詳細・持ち物など" value=${taskNotes[idOfTitle(t)]||taskNotes[t]||""}
            onInput=${e=>setTaskNote(t, e.target.value)}
            style=${{minHeight:90,resize:"vertical",lineHeight:1.6,fontFamily:"inherit",marginBottom:16}}/>

          <!-- ★保存ボタン★ 各項目は変えた時点で保存されているが、
               「押して確定した」という手応えが無いと不安になる、という声を受けて置く。
               押すと未送信ぶんをすぐ送って閉じる。 -->
          <button class="btn" style=${{marginBottom:10}} onClick=${()=>{ flushTaskQueue(); setDetailTask(null); }}>保存する</button>
          ${st!=="done"&&html`<button onClick=${()=>{ goToTimerWith(t); setDetailTask(null); }}
            style=${{width:"100%",padding:"11px",marginBottom:10,background:"none",border:"1.5px solid var(--accent)",borderRadius:10,color:"var(--accent)",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>⏱ タイマーで計測する</button>`}
          <button onClick=${()=>{ if(confirm("このタスクを削除しますか？")) deleteTask(t); }}
            style=${{width:"100%",padding:"11px",background:"none",border:"1.5px solid var(--border)",borderRadius:10,color:"var(--red,#d33)",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>削除する</button>
        </div>
      </div>`;
    })(), document.body)}

    <!-- ステータス -->
    ${statusSummary&&html`
      <button onClick=${()=>setShowStatusTip(v=>!v)}
        style=${{display:"block",width:"calc(100% - 32px)",margin:"0 16px 10px",background:"var(--card)",borderRadius:16,border:"1px solid var(--border)",overflow:"hidden",textAlign:"left",cursor:"pointer",fontFamily:"inherit",padding:0}}>
        <div style=${{padding:"14px 16px 4px",display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
          <div style=${{fontSize:12,fontWeight:700,color:"var(--text)",letterSpacing:".02em"}}>ステータス</div>
          <div style=${{fontSize:11,color:"var(--sub)"}}>合計 <b style=${{color:"var(--text)",fontSize:14}}>${statusSummary.score}</b> / 100点</div>
        </div>
        <div style=${{padding:"6px 16px 16px",display:"flex",alignItems:"center",gap:14}}>
          <${BreakdownRadar} breakdown=${statusSummary.breakdown}/>
          <div style=${{display:"flex",flexDirection:"column",gap:8,flex:1,minWidth:0}}>
            ${BREAKDOWN_CATS.map(([key])=>{
              const v = Number(statusSummary.breakdown[key]||0);
              const lb = BREAKDOWN_LABELS[key];
              const pct = Math.max(0,Math.min(100,v/20*100));
              return html`<div key=${key}>
                <div style=${{display:"flex",alignItems:"baseline",gap:5,marginBottom:3}}>
                  <span style=${{fontSize:10,fontWeight:800,letterSpacing:"0.3px",color:"var(--text)"}}>${lb.en}</span>
                  <span style=${{fontSize:9,color:"var(--sub)",opacity:0.65}}>${lb.jp}</span>
                  <span style=${{marginLeft:"auto",fontSize:11,fontWeight:700,color:"var(--text)"}}>${v}<span style=${{fontSize:9,color:"var(--sub)",fontWeight:400}}>/20</span></span>
                </div>
                <div style=${{height:4,background:"var(--bg)",borderRadius:99,overflow:"hidden"}}>
                  <div style=${{height:"100%",width:pct+"%",background:"var(--hero1)",borderRadius:99}}/>
                </div>
              </div>`;
            })}
          </div>
        </div>
        ${showStatusTip&&(()=>{
          const weakestKey = BREAKDOWN_CATS.map(([key])=>key).sort((a,b)=>Number(statusSummary.breakdown[a]||0)-Number(statusSummary.breakdown[b]||0))[0];
          const tip = BREAKDOWN_TIPS[weakestKey];
          return html`
            <div style=${{display:"flex",gap:8,alignItems:"flex-start",padding:"12px 16px",borderTop:"1px solid var(--border)",background:"var(--bg)"}}>
              <span style=${{color:"var(--accent)",flexShrink:0,display:"flex"}}><${S} n=${tip.icon} s=${16}/></span>
              <div style=${{fontSize:12,color:"var(--sub)",lineHeight:1.6}}>
                <b style=${{color:"var(--text)"}}>${BREAKDOWN_LABELS[weakestKey].jp}</b>を伸ばすヒント：${tip.text}
              </div>
            </div>
          `;
        })()}
        <div style=${{textAlign:"center",fontSize:10,color:"var(--sub)",padding:"6px 0",borderTop:showStatusTip?"none":"1px solid var(--border)"}}>${showStatusTip?"閉じる ▲":"タップでヒントを見る ▼"}</div>
      </button>
    `}

    <!-- Edit Modal -->
    ${editMode&&html`
      <div style=${{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"flex-end",zIndex:200}}>
        <div style=${{background:"var(--card)",borderRadius:"20px 20px 0 0",padding:"24px 20px 32px",width:"100%",boxSizing:"border-box",maxHeight:"80vh",overflowY:"auto"}}>
          <div style=${{fontSize:17,fontWeight:800,marginBottom:4}}>今日のタスクを編集</div>
          <div style=${{fontSize:12,color:"var(--sub)",marginBottom:16}}>やることと、想定時間（分・任意）を入力できます。タイマーでそのタスクを選ぶと、その時間で始まります。</div>
          ${editItems.map((item,i)=>html`
            <div key=${i} style=${{display:"flex",gap:8,alignItems:"center",marginBottom:10}}>
              <input class="inp" style=${{flex:1,margin:0}} value=${item.text}
                onInput=${e=>{ const a=[...editItems]; a[i]={...a[i],text:e.target.value}; setEditItems(a); }}
                placeholder="タスクを入力..."/>
              <div style=${{display:"flex",alignItems:"center",gap:3,flexShrink:0}}>
                <input class="inp" type="number" inputmode="numeric" min="1" max="600" value=${item.min}
                  onInput=${e=>{ const a=[...editItems]; a[i]={...a[i],min:e.target.value}; setEditItems(a); }}
                  placeholder="分" style=${{width:56,margin:0,textAlign:"center",padding:"10px 6px"}}/>
                <span style=${{fontSize:12,color:"var(--sub)"}}>分</span>
              </div>
              <button onClick=${()=>setEditItems(editItems.filter((_,j)=>j!==i))}
                style=${{background:"none",border:"none",color:"var(--sub)",fontSize:20,cursor:"pointer",flexShrink:0,padding:"0 4px"}}>×</button>
            </div>
          `)}
          <button onClick=${()=>setEditItems([...editItems,{text:"",min:""}])}
            style=${{width:"100%",padding:"10px",borderRadius:10,border:"1.5px dashed var(--border)",background:"none",color:"var(--accent)",fontSize:14,fontWeight:600,cursor:"pointer",marginBottom:16}}>
            ＋ タスクを追加
          </button>
          ${editError && html`<div style=${{background:"#fef2f2",border:"1px solid #fecaca",color:"#b91c1c",
            borderRadius:10,padding:"10px 12px",fontSize:12.5,lineHeight:1.8,marginBottom:10,whiteSpace:"pre-wrap"}}>${editError}</div>`}
          <button class="btn" onClick=${saveEdit} style=${{marginBottom:10}}>保存する</button>
          <button onClick=${()=>setEditMode(false)}
            style=${{width:"100%",background:"none",border:"none",color:"var(--sub)",fontSize:13,padding:"8px",cursor:"pointer"}}>キャンセル</button>
        </div>
      </div>
    `}

    <!-- Schedule -->
    ${schedule.length>0&&html`
      <div style=${{margin:"0 16px 10px",background:"var(--card)",borderRadius:16,border:"1px solid var(--border)",overflow:"hidden"}}>
        <div style=${{padding:"14px 16px",borderBottom:"1px solid var(--border)"}}>
          <div style=${{fontSize:12,fontWeight:700,color:"var(--text)"}}>今日の予定</div>
        </div>
        ${schedule.map((ev,i)=>{
          const hasZoom=isZoom(ev.sub||"");
          return html`<div key=${i} style=${{display:"flex",gap:12,padding:"12px 16px",borderBottom:i<schedule.length-1?"1px solid var(--border)":"none",alignItems:"flex-start"}}>
            <div style=${{fontSize:12,fontWeight:700,color:"var(--accent)",minWidth:42,paddingTop:2,flexShrink:0}}>${ev.time}</div>
            <div style=${{flex:1}}>
              <div style=${{fontSize:14,color:"var(--text)",fontWeight:500}}>${ev.title}</div>
              ${(hasZoom||ev.sub)&&html`<div style=${{fontSize:11,color:"var(--sub)",marginTop:3}}>${hasZoom?"🔗 Zoomリンクあり":ev.sub}</div>`}
            </div>
          </div>`;
        })}
      </div>
    `}
  </div>`;
}

// ── みんなの頑張り ──
const RANK_MEDALS = ["🥇","🥈","🥉"];
function RankingRow({rank, avatar, nickname, isMe, scoreValue, scoreUnit, sub, isLast}) {
  const medal = RANK_MEDALS[rank-1];
  return html`
    <div style=${{display:"flex",alignItems:"center",gap:11,padding:"12px 16px",borderBottom:isLast?"none":"1px solid var(--border)",background:isMe?"var(--accent-l)":"transparent"}}>
      <div style=${{fontSize:medal?18:13,fontWeight:800,color:medal?"inherit":"var(--sub)",width:24,textAlign:"center",flexShrink:0}}>${medal||rank}</div>

// ランキングは全員載せると長くなり見づらいため上位のみに絞る。
// ただし自分の順位は気になるはずなので、上位圏外なら自分の行だけ「…」区切りで下に添える
const RANKING_TOP_N = 5;
function trimRanking(list) {
  if (!list || list.length <= RANKING_TOP_N) return { top: list||[], me: null, meRank: 0 };
  const top = list.slice(0, RANKING_TOP_N);
  const meIdx = list.findIndex(u => u.isMe);
  if (meIdx === -1 || meIdx < RANKING_TOP_N) return { top, me: null, meRank: 0 };
  return { top, me: list[meIdx], meRank: meIdx+1 };
}

function LogScreen({onToast, isActive}) {
  const todayStr = formatDateStr(new Date());
  const [date, setDate] = useState(todayStr);
  const [logs, setLogs] = useState([]);
  const [saving, setSaving] = useState(false);
  const timeRef = useRef(null);
  const timeBlocks = getTimeBlocks();

  const getCurrentBlock = () => {
    const h = new Date().getHours();
    return timeBlocks.find(t => parseInt(t) === h) || timeBlocks[timeBlocks.length - 1] || "09:00-10:00";
  };

  const [block, setBlock] = useState(getCurrentBlock);
  // まとめて記録: multiModeがONの間は、チップのタップで追加の時間帯を
  // 選択でき、1回の保存で全ブロックに同じ内容を書き込む
  const [multiMode, setMultiMode] = useState(false);
  const [extraBlocks, setExtraBlocks] = useState([]);

  const [task, setTask] = useState("");
  const [focus, setFocus] = useState("");
  const [memo, setMemo] = useState("");
  // 「目標に関連している」は毎回チェックし直すのを忘れやすいため、
  // 最後に選んだ状態を記憶して新しい時間帯のデフォルトにする（タイマーと同じ方式）
  const goalRelatedDefault = () => localStorage.getItem("jiroku_log_goal_related") === "true";
  const [goalRelated, setGoalRelated] = useState(goalRelatedDefault);

  // カレンダー予定の自動入力。端末キャッシュ→本人認証→サーバー共有
  // キャッシュの順にまず自動で試すが、Safari等でサードパーティCookieが
  // ブロックされていると裏側の認証自体が失敗し続けることがあるため、
  // 自動取得できなかった場合だけ手動で読み込むボタンを出す
  const [dayEvents, setDayEvents] = useState(null);
  const [calNeedsTap, setCalNeedsTap] = useState(false);
  const autoFillRef = useRef("");
  useEffect(()=>{
    if(!isActive) return;
    setCalNeedsTap(false);
    fetchCalendarEvents(date).then(evs=>{
      if(evs) setDayEvents(evs);
      else setCalNeedsTap(true);
    });
  },[date, isActive]);
  const loadCalByTap=()=>{
    fetchCalendarEvents(date, true).then(evs=>{
      if(evs){ setDayEvents(evs); setCalNeedsTap(false); onToast("予定を読み込みました"); flushCalendarQueue(); }
      else onToast("予定の読み込みに失敗しました");
    });
  };
  // 未記録ブロックを選んだとき、入力が空なら予定タイトルを自動セット
  useEffect(()=>{
    if(!dayEvents) return;
    if(logs.find(l=>l.time_block===block)) return;
    const titles=eventsForBlock(dayEvents, block);
    if(titles.length===0){
      if(task===autoFillRef.current && task!=="") { setTask(""); autoFillRef.current=""; }
      return;
    }
    const suggestion=titles.join("、");
    if(task==="" || task===autoFillRef.current){ setTask(suggestion); autoFillRef.current=suggestion; }
  },[block, dayEvents, logs]);

  // ブロック切替時に既存ログを読み込んでフォームに反映。
  // lastLoadedRefには「フォームに最後に流し込んだ値」を控えておき、
  // 裏で取得した最新データを反映してよいか（=ユーザーが編集を始めて
  // いないか）の判定に使う
  const lastLoadedRef = useRef({task:"",focus:"",memo:"",goalRelated:false});
  // 保存ボタンを押す前に他のタブに切り替えて戻ってきても、入力途中の内容が
  // 消えないよう、時間帯ごとに下書きをlocalStorageへ自動保存しておく
  const DRAFT_LS = "jiroku_log_draft_";
  const draftKey = (d, b) => DRAFT_LS + d + "_" + b;
  const loadBlockData = (b, currentLogs) => {
    const existing = currentLogs.find(l => l.time_block === b);
    let v;
    if (existing) {
      v = {task:existing.task||"", focus:existing.focus_level||"", memo:existing.memo||"", goalRelated:existing.goal_related==="true"||existing.goal_related===true};
    } else {
      let draft = null;
      try{ draft = JSON.parse(localStorage.getItem(draftKey(date, b))||"null"); }catch(e){}
      v = draft || {task:"", focus:"", memo:"", goalRelated:goalRelatedDefault()};
    }
    setTask(v.task); setFocus(v.focus); setMemo(v.memo); setGoalRelated(v.goalRelated);
    lastLoadedRef.current = v;
  };

  const handleBlockSelect = (b) => {
    setBlock(b);
    loadBlockData(b, logs);
  };

  // チップタップ: 通常は選択切り替え。まとめて記録モード中は追加選択のON/OFF
  const handleChipTap = (b) => {
    if(!multiMode){ handleBlockSelect(b); return; }
    if(b===block) return; // 基準ブロックは外せない
    setExtraBlocks(prev => prev.includes(b) ? prev.filter(x=>x!==b) : [...prev, b]);
  };
  const toggleMultiMode = () => {
    setMultiMode(v=>{ if(v) setExtraBlocks([]); return !v; });
  };

  // 現在のフォーム値・選択ブロックを非同期コールバックから読むためのミラー
  const formRef = useRef(null);
  formRef.current = {task, focus, memo, goalRelated};
  const curBlockRef = useRef(block);
  curBlockRef.current = block;

  // 入力するたびに下書きを保存しておく（空なら消す）。保存済みログと同じ内容を
  // 保存し直すだけの場合も無害なので、既存ログかどうかは区別せずそのまま保存する
  useEffect(()=>{
    const k = draftKey(date, block);
    if(!task.trim() && !memo.trim()){ localStorage.removeItem(k); return; }
    try{ localStorage.setItem(k, JSON.stringify({task, focus, memo, goalRelated})); }catch(e){}
  },[task, focus, memo, goalRelated, date, block]);
  // 保存のたびに増やすバージョン番号。背景取得（getLogs）が開始した後に保存が
  // 行われた場合、その取得結果は保存前の古いデータなので適用しない判定に使う
  const saveVersionRef = useRef(0);

  // 記録タブの読み込み: まず端末キャッシュで即座に画面を組み立て（体感ゼロ秒）、
  // 最新データはGASから裏で取得して静かに差し替える。以前はGASの応答
  // （数百ms〜数秒）を待ってから画面を作っていたため遅く感じられていた
  const LOGS_LS="jiroku_logs_";
  useEffect(()=>{
    if(!isActive) return;
    let cached=null;
    try{ cached=JSON.parse(localStorage.getItem(LOGS_LS+date)||"null"); }catch(e){}
    const base = cached||[];
    setLogs(base);
    const def = isToday(date) ? getCurrentBlock() : (base[0]?.time_block || timeBlocks[0]);
    setBlock(def);
    setMultiMode(false); setExtraBlocks([]);
    loadBlockData(def, base);
    setTimeout(()=>{ const el=timeRef.current?.querySelector(".chip.on"); if(el) el.scrollIntoView({inline:"center",behavior:"smooth"}); },100);

    const versionAtFetchStart = saveVersionRef.current;
    gasApi("getLogs",{date}).then(r=>{
      if(!r.ok) return;
      // この取得が始まった後に保存が完了していた場合、この結果は保存前の古い
      // スナップショットなので適用しない（保存直後に「済み」マークやチェックが
      // 一瞬消える競合状態を防ぐ。ローカル側は既に保存内容で最新になっている）
      if(saveVersionRef.current !== versionAtFetchStart) return;
      const data = r.data;
      try{
        localStorage.setItem(LOGS_LS+date, JSON.stringify(data));
        const limit=addDays(formatDateStr(new Date()),-7);
        Object.keys(localStorage).forEach(k=>{
          if(k.startsWith(LOGS_LS)&&k.slice(LOGS_LS.length)<limit) localStorage.removeItem(k);
          if(k.startsWith(DRAFT_LS)&&k.slice(DRAFT_LS.length)<limit) localStorage.removeItem(k);
        });
      }catch(e){}
      // 記録タブでその日を表示した時にも、カレンダー未反映の記録を補完する
      // （独り言などの直近の記録を、ホームに戻らなくてもここで同期する）
      if(localStorage.getItem("cal_linked")) reconcileCalendarForDate(date, data);
      setLogs(data);
      // ユーザーがまだ入力を始めていない場合だけ、選択中ブロックのフォームも最新化
      const f=formRef.current, l=lastLoadedRef.current;
      if(f.task===l.task && f.focus===l.focus && f.memo===l.memo && f.goalRelated===l.goalRelated){
        loadBlockData(curBlockRef.current, data);
      }
    });
  },[date, isActive]);

  const save = async ()=>{
    if(!task.trim()) return;
    setSaving(true);
    saveVersionRef.current++;
    // まとめて記録: 選択された全ブロックを1回のリクエストで保存する。
    // メモが長くなるとURLの長さ制限に引っかかる可能性があるため、GETのURL
    // パラメータではなくPOSTのボディで送る（gasPostJson）
    const blocks = [block, ...extraBlocks].sort((a,b)=>a>b?1:-1);
    const payload = {
      date,
      task: task.trim(), focus_level: focus, memo: memo.trim(),
      goal_related: goalRelated ? "true" : "false",
    };
    if(blocks.length>1) payload.time_blocks = blocks.join(",");
    else payload.time_block = block;
    const res = await gasPostJson(blocks.length>1 ? "saveLogMulti" : "saveLog", payload);
    if(!res.ok){ onToast("保存に失敗しました。もう一度お試しください"); setSaving(false); return; }
    if(res.xp_gained){ const lv=res.level_up?`  →  Lv.${res.level} へ！`:""; onToast(`+${res.xp_gained} XP 獲得${lv}`); }
    else onToast(res.updated?"記録を上書きしました":(blocks.length>1?blocks.length+"個の時間帯に保存しました":"保存しました"));
    // 保存内容が分かっているので再取得せず、ローカルの一覧をその場で更新する
    // （サーバーへの往復が倍になり保存が重く感じられるのを防ぐ）
    let next = [...logs];
    blocks.forEach(b=>{
      const saved = {time_block:b, task:task.trim(), focus_level:focus, memo:memo.trim(), goal_related:goalRelated?"true":"false"};
      const i = next.findIndex(l=>l.time_block===b);
      if(i>=0) next[i] = {...next[i], ...saved}; else next.push(saved);
    });
    next.sort((a,b)=>a.time_block>b.time_block?1:-1);
    setLogs(next);
    try{ localStorage.setItem(LOGS_LS+date, JSON.stringify(next)); }catch(e){}
    // 保存できたので、対象ブロック分の下書きは不要になった
    blocks.forEach(b=>{ try{ localStorage.removeItem(draftKey(date, b)); }catch(e){} });
    if(blocks.length>1){ setMultiMode(false); setExtraBlocks([]); }
    setSaving(false);
    // Googleカレンダーへ書き戻し（連携済みのときだけ・待たずに裏で実行）。
    // 元の予定とタイトルが完全一致するブロックだけ、新規作成せずその予定に
    // ✅を追加する（内容が違う場合は別イベントとして作成し、予定の文言を守る）
    const taskTrimmed = task.trim();
    blocks.forEach(b=>{
      const stt = new Date(date+"T"+b.slice(0,5)+":00");
      if(isNaN(stt)) return;
      const exactMatch = exactEventForBlock(dayEvents, b, taskTrimmed);
      upsertCalendarEvent(date, b, stt.toISOString(), new Date(stt.getTime()+3600000).toISOString(), taskTrimmed, exactMatch ? exactMatch.id : null);
    });
  };

  // 間違えて記録した時間帯を削除する（編集画面で「何をしましたか」とメモを空にして
  // 削除ボタンを押すと、その時間帯の記録が消える）
  const del = async ()=>{
    if(saving) return;
    if(!confirm("この記録を削除しますか？")) return;
    setSaving(true);
    saveVersionRef.current++;
    const res = await gasPostJson("deleteLog", { date, time_block: block });
    if(!res||!res.ok){ onToast("削除に失敗しました。もう一度お試しください"); setSaving(false); return; }
    const next = logs.filter(l=>l.time_block!==block);
    setLogs(next);
    try{ localStorage.setItem(LOGS_LS+date, JSON.stringify(next)); }catch(e){}
    try{ localStorage.removeItem(draftKey(date, block)); }catch(e){}
    setTask(""); setMemo("");
    onToast("記録を削除しました");
    setSaving(false);
  };

  // タイマー記録は分単位の時間帯キー(例: 14:05-14:20)で保存されるため、手動記録の
  // 1時間枠チップ(例: 14:00-15:00)と文字列が一致しない。チップの「済み」表示は、
  // その時間帯の開始時が枠の1時間以内に収まっているログがあれば済みとみなす
  const recordedHours = new Set(logs.map(l => String(l.time_block||"").slice(0,2)).filter(Boolean));
  const recorded = { has: t => recordedHours.has(t.slice(0,2)) };
  // 手動記録は「HH:00-HH:00」の1時間枠、タイマー記録は実測の分単位キーで保存されるため、
  // 同じ1時間の中に複数の記録が混在しうる。選択中のブロックと同じ時間の他の記録を
  // 一覧で見せて、上書きではなく別記録として追加される旨も明示する
  const isFullHourBlock = tb => /^\d{2}:00-\d{2}:00$/.test(String(tb||""));
  const hourSiblingLogs = logs.filter(l => l.time_block!==block && String(l.time_block||"").slice(0,2)===block.slice(0,2));

  return html`<div>
    <div class="ph">
      <div class="ph-title-accent">記録を入力</div>
      <div class="date-nav">
        <button onClick=${()=>setDate(addDays(date,-1))}>‹</button>
        <span>${isToday(date)?"今日":date}</span>
        <button onClick=${()=>setDate(addDays(date,1))} disabled=${isToday(date)}>›</button>
      </div>
    </div>

    <div>
      <div ref=${timeRef} class="time-bar">
        ${timeBlocks.map(t=>html`<button key=${t}
          class=${"chip"+((block===t||extraBlocks.includes(t))?" on":"")+(recorded.has(t)?" done":"")}
          onClick=${()=>handleChipTap(t)}>${t}</button>`)}
      </div>
      <div class="form-wrap">
        <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,gap:8}}>
          <div style=${{fontSize:12,color:"var(--sub)"}}>
            ${multiMode
              ? `⧉ ${1+extraBlocks.length}個の時間帯を選択中（チップをタップで追加）`
              : !isToday(date) ? "🗓 過去の記録を追加・編集できます（XPは付きません）" : recorded.has(block) ? "✏️ 記録済み（編集できます）" : "📝 未記録"}
          </div>
          <button onClick=${toggleMultiMode}
            style=${{flexShrink:0,padding:"4px 10px",borderRadius:20,border:`1.5px solid ${multiMode?"var(--accent)":"var(--border)"}`,background:multiMode?"var(--accent)":"transparent",color:multiMode?"#fff":"var(--sub)",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
            ${multiMode?"選択をやめる":"⧉ まとめて記録"}
          </button>
        </div>
        ${calNeedsTap&&html`
          <button onClick=${loadCalByTap} style=${{display:"flex",alignItems:"center",gap:8,width:"100%",padding:"10px 14px",marginBottom:12,borderRadius:10,border:"1.5px dashed var(--accent)",background:"var(--accent-l)",color:"var(--accent)",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
            📅 タップしてカレンダーの予定を読み込む
          </button>
        `}
        ${hourSiblingLogs.length>0&&html`
          <div style=${{background:"var(--accent-l)",border:"1px solid var(--accent)",borderRadius:10,padding:"10px 12px",marginBottom:12}}>
            <div style=${{fontSize:12,fontWeight:700,color:"var(--accent)",marginBottom:6}}>⏱ この時間帯には他に${hourSiblingLogs.length}件の記録があります</div>
            ${hourSiblingLogs.map(l=>html`
              <div key=${l.time_block} onClick=${()=>handleBlockSelect(l.time_block)}
                style=${{display:"flex",justifyContent:"space-between",gap:8,padding:"4px 0",cursor:"pointer"}}>
                <span style=${{fontSize:11.5,color:"var(--sub)",flexShrink:0}}>${l.time_block}</span>
                <span style=${{fontSize:11.5,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${l.task}</span>
              </div>
            `)}
            <div style=${{fontSize:10.5,color:"var(--sub)",marginTop:4}}>ここで保存すると上書きではなく別の記録として追加されます</div>
          </div>
        `}
        <div class="form-grp">
          <label class="form-lbl">何をしましたか？</label>
          <input class="inp" placeholder="例：資料作成、家事、勉強など" value=${task} onInput=${e=>setTask(e.target.value)} />
          ${task!==""&&task===autoFillRef.current&&html`
            <div style=${{fontSize:11,color:"var(--accent)",marginTop:5,display:"flex",alignItems:"center",gap:4}}>
              📅 カレンダーの予定から自動入力しました（編集できます）
            </div>
          `}
        </div>
        <div class="form-grp">
          <button onClick=${()=>{const v=!goalRelated;setGoalRelated(v);localStorage.setItem("jiroku_log_goal_related",String(v));}} style=${{display:"flex",alignItems:"center",gap:8,background:"none",border:`1.5px solid ${goalRelated?"var(--accent)":"var(--border)"}`,borderRadius:9,padding:"7px 11px",width:"100%",cursor:"pointer",transition:"all .15s",backgroundColor:goalRelated?"var(--accent-l)":"transparent"}}>
            <div style=${{width:16,height:16,borderRadius:5,border:`2px solid ${goalRelated?"var(--accent)":"var(--border)"}`,background:goalRelated?"var(--accent)":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all .15s"}}>
              ${goalRelated&&html`<svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
            </div>

          </button>
        </div>
        <div class="form-grp">
          <label class="form-lbl">自己評価</label>
          <${EvalPicker} value=${focus} onChange=${setFocus}/>
        </div>
        <div class="form-grp">
          <div style=${{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8}}>
            <label class="form-lbl" style=${{marginBottom:0}}>メモ（必須）</label>
            <span style=${{fontSize:10.5,color:"var(--sub)",whiteSpace:"nowrap"}}>うまくできたか・感じたこと・改善点</span>
          </div>
          <textarea class="txa" style=${{marginTop:6,maxHeight:280,overflowY:"auto"}}
            placeholder="うまくいった点、感じたこと、次はこうしたい、など" value=${memo}
            onInput=${e=>{setMemo(e.target.value);e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,280)+"px";}}
            ref=${el=>{if(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,280)+"px";}}} />
        </div>
        ${(()=>{
          const isEditing = recorded.has(block);
          const cleared = !task.trim() && !memo.trim();
          // 既存の記録で、内容を空にした状態＝削除の意図。ボタンを「削除」に切り替えて有効化する
          if(isEditing && cleared){
            return html`<button class="btn" onClick=${del} disabled=${saving} style=${{background:"var(--red)"}}>${saving?html`<span class="spin"/>`:"この記録を削除する"}</button>`;
          }
          return html`<button class="btn" onClick=${save} disabled=${!task.trim()||!memo.trim()||saving}>${saving?html`<span class="spin"/>`:isEditing?"更新する":"保存する"}</button>`;
        })()}
      </div>
    </div>

    ${logs.length>0&&html`
      <div class="card" style=${{marginBottom:24}}>
        <div class="card-label">${isToday(date)?"本日の記録":date+" の記録"}</div>
        ${logs.map((l,i)=>{
          const num=l.focus_level?.charAt(0);
          const isTimer = !isFullHourBlock(l.time_block);
          // 集中度「5 — 完璧にできた」を「数字」と「ラベル」に分解して、チップに整える
          const focusStr = String(l.focus_level||"");
          const focusLabel = focusStr.replace(/^\s*\d+\s*[—–-]\s*/,"").trim();
          return html`<div key=${i} class="log-row" style=${{cursor:"pointer"}} onClick=${()=>{handleBlockSelect(l.time_block);window.scrollTo?.(0,0);}}>
            <div class="log-time">${isTimer?"⏱ ":""}${l.time_block}</div>
            <div>
              <div class="log-task">${l.task}</div>

              ${l.memo&&html`<div class="log-memo">${l.memo}</div>`}
            </div>
          </div>`;
        })}
      </div>
    `}
  </div>`;
}

// スコア推移グラフ（直近14日）
function ScoreTrend({list}) {
  if(!list || list.length < 2) return null;
  const pts = [...list].slice(0,14).reverse(); // 古い→新しい
  const W=320, H=96, PX=14, PT=12, PB=20;
  const iw=W-PX*2, ih=H-PT-PB;
  const x=i=>PX+(pts.length===1?iw/2:i*(iw/(pts.length-1)));
  const y=s=>PT+ih-(Math.max(0,Math.min(100,s))/100)*ih;
  const path=pts.map((p,i)=>`${i===0?"M":"L"}${x(i).toFixed(1)},${y(p.score).toFixed(1)}`).join(" ");
  const area=`${path} L${x(pts.length-1).toFixed(1)},${PT+ih} L${x(0).toFixed(1)},${PT+ih} Z`;
  const avg=Math.round(pts.reduce((s,p)=>s+p.score,0)/pts.length);
  const diff=pts.length>=2?pts[pts.length-1].score-pts[0].score:0;
  const fmtMD=d=>{const [,m,dd]=(d||"").substring(0,10).split("-");return Number(m)+"/"+Number(dd);};
  return html`
    <div class="card" style=${{marginBottom:8}}>
      <div style=${{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:4}}>
        <div class="card-label" style=${{marginBottom:0}}>レポートスコア推移（直近${pts.length}回）</div>
        <div style=${{fontSize:11,color:"var(--sub)"}}>平均 <b style=${{color:"var(--text)"}}>${avg}</b>点
          <span style=${{marginLeft:8,color:diff>0?"var(--green)":diff<0?"var(--red)":"var(--sub)",fontWeight:600}}>${diff>0?"↑":diff<0?"↓":"→"}${Math.abs(diff)}</span>
        </div>
      </div>
      <svg viewBox=${`0 0 ${W} ${H}`} style=${{width:"100%",height:"auto",display:"block"}}>
        ${[25,50,75].map(g=>html`<line key=${g} x1=${PX} x2=${W-PX} y1=${y(g)} y2=${y(g)} stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"/>`)}
        <path d=${area} fill="var(--accent)" opacity="0.08"/>
        <path d=${path} fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        ${pts.map((p,i)=>html`<circle key=${i} cx=${x(i)} cy=${y(p.score)} r=${i===pts.length-1?4:2.5} fill=${i===pts.length-1?"var(--accent)":"var(--card)"} stroke="var(--accent)" stroke-width="1.5"/>`)}
        <text x=${x(0)} y=${H-4} font-size="9" fill="var(--sub)" text-anchor="start">${fmtMD(pts[0].date)}</text>
        <text x=${x(pts.length-1)} y=${H-4} font-size="9" fill="var(--sub)" text-anchor="end">${fmtMD(pts[pts.length-1].date)}</text>
      </svg>
    </div>`;
}

// 振り返り（数値化＋事実の整理＋自分の日記）
// この日の数値サマリー（レポートのスコアの直下に置く）
function JournalStats({logs}) {
  const goalBlocks=logs.filter(l=>l.goal_related==="true"||l.goal_related===true).length;
  const goalPct=logs.length?Math.round(goalBlocks/logs.length*100):0;
  const focusNums=logs.map(l=>parseInt(l.focus_level)||0).filter(n=>n>0);
  const avgFocus=focusNums.length?(focusNums.reduce((a,b)=>a+b,0)/focusNums.length).toFixed(1):"−";
  const memoCount=logs.filter(l=>l.memo&&l.memo.trim()).length;
  return html`<div class="card">
    <div class="card-label">この日の数値</div>
    <div style=${{display:"flex",gap:8}}>
      ${[["記録",logs.length+"時間"],["目標関連",goalBlocks+"時間 ("+goalPct+"%)"],["平均集中",avgFocus+" / 5"],["メモ",memoCount+"個"]].map(([l,v])=>html`
        <div key=${l} style=${{flex:1,background:"var(--bg)",borderRadius:10,padding:"10px 6px",textAlign:"center"}}>
          <div style=${{fontSize:13,fontWeight:800,color:"var(--accent)",lineHeight:1.3}}>${v}</div>
          <div style=${{fontSize:10,color:"var(--sub)",marginTop:3}}>${l}</div>
        </div>
      `)}
    </div>
  </div>`;
}

function JournalSection({date, logs}) {
  const [diary,setDiary]=useState("");
  const [autoSummary,setAutoSummary]=useState("");
  const [summaryLoading,setSummaryLoading]=useState(true);
  const [loaded,setLoaded]=useState(false);
  const [saving,setSaving]=useState(false);
  const [savedMsg,setSavedMsg]=useState(false);
  const [events,setEvents]=useState(null);
  useEffect(()=>{
    setDiary(""); setAutoSummary(""); setSummaryLoading(true); setLoaded(false); setEvents(null); setSavedMsg(false);
    gasApi("getDiary",{date}).then(r=>{
      if(r.ok&&r.data){ setDiary(r.data.diary||""); setAutoSummary(r.data.autoSummary||""); }
      setLoaded(true); setSummaryLoading(false);
    });
    if(localStorage.getItem("cal_linked")) fetchCalendarEvents(date).then(setEvents);
  },[date]);
  const save=async()=>{
    setSaving(true);
    try{
      await fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
        body:JSON.stringify({action:"saveDiary",studentEmail:CURRENT_USER.email,date,diary})});
      setSavedMsg(true); setTimeout(()=>setSavedMsg(false),2500);
    }catch{}
    setSaving(false);
  };

  // 予定と記録の対比: 予定の時間帯と重なる記録があるか（時間の重なり優先、なければタイトル一致で補完）
  const isDone=(ev)=>{
    if(!ev.allDay && ev.startHour!=null){
      const byTime=logs.some(l=>{ const lh=parseInt(l.time_block); return !isNaN(lh) && lh < ev.endHour && (lh+1) > ev.startHour; });
      if(byTime) return true;
    }
    return logs.some(l=>l.task&&(l.task.includes(ev.title)||ev.title.includes(l.task)));
  };

  return html`<div>
    <!-- この日の数値 -->
    ${logs.length>0&&html`<${JournalStats} logs=${logs}/>`}

    <!-- 時間ログ＋カレンダーをもとにAIが事実だけを整理したまとめ -->
    ${logs.length>0&&html`
      <div class="card">
        <div class="card-label">📋 この日の事実まとめ（AI）</div>
        ${summaryLoading
          ? html`<div style=${{display:"flex",justifyContent:"center",padding:16}}><div class="spin" style=${{borderColor:"var(--border)",borderTopColor:"var(--accent)",width:18,height:18,borderWidth:2}}/></div>`
          : autoSummary
            ? html`<p style=${{fontSize:14,lineHeight:1.8,color:"var(--text)"}}>${autoSummary}</p>`
            : html`<div style=${{fontSize:12,color:"var(--sub)"}}>まとめを生成できませんでした</div>`
        }
      </div>
    `}

    <!-- 自分の日記 -->
    <div class="card">
      <div class="card-label" style=${{display:"flex",alignItems:"center",gap:6}}><${S} n="pencil" s=${12}/>日記</div>
      <textarea class="txa" style=${{minHeight:110}} placeholder="この日を自由に振り返って書き残せます"
        value=${diary} onInput=${e=>setDiary(e.target.value)} disabled=${!loaded}/>
      <button class="btn" onClick=${save} disabled=${saving||!loaded} style=${{marginTop:10}}>
        ${saving?html`<span class="spin"/>`:"日記を保存"}
      </button>
      ${savedMsg&&html`<div style=${{fontSize:12,color:"var(--green)",fontWeight:600,textAlign:"center",marginTop:8}}>保存しました ✓</div>`}
    </div>

    <!-- 予定と実績 -->
    ${events&&events.length>0&&html`
      <div class="card">
        <div class="card-label">予定と実績</div>
        <div style=${{fontSize:11,color:"var(--sub)",marginBottom:10,lineHeight:1.6}}>予定の時間帯に記録があれば「記録あり」になります</div>
        ${events.map((ev,i)=>html`
          <div key=${i} style=${{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:i<events.length-1?"1px solid var(--border)":"none"}}>
            <div style=${{fontSize:11,fontWeight:600,color:"var(--sub)",minWidth:42,flexShrink:0}}>${ev.time}</div>
            <div style=${{flex:1,fontSize:13,color:"var(--text)"}}>${ev.title}</div>
            <div style=${{fontSize:11,fontWeight:600,flexShrink:0,color:isDone(ev)?"var(--green)":"var(--sub)"}}>${isDone(ev)?"✓ 記録あり":"記録なし"}</div>
          </div>
        `)}
      </div>
    `}

    <!-- 時間ログ -->
    ${logs.length>0&&html`
      <div class="card" style=${{marginBottom:24}}>
        <div class="card-label">時間ログ</div>
        ${logs.map((l,i)=>{
          const num=l.focus_level?.charAt(0);
          return html`<div key=${i} class="log-row">
            <div class="log-time">${l.time_block}</div>
            <div><div class="log-task">${l.task}</div><div class="log-meta"><span class="dot" style=${{background:DOT[num]||"var(--sub)"}}/>${l.focus_level}${l.memo?` · ${l.memo}`:""}</div></div>
          </div>`;
        })}
      </div>
    `}
  </div>`;
}

function BreakdownRadar({breakdown}) {
  const N = BREAKDOWN_CATS.length;
  const cx = 80, cy = 80, maxR = 54, maxVal = 20;
  const startAngle = -Math.PI/2;
  const angleStep = (Math.PI*2)/N;
  const pt = (i, frac, r) => {
    const a = startAngle + i*angleStep;
    return [cx + Math.cos(a)*r*frac, cy + Math.sin(a)*r*frac];
  };
  const ringFracs = [0.25,0.5,0.75,1];
  const ringPoints = ringFracs.map(f => BREAKDOWN_CATS.map((_,i)=>pt(i,f,maxR).join(",")).join(" "));
  const axisEnds = BREAKDOWN_CATS.map((_,i)=>pt(i,1,maxR));
  const dataPoints = BREAKDOWN_CATS.map(([key],i)=>{
    const v = Math.max(0,Math.min(maxVal,Number(breakdown[key]||0)));
    return pt(i, v/maxVal, maxR);
  });
  const dataPolygon = dataPoints.map(p=>p.join(",")).join(" ");
  const labelPos = BREAKDOWN_CATS.map((_,i)=>pt(i,1,maxR*1.27));
  const gid = "radarGrad";

  return html`
    <svg width="160" height="160" viewBox="0 0 160 160" style=${{flexShrink:0}}>
      <defs>
        <linearGradient id=${gid} x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--hero1)"/>
          <stop offset="100%" stop-color="var(--hero2)"/>
        </linearGradient>
      </defs>
      ${ringPoints.map((pts,i)=>html`<polygon key=${i} points=${pts} fill="none" stroke="var(--border)" stroke-width="1"/>`)}
      ${axisEnds.map((p,i)=>html`<line key=${i} x1=${cx} y1=${cy} x2=${p[0]} y2=${p[1]} stroke="var(--border)" stroke-width="1"/>`)}
      <polygon points=${dataPolygon} fill=${`url(#${gid})`} fill-opacity="0.32" stroke=${`url(#${gid})`} stroke-width="2.5" stroke-linejoin="round"/>
      ${dataPoints.map((p,i)=>html`<circle key=${i} cx=${p[0]} cy=${p[1]} r="3" fill="var(--hero1)"/>`)}
      ${BREAKDOWN_CATS.map(([key],i)=>{
        const [lx,ly] = labelPos[i];
        return html`<text key=${key} x=${lx} y=${ly+3} text-anchor="middle" font-size="10" font-weight="400" fill="var(--sub)" opacity="0.6" style=${{fontFamily:"inherit"}}>${BREAKDOWN_LABELS[key].jp}</text>`;
      })}
    </svg>
  `;
}

      const rawActions = JSON.parse(localStorage.getItem("jiroku_custom_actions_"+todayKey)||"[]")||[];

// 目覚まし時計のような「ピピピ」という電子音をWeb Audio APIのオシレーターで
// その場で合成する（録音済みサンプルではなく矩形波のビープ音を鳴らす）。
// 1グループ=短いビープを3回（ピピピ）、グループの間に少し間を空けて繰り返す
const ALARM_STYLES = [
  { key:"soft",     label:"ソフト",     freq:1800, beepMs:110, gapMs:110, groups:2, groupGapMs:450, gain:0.45 },
  { key:"standard", label:"スタンダード", freq:2400, beepMs:120, gapMs:120, groups:2, groupGapMs:450, gain:0.6 },
  { key:"strong",   label:"しっかり",   freq:3000, beepMs:130, gapMs:100, groups:2, groupGapMs:350, gain:0.75 },
];
const getAlarmStyle = () => ALARM_STYLES.find(s=>s.key===localStorage.getItem("timer_alarm_style")) || ALARM_STYLES[1];
let sharedAudioCtx = null;
function getSharedAudioCtx() {
  // iOSはバックグラウンドに回るとAudioContextを勝手にclosedにすることがあるため、
  // その場合は作り直す（closedのcontextはresumeできず、音が一切鳴らなくなる）
  if(!sharedAudioCtx || sharedAudioCtx.state === "closed") sharedAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return sharedAudioCtx;
}
// 音が鳴らせなかった時の保険: クリック音サンプルを連打してアラーム代わりにする
// （HTMLAudioはWeb Audioと復帰条件が異なるため、片方が死んでいても鳴る可能性がある）
let fallbackAlarmEl = null;
function playFallbackAlarm() {
  try {
    if(!fallbackAlarmEl) fallbackAlarmEl = new Audio(TIMER_CLICK_SRC);
    fallbackAlarmEl.volume = 1;
    let n = 0;
    const rep = () => { if(n++>=6) return; fallbackAlarmEl.currentTime = 0; fallbackAlarmEl.play().catch(()=>{}); setTimeout(rep, 250); };
    rep();
  } catch(e){}
}
// 指定スタイルで「ピピピ…」を合成して鳴らす。テスト再生・タイマー完了時の両方から呼ばれる
function scheduleAlarmBeeps(style) {
  const ctx = getSharedAudioCtx();
  // iOSでは電話やバックグラウンド遷移後に"interrupted"や"suspended"のまま戻ってくる。
  // resumeは非同期なので、完了を待ってからオシレーターを組み立てる（suspended中に
  // 組み立てると鳴らないことがある）。0.6秒待っても復帰しなければ保険の音に切り替える
  if(ctx.state !== "running") {
    let done = false;
    const p = ctx.resume && ctx.resume();
    if(p && p.then) {
      p.then(()=>{ if(!done){ done = true; buildAlarmBeeps(ctx, style); } }).catch(()=>{ if(!done){ done = true; playFallbackAlarm(); } });
      setTimeout(()=>{ if(!done){ done = true; playFallbackAlarm(); } }, 600);
      return;
    }
  }
  buildAlarmBeeps(ctx, style);
}
function buildAlarmBeeps(ctx, style) {
  const beepsPerGroup = 3;
  const beepSec = style.beepMs/1000, gapSec = style.gapMs/1000;
  const groupDurSec = beepsPerGroup*(beepSec+gapSec);
  let t = ctx.currentTime;
  for(let g=0; g<style.groups; g++){
    for(let b=0; b<beepsPerGroup; b++){
      const start = t + b*(beepSec+gapSec);
      const osc = ctx.createOscillator();
      osc.type = "square";
      osc.frequency.value = style.freq;
      const gain = ctx.createGain();
      // クリックノイズが出ないよう、立ち上がり・立ち下がりを短くフェードする
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(style.gain, start+0.005);
      gain.gain.setValueAtTime(style.gain, start+beepSec-0.01);
      gain.gain.linearRampToValueAtTime(0, start+beepSec);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start+beepSec+0.02);
    }
    t += groupDurSec + style.groupGapMs/1000;
  }
}

// ── Chat ──
function TimerScreen({onToast, isActive}) {
  const getPresets = () => JSON.parse(localStorage.getItem("timer_presets")||"[25,45,60]");
  const getBreak   = () => Number(localStorage.getItem("timer_break")||"5");

  const loadTimerState = () => {
    try {
      const s = JSON.parse(localStorage.getItem("jiroku_timer_state")||"null");
      if (!s) return null;
      // 実行中だった場合、経過時間を差し引いて残り時間を計算
      if (s.isRunning && s.savedAt) {
        const elapsed = Math.floor((Date.now() - s.savedAt) / 1000);
        s.timeLeft = Math.max(0, s.timeLeft - elapsed);
      }
      return s;
    } catch(e) { return null; }
  };

  const saved = loadTimerState();
  const defaultMin = getPresets()[0];

  const [breakMin]       = useState(getBreak);
  const [selectedMin, setSelectedMin] = useState(saved?.selectedMin ?? defaultMin);
  // 休憩の入れ方: 25分以下の短い集中は休憩なし。25分を超えたら休憩を挟む
  // （45分→10分、60分超→15分）。休憩0＝そのまま次の集中へ戻す
  const breakForFocus = (min) => min <= 25 ? 0 : (min <= 45 ? 10 : 15);
  const [activeBreakMin, setActiveBreakMin] = useState(0);
  // 集中セッション後に「休憩へ入る／休憩なしで集中に戻す」を切り替える
  const goToBreakOrReset = () => {
    const bm = breakForFocus(selectedMin);
    setStartTime(null);
    if(bm > 0){ setActiveBreakMin(bm); setMode("break"); setTimeLeft(bm*60); }
    else { setMode("focus"); setTimeLeft(selectedMin*60); }
  };
  const [timeLeft, setTimeLeft]       = useState(saved?.timeLeft ?? defaultMin*60);
  const [isRunning, setIsRunning]     = useState(saved?.isRunning ?? false);
  const [mode, setMode]               = useState(saved?.mode ?? "focus");
  const [sessionCount, setSessionCount] = useState(saved?.sessionCount ?? 0);
  const [task, setTask]               = useState(saved?.task ?? "");
  const [startTime, setStartTime]     = useState(saved?.startTime ? new Date(saved.startTime) : null);
  const [showModal, setShowModal]     = useState(false);
  // タイマー完了の記録モーダルが開いている間は、自動アップデートのリロードを保留させる
  // （メモ入力中に画面が突然消えるのを防ぐ）。data-entry-openをルート要素に立てる
  useEffect(()=>{
    if(showModal) document.documentElement.setAttribute("data-entry-open","1");
    else document.documentElement.removeAttribute("data-entry-open");
    return ()=>document.documentElement.removeAttribute("data-entry-open");
  },[showModal]);
  // タイマー完了後の記録をワンタップで確定できるよう、自己評価は初期値を入れておく
  // （毎回5段階から選び直す手間を減らす。もちろん自由に変更できる）
  const [logFocus, setLogFocus]       = useState("4 — よくできた");
  const [logMemo, setLogMemo]         = useState("");
  const [logGoalRelated, setLogGoalRelated] = useState(()=>localStorage.getItem("jiroku_timer_goal_related")!=="false");
  const [saving, setSaving]           = useState(false);
  // 今回のセッションの実測結果（予定◯分に対して実際◯分集中したか）。
  // 途中で終えた場合も分単位で記録できるよう、モーダルを開く時点で確定させる
  const [sessionResult, setSessionResult] = useState(null); // {planned, actual} | null

  // ホーム画面の「今日のタスク」を、タイマーの集中対象としてもワンタップで選べるようにする。
  // 各項目は {text, min}（minは想定時間・分）。古い形式（ただの文字列）にも後方互換で対応する
  const normTaskOpts = (items) => (items||[]).map(it => (typeof it==="string" ? {text:it, min:null} : {text:String(it.text||""), min:(it.min||null)})).filter(o=>o.text);
  const readTodayActions = () => {
    try {
      const s = JSON.parse(localStorage.getItem("jiroku_today_actions_shared")||"null");
      if (s && s.date === formatDateStr(new Date())) return normTaskOpts(s.items);
    } catch(e){}
    return [];
  };
  const [todayActionOptions, setTodayActionOptions] = useState(readTodayActions);
  useEffect(()=>{
    if(!isActive) return;
    setTodayActionOptions(readTodayActions());
    // ボードのカードから「⏱測る」で遷移してきた場合、そのタスクを自動でセットして開始する
    try{
      const p = JSON.parse(localStorage.getItem("jiroku_timer_pending_task")||"null");
      localStorage.removeItem("jiroku_timer_pending_task");
      if(p && p.date===formatDateStr(new Date()) && p.text && !isRunning){
        setTask(p.text);
        const m = Number(p.min);
        if(m>0){ setSelectedMin(m); setTimeLeft(m*60); }
      }
    }catch(e){}
  },[isActive]);

  // 状態をlocalStorageに保存
  useEffect(()=>{
    localStorage.setItem("jiroku_timer_state", JSON.stringify({
      selectedMin, timeLeft, isRunning, mode, sessionCount,
      task, startTime: startTime?.toISOString()||null, savedAt: Date.now()
    }));
  },[selectedMin, timeLeft, isRunning, mode, sessionCount, task, startTime]);

  // タブに戻った時にプリセット設定を再読込
  const [presets, setPresets] = useState(getPresets);
  useEffect(()=>{ if(isActive) setPresets(getPresets()); },[isActive]);

  // スタート/一時停止は短いクリック音、完了は目覚まし時計風の「ピピピ」ビープで区別する
  const clickElRef = useRef(null);
  const getClickEl = () => {
    if(!clickElRef.current) clickElRef.current = new Audio(TIMER_CLICK_SRC);
    return clickElRef.current;
  };
  const primeAudio = () => {
    try {
      const el = getClickEl();
      el.volume = 0.5;
      el.currentTime = 0;
      el.play().catch(()=>{});
    } catch(e){}
    // ユーザー操作のタイミングでAudioContextを再開しておく
    // （タイマー終了時はユーザー操作の外なので、ここで準備しておかないと鳴らせないことがある）
    try {
      const ctx = getSharedAudioCtx();
      if(ctx.state === "suspended") ctx.resume();
    } catch(e){}
    try { navigator.vibrate?.(60); } catch(e){}
  };
  const playBeep = () => {
    try { scheduleAlarmBeeps(getAlarmStyle()); } catch(e){}
    // 音が出せない環境（マナーモード等）でも気づけるよう振動も併用（アラームらしく長めのパターンに）
    try { navigator.vibrate?.([300,150,300,150,300,150,300]); } catch(e){}
  };

  // バックグラウンド復帰時に経過時間を補正する
  const timeLeftRef = useRef(timeLeft);
  const isRunningRef = useRef(isRunning);
  const selectedMinRef = useRef(selectedMin);
  const modeRef = useRef(mode);
  const taskRef = useRef(task);
  useEffect(()=>{ timeLeftRef.current = timeLeft; },[timeLeft]);
  useEffect(()=>{ isRunningRef.current = isRunning; },[isRunning]);
  useEffect(()=>{ selectedMinRef.current = selectedMin; },[selectedMin]);
  useEffect(()=>{ modeRef.current = mode; },[mode]);
  useEffect(()=>{ taskRef.current = task; },[task]);

  // タイマーの時間が終了した＝そのタスクは完了とみなす。
  // ①今日のタスクに自動でチェックを付け（today_actions）、②タイマーの選択肢から消す。
  // 集中対象が「今日のタスク」の項目に一致する時だけ実行する（フリー入力の時は何もしない）。
  // ホーム側はチェック状態を再読込して✓を反映＆共有リストを更新する。
  const completeTaskIfListed = (taskText) => {
    const t = String(taskText||"").trim();
    if(!t) return;
    if(!todayActionOptions.some(o=>o.text===t)) return; // 今日のタスク由来でなければ対象外
    try {
      // ★完了状態は task_id をキーにする★
      //   ホーム画面側が id キーで持つようになったので、ここだけ名前で
      //   書くと「タイマーで終わらせたのにホームで未完了のまま」になる。
      const d0 = new Date();
      const dayKey = d0.getFullYear()+"-"+String(d0.getMonth()+1).padStart(2,"0")+"-"+String(d0.getDate()).padStart(2,"0");
      let tid = t;
      try {
        const raw = JSON.parse(localStorage.getItem("jiroku_custom_actions_"+dayKey)||"[]")||[];
        const hit = normalizeTaskList(raw).find(x=>x.title===t);
        if (hit) tid = hit.id;
      } catch(e){}
      const checked = JSON.parse(localStorage.getItem("today_actions")||"{}");
      if(!checked[tid] && !checked[t]){
        checked[tid] = true;
        if (tid !== t) delete checked[t];   // 旧形式の掃除
        localStorage.setItem("today_actions", JSON.stringify(checked));
        gasPostJson("saveTodayActions", {checked: JSON.stringify(checked), noBridge: "1"}); // 他端末にも同期
        if (tid !== t) enqueueTaskMutation("UPDATE", tid, { status: "DONE" });   // Tasksシートへも
      }
      // 共有リスト（タイマーの選択肢）からも即座に除外
      const shared = JSON.parse(localStorage.getItem("jiroku_today_actions_shared")||"null");
      if(shared && Array.isArray(shared.items)){
        shared.items = shared.items.filter(it=> (typeof it==="string"?it:String(it.text||"")) !== t);
        localStorage.setItem("jiroku_today_actions_shared", JSON.stringify(shared));
      }
    } catch(e){}
    setTodayActionOptions(opts=>opts.filter(o=>o.text!==t));
  };

  // アプリが閉じられていても気づけるよう、開始時にLINE通知をGAS側に予約し、
  // 一時停止・リセット・アプリ内で完了を検知できたときは予約を取り消す
  const scheduleEndNotify = (secondsLeft, currentMode) => {
    const endTime = Date.now() + secondsLeft*1000;
    const label = currentMode==="focus" ? "集中セッション" : "休憩";
    gasPost("scheduleTimerEnd", {endTime, label});
  };
  const cancelEndNotify = () => { gasPost("cancelTimerEnd"); };

  useEffect(()=>{
    const onVisible = () => {
      if(document.visibilityState === 'visible' && isRunningRef.current) {
        try {
          const s = JSON.parse(localStorage.getItem("jiroku_timer_state")||"null");
          if(s && s.isRunning && s.savedAt) {
            const elapsed = Math.floor((Date.now() - s.savedAt) / 1000);
            const corrected = Math.max(0, s.timeLeft - elapsed);
            setTimeLeft(corrected);
            if(corrected <= 0) {
              setIsRunning(false);
              playBeep();
              cancelEndNotify(); // アプリ内で気づけたのでLINE通知は不要
              if(modeRef.current === "focus"){ setSessionCount(c=>c+1); setSessionResult({planned:selectedMinRef.current, actual:selectedMinRef.current}); completeTaskIfListed(taskRef.current); setShowModal(true); }
              else { setMode("focus"); setTimeLeft(selectedMinRef.current*60); }
            }
          }
        } catch(e){}
      }
    };
    document.addEventListener('visibilitychange', onVisible);
    return ()=>document.removeEventListener('visibilitychange', onVisible);
  },[]);

  useEffect(()=>{
    if(!isRunning) return;
    if(timeLeft<=0){
      setIsRunning(false);
      playBeep();
      cancelEndNotify(); // アプリ内で気づけたのでLINE通知は不要
      if(mode==="focus"){ setSessionCount(c=>c+1); setSessionResult({planned:selectedMin, actual:selectedMin}); completeTaskIfListed(task); setShowModal(true); }
      else { setMode("focus"); setTimeLeft(selectedMin*60); }
      return;
    }
    const t = setTimeout(()=>setTimeLeft(s=>s-1), 1000);
    return ()=>clearTimeout(t);
  },[isRunning, timeLeft]);

  const selectPreset = (min) => {
    setSelectedMin(min); setTimeLeft(min*60);
    setIsRunning(false); setStartTime(null); setMode("focus");
    cancelEndNotify();
  };
  const start = () => {
    primeAudio();
    if(!startTime) setStartTime(new Date());
    setIsRunning(true);
    scheduleEndNotify(timeLeft, mode);
  };
  // 指定した分数でその場からタイマーを開始する（今日のタスクの想定時間で始めるのに使う）
  const startWithMinutes = (min) => {
    primeAudio();
    setSelectedMin(min); setTimeLeft(min*60); setMode("focus");
    setStartTime(new Date()); setIsRunning(true);
    scheduleEndNotify(min*60, "focus");
  };
  // 今日のタスクを選んだ時の挙動：ラベルをセットし、想定時間があればその時間でタイマー開始
  const selectTaskOption = (opt) => {
    if(isRunning) return;
    if(task===opt.text){ setTask(""); return; } // もう一度タップで選択解除
    setTask(opt.text);
    if(opt.min && Number(opt.min)>0) startWithMinutes(Number(opt.min));
  };
  const pause = () => { primeAudio(); setIsRunning(false); cancelEndNotify(); };
  const reset = () => { setIsRunning(false); setTimeLeft(selectedMin*60); setStartTime(null); setMode("focus"); setTask(""); setSessionResult(null); localStorage.removeItem("jiroku_timer_state"); cancelEndNotify(); };

  const saveLog = async () => {
    setSaving(true);
    const st = startTime||new Date();
    const endDt = new Date(st.getTime() + (sessionResult?sessionResult.actual:selectedMin)*60000);
    const fmtHM = d => String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
    // 同じ1時間内に複数回タイマーで測っても記録が上書きされないよう、時間帯キーは
    // 「HH:00-HH:00」の固定枠ではなく、実際の開始〜終了の分単位にする（1回ごとに別の記録として残る）
    const timeBlock = fmtHM(st)+"-"+fmtHM(endDt);
    // 予定に対する実測の集中時間を、メモの末尾に分単位で自動追記する
    // （レポート生成のAIにも渡るため、計画実行力のフィードバック材料になる）
    const timerNote = sessionResult ? `⏱ 集中${sessionResult.actual}分（予定${sessionResult.planned}分）` : "";
    const memoToSave = [logMemo.trim(), timerNote].filter(Boolean).join("\n");
    // メモが長くなるとURLの長さ制限に引っかかる可能性があるため、GETのURL
    // パラメータではなくPOSTのボディで送る（gasPostJson）
    const calTitle = task.trim()||`ポモドーロ${sessionResult?sessionResult.actual:selectedMin}分集中`;
    const res = await gasPostJson("saveLog", {
      time_block: timeBlock,
      task: calTitle,
      focus_level: logFocus,
      memo: memoToSave,
      goal_related: logGoalRelated?"true":"false",
    });
    if(!res.ok){ onToast("記録に失敗しました。もう一度お試しください"); setSaving(false); return; }
    if(res.xp_gained){ const lv=res.level_up?` → Lv.${res.level}！`:""; onToast(`+${res.xp_gained} XP 獲得${lv}`); }
    else onToast(res.updated?"記録を更新しました":"記録しました");
    // タイマー記録は1時間枠ではなく「実際に集中した開始〜終了時刻」でカレンダーに書き戻す
    // （同じ時間帯キーを使うので、手動記録側で作ったイベントがあれば実測時刻に更新される）
    upsertCalendarEvent(formatDateStr(st), timeBlock, st.toISOString(), endDt.toISOString(), calTitle);
    setSaving(false); setShowModal(false); setLogMemo(""); setTask(""); setSessionResult(null);
    goToBreakOrReset();
  };
  const skipLog = () => { setShowModal(false); setTask(""); setSessionResult(null); goToBreakOrReset(); };

  const mins = Math.floor(timeLeft/60);
  const secs = timeLeft%60;
  const totalSec = (mode==="focus"?selectedMin:(activeBreakMin||breakMin))*60;
  const pct = Math.max(0,Math.min(100,((totalSec-timeLeft)/totalSec)*100));
  const r=90, circ=2*Math.PI*r, offset=circ*(1-pct/100);
  const accentColor = mode==="break"?"var(--green)":"var(--accent)";

  return html`<div style=${{paddingBottom:32}}>
    <div class="ph">
      <div class="ph-title-accent">ポモドーロタイマー</div>
    </div>
    <div style=${{padding:"0 16px"}}>

      <div style=${{display:"flex",gap:8,marginBottom:24}}>
        ${presets.map(min=>html`
          <button key=${min} onClick=${()=>!isRunning&&selectPreset(min)}
            style=${{flex:1,padding:"10px 0",borderRadius:10,border:`1.5px solid ${selectedMin===min?"var(--accent)":"var(--border)"}`,
            background:selectedMin===min?"var(--accent-l)":"var(--card)",color:selectedMin===min?"var(--accent)":"var(--sub)",
            fontWeight:600,fontSize:14,cursor:isRunning?"default":"pointer",opacity:isRunning&&selectedMin!==min?0.4:1}}>
            ${min}分
          </button>
        `)}
      </div>

      <div style=${{position:"relative",width:220,height:220,margin:"0 auto",marginBottom:20}}>
        <svg width="220" height="220" viewBox="0 0 220 220" style=${{position:"absolute",top:0,left:0}}>
          <circle cx="110" cy="110" r=${r} fill="none" stroke="var(--border)" stroke-width="10"/>
          <circle cx="110" cy="110" r=${r} fill="none" stroke=${accentColor} stroke-width="10"
            stroke-dasharray=${circ} stroke-dashoffset=${offset}
            stroke-linecap="round" transform="rotate(-90 110 110)"
            style=${{transition:"stroke-dashoffset 1s linear"}}/>
        </svg>
        <div style=${{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <div style=${{fontSize:46,fontWeight:800,color:"var(--text)",lineHeight:1,fontVariantNumeric:"tabular-nums"}}>
            ${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}
          </div>
          <div style=${{fontSize:13,color:mode==="break"?"var(--green)":"var(--sub)",marginTop:8}}>
            ${mode==="focus"?`集中中 · 第${sessionCount+1}セッション`:`休憩中 · 第${sessionCount}セッション完了`}
          </div>
        </div>
      </div>

      ${mode==="focus"&&html`
        <div class="form-grp" style=${{marginBottom:16}}>
          ${!isRunning && todayActionOptions.length>0 && html`
            <div style=${{marginBottom:14}}>
              <div style=${{fontSize:10.5,fontWeight:700,letterSpacing:".04em",color:"var(--sub)",marginBottom:7}}>今日のタスクから選ぶ（⏱想定時間つきはその時間で開始）</div>
              <div style=${{display:"flex",flexDirection:"column",gap:6}}>
                ${todayActionOptions.map((a,i)=>{
                  const on=task===a.text;
                  return html`
                    <button key=${i} onClick=${()=>selectTaskOption(a)}
                      style=${{display:"flex",alignItems:"center",gap:8,width:"100%",textAlign:"left",padding:"10px 12px",borderRadius:10,border:`1.5px solid ${on?"var(--accent)":"var(--border)"}`,background:on?"var(--accent-l)":"var(--bg)",cursor:"pointer",fontFamily:"inherit"}}>
                      <span style=${{fontSize:13,flexShrink:0,opacity:on?1:.7}}>🎯</span>
                      <span style=${{flex:1,minWidth:0,fontSize:12.5,fontWeight:on?700:500,color:on?"var(--accent)":"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${a.text}</span>
                      ${a.min>0&&html`<span style=${{flexShrink:0,fontSize:11,fontWeight:600,color:on?"var(--accent)":"var(--sub)"}}>⏱${a.min}分</span>`}
                      ${on&&html`<span style=${{flexShrink:0,fontSize:12,color:"var(--accent)"}}>✓</span>`}
                    </button>
                  `;
                })}
              </div>
            </div>
          `}
          <label class="form-lbl">何に集中しますか？（任意）</label>
          <input class="inp" placeholder="例：資料作成、家事、勉強など" value=${task}
            onInput=${e=>setTask(e.target.value)} disabled=${isRunning}/>
          <!-- 計測中でも書けるメモ。ここに書いた内容は終了後の記録メモに引き継がれる -->
          <label class="form-lbl" style=${{marginTop:12}}>メモ（計測中も書けます・任意）</label>
          <textarea class="inp" placeholder="気づいたこと・やったことをここにメモ" value=${logMemo}
            onInput=${e=>setLogMemo(e.target.value)}
            style=${{minHeight:isRunning?96:64,resize:"vertical",lineHeight:1.6,fontFamily:"inherit"}}/>
        </div>
      `}

      <div style=${{display:"flex",gap:10,marginBottom:startTime&&!showModal?8:16}}>
        <button onClick=${isRunning?pause:start}
          style=${{flex:1,padding:"15px",borderRadius:12,border:"none",background:accentColor,
          color:"white",fontSize:17,fontWeight:700,cursor:"pointer"}}>
          ${isRunning?"⏸ 一時停止":"▶ スタート"}
        </button>
        <button onClick=${reset}
          style=${{padding:"15px 18px",borderRadius:12,border:"1.5px solid var(--border)",
          background:"var(--card)",color:"var(--sub)",fontSize:18,cursor:"pointer"}}>↺</button>
      </div>

      ${startTime&&!showModal&&html`
        <button onClick=${()=>{
            pause();
            // 途中終了でも実際に集中した時間を分単位で確定させる（最低1分）。
            // 休憩中に押した場合は、直前の集中セッションは完走済みなので予定＝実測
            const actual = mode==="focus"
              ? Math.max(1, Math.round((selectedMin*60 - timeLeft)/60))
              : selectedMin;
            setSessionResult({planned:selectedMin, actual});
            setShowModal(true);
          }}
          style=${{width:"100%",padding:"11px",borderRadius:12,border:"1.5px solid var(--accent)",
          background:"none",color:"var(--accent)",fontSize:14,fontWeight:600,cursor:"pointer",marginBottom:16}}>
          ✓ タスク完了・途中で記録する
        </button>
      `}

      <div style=${{display:"flex",gap:10,marginBottom:20}}>
        <div style=${{flex:1,background:"var(--card)",borderRadius:14,padding:"14px 0",textAlign:"center",border:"1px solid var(--border)"}}>
          <div style=${{fontSize:26,fontWeight:800,color:"var(--accent)",lineHeight:1}}>${sessionCount}</div>
          <div style=${{fontSize:11,color:"var(--sub)",marginTop:4}}>セッション完了</div>
        </div>
        <div style=${{flex:1,background:"var(--card)",borderRadius:14,padding:"14px 0",textAlign:"center",border:"1px solid var(--border)"}}>
          <div style=${{fontSize:26,fontWeight:800,color:"var(--accent)",lineHeight:1}}>${sessionCount*selectedMin}</div>
          <div style=${{fontSize:11,color:"var(--sub)",marginTop:4}}>集中した分数</div>
        </div>
      </div>

      ${(()=>{
        const quotes=[
          {text:"成功は最終的なものではなく、失敗は致命的ではない。大切なのは続ける勇気だ。",author:"ウィンストン・チャーチル"},
          {text:"千里の道も一歩から。",author:"老子"},
          {text:"今日できることを明日に延ばすな。",author:"ベンジャミン・フランクリン"},
          {text:"才能とは、毎日同じことを新鮮な気持ちでできる能力のことである。",author:"古賀稔彦"},
          {text:"行動こそが全てを決める。今すぐ動け。",author:"ゲーテ"},
          {text:"どんな小さな進歩も、昨日の自分を超えている。",author:"匿名"},
          {text:"夢を見るだけでは不十分。行動しなければ夢は夢のままだ。",author:"ヴァルター・スコット"},
          {text:"集中力は、成功への最短ルートだ。",author:"ブルース・リー"},
          {text:"できると思えばできる。できないと思えばできない。どちらも正しい。",author:"ヘンリー・フォード"},
          {text:"一度に一つのことに集中すれば、あなたは多くのことを成し遂げられる。",author:"オグ・マンディーノ"},
          {text:"石の上にも三年。",author:"日本のことわざ"},
          {text:"努力は必ず報われる。もし報われない努力があるならば、それはまだ努力と呼べない。",author:"王貞治"},
          {text:"やってみなければ分からない。やってみれば必ず分かる。",author:"本田宗一郎"},
          {text:"小さなことを重ねることが、とんでもないところへ行くただひとつの道。",author:"イチロー"},
          {text:"人生は今日一日の積み重ねである。",author:"伊藤忠兵衛"},
        ];
        const today=new Date(); const idx=(today.getFullYear()*10000+((today.getMonth()+1)*100)+today.getDate())%quotes.length;
        const q=quotes[idx];
        return html`
          <div style=${{background:"var(--card)",borderRadius:14,padding:"18px 16px",border:"1px solid var(--border)",marginBottom:8}}>
            <div style=${{fontSize:11,color:"var(--accent)",fontWeight:700,marginBottom:8,letterSpacing:"0.05em"}}>TODAY'S QUOTE</div>
            <div style=${{fontSize:14,color:"var(--text)",lineHeight:1.7,fontStyle:"italic",marginBottom:10}}>"${q.text}"</div>
            <div style=${{fontSize:12,color:"var(--sub)",textAlign:"right"}}>— ${q.author}</div>
          </div>
        `;
      })()}
    </div>

    ${showModal&&html`
      <div style=${{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"flex-end",zIndex:200}}
        onClick=${e=>{if(e.target===e.currentTarget)setShowModal(false);}}>
        <div style=${{background:"var(--card)",borderRadius:"20px 20px 0 0",padding:"24px 20px calc(32px + env(safe-area-inset-bottom))",width:"100%",boxSizing:"border-box",maxHeight:"85dvh",overflowY:"auto",overscrollBehavior:"contain",WebkitOverflowScrolling:"touch"}}>
          <div style=${{fontSize:20,fontWeight:800,marginBottom:4}}>お疲れ様でした！🎉</div>
          <div style=${{fontSize:13,color:"var(--sub)",marginBottom:20}}>
            ${sessionResult
              ? (sessionResult.actual>=sessionResult.planned
                  ? `${sessionResult.planned}分の集中セッションが完了しました。記録しましょう。`
                  : `予定${sessionResult.planned}分のうち${sessionResult.actual}分集中しました。記録しましょう。`)
              : `${selectedMin}分の集中セッションが完了しました。記録しましょう。`}
          </div>
          <div class="form-grp">
            <label class="form-lbl">何をしましたか？</label>
            <input class="inp" value=${task} onInput=${e=>setTask(e.target.value)}
              placeholder="例：資料作成"/>
          </div>
          <div class="form-grp">
            <button onClick=${()=>{const v=!logGoalRelated;setLogGoalRelated(v);localStorage.setItem("jiroku_timer_goal_related",String(v));}} style=${{display:"flex",alignItems:"center",gap:8,background:logGoalRelated?"var(--accent-l)":"none",border:`1.5px solid ${logGoalRelated?"var(--accent)":"var(--border)"}`,borderRadius:9,padding:"7px 11px",width:"100%",cursor:"pointer",transition:"all .15s"}}>
              <div style=${{width:16,height:16,borderRadius:5,border:`2px solid ${logGoalRelated?"var(--accent)":"var(--border)"}`,background:logGoalRelated?"var(--accent)":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all .15s"}}>
                ${logGoalRelated&&html`<svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
              </div>
              <span style=${{fontSize:12.5,fontWeight:500,color:logGoalRelated?"var(--accent)":"var(--sub)"}}>この時間は目標に関連している</span>
            </button>
          </div>
          <div class="form-grp">
            <label class="form-lbl">自己評価</label>
            <${EvalPicker} value=${logFocus} onChange=${setLogFocus}/>
          </div>
          <div class="form-grp" style=${{marginBottom:20}}>
            <div style=${{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8}}>
              <label class="form-lbl" style=${{marginBottom:0}}>メモ（必須）</label>
              <span style=${{fontSize:10.5,color:"var(--sub)",whiteSpace:"nowrap"}}>うまくできたか・感じたこと・改善点</span>
            </div>
            <textarea class="txa" style=${{marginTop:6}} placeholder="うまくいった点、感じたこと、次はこうしたい、など" value=${logMemo}
              onInput=${e=>setLogMemo(e.target.value)}/>
          </div>
          <button class="btn" onClick=${saveLog} disabled=${saving||!logMemo.trim()} style=${{marginBottom:10}}>
            ${saving?html`<span class="spin"/>`:html`記録して休憩へ（${breakMin}分）`}
          </button>
          <button onClick=${skipLog} style=${{width:"100%",background:"none",border:"none",color:"var(--sub)",fontSize:13,padding:"8px",cursor:"pointer"}}>
            スキップ（記録しない）
          </button>
          <button onClick=${()=>{setShowModal(false);}} style=${{width:"100%",background:"none",border:"none",color:"var(--sub)",fontSize:12,padding:"4px",cursor:"pointer",marginTop:2}}>
            ← タイマーに戻る
          </button>
        </div>
      </div>
    `}
  </div>`;
}

    { q:"XPとレベルの仕組みは？",

  { cat:"みんなの頑張り・ランキング", icon:"🏆", items:[
    { q:"「みんなの頑張り」では何が見られる？",

    { q:"「連続記録ランキング」って何？",
      a:"🔥連続で記録している日数の長い順に並ぶランキングです。名前の横の🧊は、その人が持っているフリーズの数です。\n記録が途切れている（0日の）人は載らないので、続けている人だけが表示されます。" },
    { q:"「最新レポートランキング（〇人中〇位）」って何？",
      a:"みんなの一番新しいAIレポートの点数で競う順位です。順位の横の矢印は、前回のランキングと比べて上がった（▲）・下がった（▼）・変わらない（―）を表します。\nランキングに載せたくない場合は担当コーチに相談すれば非表示にでき、その場合は他の人の名前も自分には見えなくなります。" },
