<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JIROKU</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="JIROKU" />
  <meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#101417" media="(prefers-color-scheme: dark)" />
  <!-- ★接続だけ先に始めておく★（2026-08-05 起動高速化）
       つなぎ始めるのに毎回100〜300msかかる。HTMLを読んでいる間に済ませておく。 -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://script.google.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- ★フォントで表示を止めない★
       以前は、この1行の読み込みが終わるまで画面が真っ白のままだった。
       まず端末のフォントで表示し、DM Sansは届いた時点で差し替える。 -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-iPOMe3E8jVgp/PepuDy7lJvw7L/QP97X5POfi+X1EVyDVQi8Kuv/MooNVB5OFXVN" src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
  <!-- ★unpkgが落ちている・遅いときの保険★
       ここが読めないとアプリは起動画面のまま止まる（2026-08-03にKaiの端末で発生）。
       中身は同じnpmパッケージなので、SRIハッシュはそのまま使える。 -->
  <script>
    (function () {
      var need = [];
      if (!window.React)    need.push(["https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js","sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"]);
      if (!window.ReactDOM) need.push(["https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js","sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"]);
      if (!window.htm)      need.push(["https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js","sha384-iPOMe3E8jVgp/PepuDy7lJvw7L/QP97X5POfi+X1EVyDVQi8Kuv/MooNVB5OFXVN"]);
      for (var i = 0; i < need.length; i++) {
        document.write('<script crossorigin="anonymous" integrity="' + need[i][1] + '" src="' + need[i][0] + '"><\/script>');
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #F8F8FA;
      --card:     #FFFFFF;
      --border:   #E5E7EB;
      --text:     #1F2937;
      --sub:      #9CA3AF;
      /* ★--faint を定義する★（2026-08-07 Kai報告「文字が黒くて見づらい」）
         8か所で var(--faint) を使っていたのに、定義がどこにも無かった。
         定義の無い変数を使うと color の指定そのものが無効になり、
         ボタンの中では既定の黒になる。暗いテーマで真っ黒になっていた。 */
      --faint:    #AEB5BD;
      --accent:   #0891B2;
      --accent-l: #CFFAFE;
      --glow:     rgba(8,145,178,.12);
      --green:    #22C55E;
      --green-l:  #F0FDF4;
      --amber:    #F59E0B;
      --amber-l:  #FFFBEB;
      --focus:    #D97706;   /* 今日のフォーカス。淡い金色だと薄いので濃いオレンジに（2026-08-05 Kai要望） */
      --red:      #EF4444;
      --red-l:    #FEF2F2;
      --nav-h:    64px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --r:        14px;
      --hero1:    #0891B2;
      --hero2:    #0e7490;
      /* ★記録画面のシアン★（2026-08-05 Kai指摘）
         明るいときは水色だとJIROKUの色に見えない。
         ライトはJIROKUの基本色、ダークは指定いただいた画像の色を使う。 */
      --cyan:     #0891B2;
    }

    html, body {
      height: 100%; background: var(--bg);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      color: var(--text); -webkit-font-smoothing: antialiased;
    }
    #root { height: 100%; width: 100%; position: relative; background: var(--bg); overflow: hidden; }

    .screen {
      position: absolute; inset: 0;
      bottom: calc(var(--nav-h) + var(--safe-bottom));
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }

    /* ── Nav ── */
    .nav {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: calc(var(--nav-h) + var(--safe-bottom));
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex; padding-bottom: var(--safe-bottom);
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      border: none; background: none; cursor: pointer;
      color: var(--sub); -webkit-tap-highlight-color: transparent;
      transition: color .15s;
    }
    .nav-btn.on { color: var(--accent); }
    .nav-lbl { font-size: 10px; font-weight: 500; letter-spacing: .1px; }

    /* ── Page header ── */
    .ph { padding: 24px 20px 8px; }
    .ph-title { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -.3px; }
    .ph-title-accent { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -.3px; }
    .ph-sub { font-size: 13px; color: var(--sub); margin-top: 2px; }
    .ph-label { display: none; }

    /* 階級のカードをめくる。押すと裏の性格が出る（2026-08-05 Kai要望） */
    .flip { perspective: 800px; }
    .flip-in { position: relative; width: 100%; height: 100%;
               transition: transform .45s cubic-bezier(.2,.7,.3,1); transform-style: preserve-3d; }
    .flip.on .flip-in { transform: rotateY(180deg); }
    .flip-f, .flip-b { position: absolute; inset: 0; backface-visibility: hidden;
                       -webkit-backface-visibility: hidden;
                       display: flex; align-items: center; justify-content: center; }
    .flip-b { transform: rotateY(180deg); }
    @media (prefers-reduced-motion: reduce) { .flip-in { transition: none; } }

    /* 未到達の階級にうっすら敷くシルエット。
       明るい画面では黒、暗い画面では白にしないと見えない（2026-08-05） */
    .rank-ghost { filter: grayscale(1) brightness(0) opacity(0.10); }

    /* ── Cards ── */
    .card {
      background: var(--card); border-radius: 12px;
      padding: 16px; margin: 0 16px 8px;
      border: 1px solid var(--border);
    }
    .card-label {
      font-size: 11px; font-weight: 500; color: var(--sub);
      margin-bottom: 12px; letter-spacing: .1px;
    }

    /* ── Stat tiles (unused but kept for compat) ── */
    .stat-row { display: flex; gap: 8px; margin: 0 16px 8px; }
    .stat-tile { flex: 1; background: var(--card); border-radius: 10px; padding: 14px 12px; text-align: center; border: 1px solid var(--border); }
    .stat-v { font-size: 24px; font-weight: 700; line-height: 1; color: var(--text); }
    .stat-l { font-size: 10px; color: var(--sub); margin-top: 4px; font-weight: 500; }
    .streak-tile { }
    .streak-tile .stat-v { color: var(--amber); }
    .level-v { color: var(--accent); }

    /* ── XP bar ── */
    .xp-wrap { margin: 0 16px 12px; }
    .xp-top { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); font-weight: 500; margin-bottom: 6px; }
    .xp-track { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .xp-fill { height: 4px; border-radius: 99px; background: var(--accent); transition: width .6s cubic-bezier(.4,0,.2,1); }

    /* ── Badge pills ── */
    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 16px 10px; }
    .badge-pill { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 20px; background: var(--bg); border: 1px solid var(--border); color: var(--sub); }

    /* ── Score ring ── */
    .ring-wrap { display: flex; align-items: center; gap: 16px; }
    .ring { width: 68px; height: 68px; flex-shrink: 0; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--pct)*1%), var(--border) 0); display: flex; align-items: center; justify-content: center; }
    .ring-inner { width: 52px; height: 52px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .ring-num { font-size: 18px; font-weight: 700; color: var(--text); line-height: 1; }
    .ring-unit { font-size: 9px; color: var(--sub); }

    /* ── Schedule ── */
    .sched-row { display: flex; align-items: flex-start; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .sched-row:last-child { border-bottom: none; }
    .sched-time { font-size: 12px; font-weight: 600; color: var(--accent); min-width: 40px; padding-top: 1px; flex-shrink: 0; }
    .sched-title { font-size: 14px; font-weight: 500; color: var(--text); }
    .sched-sub { font-size: 11px; color: var(--sub); margin-top: 2px; }

    /* ── Section header ── */
    .sec-head { padding: 16px 20px 8px; }
    .sec-head h2 { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }

    /* ── Time bar ── */
    .time-bar { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; border-bottom: 1px solid var(--border); }
    .time-bar::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; padding: 6px 12px; border-radius: 7px;
      font-size: 12px; font-weight: 500; cursor: pointer;
      border: 1px solid var(--border); background: var(--card);
      color: var(--sub); transition: all .12s; -webkit-tap-highlight-color: transparent;
    }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .chip.done { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .chip.on.done { background: var(--accent); color: #fff; }

    /* ── Form ── */
    .form-wrap { padding: 14px 16px 16px; }
    .form-grp { margin-bottom: 13px; }
    .form-lbl { font-size: 12px; font-weight: 500; color: var(--sub); margin-bottom: 6px; display: block; }
    .inp, .txa {
      width: 100%; padding: 11px 13px; border: 1px solid var(--border);
      border-radius: 9px; font-size: 15px; font-family: inherit;
      background: var(--card); color: var(--text); outline: none; transition: border-color .12s;
      box-sizing: border-box;
    }
    .inp:focus, .txa:focus { border-color: var(--accent); }
    input[type="date"].inp, input[type="date"].login-inp { -webkit-appearance: none; appearance: none; text-align: center; }
    .txa { resize: none; min-height: 68px; line-height: 1.6; overflow: hidden; }

    /* ── Eval buttons ── */
    .eval-btn {
      width: 100%; padding: 8px 12px; margin-bottom: 4px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card);
      font-size: 13.5px; font-weight: 500; cursor: pointer; text-align: left;
      color: var(--sub); transition: all .12s; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .eval-btn:last-child { margin-bottom: 0; }
    .e5 { background: var(--green-l); border-color: #86EFAC; color: #15803D; }
    .e4 { background: var(--accent-l); border-color: #A5B4FC; color: #3730A3; }
    .e3 { background: var(--amber-l); border-color: #FCD34D; color: #92400E; }
    .e2 { background: var(--red-l); border-color: #FCA5A5; color: #991B1B; }
    .e1 { background: var(--red-l); border-color: #FCA5A5; color: #991B1B; }

    /* ── Primary button ── */
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: var(--accent); color: #fff;
      font-size: 15px; font-weight: 600; cursor: pointer;
      font-family: inherit; letter-spacing: .1px;
      transition: opacity .12s, transform .1s; -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: .85; transform: scale(.99); }
    .btn:disabled { background: var(--border); color: var(--sub); cursor: default; }

    /* ── Ghost button ── */
    .btn-g {
      width: 100%; padding: 13px; border-radius: 9px;
      border: 1px solid var(--border); background: transparent;
      color: var(--red); font-size: 14px; font-weight: 500;
      cursor: pointer; font-family: inherit;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px);
      left: 50%; transform: translateX(-50%);
      background: #111827; color: #fff;
      padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
      z-index: 999; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.2);
      animation: up .2s ease;
    }
    @keyframes up { from { opacity:0; transform: translateX(-50%) translateY(6px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }

    /* ── Report ── */
    .report-hero { padding: 28px 20px 16px; text-align: center; }
    .report-date { font-size: 11px; font-weight: 500; color: var(--sub); margin-bottom: 12px; }
    .report-score { font-size: 72px; font-weight: 800; line-height: 1; letter-spacing: -3px; color: var(--text); }
    .report-pts { font-size: 13px; color: var(--sub); margin-top: 4px; }

    /* ── Tag ── */
    .tag { display: inline-block; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 500; }
    .t-g { background: var(--green-l); color: #15803D; }
    .t-a { background: var(--amber-l); color: #92400E; }

    /* ── Log rows ── */
    .log-row { display: flex; align-items: flex-start; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border); }
    .log-row:last-child { border-bottom: none; }
    .log-row > div:last-child { flex: 1; min-width: 0; }
    /* 時間帯を主役に：はっきり読める大きさ・色。範囲(HH:MM-HH:MM)も折り返さず表示 */
    .log-time { font-size: 12.5px; font-weight: 700; color: var(--accent); min-width: 92px; padding-top: 1px; flex-shrink: 0; letter-spacing: .01em; white-space: nowrap; }
    .log-task { font-size: 14.5px; font-weight: 600; color: var(--text); line-height: 1.5; overflow-wrap: anywhere; word-break: break-word; }
    /* 集中度は小さなチップに。メモは独立行で読みやすく */
    .log-focus { display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; font-size: 11px; font-weight: 600; color: var(--sub); background: var(--bg); border-radius: 20px; padding: 2px 9px 2px 7px; }
    .log-focus .dot { flex-shrink: 0; }
    .log-memo { font-size: 12.5px; color: var(--text); opacity: .78; line-height: 1.7; margin-top: 6px; overflow-wrap: anywhere; word-break: break-word; white-space: pre-wrap; }
    .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

    /* ── Chat ── */
    .chat-head { padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .chat-av { width: 34px; height: 34px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text); flex-shrink: 0; }
    .chat-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .chat-status { font-size: 11px; color: var(--sub); }

    .msgs { padding: 16px; display: flex; flex-direction: column; gap: 8px; min-height: 100%; }
    .bubble { max-width: 76%; padding: 10px 14px; font-size: 14px; line-height: 1.6; overflow-wrap: break-word; word-break: break-word; white-space: pre-wrap; border-radius: 14px; min-width: 130px; }
    .b-in { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .b-out { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .btime { font-size: 10px; color: var(--sub); margin-top: 3px; }
    .btime-r { text-align: right; }

    .chat-bar { padding: 10px 14px; background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; }
    .chat-inp { flex: 1; padding: 10px 13px; border: 1px solid var(--border); border-radius: 9px; font-size: 15px; font-family: inherit; outline: none; resize: none; max-height: 100px; line-height: 1.4; background: var(--bg); color: var(--text); }
    .chat-inp:focus { border-color: var(--accent); }
    .send { width: 38px; height: 38px; border-radius: 9px; background: var(--accent); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
    .send:disabled { background: var(--border); color: var(--sub); cursor: default; }

    /* ── Settings ── */
    .s-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .s-row:last-child { border-bottom: none; }
    .s-k { color: var(--sub); font-weight: 400; }
    .s-v { font-weight: 500; color: var(--text); }
    select { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border); font-size: 14px; background: var(--card); color: var(--text); font-family: inherit; outline: none; }
    select:focus { border-color: var(--accent); }

    /* ── Date nav ── */
    .date-nav { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
    .date-nav button { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--sub); padding: 0 4px; line-height: 1; }
    .date-nav button:disabled { color: var(--border); cursor: default; }
    .date-nav span { font-size: 13px; font-weight: 600; color: var(--text); }

    /* ── Spinner ── */
    .spin { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: rot .6s linear infinite; display: inline-block; }
    @keyframes rot { to { transform: rotate(360deg); } }

    /* ── 独り言FABの上に出る、モコモコの雲（インラインSVG） ── */
    .quick-hint {
      position: absolute; right: -14px; bottom: 100%; margin-bottom: -12px;
      width: 96px; height: 76px; pointer-events: none; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      animation: quickHintIn .5s cubic-bezier(.34,1.56,.64,1), quickHintFloat 3.4s ease-in-out .5s infinite;
      transform-origin: bottom center;
    }
    .quick-hint svg.cloud {
      position: absolute; inset: 0; width: 100%; height: 100%;
      filter: drop-shadow(0 5px 9px rgba(8,145,178,0.18));
    }
    .quick-hint svg.cloud circle { fill: var(--card); }
    .quick-hint .t {
      position: relative; z-index: 1; color: var(--text);
      font-size: 10px; font-weight: 700; letter-spacing: .02em; white-space: nowrap;
      margin-top: -6px; /* しっぽの分、本体中心に文字を寄せる */
    }
    @keyframes quickHintIn { from { opacity: 0; transform: translateY(6px) scale(.8); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes quickHintFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    /* ── Empty ── */
    .empty { padding: 48px 24px; text-align: center; }
    .empty-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .empty-body { font-size: 13px; color: var(--sub); line-height: 1.7; }

    /* ── Login ── */
    .login-wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; background: var(--bg); }
    .login-logo { width: 72px; height: 72px; margin: 0 auto 18px; }
    .login-title { font-size: 24px; font-weight: 700; letter-spacing: -.4px; text-align: center; color: var(--text); }
    .login-sub { font-size: 13px; color: var(--sub); text-align: center; margin: 5px 0 32px; line-height: 1.6; }
    .login-box { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 8px; }

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);

  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);

const TASK_QUEUE_KEY = "jiroku_task_mutations";

}

  try {
    const m = loadTaskBirths(); m[id] = Date.now();

//   取得を始めたあとにタスクを足していたら、その一覧はもう古い。

window.__taskGen = window.__taskGen || 0;

function bumpTaskGen(){ window.__taskGen++; }
function enqueueTaskMutation(op, taskId, changes, baseValues){
  if (!taskId) return;
  if (op === "CREATE") markTaskBorn(taskId);
  bumpTaskGen();
  const q = loadTaskQueue();
  const m = { mid: "m_"+Date.now()+"_"+Math.random().toString(36).slice(2,8),

              // 止めっぱなしにしないための判断に使う

  // ★フィールド単位の競合検出★
  //   「変える項目について、自分が見ていた値」を一緒に送る。
  //   サーバーは、その項目が別の端末で変わっていたときだけ止める。
  //   ・PCで重要度／スマホで期限 → ぶつからないので両方通る
  //   ・PCとスマホが両方とも期限 → 要確認になる（黙って消えない）
  //   レコード全体のversionでは前者まで止まり、versionを見ないと後者が消える。
  if (op === "UPDATE" && baseValues && Object.keys(baseValues).length) {
    m.base_values = baseValues;
  }
  // ★同じタスクの同じ項目は、1件にまとめる★（2026-08-05 Kai報告
  //   「消したりつけたりすると元に戻る」）
  //   素早く2回切り替えると、2件目の base_values も画面の状態から作られるため
  //   「最初の値」のままになる。1件目が通った直後の2件目は、サーバーから見ると
  //   自分が知らない値からの変更なので競合と判定され、止まって元に戻って見えた。
  //   最初に控えた base_values を残したまま、changes だけ最後の値で上書きする。
  //   こうすると「元の値 → 最終的な値」の1件になり、競合しない。
  if (op === "UPDATE") {
    const keys = Object.keys(m.changes);
    for (let i = q.length - 1; i >= 0; i--) {
      const prev = q[i];
      if (prev.state !== "pending" || prev.op !== "UPDATE" || prev.task_id !== taskId) continue;
      const prevKeys = Object.keys(prev.changes || {});
      // 触っている項目が同じものだけまとめる（別項目は独立して通す）

// ★時間の使い方ごとに色を分ける★（2026-08-05 Kai要望）
//   これまでは記録をすべて灰色(8=Graphite)で書いていたため、カレンダーを開いても
//   「何に時間を使った1日だったか」が色で分からなかった。
//   良い使い方ほど落ち着いた緑〜青、望ましくない「計画外の時間」は赤にして、
//   1週間を俯瞰したときに色の偏りだけで傾向が読めるようにする。
//   （GoogleカレンダーのcolorIdは1〜11の固定パレット）
// ★カレンダーの色はアプリの色に合わせる★（2026-08-05 Kai要望）
//   別々の色にしていたため、アプリでは青の「目標に直結」がカレンダーでは緑、
//   といったズレが起きていた。Googleカレンダーは11色から選ぶしかないので、
//   アプリの色にいちばん近いものを選ぶ。TIME_CLASS_COLOR と対で直すこと。
//     目標に直結   #3B82F6 青   → Blueberry #3F51B5
//     将来への投資 #8B5CF6 紫   → Grape     #8E24AA
//     回復         #22C55E 緑   → Sage      #33B679
//     人間関係     #F59E0B 橙   → Banana    #F6BF26
//     日常業務     JIROKUの色   → Peacock   #039BE5
//     計画外の時間 #64748B 灰   → Graphite  #616161
const CAL_COLOR_BY_CLASS = {
  GOAL_DIRECT:           "9",  // Blueberry 青
  ASSET_BUILD:           "3",  // Grape     紫
  RECOVERY:              "2",  // Sage      緑
  RELATIONSHIP:          "5",  // Banana    橙寄りの黄
  RECOVERY_RELATIONSHIP: "2",  // 旧分類。書き換えない昔の記録のために残す
  OPERATIONS:            "7",  // Peacock   水色
  UNPLANNED_LEAKAGE:     "8",  // Graphite  灰

// 混ざらないように淡い色にしておく
const JIROKU_RECORD_COLOR_ID = "1";   // Lavender
const calColorFor = (cls) => CAL_COLOR_BY_CLASS[String(cls||"").toUpperCase()] || JIROKU_RECORD_COLOR_ID;

async function upsertCalendarEvent(dateStr, key, startISO, endISO, title, exactOriginalEventId, isRetry, cls){
  try{
    // サーバー(Kai権限)がカレンダー書き込みを担う本人は、クライアント側では書かない（二重登録防止）
    if(localStorage.getItem("server_calendar")) return;
    if(!localStorage.getItem("cal_linked") || !title) return;
    const token = await getCalendarToken(false);
    if(!token) {
      if(!isRetry) console.warn("[JIROKU calendar] token取得失敗、1秒後に再試行", {dateStr, key, title});
      if(!isRetry) return setTimeout(()=>upsertCalendarEvent(dateStr, key, startISO, endISO, title, exactOriginalEventId, true, cls), 1000);
      console.error("[JIROKU calendar] token取得に再試行しても失敗→キューに退避", {dateStr, key, title});
      enqueueCalWrite({dateStr, key, startISO, endISO, title, exactOriginalEventId, cls});
      return;
    }
    let map = {};
    try{ map = JSON.parse(localStorage.getItem(CAL_EVT_LS+dateStr)||"{}"); }catch{}
    const base = "https://www.googleapis.com/calendar/v3/calendars/primary/events";
    const headers = { Authorization:"Bearer "+token, "Content-Type":"application/json" };
    // 色分け(colorId)はGoogleカレンダーの表示上あまり目立たず、見分けがつきにくいという
    // フィードバックがあったため、タイトル自体に「✅ 」を付けて、どの画面・端末でも
    // 文字で確実に「実際にやったこと」と分かるようにする（色は補助的な扱いにする）
    const recordTitle = "✔️ " + title;
    // extendedProperties.private.jirokuRecordで「JIROKUの記録から書き込んだ/更新した予定」と
    // 印を付けておく。カレンダー上は普通の予定として見えるが、アプリ側の「今日の予定」
    // 表示や自動入力では、既に完了したことをまた"予定"として出さないようこの印で除外する
    const colorId = calColorFor(cls);
    const body = JSON.stringify({ summary: recordTitle, start:{ dateTime:startISO }, end:{ dateTime:endISO },
      colorId, extendedProperties:{ private:{ jirokuRecord:"1" } } });

    // 元の予定と記録内容のタイトルが文字通り完全一致する場合だけ、新規に別イベントを
    // 作らずその予定へ✅マークを追加する（内容が同じなので上書きしても情報は失われない）。
    // 一致しない場合にここで上書きすると、元の予定の文言が消えてしまうため、
    // 完全一致以外は必ず別イベントとして作成・更新する
    const alreadyClaimed = Object.values(map).includes(exactOriginalEventId);
    if(exactOriginalEventId && !map[key] && !alreadyClaimed){
      const titleOnlyBody = JSON.stringify({ summary: recordTitle,
        colorId, extendedProperties:{ private:{ jirokuRecord:"1" } } });
      const r0 = await fetch(base+"/"+encodeURIComponent(exactOriginalEventId), { method:"PATCH", headers, body:titleOnlyBody });
      if(r0.ok){
        map[key] = exactOriginalEventId;
        try{ localStorage.setItem(CAL_EVT_LS+dateStr, JSON.stringify(map)); }catch{}
        dequeueCalWrite(dateStr, key);
        return;
      }
      // 更新に失敗した場合は下の通常フローで新規作成にフォールバックする
    }

    if(map[key]){
      const r = await fetch(base+"/"+encodeURIComponent(map[key]), { method:"PATCH", headers, body });
      if(r.ok){ dequeueCalWrite(dateStr, key); return; }
      // カレンダー側で手動削除されていた場合(404/410)だけ作り直す。それ以外の失敗は
      // 一時的な通信エラーの可能性があるため、1回だけ再試行してから諦める
      if(r.status!==404 && r.status!==410){
        if(!isRetry){
          console.warn("[JIROKU calendar] 更新失敗、1秒後に再試行", {dateStr, key, title, status:r.status});
          setTimeout(()=>upsertCalendarEvent(dateStr, key, startISO, endISO, title, exactOriginalEventId, true, cls), 1000);
        } else {
          console.error("[JIROKU calendar] 更新に再試行しても失敗→キューに退避", {dateStr, key, title, status:r.status});
          enqueueCalWrite({dateStr, key, startISO, endISO, title, exactOriginalEventId, cls});
        }
        return;
      }
    }
    const r2 = await fetch(base, { method:"POST", headers, body });
    if(r2.ok){
      const ev = await r2.json();
      map[key] = ev.id;
      try{ localStorage.setItem(CAL_EVT_LS+dateStr, JSON.stringify(map)); }catch{}
      dequeueCalWrite(dateStr, key);
    } else if(!isRetry){
      console.warn("[JIROKU calendar] 新規作成失敗、1秒後に再試行", {dateStr, key, title, status:r2.status});
      setTimeout(()=>upsertCalendarEvent(dateStr, key, startISO, endISO, title, exactOriginalEventId, true, cls), 1000);
    } else {
      console.error("[JIROKU calendar] 新規作成に再試行しても失敗→キューに退避", {dateStr, key, title, status:r2.status});
      enqueueCalWrite({dateStr, key, startISO, endISO, title, exactOriginalEventId, cls});
    }
  }catch(e){
    if(!isRetry){
      console.warn("[JIROKU calendar] 書き込み中に例外、1秒後に再試行", {dateStr, key, title, error:String(e)});
      setTimeout(()=>upsertCalendarEvent(dateStr, key, startISO, endISO, title, exactOriginalEventId, true, cls), 1000);
    } else {
      console.error("[JIROKU calendar] 再試行しても例外→キューに退避", {dateStr, key, title, error:String(e)});
      enqueueCalWrite({dateStr, key, startISO, endISO, title, exactOriginalEventId, cls});
    }
  }
}
// その日の「記録(logs)」と「カレンダーに書き込み済みか(端末の対応表)」を突き合わせ、
// まだカレンダーに書けていない記録を書き込む（＝取りこぼしの遡り補完）。
// 独り言で作った過去の記録や、書き込み前にタブを閉じた分などをここで拾う。
async function reconcileCalendarForDate(dateStr, logs){
  if(localStorage.getItem("server_calendar")) return; // サーバーが書き込むので補完不要
  if(!localStorage.getItem("cal_linked") || !Array.isArray(logs) || logs.length===0) return;
  let map={}; try{ map=JSON.parse(localStorage.getItem(CAL_EVT_LS+dateStr)||"{}"); }catch(e){}
  for(const l of logs){
    const tb=String(l.time_block||""); if(!tb || map[tb]) continue; // 既に書き込み済みはスキップ
    const [s,e]=tb.split("-");

    const ett=e?new Date(dateStr+"T"+String(e).slice(0,5)+":00"):null;
    const endDt=(ett&&ett>stt)?ett:new Date(stt.getTime()+3600000);
    await upsertCalendarEvent(dateStr, tb, stt.toISOString(), endDt.toISOString(), l.task||"記録", null, false, l.time_classification||"");
  }
}

async function fetchCalendarEvents(dateStr, interactive=false){
  if(gcalFresh(dateStr)) return gcalCache[dateStr];
  // interactive(ボタン手動タップ)はユーザー操作なので毎回必ず新規実行し、
  // 裏で動いているサイレント取得の使い回しはしない

  if(!interactive) gcalInFlight[dateStr]=p;

}

        // サーバーへ同期（コーチのプロンプト用＆次回起動・他端末のフォールバック）

// 時間ブロック（例 "10:00-11:00"）に重なる予定タイトル一覧
function eventsForBlock(evs, block){
  if(!evs) return [];
  const h=parseInt(block);
  return evs.filter(e=>!e.allDay && e.startHour!==null && e.startHour<h+1 && e.endHour>h).map(e=>e.title);
}
// 記録した内容が、その時間帯にあった予定のタイトルと文字通り完全一致する場合だけ、
// 別イベントを作らずその予定に✅マークを追加する（内容が違う場合に上書きして
// 消してしまわないよう、完全一致の時だけの限定的な救済措置）
function exactEventForBlock(evs, block, taskText){
  if(!evs) return null;
  const h=parseInt(block);
  const matches=evs.filter(e=>!e.allDay && e.startHour!==null && e.startHour<h+1 && e.endHour>h && e.id && e.title===taskText);
  return matches.length===1 ? matches[0] : null;
}

function Toast({msg, onDone}) {
  useEffect(()=>{ const t=setTimeout(onDone,2500); return ()=>clearTimeout(t); },[]);

function formatDateStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(s,n){ const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return formatDateStr(d); }
// ★0 = 暦の日付どおり★（2026-08-05 Kai報告で4→0に戻した）
//   深夜0〜4時を「前の日の続き」として扱ってみたが、
//   ホームは8/5・記録は8/4と表示がズレて、日付が壊れて見えた。
//   日をまたぐ作業が割れる問題は、区切りをずらさなくても
//   「23:00-01:00 を1件のまま扱う」(blockSpan) で解決している。
//   ずらす必要が出たときは、ここと gas/Code.gs の DAY_CUTOFF_HOUR_GAS を
//   必ず同じ値にすること。片方だけ変えると日付が食い違う。
const DAY_CUTOFF_HOUR = 0;
// ★1日の区切りは深夜4時★（2026-08-05 Kai要望・サーバーの logicalToday_ と同じ値）
//   午前2時に記録すると、暦の上では新しい日になるが、本人の感覚では前の日の続き。
//   夜通しの作業（20時〜23時 と 23時〜翌1時）が2日に割れないよう、
//   深夜0〜4時は前の日として扱う。
//   ※ここを変えるときは gas/Code.gs の DAY_CUTOFF_HOUR_GAS も必ず同じ値にすること。
function logicalTodayStr(){
  const d = new Date();
  if (d.getHours() < DAY_CUTOFF_HOUR) d.setDate(d.getDate() - 1);
  return formatDateStr(d);
}
function isToday(s){ return s===logicalTodayStr(); }

function announceJiroFound(res) {
  const g = (res && res.jiro_gained) || [];
  if (g.length) {
    try { window.dispatchEvent(new CustomEvent("jiroku:jirofound", { detail: g })); } catch (e) {}
    return;
  }

//   これで、どの経路で増えても必ずカードが出る。
const JIRO_SEEN_KEY = "jiroku_announced_jiro";
function announceNewlyFound(game) {
  try {
    const found = (game && game.jiro && game.jiro.found) || [];
    if (!found.length) return;
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem(JIRO_SEEN_KEY) || "[]"); } catch (e) {}
    const fresh = found.filter(id => seen.indexOf(id) === -1);
    if (!fresh.length) return;
    localStorage.setItem(JIRO_SEEN_KEY, JSON.stringify(found));
    const list = fresh.map(id => {
      const j = HIDDEN_JIRO.find(x => x.id === id);
      return j ? { id: j.id, no: j.no, name: j.name, rarity: j.rarity } : null;
    }).filter(Boolean);
    if (list.length) {
      setTimeout(() => {
        try { window.dispatchEvent(new CustomEvent("jiroku:jirofound", { detail: list })); } catch (e) {}
      }, 900);
    }
  } catch (e) { /* 出せなくてもアプリは動かす */ }
}

//   1件選ぶごとにその場で保存し、選んだ行は静かに消えていく（押し直しはできる）。
//   保存に失敗したら、その行は消さずに残す（黙って無かったことにしない）。
function BulkClassifySheet({date, onClose, onSaved, onToast}) {
  useLockBodyScroll();
  const [rows, setRows] = useState(null);   // null = 読み込み中
  const [doneCount, setDoneCount] = useState(0);
  useEffect(()=>{
    let alive = true;
    // ★7日ぶんを1回で取る★（2026-08-07 Kai報告「読み込みが遅い」）
    //   以前は日ごとに7回に分けて呼んでいた。Apps Script は同じ人の
    //   リクエストを順番に処理するので、7回ぶんの待ち時間が積み上がっていた。
    //   古い版のサーバーに当たったときのために、失敗したら元のやり方に戻す。
    const days = Array.from({length:7}, (_,i)=>addDays(date, -i));
    const fetchAll = () => gasApi("getLogsRange",{date, days:7})
      .then(r=>{
        if(!(r&&r.ok&&r.data&&typeof r.data==="object"&&!Array.isArray(r.data))) throw new Error("range not available");
        return days.map(d=>({d, list:(r.data[d])||[]}));
      })
      .catch(()=>Promise.all(days.map(d=>
        gasApi("getLogs",{date:d}).then(r=>({d, list:(r&&r.ok&&r.data)||[]})).catch(()=>({d,list:[]})))));
    fetchAll()
      .then(res=>{
        if(!alive) return;
        const out = [];
        res.forEach(({d,list})=>list.forEach(l=>{
          if(String(l.time_classification||"").trim()) return;
          if(!l.log_id) return;                 // 分類の保存はlog_idで行うため
          out.push({...l, __date:d});
        }));
        out.sort((a,b)=> a.__date===b.__date
          ? blockSortKey(a.time_block)-blockSortKey(b.time_block)
          : (a.__date>b.__date?-1:1));
        setRows(out);
      });
    return ()=>{ alive=false; };
  },[date]);

  // ★押した瞬間に次へ進める★（2026-08-05 Kai報告「1クリックで時間を取られる」）
  //   これまでは1件ごとにサーバーの応答を待ち、待っている間は他のボタンも
  //   押せなかった。20件あると数分かかる。
  //   押した時点で一覧から消し、送信は裏で行う。
  //   失敗したものだけ戻して知らせる（黙って無かったことにしない）。
  const failedRef = useRef([]);
  const pendingRef = useRef(0);
  const handledRef = useRef({});   // 二重押しよけ
  const pick = (l, k) => {
    if (handledRef.current[l.log_id]) return;
    handledRef.current[l.log_id] = true;
    setRows(prev=>prev.filter(x=>x.log_id!==l.log_id));
    setDoneCount(n=>n+1);
    onSaved&&onSaved(l.log_id, k);
    pendingRef.current++;
    gasPostJson("setLogClassification", { log_id: l.log_id, time_classification: k })
      .then(r=>{
        if(!r || !r.ok){
          delete handledRef.current[l.log_id];   // やり直せるようにする
          failedRef.current.push(l);
          setRows(prev=>[...prev, l].sort((a,b)=> a.__date===b.__date
            ? blockSortKey(a.time_block)-blockSortKey(b.time_block)
            : (a.__date>b.__date?-1:1)));
          setDoneCount(n=>Math.max(0,n-1));
        }
      })
      .catch(()=>{})
      .finally(()=>{
        pendingRef.current--;
        if(pendingRef.current===0 && failedRef.current.length){
          onToast&&onToast(failedRef.current.length+"件は保存できませんでした。もう一度押してください");
          failedRef.current = [];
        }
      });
  };

  // ★画面の外（body直下）に出す★
  //   他のモーダルと同じ作りにする。中に埋めたままだと、
  //   親側の指定によって position:fixed が効かず、後ろの画面が操作できてしまう。
  return ReactDOM.createPortal(html`
    <div style=${{position:"fixed",inset:0,height:"100dvh",zIndex:430,background:"var(--bg)",display:"flex",flexDirection:"column"}}>
      <div style=${{display:"flex",alignItems:"center",gap:10,padding:"14px 16px",borderBottom:"1px solid var(--border)",flexShrink:0,paddingTop:"calc(14px + var(--safe-top, 0px))"}}>

// ★3階層で同じ形の進捗バー★（2026-08-05 Kaiと整理）
//
//   %だけを出しても「順調なのか遅れているのか」は分からない。
//   期間のどこまで来たか（今日いるべき位置）をバーの上にマーカーで重ねると、
//   実績がその線より右にあれば先行、左なら遅れ、と一目で読める。
//   3か月目標・2週間Sprint・今週の目標のすべてで同じ見た目にそろえる。
//
//   percent … 実績の割合（0以上。100を超えることもある）
//   pace    … 期間の経過割合（今日いるべき位置）。無ければマーカーを出さない
function ProgressBar({percent, pace, label, sub}) {
  const p = Math.max(0, Math.min(100, Number(percent) || 0));
  const over = Number(percent) > 100;
  const hasPace = pace !== null && pace !== undefined && !isNaN(Number(pace));
  const pc = hasPace ? Math.max(0, Math.min(100, Number(pace))) : null;
  // 予定より進んでいるか。遅れているときだけ色を変えて気づけるようにする
  const behind = hasPace && Number(percent) < Number(pace) - 5;
  const color = over ? "var(--green)" : behind ? "var(--amber,#BA7517)" : "var(--accent)";
  return html`
    <div>
      ${(label||sub)&&html`
        <div style=${{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8,marginBottom:4}}>
          <span style=${{fontSize:11.5,color:"var(--sub)"}}>${label||""}</span>
          <span style=${{fontSize:11.5,color:"var(--sub)",whiteSpace:"nowrap"}}>${sub||""}</span>
        </div>`}
      <div style=${{position:"relative",height:8,background:"var(--bg)",borderRadius:99,overflow:"visible"}}>
        <div style=${{position:"absolute",inset:0,borderRadius:99,overflow:"hidden"}}>
          <div style=${{height:"100%",width:p+"%",background:color,borderRadius:99}}/>
        </div>
        ${hasPace&&html`
          <div title="今日いるべき位置"
            style=${{position:"absolute",left:pc+"%",top:-3,width:2,height:14,background:"var(--text)",
                     opacity:0.55,borderRadius:2,transform:"translateX(-1px)"}}/>`}
      </div>
      ${hasPace&&html`
        <div style=${{fontSize:10,color:behind?"var(--amber,#BA7517)":"var(--sub)",marginTop:4,lineHeight:1.6}}>
          ${behind ? "予定より遅れています（今日は "+Math.round(pc)+"% あたり）"
                   : "今日いるべき位置 "+Math.round(pc)+"%"}
        </div>`}
    </div>`;
}

// シートを開いている間は、後ろの画面をスクロールさせない
function useLockBodyScroll(){
  useEffect(()=>{
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    document.documentElement.setAttribute("data-modal-open","1");
    return ()=>{ document.body.style.overflow = prev;
                 document.documentElement.removeAttribute("data-modal-open"); };
  },[]);
}

  useLockBodyScroll();
  const p = weekly ? {} : ((goal && goal.pace) || {});

    ? (goal.unit || (goal.metric_type==="DURATION" ? "分" : "件"))

    ? (Number(goal.std_line)>0 ? Number(goal.std_line) : (Number(goal.target_total)||0))
    : (Number(p.target)||0);
  const add = Number(amount)||0;
  const next = cur + (entry ? (add - (Number(entry.amount)||0)) : add);
  const pctNow = tgt>0 ? Math.round(cur/tgt*100) : null;
  const pctNext = tgt>0 ? Math.round(next/tgt*100) : null;

    if(!(Number(amount))) { onToast&&onToast(weekly?"数を入れてください":"金額を入れてください"); return; }

    const r = entry
      ? await gasPostJson("updateGoalEntry", { entry_id: entry.entry_id, amount: Number(amount), category: cat, memo })
      : await gasPostJson("addGoalEntry", weekly
          ? { weekly_goal_id: goal.weekly_goal_id, amount: Number(amount), category: "OTHER", memo }
          : { quarterly_goal_id: goal.quarterly_goal_id, amount: Number(amount), category: cat, memo });
    setSaving(false);
    if(r&&r.ok){ onToast&&onToast(entry?"実績を更新しました":"実績を追加しました！"); onSaved&&onSaved(); onClose(); }
    else onToast&&onToast((r&&r.error)||"保存できませんでした");

  // ★画面の外（body直下）に出す★
  //   他のモーダルと同じ作りにする。中に埋めたままだと、

             border:"1px solid var(--border)",borderBottom:"none",
             padding:"20px 20px calc(24px + var(--safe-bottom, 0px))",maxHeight:"88dvh",overflowY:"auto"}}>
        <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>

        </div>

        <div style=${{fontSize:12.5,color:"var(--sub)",marginBottom:6}}>${weekly?"数":"金額"}</div>
        <div style=${{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>

            onInput=${e=>setAmount(e.target.value)} placeholder="0"
            style=${{margin:0,flex:1,fontSize:20,fontWeight:700,padding:"12px 14px"}}/>
          <span style=${{flexShrink:0,fontSize:14,color:"var(--sub)"}}>${unit}</span>

                       fontSize:13,fontWeight:700,

        <div style=${{fontSize:12.5,color:"var(--sub)",marginBottom:6}}>メモ（任意）</div>

// ★今週の目標に実績を入れる★（2026-08-05 Kai要望）
//   ＋を押したら、その場で数を決められるようにする。
//   間違えて足すこともあるので、マイナスにもできる（打ち消しの記録を1件残す）。
function WeeklyEntrySheet({goal, onClose, onSave, onToast}) {
  useLockBodyScroll();
  const u = goal.unit || (goal.metric_type==="DURATION" ? "分" : "件");
  const cur = Number(goal.actual_value)||0;
  const t = Number(goal.std_line)>0 ? Number(goal.std_line) : Number(goal.target_total);
  // −／＋の刻みも目標の大きさに合わせる（300件を1ずつ動かすのは現実的でない）
  const step = (goal.metric_type==="DURATION") ? 30
             : ((!isNaN(t) && t>=100) ? 10 : (!isNaN(t) && t>=40) ? 5 : 1);
  const [n, setN] = useState(step);
  const [saving, setSaving] = useState(false);
  const C = "var(--green)";
  const next = cur + (Number(n)||0);
  const save = async () => {
    const v = Number(n);
    if(!v){ onToast&&onToast("0以外の数を入れてください"); return; }
    setSaving(true);
    await onSave(goal, v);
    setSaving(false);
    onClose();
  };
  // ★画面の外（body直下）に出す★
  //   他のモーダルと同じ作りにする。中に埋めたままだと、
  //   親側の指定によって position:fixed が効かず、後ろの画面が操作できてしまう。
  return ReactDOM.createPortal(html`
    <div onClick=${onClose} style=${{position:"fixed",inset:0,zIndex:441,background:"rgba(0,0,0,0.55)",
                                     display:"flex",
                                     alignItems:SHEET_WIDE?"stretch":"flex-end",
                                     justifyContent:SHEET_WIDE?"flex-end":"center"}}>

          <button onClick=${onClose} style=${{background:"none",border:"none",color:"var(--sub)",fontSize:22,cursor:"pointer",lineHeight:1,padding:"0 4px"}}>×</button>
        </div>

             目標の大きさに合わせて刻みを変える（6件なら1/2/3、300件なら5/10/30…）。 -->
        ${(()=>{
          const base = (!isNaN(t)&&t>0) ? t : 10;
          const raw = [1, Math.round(base*0.05), Math.round(base*0.1), Math.round(base*0.25)];
          const opts = Array.from(new Set(raw.filter(v=>v>=1))).sort((a2,b2)=>a2-b2).slice(0,4);

          return html`

        <div style=${{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
          <button onClick=${()=>setN(v=>Number(v)-step)}

                     cursor:"pointer",fontFamily:"inherit",lineHeight:1}}>−</button>

            onInput=${e=>setN(e.target.value)}
            style=${{margin:0,flex:1,textAlign:"center",fontSize:24,fontWeight:800,padding:"10px 8px"}}/>
          <span style=${{flexShrink:0,fontSize:14,color:"var(--sub)",width:24}}>${u}</span>
          <button onClick=${()=>setN(v=>Number(v)+step)}
            style=${{flexShrink:0,width:46,height:46,borderRadius:12,border:`1px solid ${C}`,
                     background:"transparent",color:C,fontSize:22,fontWeight:700,
                     cursor:"pointer",fontFamily:"inherit",lineHeight:1}}>＋</button>
        </div>

// ★記録の時間を直す★（2026-08-05 Kai要望）
//   独り言やタイマーから自動で作られた記録は、時刻がずれていることがある。
//   これまでは「時間を細かく」で選び直すと、中身が空の別の記録が増えるだけで
//   元の記録が残り、二重になっていた。ここでは中身はそのままに時刻だけ動かす。
function LogTimeSheet({log, date, onClose, onSaved, onToast}) {
  useLockBodyScroll();
  const sp = blockSpan(log.time_block) || { start: 0, end: 60 };
  const toHM = (m) => String(Math.floor((m % 1440) / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
  const toMin = (v) => { const p = String(v || "").split(":"); return (Number(p[0]) || 0) * 60 + (Number(p[1]) || 0); };
  const [from, setFrom] = useState(toHM(sp.start));
  const [to, setTo] = useState(toHM(sp.end));
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState("");
  const mins = (() => { let d = toMin(to) - toMin(from); if (d < 0) d += 1440; return d; })();
  const hm = (m) => m >= 60 ? (Math.floor(m / 60) + "時間" + (m % 60 ? (m % 60) + "分" : "")) : (m + "分");
  const shift = (delta) => { setFrom(toHM(((toMin(from) + delta) % 1440 + 1440) % 1440));
                             setTo(toHM(((toMin(to) + delta) % 1440 + 1440) % 1440)); };
  const changed = (toHM(sp.start) !== from) || (toHM(sp.end) !== to);
  const save = async () => {
    if (!(mins > 0)) { setErr("終わりの時刻を、始まりより後にしてください"); return; }
    setSaving(true); setErr("");
    const r = await gasPostJson("updateLogTime", {
      log_id: log.log_id || "", date: date, time_block: log.time_block, new_time_block: from + "-" + to });
    setSaving(false);
    if (r && r.ok) {
      // 重なっていても通す。ただし黙って重ねると合計時間が二重になるので、そこは伝える
      const ov = (r.overlaps || []).length;
      onToast && onToast(ov ? ("時間を直しました（" + ov + "件と重なっています）") : "時間を直しました");
      onSaved && onSaved(from + "-" + to, mins); onClose();
    }
    else setErr((r && r.error) || "直せませんでした");
  };
  return ReactDOM.createPortal(html`
    <div onClick=${onClose} style=${{position:"fixed",inset:0,zIndex:450,background:"rgba(0,0,0,0.55)",
                                     display:"flex",
                                     alignItems:SHEET_WIDE?"stretch":"flex-end",
                                     justifyContent:SHEET_WIDE?"flex-end":"center"}}>
      <div onClick=${e=>e.stopPropagation()}
        style=${SHEET_WIDE
          ? {width:400,maxWidth:"92vw",background:"var(--card)",borderLeft:"1px solid var(--border)",
             padding:"20px 20px 24px",height:"100%",overflowY:"auto"}
          : {width:"100%",maxWidth:520,background:"var(--card)",borderRadius:"20px 20px 0 0",
             border:"1px solid var(--border)",borderBottom:"none",
             padding:"20px 20px calc(24px + var(--safe-bottom, 0px))",maxHeight:"88dvh",overflowY:"auto"}}>
        <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
          <span style=${{flex:1,fontSize:17,fontWeight:800,color:"var(--text)"}}>記録の時間を直す</span>
          <button onClick=${onClose} style=${{background:"none",border:"none",color:"var(--sub)",fontSize:22,
            cursor:"pointer",lineHeight:1,padding:"0 4px"}}>×</button>
        </div>
        <div style=${{fontSize:13,color:"var(--sub)",marginBottom:16,lineHeight:1.7,overflowWrap:"anywhere"}}>
          ${log.task||"（内容なし）"}<br/>
          <span style=${{fontSize:11.5}}>いまは ${String(log.time_block||"").replace("-"," - ")}（${hm(sp.end-sp.start)}）です。
          内容と分類はそのまま、時間だけ変わります。</span>
        </div>

        <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
          <input class="inp" type="time" step="300" value=${from} onInput=${e=>{setFrom(e.target.value); setErr("");}}
            style=${{width:118,margin:0,textAlign:"center"}}/>
          <span style=${{color:"var(--sub)"}}>〜</span>
          <input class="inp" type="time" step="300" value=${to} onInput=${e=>{setTo(e.target.value); setErr("");}}
            style=${{width:118,margin:0,textAlign:"center"}}/>
          <span style=${{fontSize:12.5,fontWeight:700,color:mins>0?"var(--accent)":"var(--red)"}}>
            ${mins>0?hm(mins):"時間が逆です"}</span>
        </div>

        <div style=${{fontSize:11.5,color:"var(--sub)",marginBottom:6}}>長さを変える</div>
        <div style=${{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
          ${[15,30,45,60,90,120].map(m=>html`
            <button key=${m} onClick=${()=>{setTo(toHM(((toMin(from)+m)%1440+1440)%1440)); setErr("");}}
              style=${{padding:"6px 11px",borderRadius:20,fontSize:11.5,cursor:"pointer",fontFamily:"inherit",
                       border:`1px solid ${mins===m?"var(--accent)":"var(--border)"}`,
                       background:mins===m?"var(--accent-l)":"transparent",
                       color:mins===m?"var(--accent)":"var(--sub)",
                       fontWeight:mins===m?700:500}}>${hm(m)}</button>`)}
        </div>

        <div style=${{fontSize:11.5,color:"var(--sub)",marginBottom:6}}>まるごと前後にずらす</div>
        <div style=${{display:"flex",gap:6,flexWrap:"wrap",marginBottom:16}}>
          ${[-60,-30,-15,15,30,60].map(m=>html`
            <button key=${m} onClick=${()=>{shift(m); setErr("");}}
              style=${{padding:"6px 11px",borderRadius:20,fontSize:11.5,cursor:"pointer",fontFamily:"inherit",
                       border:"1px solid var(--border)",background:"transparent",color:"var(--sub)"}}>
              ${m>0?"+":"−"}${Math.abs(m)}分</button>`)}
        </div>

        ${err&&html`
          <div style=${{background:"var(--red-l)",border:"1px solid var(--red)",color:"var(--red)",
                        borderRadius:10,padding:"9px 11px",fontSize:12,lineHeight:1.7,marginBottom:12}}>${err}</div>`}

        <button class="btn" onClick=${save} disabled=${saving||!changed||!(mins>0)}
          style=${{opacity:(saving||!changed||!(mins>0))?0.5:1}}>
          ${saving ? "直しています…" : changed ? `この時間に直す（${from} - ${to}）` : "時間を変えてください"}</button>
        <div style=${{fontSize:11,color:"var(--sub)",lineHeight:1.7,marginTop:10}}>
          カレンダーの予定も一緒に動きます。他の記録と時間が重なっても登録できます
          （そのぶん合計時間は重ねて数えられます）。
        </div>
      </div>
    </div>`, document.body);
}

const EVALS = [
  {l:"5 — 完璧にできた", c:"e5"},{l:"4 — よくできた", c:"e4"},
  {l:"3 — まあまあだった", c:"e3"},{l:"2 — もう少しだった", c:"e2"},{l:"1 — 全然だめだった", c:"e1"},

// ★深夜0時〜5時の枠が無かった★（2026-08-07 kyokaさんのアンケート★2）
//   「夜中や朝方にやる事があるが、時間枠がないので記録がやりにくい」
//   05:00始まりだったので、0時〜5時に何かをしても記録する場所が無かった。
//   記録できない日ができ、そのぶん連続記録が切れていた。
const ALL_TIME_BLOCKS = ["00:00-01:00","01:00-02:00","02:00-03:00","03:00-04:00","04:00-05:00",
  "05:00-06:00","06:00-07:00","07:00-08:00","08:00-09:00","09:00-10:00","10:00-11:00","11:00-12:00","12:00-13:00","13:00-14:00","14:00-15:00","15:00-16:00","16:00-17:00","17:00-18:00","18:00-19:00","19:00-20:00","20:00-21:00","21:00-22:00","22:00-23:00","23:00-24:00"];
const getLogHours = () => JSON.parse(localStorage.getItem("jiroku_log_hours")||'{"start":6,"end":23}');
// 1日の目標時間（目標に関連した記録を何時間積むか）。固定の8h基準ではなく、
// 本人が自分で決めた目標に対する達成度を測れるようにする。デフォルトは2時間
const getDailyGoalHours = () => Number(localStorage.getItem("jiroku_daily_goal_hours")) || 2;
const getTimeBlocks = () => { const {start,end}=getLogHours(); return ALL_TIME_BLOCKS.filter(b=>parseInt(b)>=start&&parseInt(b)<=end); };
const TIME_BLOCKS = getTimeBlocks();

// ── 記録の時間帯キーを扱う道具 ────────────────────────────────
// 時間帯キーは3種類ある：
//   "14:00-15:00" … 手動記録の1時間枠
//   "13:00-15:40" … 「時間を細かく」やタイマーで測った実測の範囲
//   "14:00"       … 開始だけ（1時間とみなす）
const HM_TO_MIN = (v) => { const p=String(v||"").split(":"); return (Number(p[0])||0)*60+(Number(p[1])||0); };
// 開始・終了を「その日の0時からの分」で返す。日をまたぐ範囲（23:00-01:00）は
// 終了に24時間を足して、必ず 終了 > 開始 になるようにする
const blockSpan = (tb) => {
  const s = String(tb||"").trim();
  const m = s.match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/);
  if(m){
    const st = Number(m[1])*60+Number(m[2]);
    let en = Number(m[3])*60+Number(m[4]);
    if(en <= st) en += 1440;             // 日をまたいだ記録
    return {start:st, end:en};
  }
  if(/^\d{1,2}:\d{2}/.test(s)){ const st=HM_TO_MIN(s.slice(0,5)); return {start:st, end:st+60}; }
  return null;
};
const blockMinutes = (tb) => { const sp=blockSpan(tb); return sp ? sp.end-sp.start : 0; };
// 並び順のためのキー。深夜0〜4時の記録は、その日のいちばん後ろへ回す
const blockSortKey = (tb) => {
  const sp = blockSpan(tb);
  if(!sp) return 0;
  return sp.start < DAY_CUTOFF_HOUR*60 ? sp.start + 1440 : sp.start;
};
const sortLogsByTime = (arr) => [...arr].sort((a,b)=>blockSortKey(a.time_block)-blockSortKey(b.time_block));
// 2つの時間帯が重なっているか（1分でも重なれば true）
const blocksOverlap = (a, b) => {
  const x = blockSpan(a), y = blockSpan(b);
  if(!x || !y) return false;
  return x.start < y.end && y.start < x.end;
};
