// 2週間スプリントの作成・編集。3か月目標を必ず親に選ばせる
// （親のない目標は集計に載らず、あとで宙に浮くため）
// 3か月目標の深掘り。数字を先に聞かず、「達成した状態」から数えるものを決める。
// 「腹筋をシックスパックにする / 12回」のように、何の12回か分からない目標を作らせない。
function GoalDeepenSheet({goal, onClose, onSaved, onToast}) {
  const [step, setStep] = useState(0);
  const [d, setD] = useState(()=>({...goal}));
  const [saving, setSaving] = useState(false);
  const set = (k,v)=>setD(p=>({...p,[k]:v}));
  const today = formatDateStr(new Date());
  const plus = (n)=>{ const x=new Date(today+"T00:00:00+09:00"); x.setMonth(x.getMonth()+n); return formatDateStr(x); };

  const STEPS = [
    { key:"why", title:"なぜ、それをやりたい？",
      hint:"きれいな言葉でなくて大丈夫です。しんどい時に自分を戻してくれるのは、この一行です。",
      ph:"例：家族に心配をかけずに、来年も同じ働き方を続けたいから", multi:true },
    { key:"success_condition", title:"どうなっていたら「できた」と言える？",
      hint:"「がんばる」ではなく、他の人が見ても分かる状態で書きます。ここが決まると、数えるものが決まります。",
      ph:"例：体脂肪率が15%を切って、腹筋の線が見えている", multi:true },
    { key:"__metric", title:"では、何を数えますか？",
      hint:"上の状態に近づいたかを測れる数字を1つだけ選びます。増えるほど良い数字にしてください。" },
    { key:"__period", title:"いつまで？",
      hint:"3か月が基本です。長すぎると今日が変わらず、短すぎると形になりません。" },
    { key:"guardrails", title:"これは犠牲にしない、というものは？",
      hint:"目標を追ううちに壊しがちなものを先に決めておきます。空欄でも進めます。",
      ph:"例：睡眠6時間、週1回は家族と夕食", multi:true }
  ];
  const cur = STEPS[step];
  const last = step === STEPS.length - 1;

  const save = async () => {
    setSaving(true);
    const body = {...d};
    delete body.pace; delete body.paceLabel; delete body.weeklyGoals; delete body.current_value_source;
    const r = await gasPostJson("saveGoal", body);
    setSaving(false);
    if(r&&r.ok){ onToast&&onToast("保存しました"); onSaved&&onSaved(); onClose(); }
    else onToast&&onToast((r&&r.error)||"保存できませんでした");
  };

  return html`
    <div style=${{position:"fixed",inset:0,height:"100dvh",zIndex:430,background:"var(--bg)",display:"flex",flexDirection:"column"}}>
      <div style=${{display:"flex",alignItems:"center",gap:10,padding:"14px 16px",borderBottom:"1px solid var(--border)",flexShrink:0,paddingTop:"calc(14px + var(--safe-top, 0px))"}}>
        <div style=${{flex:1,minWidth:0}}>
          <div style=${{fontSize:10.5,color:"var(--sub)",fontWeight:700}}>${step+1} / ${STEPS.length}</div>
          <div style=${{fontSize:14,fontWeight:800,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${d.title}</div>
        </div>
        <button onClick=${onClose} style=${{background:"none",border:"none",color:"var(--sub)",fontSize:22,cursor:"pointer",lineHeight:1,padding:"0 4px"}}>×</button>
      </div>
      <div style=${{height:3,background:"var(--border)",flexShrink:0}}>
        <div style=${{height:"100%",width:((step+1)/STEPS.length*100)+"%",background:"var(--accent)",transition:"width .3s"}}/>
      </div>

      <div style=${{flex:1,minHeight:0,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"20px 16px calc(28px + var(--safe-bottom, 0px))"}}>
        <div style=${{fontSize:17,fontWeight:800,lineHeight:1.5,marginBottom:8}}>${cur.title}</div>
        <div style=${{fontSize:12.5,color:"var(--sub)",lineHeight:1.8,marginBottom:16}}>${cur.hint}</div>

        ${cur.key==="__metric" ? html`
          <div style=${{marginBottom:14}}>
            <div style=${{fontSize:12,color:"var(--sub)",marginBottom:6}}>数えるもの（単位）</div>
            <div style=${{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
              ${["回","件","分","時間","日","万円","kg","%","点"].map(u=>html`
                <button key=${u} onClick=${()=>set("unit",u)}
                  style=${{padding:"7px 14px",borderRadius:20,fontSize:12.5,cursor:"pointer",fontFamily:"inherit",
                           border:`1.5px solid ${d.unit===u?"var(--accent)":"var(--border)"}`,
                           background:d.unit===u?"var(--accent-l)":"transparent",
                           color:d.unit===u?"var(--accent)":"var(--sub)",fontWeight:d.unit===u?700:500}}>${u}</button>`)}
            </div>
            <input class="inp" placeholder="ほかの単位を書く（例：本、社、ページ）" value=${d.unit||""}
              onInput=${e=>set("unit",e.target.value)} style=${{marginBottom:14}}/>
            <div style=${{display:"flex",gap:10}}>
              <label style=${{flex:1}}><span class="form-lbl">3か月後にいくつ？</span>
                <input class="inp" type="number" inputmode="decimal" placeholder="目標" value=${d.target_value||""}
                  onInput=${e=>set("target_value",e.target.value)} style=${{margin:0,textAlign:"right"}}/></label>
              <label style=${{flex:1}}><span class="form-lbl">いまはいくつ？</span>
                <input class="inp" type="number" inputmode="decimal" placeholder="現在" value=${d.current_value||""}
                  onInput=${e=>set("current_value",e.target.value)} style=${{margin:0,textAlign:"right"}}/></label>
            </div>
            <div style=${{fontSize:11.5,color:"var(--sub)",lineHeight:1.7,marginTop:8}}>
              いまが0でも書いてください。空欄のままだと「まだ測っていない」扱いになり、進み具合を出せません。
            </div>
          </div>`
        : cur.key==="__period" ? html`
          <div style=${{marginBottom:14}}>
            <div style=${{display:"flex",gap:6,marginBottom:12}}>
              ${[["3か月",3],["2か月",2],["1か月",1]].map(([lb,n])=>html`
                <button key=${lb} onClick=${()=>{ set("start_date", d.start_date||today); set("end_date", plus(n)); }}
                  style=${{flex:1,padding:"10px 4px",borderRadius:10,fontSize:12.5,cursor:"pointer",fontFamily:"inherit",
                           border:`1.5px solid ${d.end_date===plus(n)?"var(--accent)":"var(--border)"}`,
                           background:d.end_date===plus(n)?"var(--accent-l)":"transparent",
                           color:d.end_date===plus(n)?"var(--accent)":"var(--sub)",fontWeight:700}}>${lb}</button>`)}
            </div>
            <div style=${{display:"flex",gap:10}}>
              <label style=${{flex:1}}><span class="form-lbl">はじめ</span>
                <input class="inp" type="date" value=${d.start_date||today} onInput=${e=>set("start_date",e.target.value)} style=${{margin:0}}/></label>
              <label style=${{flex:1}}><span class="form-lbl">おわり</span>
                <input class="inp" type="date" value=${d.end_date||""} onInput=${e=>set("end_date",e.target.value)} style=${{margin:0}}/></label>
            </div>
          </div>`
        : html`
          <textarea class="inp" placeholder=${cur.ph} value=${d[cur.key]||""}
            onInput=${e=>set(cur.key, e.target.value)}
            style=${{minHeight:110,resize:"vertical",lineHeight:1.7,fontFamily:"inherit",marginBottom:14}}/>`}

        <div style=${{display:"flex",gap:8,marginTop:6}}>
          ${step>0&&html`<button onClick=${()=>setStep(step-1)}
            style=${{flex:1,padding:"12px",borderRadius:10,border:"1.5px solid var(--border)",background:"none",color:"var(--sub)",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>もどる</button>`}
          <button disabled=${saving} onClick=${()=>{ if(last) save(); else setStep(step+1); }}
            style=${{flex:2,padding:"12px",borderRadius:10,border:"none",background:"var(--accent)",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",opacity:saving?0.6:1}}>
            ${saving?"保存中…":(last?"保存して終わる":"次へ")}</button>
        </div>
        <button onClick=${()=>{ if(last) save(); else setStep(step+1); }}
          style=${{width:"100%",marginTop:10,background:"none",border:"none",color:"var(--sub)",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
          ここは飛ばす</button>
      </div>
    </div>`;
}

// 今週の目標をつくる小さい画面。
// これまでは「目標ロードマップ」全体を開き直していたため、
//   ・通信が遅いと読み込み中のまま止まる（実際に止まった）
//   ・「スプリントから作る」と言いながらスプリントを選べない
// という2つの問題があった。手元にあるデータだけで動かす。
function WeeklyGoalSheet({sprints, goals, editing, onClose, onSaved, onToast}) {
  const cur = (sprints||[]).filter(x=>x.isCurrent);
  // editing が渡されたら、その週間目標を書き換える（新規と同じ画面を使う）
  const [d, setD] = useState(()=> editing ? {
    weekly_goal_id: editing.weekly_goal_id,
    link_sprint_id: editing.link_sprint_id||"",
    link_quarterly_goal_id: editing.link_quarterly_goal_id||"",
    title: editing.title||"", metric_type: editing.metric_type||"COUNT",
    unit: editing.unit||"件",
    target_total: String(editing.std_line||editing.target_total||""),
    status: editing.status||"ACTIVE"
  } : {
    link_sprint_id: (cur[0]&&cur[0].sprint_id)||"",
    link_quarterly_goal_id: (cur[0]&&cur[0].link_quarterly_goal_id)||((goals[0]&&goals[0].quarterly_goal_id)||""),
    title:"", metric_type:"COUNT", unit:"件", target_total:"", status:"ACTIVE"
  });
  const [saving,setSaving]=useState(false);
  const set=(k,v)=>setD(p=>({...p,[k]:v}));
  const pickSprint=(id)=>{
    const sp=(sprints||[]).find(x=>x.sprint_id===id);
    setD(p=>({...p, link_sprint_id:id,
      link_quarterly_goal_id: (sp&&sp.link_quarterly_goal_id)||p.link_quarterly_goal_id}));
  };
  const MT=[["COUNT","回数","件"],["DURATION","時間","分"],["DAYS","日数","日"],["BOOLEAN","やったかどうか",""]];
  const save=async()=>{
    if(!String(d.title||"").trim()){ onToast&&onToast("今週やることを書いてください"); return; }
    if(d.metric_type!=="BOOLEAN" && !String(d.target_total||"").trim()){ onToast&&onToast("いくつやるかを入れてください"); return; }
    setSaving(true);
    const r=await gasPostJson("saveWeeklyGoal", {...d, std_line:d.target_total});
    setSaving(false);
    if(r&&r.ok){ onToast&&onToast(editing?"今週の目標を変更しました":"今週の目標を決めました"); onSaved&&onSaved(); onClose(); }
    else onToast&&onToast((r&&r.error)||"保存できませんでした");
  };
  const sp = cur.find(x=>x.sprint_id===d.link_sprint_id);
  return html`
    <div style=${{position:"fixed",inset:0,height:"100dvh",zIndex:420,background:"var(--bg)",display:"flex",flexDirection:"column"}}>
      <div style=${{display:"flex",alignItems:"center",gap:10,padding:"14px 16px",borderBottom:"1px solid var(--border)",flexShrink:0,paddingTop:"calc(14px + var(--safe-top, 0px))"}}>
        <div style=${{fontSize:15,fontWeight:800,flex:1}}>今週やることを決める</div>
        <button onClick=${onClose} style=${{background:"none",border:"none",color:"var(--sub)",fontSize:22,cursor:"pointer",lineHeight:1,padding:"0 4px"}}>×</button>
      </div>
      <div style=${{flex:1,minHeight:0,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"14px 16px calc(28px + var(--safe-bottom, 0px))"}}>
        ${sp&&html`
          <div style=${{background:"var(--bg)",borderRadius:10,padding:"10px 12px",marginBottom:16,fontSize:12,color:"var(--sub)",lineHeight:1.7}}>
            スプリント「<b style=${{color:"var(--text)"}}>${sp.name}</b>」の2週間のうち、<b style=${{color:"var(--text)"}}>今週ぶんの数字</b>を決めます。
            ${sp.action_metric&&html`<br/>2週間ぶんの目安：${sp.action_metric}`}
          </div>`}
        ${cur.length>1&&html`
          <label class="form-lbl">どのスプリント？</label>
          <select class="inp" value=${d.link_sprint_id} onInput=${e=>pickSprint(e.target.value)} style=${{marginBottom:16}}>
            ${cur.map(x=>html`<option key=${x.sprint_id} value=${x.sprint_id}>${x.name}</option>`)}
          </select>`}

        <label class="form-lbl">今週やること</label>
        <input class="inp" placeholder="例：架電する" value=${d.title}
          onInput=${e=>set("title",e.target.value)} style=${{marginBottom:16}}/>

        <label class="form-lbl">どう数える？</label>
        <div style=${{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
          ${MT.map(([v,lb,u])=>html`
            <button key=${v} onClick=${()=>{ set("metric_type",v); if(u) set("unit",u); }}
              style=${{padding:"8px 14px",borderRadius:20,fontSize:12.5,cursor:"pointer",fontFamily:"inherit",
                       border:`1.5px solid ${d.metric_type===v?"var(--accent)":"var(--border)"}`,
                       background:d.metric_type===v?"var(--accent-l)":"transparent",
                       color:d.metric_type===v?"var(--accent)":"var(--sub)",fontWeight:d.metric_type===v?700:500}}>${lb}</button>`)}
        </div>

        ${d.metric_type!=="BOOLEAN"&&html`
          <label class="form-lbl">今週いくつ？</label>
          <div style=${{display:"flex",gap:8,alignItems:"center",marginBottom:6}}>
            <input class="inp" type="number" inputmode="decimal" value=${d.target_total}
              onInput=${e=>set("target_total",e.target.value)} style=${{width:110,margin:0,textAlign:"right"}}/>
            <input class="inp" value=${d.unit} onInput=${e=>set("unit",e.target.value)}
              style=${{width:80,margin:0}} placeholder="単位"/>
          </div>
          <div style=${{fontSize:11,color:"var(--sub)",lineHeight:1.6,marginBottom:16}}>
            2週間ぶんの半分が目安です。届く数にしてください。届かない数を置くと、達成が遠のくだけです。
          </div>`}

        <button class="btn" disabled=${saving} onClick=${save}>${saving?"保存中…":"保存する"}</button>
      </div>
    </div>`;
}

function SprintSheet({goals, editing, onClose, onSaved, onToast}) {
  const today = formatDateStr(new Date());
  // ★しまう★ 3か月目標・今週の目標と同じ言い回し・同じ位置にそろえる
  const archiveSprint = async () => {
    if (!editing || !editing.sprint_id) return;
    if (!confirm("この2週間スプリントをしまいます。よろしいですか？\n（ぶら下がっている今週の目標は残ります）")) return;
    const r = await gasPostJson("archiveGoalItem", { kind:"sprint", sprint_id: editing.sprint_id });
    if (r && r.ok) { onToast && onToast("しまいました"); onSaved && onSaved(); onClose && onClose(); }
    else onToast && onToast((r && r.error) || "しまえませんでした");
  };
  const plus = (d,n)=>{ const x=new Date(d+"T00:00:00+09:00"); x.setDate(x.getDate()+n); return formatDateStr(x); };
  const [d, setD] = useState(()=> editing ? {...editing} : {
    name:"", link_quarterly_goal_id: (goals[0]&&goals[0].quarterly_goal_id)||"",
    start_date: today, end_date: plus(today,13),
    bottleneck:"", target_state:"", hypothesis:"", action_metric:"", result_metric:"",
    try_actions:"", stop_actions:"", if_then:"", success_condition:"", coaching_note:"", status:"ACTIVE"
  });
  const [saving, setSaving] = useState(false);
  const [more, setMore] = useState(false);
  const set = (k,v)=>setD(p=>({...p,[k]:v}));
  const save = async () => {
    if(!String(d.link_quarterly_goal_id||"").trim()){ onToast&&onToast("どの3か月目標のためか選んでください"); return; }
    if(!String(d.target_state||"").trim()){ onToast&&onToast("2週間後どうなっていたいかを書いてください"); return; }
    // ★名前は聞かない★ 項目が多いほど手が止まる。到達状態の先頭を名前にする
    if(!String(d.name||"").trim()) d.name = String(d.target_state).replace(/\n/g," ").slice(0,40);
    setSaving(true);
    const r = await gasPostJson("saveSprint", d);
    setSaving(false);

  const F = (label, key, ph, multi) => html`

  const IC = {

        <!-- ロードマップのどこを決めているのかを見せる -->
        <div style=${{display:"flex",alignItems:"flex-start",gap:5,marginBottom:16}}>

        </div>

        <div style=${{background:"var(--accent-l)",borderRadius:10,padding:"10px 12px",marginBottom:18,display:"flex",gap:8}}>

          <span style=${{fontSize:11.5,lineHeight:1.7}}>
            <b style=${{color:"var(--text)"}}>相手の判断ではなく、自分で積み上げる行動を先に決めます。</b><br/>
            <span style=${{color:"var(--sub)"}}>結果（アポ・成約）はコントロールできません。</span>

        ${Head(IC.goal,"#0EA5A5","どの3か月目標につなげる？",true)}
        ${goals.length===0

          : html`<select class="inp" value=${d.link_quarterly_goal_id} onInput=${e=>set("link_quarterly_goal_id",e.target.value)}

function GoalTreeSheet({onClose, onToast}) {
  const [tree,setTree]=useState(null);
  const [sprints,setSprints]=useState([]);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [goalDraft,setGoalDraft]=useState(null);   // 3か月目標の編集中データ
  const [wgDraft,setWgDraft]=useState(null);       // 週間目標の編集中データ
  const [spSheet,setSpSheet]=useState(null);       // 2週間Sprintの編集（null=閉）

  // 段階ごとの色。ロードマップと同じにして、同じものを見ていると分かるようにする
  const C_Q="#14B8A6", C_S="#3B82F6", C_W="#4CAF50";

  const load=async()=>{
    setLoading(true);
    // ★ロードマップと同じ3層を出す★（2026-08-05 Kai要望）
    //   これまで一覧は「3か月目標 → 今週やること」の2層で、真ん中の
    //   2週間Sprintが抜けていた。同じものを見ているのに構造が違っていた。
    const r=await gasApi("getRoadmap");
    if(r&&r.ok){
      setTree(r.goalTree||null);
      setSprints(((r.sprints&&r.sprints.data)||[]).filter(x=>String(x.status||"ACTIVE").toUpperCase()!=="ARCHIVED"));
    } else {
      const g=await gasApi("getGoalTree");
      if(g&&g.ok) setTree(g.data); else onToast&&onToast(g&&g.error?g.error:"読み込みに失敗しました");
      const sp=await gasApi("getSprints");
      if(sp&&sp.ok) setSprints((sp.data||[]).filter(x=>String(x.status||"ACTIVE").toUpperCase()!=="ARCHIVED"));
    }
    setLoading(false);
  };
  useEffect(()=>{load();},[]);

  const saveGoalRow=async()=>{
    if(!String(goalDraft.title||"").trim()){ onToast&&onToast("目標を入力してください"); return; }
    setSaving(true);
    const r=await gasPostJson("saveGoal", goalDraft);
    setSaving(false);
    if(r&&r.ok){ setGoalDraft(null); onToast&&onToast("保存しました"); load(); }
    else onToast&&onToast(r&&r.error?r.error:"保存に失敗しました");
  };
  const saveWgRow=async()=>{
    if(!String(wgDraft.title||"").trim()){ onToast&&onToast("やることを入力してください"); return; }
    setSaving(true);
    const r=await gasPostJson("saveWeeklyGoal", wgDraft);
    setSaving(false);
    if(r&&r.ok){ setWgDraft(null); onToast&&onToast("保存しました"); load(); }
    else onToast&&onToast(r&&r.error?r.error:"保存に失敗しました");
  };
  const archive=async(kind,id)=>{
    const msg = kind==="goal" ? "この3か月目標と、ぶら下がっている週間目標をしまいます。よろしいですか？" : "この週間目標をしまいます。よろしいですか？";
    if(!confirm(msg)) return;
    const body = kind==="goal" ? {kind:"goal",quarterly_goal_id:id} : {kind:"weekly",weekly_goal_id:id};
    const r=await gasPostJson("archiveGoalItem", body);
    if(r&&r.ok){ onToast&&onToast("しまいました"); load(); } else onToast&&onToast("失敗しました");
  };

  const goals = (tree&&tree.goals)||[];
  const num = v => (v===null||v===undefined||v==="") ? null : Number(v);
  const fmt = v => { const n=num(v); return n===null ? "—" : (Math.round(n*10)/10).toLocaleString(); };
  // 週間目標の行（3か月直下でも、Sprintの下でも同じ形で出す）
  const wgRow = (w) => (wgDraft&&wgDraft.weekly_goal_id===w.weekly_goal_id)
    ? html`<${WeeklyGoalEditor} draft=${wgDraft} setDraft=${setWgDraft} onSave=${saveWgRow} onCancel=${()=>setWgDraft(null)} saving=${saving}
                  onArchive=${wgDraft&&wgDraft.weekly_goal_id?()=>archive("weekly",wgDraft.weekly_goal_id):null}/>`
    : (()=>{
        const t = Number(w.std_line)>0?Number(w.std_line):Number(w.target_total);
        const u = w.unit || (w.metric_type==="DURATION"||w.metric_type==="minutes" ? "分" : "件");
        const a = Number(w.actual_value)||0;
        const pct = (!isNaN(t)&&t>0) ? Math.min(100, a/t*100) : null;
        const mt = String(w.metric_type||"").toUpperCase();
        const canAdd = (mt==="COUNT"||mt==="DURATION"||mt==="");
        const howNote = canAdd ? "「＋」から自分で足せます"
                      : (mt==="BOOLEAN" ? "「できた」に変えると達成になります"
                                        : "記録した日数から自動で数えます");
        return html`
        <div style=${{padding:"9px 10px",background:"var(--bg)",borderRadius:9,marginBottom:6}}>
          <div style=${{display:"flex",alignItems:"center",gap:8}}>
            <div style=${{flex:1,minWidth:0,fontSize:12.5,fontWeight:600,color:"var(--text)",
                          overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${w.title}</div>
            ${pct!==null
              ? html`<div style=${{flexShrink:0,fontSize:12,whiteSpace:"nowrap"}}>
                  <b style=${{color:C_W}}>${a}</b><span style=${{color:"var(--sub)"}}> / ${t}${u}</span></div>`
              : html`<div style=${{flexShrink:0,fontSize:11,color:"var(--sub)"}}>数値なし</div>`}
            <button onClick=${()=>setWgDraft({...EMPTY_WG,...w})} style=${{background:"none",border:"none",color:"var(--accent)",fontSize:11.5,fontWeight:700,cursor:"pointer",flexShrink:0}}>編集</button>
            <button onClick=${()=>archive("weekly",w.weekly_goal_id)} style=${{background:"none",border:"none",color:"var(--sub)",fontSize:15,cursor:"pointer",lineHeight:1,flexShrink:0}}>×</button>
          </div>
          ${pct!==null&&html`
            <div style=${{height:4,marginTop:7,background:"var(--border)",borderRadius:99,overflow:"hidden"}}>
              <div style=${{height:"100%",width:pct+"%",background:C_W,borderRadius:99}}/>
            </div>`}
          <div style=${{fontSize:10.5,color:"var(--sub)",marginTop:5}}>
            ${howNote}
            ${(w.min_line!==""&&w.min_line!=null)?"　／　最低 "+w.min_line+u:""}
          </div>
        </div>`;
      })();

  return html`
    <div style=${{position:"fixed",inset:0,height:"100dvh",zIndex:400,background:"var(--bg)",display:"flex",flexDirection:"column"}}>
      <div style=${{display:"flex",alignItems:"center",gap:10,padding:"14px 16px",borderBottom:"1px solid var(--border)",flexShrink:0,paddingTop:"calc(14px + var(--safe-top, 0px))"}}>
        <div style=${{fontSize:15,fontWeight:800,color:"var(--text)",flex:1}}>目標ロードマップ</div>
        <button onClick=${onClose} style=${{background:"none",border:"none",color:"var(--sub)",fontSize:22,cursor:"pointer",lineHeight:1,padding:"0 4px"}}>×</button>
      </div>

      <div style=${{flex:1,minHeight:0,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"14px 16px calc(28px + var(--safe-bottom, 0px))"}}>
        <div style=${{fontSize:12,color:"var(--sub)",lineHeight:1.7,marginBottom:14}}>
          3か月後にたどり着きたい場所を決めて、2週間・今週へ落とし込みます。

// LINE連携の設定セクション。認証済みの本人だけが「連携用のことば」を発行できる。
// 発行したことばをLINEへ送ると連携が完了する（5分間・1回限り）。
function LineLinkSection({onToast, linked, onLinked}) {
  const [code,setCode]=useState("");
  const [left,setLeft]=useState(0);
  const [busy,setBusy]=useState(false);
  useEffect(()=>{ if(left<=0) return; const t=setTimeout(()=>setLeft(left-1),1000); return ()=>clearTimeout(t); },[left]);

  // すでに連携済みなら、連携コードは出さない。
  // 出してしまうと「送っても何も起きない」状態になり、壊れているように見える
  if (linked) {
    return html`
      <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
        <span style=${{fontSize:16}}>✅</span>
        <span style=${{fontSize:13.5,fontWeight:700,color:"var(--text)"}}>連携済みです</span>
      </div>
      <div style=${{fontSize:12.5,color:"var(--sub)",lineHeight:1.8}}>
        毎時間のリマインダーと、毎晩のAIレポートがLINEに届きます。<br/>
        機種変更などで連携し直したいときは、運営までご連絡ください。
      </div>`;
  }

  // コードを出したあと、LINEで送信が済んだかを見に行く。
  // 済んでいれば、この画面をそのまま「連携済みです」に切り替える
  useEffect(()=>{
    if(!code || linked) return;
    const t=setInterval(async()=>{
      const r=await authedPost("getUser");
      if(r&&r.ok&&r.data&&r.data.lineLinked){ clearInterval(t); onLinked&&onLinked(); }
    }, 5000);
    return ()=>clearInterval(t);
  },[code, linked]);

  const issue=async()=>{
    setBusy(true);
    const r=await authedPost("issueLineLinkToken");
    setBusy(false);
    if(r&&r.ok&&r.linkWord){ setCode(r.linkWord); setLeft(r.expiresInSec||300); }
    else onToast&&onToast(r&&r.error==="AUTH_REQUIRED" ? "もう一度ログインしてください" : "発行できませんでした");
  };
  const copy=()=>{ navigator.clipboard.writeText("LINK "+code).then(()=>onToast&&onToast("コピーしました")); };
  const mm=String(Math.floor(left/60)), ss=String(left%60).padStart(2,"0");

  return html`
    <div style=${{fontSize:12.5,color:"var(--sub)",lineHeight:1.8,marginBottom:14}}>
      LINEで毎時間のリマインダーと、毎晩のAIレポートを受け取れます。
    </div>
    ${!code ? html`
      <button class="btn" onClick=${issue} disabled=${busy}>${busy?"準備中…":"連携をはじめる"}</button>
      <div style=${{fontSize:11.5,color:"var(--sub)",marginTop:10,lineHeight:1.7}}>
        ボタンを押すと連携コードが出ます。それをJIROKUのLINEに送ると完了です。
      </div>
    ` : html`
      <div style=${{fontSize:12.5,color:"var(--text)",fontWeight:700,marginBottom:8}}>
        ① 下の文字をコピー　② JIROKUのLINEに貼り付けて送信
      </div>
      <div style=${{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:12,padding:14,marginBottom:10}}>
        <div style=${{fontFamily:"monospace",fontSize:14,fontWeight:700,color:"var(--text)",wordBreak:"break-all",lineHeight:1.6}}>LINK ${code}</div>
        <div style=${{fontSize:11,color:left<60?"#e57373":"var(--sub)",marginTop:8}}>
          ${left>0 ? "有効期限 あと "+mm+":"+ss : "期限切れです。もう一度お試しください"}
        </div>
      </div>
      <div style=${{display:"flex",gap:8,marginBottom:8}}>
        <button class="btn" onClick=${copy} style=${{flex:1}}>コピーする</button>
        <button onClick=${()=>window.open("https://lin.ee/5pElLYY","_blank")} style=${{background:"#06C755",border:"none",borderRadius:10,padding:"0 16px",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>LINEを開く</button>
      </div>
      <button onClick=${issue} disabled=${busy} style=${{background:"none",border:"1px solid var(--border)",borderRadius:10,padding:"9px",color:"var(--sub)",fontSize:12.5,fontWeight:600,cursor:"pointer",width:"100%"}}>コードを出し直す</button>
    `}`;
}

// 週次ふりかえりを出してよいかの判定。
// 以前は「土日なら出す」だけだったため、次の2つの問題があった。
//  ① 記入していないまとめが、何週間前のものでも週末のたびに出続けた
//     （実際に8日以上前に終わった週のまとめが表示されていた）
//  ② 深夜1時でも暦上は土曜なので、金曜の夜に「今週をふりかえろう」が出た
// そこで「日曜の朝7時〜夜23時」「直近に終わった週のものだけ」に限定する。
// 深夜0〜4時は本人の感覚ではまだ前日なので、土曜の深夜に出さないよう日付をずらす。
function shouldShowWeeklyReview(weekly) {
  if (!weekly || !weekly.weekEnd) return false;
  const now = new Date();
  const eff = new Date(now.getTime() - (now.getHours() < 4 ? 4 * 3600 * 1000 : 0));
  if (eff.getDay() !== 0) return false;                       // 日曜だけ
  const h = eff.getHours();
  if (h < 7 || h >= 23) return false;                         // 朝7時〜夜23時のあいだ
  const end = new Date(String(weekly.weekEnd) + "T00:00:00");
  const days = Math.floor((eff - end) / 86400000);
  return days >= 0 && days <= 9;                              // 直近に終わった週のものだけ
}

// ★1日に使える時間と、休む日（B8〜B10）★
//   会社でいう資金繰り。使える時間が分からないと「詰め込みすぎ」を判定できない。
//   曜日ごとの既定を決めておき、その日だけ変えたいときは今日の設定で上書きする。
function AvailableTimeSection({onToast}) {
  const DAYS = [["mon","月"],["tue","火"],["wed","水"],["thu","木"],["fri","金"],["sat","土"],["sun","日"]];
  const todayKey2 = formatDateStr(new Date());
  const [wk, setWk] = useState(null);          // 曜日ごとの既定（分）
  const [day, setDay] = useState(null);        // 今日の設定
  const [saved, setSaved] = useState(null);    // 最後に保存できた内容（変更の有無を見るため）
  const [busy, setBusy] = useState(false);
  const [failed, setFailed] = useState(false);
  // 読み込みに失敗したときに「読み込み中…」のまま固まると、
  // 何も押せない画面になってしまう。失敗はそう出して、押し直せるようにする。
  const load = async () => {
    setFailed(false);
    let r = null;
    try { r = await authedPost("getDayPlan", { date: todayKey2 }); } catch(e) { r = null; }
    if (r && r.ok && r.data) {
      const w0 = r.data.weekly_available_minutes || {};
      const d0 = { day_type: r.data.day_type || "NORMAL", available_minutes: r.data.available_minutes,
                   resolved: r.data.resolved };
      setWk(w0); setDay(d0); setSaved(JSON.stringify([w0, d0.day_type, d0.available_minutes]));
    } else {
      const w0 = {}, d0 = { day_type:"NORMAL", available_minutes:null };
      setWk(w0); setDay(d0); setSaved(JSON.stringify([w0, d0.day_type, d0.available_minutes]));
      if (!r || !r.ok) setFailed(true);
    }
  };
  useEffect(()=>{ load(); },[]);
  if (wk === null) return html`
    <div style=${{fontSize:12.5,color:"var(--sub)"}}>読み込み中…</div>`;

  const hh = (m) => m === null || m === undefined || m === "" ? "未設定"
                    : (Math.floor(m/60) + "時間" + (m%60 ? (m%60)+"分" : ""));

  // ★1タップごとに保存しない★（2026-08-05 Kai要望）
  //   保存のたびにサーバーへ往復して2秒ほど固まり、選ぶだけで時間がかかっていた。
  //   選ぶのは画面の中だけで済ませ、最後に「保存する」でまとめて送る。
  const dirty = saved !== JSON.stringify([wk, day.day_type, day.available_minutes]);
  const saveAll = async () => {
    setBusy(true);
    const r1 = await authedPost("saveWeeklyAvailable", { weekly_available_minutes: JSON.stringify(wk) });
    const r2 = await authedPost("saveDayPlan", { date: todayKey2, day_type: day.day_type,

// ★ジロー図鑑★（2026-08-06 Kai要望で攻略本から独立させた）
//   攻略本の奥（設定→階級システム→攻略本→スクロール）にあって誰も辿り着けない。
//   ホームのジローくんからも、設定からも1タップで開けるようにする。
// ★進み具合は必ず数にしてから使う★（2026-08-06 Kai指摘「バーが逆になっている」）
//   now や need が欠けた古い保存データだと 0/0 で NaN になり、
//   width:"NaN%" は無効な指定なので幅が自動＝満タンに見えていた。
//   達成ずみ・会えたあとは満タンで固定する。
function jiroProgOf(p, have) {
  const need = Math.max(0, Number(p && p.need) || 0);
  const now  = Math.max(0, Number(p && p.now)  || 0);
  const done = !!have || (need > 0 && now >= need);
  const pct  = done ? 100 : (need > 0 ? Math.round(Math.min(1, now / need) * 100) : 0);
  return { now: now, need: need, done: done, pct: pct };
}

    "レジェンド":"みんなの頑張りで仲間を応援する。教えることで自分も伸びます。",

                      padding:"18px 20px 16px",overflow:"hidden",flexShrink:0}}>

            stroke-linejoin="round" style=${{position:"absolute",right:-22,top:-16,opacity:0.16}}>
            <path d="M3 4.5h6a3 3 0 0 1 3 3v12a2.5 2.5 0 0 0-2.5-2.5H3z"/>

          <div style=${{display:"flex",gap:10,overflowX:"auto",paddingBottom:10,marginBottom:14,
                        WebkitOverflowScrolling:"touch"}}>
            ${RANK_RULES.map(r=>{
              const reached = myLevel>0 && myLevel>=r.minLv;
              const hidden = r.secret && !reached;
              return html`
                <div key=${r.name} style=${{flexShrink:0,width:78,textAlign:"center"}}>

          ${Box({children:HOWTO.map(([t,d],i)=>html`
            <div key=${i} style=${{display:"flex",gap:9,alignItems:"flex-start",

              <span style=${{flexShrink:0,width:18,height:18,borderRadius:"50%",background:"var(--accent)",

              <span style=${{flex:1,minWidth:0}}>
                <span style=${{display:"block",fontSize:12,fontWeight:800,color:"var(--text)"}}>${t}</span>
                <span style=${{display:"block",fontSize:11,color:"var(--sub)",lineHeight:1.65,marginTop:2}}>${d}</span>
              </span>
            </div>`)})}

          <!-- XPの仕組み -->
          ${H({t:"XPとレベルの仕組み",s:"1件の記録でもらえるXPは、この3つの足し算です。"})}
          ${Box({children:html`
            <div>
              ${[["記録を1件つける","+10"],["ひとことメモを書く","+5"],
                 ["連続日数ボーナス（その日の1件目だけ）","+2 × 連続日数"]].map(([k,v],i)=>html`
                <div key=${i} style=${{display:"flex",alignItems:"baseline",gap:10,
                                       padding:"7px 0",borderBottom:"1px solid var(--border)"}}>
                  <span style=${{flex:1,minWidth:0,fontSize:11.5,color:"var(--text)",lineHeight:1.5}}>${k}</span>
                  <span style=${{flexShrink:0,fontSize:12,fontWeight:800,color:"var(--accent)"}}>${v}</span>
                </div>`)}
              <div style=${{fontSize:11,color:"var(--sub)",lineHeight:1.7,marginTop:10}}>
                連続日数ボーナスは30日で頭打ち（最大 +60）。<br/>
                つまり<b style=${{color:"var(--text)"}}>1日1件を切らさない</b>のが、いちばん効きます。<br/>
                レベルは上に行くほど必要なXPが増え、Lv.100（累計 83,040 XP）が頂点です。
              </div>
            </div>`})}

          <!-- 階級ごとの攻略ポイント -->
          ${H({t:"階級ごとの攻略ポイント",s:"いま会えるジローくんの分だけ読めます。"})}
          ${Box({children:RANK_RULES.map(r=>{
            const reached = myLevel>0 && myLevel>=r.minLv;
            const hidden = r.secret && !reached;
            return html`
              <div key=${r.name} style=${{display:"flex",gap:9,alignItems:"flex-start",marginBottom:11}}>
                <span style=${{flexShrink:0,marginTop:3,width:7,height:7,borderRadius:"50%",
                               background:reached?r.color:"var(--border)"}}/>
                <span style=${{flex:1,minWidth:0}}>
                  <span style=${{display:"block",fontSize:11.5,fontWeight:800,
                                 color:reached?"var(--text)":"var(--sub)"}}>
                    ${hidden?"？？？":r.name} <span style=${{fontWeight:700,color:"var(--faint)"}}>${r.lv}</span></span>
                  <span style=${{display:"block",fontSize:11,lineHeight:1.65,marginTop:2,
                                 color:reached?"var(--sub)":"var(--faint)"}}>
                    ${reached ? TIPS[r.name] : `Lv.${r.minLv} でここが読めます`}</span>
                </span>
              </div>`;
          })})}

          <!-- つまずきと対策 -->
          ${H({t:"よくあるつまずきと対策"})}
          ${Box({children:STUCK.map(([q,a],i)=>html`
            <div key=${i} style=${{marginBottom:i===STUCK.length-1?0:11}}>
              <div style=${{fontSize:11.5,fontWeight:800,color:"var(--text)"}}>${q}</div>
              <div style=${{fontSize:11,color:"var(--sub)",lineHeight:1.65,marginTop:2}}>→ ${a}</div>
            </div>`)})}

          <div style=${{background:"var(--accent-l)",border:"1px solid var(--accent)",borderRadius:14,
                        padding:"12px 14px",fontSize:11.5,color:"var(--accent)",fontWeight:700,
                        lineHeight:1.7,textAlign:"center",marginBottom:14}}>
            大事なのは速さじゃない。<br/>昨日の自分を超えることだよ。
          </div>

          <button class="btn-g" onClick=${onClose}>閉じる</button>
        </div>
      </div>
    </div>`, document.body);
}

function SettingsScreen({onToast,onLogout,onGoalSaved,profile,onProfileSaved,onCalLinked,jumpTo,onJumped}) {
  // ★App から game を渡さないこと★（2026-08-05 本番で画面が真っ赤になった）
  //   game は App には無く、ホーム側の state。渡そうとして
  //   「Can't find variable: game」でアプリ全体が落ちた。
  //   ホームが localStorage に置いたキャッシュから読む。
  const gameCache = (()=>{ try { return JSON.parse(localStorage.getItem("cache_gameStatus")||"null"); } catch { return null; } })();
  const [nickname,setNickname]=useState(profile?.nickname||CURRENT_USER.name);
  const [avatar,setAvatar]=useState(profile?.avatar||"🦊");
  const [showAllAvatars,setShowAllAvatars]=useState(false);
  // 自分の記録の書き出し（データ所有）。取得した内容をブラウザでファイル化してダウンロード
  const [exporting,setExporting]=useState("");
  const exportData=async(format)=>{
    setExporting(format);
    try{
      const r=await gasApi("exportMyData",{format});
      if(r.ok&&r.content){
        const blob=new Blob([r.content],{type:(r.mime||"text/plain")+";charset=utf-8"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url; a.download=r.filename||("jiroku."+(format==="csv"?"csv":"md"));
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
        onToast("記録を書き出しました");
      } else onToast(r.error||"書き出しに失敗しました");
    }catch(e){ onToast("書き出しに失敗しました"); }
    setExporting("");
  };
  const saveProfile=async()=>{
    if(!nickname.trim()){ onToast("ニックネームを入力してください"); return; }
    const nn=nickname.trim();
    await gasPost("saveSettings",{nickname:nn,avatar});
    const u={...CURRENT_USER,nickname:nn,avatar};
    CURRENT_USER=u; localStorage.setItem("edventure_user",JSON.stringify(u));
    onProfileSaved({nickname:nn,avatar});
    onToast("プロフィールを保存しました");
  };
  const saved=JSON.parse(localStorage.getItem("notifySettings")||'{"start":7,"end":23,"interval":6}');
  const savedGoals=JSON.parse(localStorage.getItem("jiroku_goals")||'[{"goal":"","deadline":""}]');
  const savedLogHours=getLogHours();
  const [interval,setInterval]=useState(saved.interval||2);
  const [logStart,setLogStart]=useState(savedLogHours.start);
  const [logEnd,setLogEnd]=useState(savedLogHours.end);
  const PRESET_OPTIONS=[5,10,15,20,25,30,45,60,90];
  const [selectedPresets,setSelectedPresets]=useState(()=>JSON.parse(localStorage.getItem("timer_presets")||"[25,45,60]"));
  const [breakMin,setBreakMin]=useState(()=>Number(localStorage.getItem("timer_break")||"5"));
  const [alarmStyle,setAlarmStyle]=useState(()=>localStorage.getItem("timer_alarm_style")||"standard");
  const testAlarmStyle=(key)=>{
    const style=ALARM_STYLES.find(s=>s.key===key)||ALARM_STYLES[1];
    try { scheduleAlarmBeeps(style); } catch(e){}
  };
  const togglePreset=(min)=>{
    if(selectedPresets.includes(min)){
      if(selectedPresets.length<=1){return;} // 最低1つ必須
      setSelectedPresets(selectedPresets.filter(p=>p!==min));
    } else {
      if(selectedPresets.length>=3) return; // 最大3つ
      setSelectedPresets([...selectedPresets,min].sort((a,b)=>a-b));
    }
  };
  const saveTimerSettings=()=>{
    localStorage.setItem("timer_presets",JSON.stringify(selectedPresets));
    localStorage.setItem("timer_break",String(breakMin));
    localStorage.setItem("timer_alarm_style",alarmStyle);
    onToast("タイマー設定を保存しました");
  };
  const [goals,setGoals]=useState(savedGoals.length?savedGoals:[{goal:"",deadline:""}]);
  const updateGoal=(i,field,val)=>{ const g=[...goals]; g[i]={...g[i],[field]:val}; setGoals(g); };
  const addGoal=()=>{ if(goals.length<3) setGoals([...goals,{goal:"",deadline:""}]); };
  const removeGoal=(i)=>{ if(goals.length>1) setGoals(goals.filter((_,j)=>j!==i)); };
  const [calLinked,setCalLinked]=useState(!!localStorage.getItem("cal_linked"));
  const [calWriteGranted,setCalWriteGranted]=useState(!!localStorage.getItem("cal_write_granted"));
  const [calLoading,setCalLoading]=useState(false);
  // 複数カレンダー連携: アカウント内のカレンダー一覧から選択できるようにする
  const [calList,setCalList]=useState(null);
  const [calListLoading,setCalListLoading]=useState(false);
  const [selectedCalIds,setSelectedCalIds]=useState(()=>{
    try{ return JSON.parse(localStorage.getItem("jiroku_cal_ids")||'["primary"]'); }catch(e){ return ["primary"]; }
  });
  const loadCalList=async()=>{
    setCalListLoading(true);
    let token=await getCalendarToken(false);
    if(!token) token=await getCalendarToken(true);
    if(!token){ setCalListLoading(false); onToast("カレンダー一覧の取得に失敗しました"); return; }
    try{
      const r=await fetch("https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader&maxResults=50",
        {headers:{Authorization:"Bearer "+token}}).then(r=>r.json());
      if(r.items){
        // メインを先頭に、次に名前順で並べる
        const list=r.items.map(c=>({id:c.primary?"primary":c.id, summary:c.summaryOverride||c.summary||c.id, primary:!!c.primary}))
          .sort((a,b)=>(b.primary?1:0)-(a.primary?1:0) || String(a.summary).localeCompare(String(b.summary),"ja"));
        setCalList(list);
      } else onToast("カレンダー一覧の取得に失敗しました");
    }catch(e){ onToast("カレンダー一覧の取得に失敗しました"); }
    setCalListLoading(false);
  };
  const toggleCalId=(id)=>{
    const next=selectedCalIds.includes(id)
      ? selectedCalIds.filter(x=>x!==id)
      : [...selectedCalIds,id];
    if(next.length===0) return; // 最低1つは必須
    setSelectedCalIds(next);
    localStorage.setItem("jiroku_cal_ids",JSON.stringify(next));
    clearCalendarCache(); // 選択が変わったら古い予定キャッシュを破棄して取り直す
  };
  const [pushEnabled,setPushEnabled]=useState(!!localStorage.getItem("push_enabled"));
  const [pushLoading,setPushLoading]=useState(false);
  const enablePush=async()=>{
    setPushLoading(true);
    const r=await enablePushNotifications();
    setPushLoading(false);
    if(r.ok) setPushEnabled(true);
    else onToast(r.error||"プッシュ通知の設定に失敗しました");
  };

  const linkCalendar=()=>{
    if(!window.google||!google.accounts) return;
    setCalLoading(true);
    // ポップアップが閉じられた/ブロックされた場合の保険（callbackが来ないと固まるため）
    const safety=setTimeout(()=>setCalLoading(false), 45000);
    const client=google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: "https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/calendar.events",
      error_callback: ()=>{ clearTimeout(safety); setCalLoading(false); onToast("連携できませんでした。もう一度お試しください"); },
      callback: async(tokenResp)=>{
        clearTimeout(safety);
        if(tokenResp.error){ setCalLoading(false); onToast("カレンダー連携に失敗しました"); return; }
        // トークンを受け取れた時点で、Google側の許可(スコープの同意)自体は成功している。
        // この後のカレンダーID取得・サーバー保存が失敗しても「許可済み」の記録は
        // 別に残しておく（そうしないと、付随処理の失敗のたびに毎回この画面で
        // 許可を求め続けることになってしまうため）
        localStorage.setItem("cal_linked","1");
        localStorage.setItem("cal_write_granted","1");
        setCalLinked(true);
        setCalWriteGranted(true);
        try{
          gcalToken=tokenResp.access_token;
          gcalTokenExp=Date.now()+(Number(tokenResp.expires_in)||3600)*1000;
          try{ localStorage.setItem("gcal_token", JSON.stringify({token:gcalToken, exp:gcalTokenExp})); }catch(e){}
          const calRes=await fetch("https://www.googleapis.com/calendar/v3/users/me/calendarList/primary",{
            headers:{Authorization:"Bearer "+tokenResp.access_token}
          }).then(r=>r.json());
          const calId=calRes.id||CURRENT_USER.email;
          await gasPost("saveSettings",{google_calendar_id:calId});
          onCalLinked && onCalLinked();
          fetchCalendarEvents(formatDateStr(new Date())); // 今日の予定を先読み
          flushCalendarQueue(); // 連携でトークンが取れたので、溜まっていた書き込みを送信
          onToast("カレンダーを連携しました！");
        }catch{ onToast("カレンダー取得に失敗しました"); }
        setCalLoading(false);
      }
    });
    client.requestAccessToken();
  };

  // 休みの曜日（0=日〜6=土）。休みの日はリマインダーなし・XP減衰なし・連続記録も守られる
  const [restDays,setRestDays]=useState(()=>{
    try{ return JSON.parse(localStorage.getItem("jiroku_rest_days")||"[]"); }catch(e){ return []; }
  });
  const toggleRestDay=(d)=>setRestDays(restDays.includes(d)?restDays.filter(x=>x!==d):[...restDays,d].sort());

  // 記録時間帯とLINE通知を同時に保存（両者は常に連動）
  const saveTimeSettings=()=>{
    if(logEnd<=logStart){onToast("終了時間は開始より後にしてください");return;}
    localStorage.setItem("jiroku_log_hours",JSON.stringify({start:logStart,end:logEnd}));
    localStorage.setItem("notifySettings",JSON.stringify({start:logStart,end:logEnd,interval}));
    localStorage.setItem("jiroku_rest_days",JSON.stringify(restDays));
    gasPost("saveSettings",{notify_start:logStart,notify_end:logEnd,notify_interval:interval,rest_days:restDays.join(",")});
    onToast("時間帯と通知設定を保存しました");
  };
  const saveGoal=()=>{
    if(!goals[0]?.goal.trim()){onToast("目標1を入力してください");return;}
    localStorage.setItem("jiroku_goals",JSON.stringify(goals));
    gasPost("saveSettings",{
      goal:goals[0]?.goal.trim()||"", goal_deadline:goals[0]?.deadline||"",
      goal2:goals[1]?.goal.trim()||"", goal_deadline2:goals[1]?.deadline||"",
      goal3:goals[2]?.goal.trim()||"", goal_deadline3:goals[2]?.deadline||"",
    });
    onGoalSaved(goals);
    onToast("目標を保存しました");
  };

  // ★いまのレベル★ 階級のキャラクターは、その階級に上がるまで出さない。
  //   設定画面は game を持っていないので、まずホームが残した内容から読む。
  //   残っていないと自分の階級まで隠れてしまうので、その時は取りに行く。
  const [myLevel, setMyLevel] = useState(()=>{
    try { return Number(JSON.parse(localStorage.getItem("cache_gameStatus")||"{}").level)||0; }
    catch(e){ return 0; }
  });
  const SectionHeader = ({icon, title}) => html`
    <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
      <span style=${{fontSize:15}}>${icon}</span>
      <div style=${{fontSize:14,fontWeight:700,color:"var(--text)"}}>${title}</div>
    </div>
  `;
  // 設定をグループに区切る小見出し（アカウント / 目標と記録 / 連携 / データ / 情報）
  const GroupLabel = (t) => html`<div style=${{fontSize:11,fontWeight:700,color:"var(--sub)",letterSpacing:"0.06em",margin:"6px 4px 10px"}}>${t}</div>`;

  // 折りたたみ式セクション。開閉状態は openSec で管理し、本体は安定した
  // モジュール外コンポーネント SettingsSec を使う（下の各セクションで直接呼ぶ）
  const [openSec,setOpenSec]=useState("");
  const [flipped,setFlipped]=useState({});   // 階級カードをめくった状態
  const [guideOpen,setGuideOpen]=useState(false);  // 攻略本を開いているか
  const [zukanOpen,setZukanOpen]=useState(false);  // ジロー図鑑を開いているか
  // 階級システムを開いたとき、レベルが分からなければ取りに行く。
  // ★この useEffect は openSec より後に書くこと★
  //   前に書いて "Cannot access 'openSec' before initialization" で
  //   設定画面が真っ赤になった（2026-08-05）。
  useEffect(()=>{
    if (myLevel > 0 || openSec !== "rank") return;
    gasApi("getGameStatus").then(r=>{
      const lv = Number(r && r.ok && r.data && r.data.level);
      if (lv > 0) setMyLevel(lv);
    }).catch(()=>{});
  },[openSec]);
  const [linkTick,setLinkTick]=useState(0);   // 連携完了で画面を描き直すための印
  // ホームのバナーや、LINEのメッセージのリンク（?open=linelink）から来たときは、
  // その場でLINE連携の欄を開いて、そこまでスクロールする
  useEffect(()=>{ if(jumpTo){ setOpenSec(jumpTo); onJumped&&onJumped();
    setTimeout(()=>{ try{ const el=document.getElementById("sec-"+jumpTo); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); }catch(e){} }, 250); } },[jumpTo]);
  const [showGoalTree,setShowGoalTree]=useState(false); // 目標階層（段階公開）

  return html`<div style=${{paddingBottom:48}}>
    ${showGoalTree&&html`<${GoalTreeSheet} onClose=${()=>setShowGoalTree(false)} onToast=${onToast}/>`}

    <!-- Hero -->
    <div style=${{background:"linear-gradient(135deg, var(--hero1) 0%, var(--hero2) 100%)",padding:"36px 20px 28px",position:"relative",overflow:"hidden"}}>
      <!-- 右下: 大きなロゴマーク装飾 -->
      <svg style=${{position:"absolute",bottom:-30,right:-30,opacity:0.07}} width="140" height="140" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg"><circle cx="36" cy="36" r="36" fill="#fff"/><circle cx="36" cy="36" r="25" fill="none" stroke="#fff" stroke-width="4.5"/><path d="M36 11 A25 25 0 1 1 14.5 50" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="36" cy="36" r="15" fill="none" stroke="#fff" stroke-width="2"/><line x1="36" y1="36" x2="36" y2="25" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="36" y1="36" x2="43" y2="41" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="36" cy="36" r="2" fill="#fff"/></svg>
      <!-- JIROKUロゴ 右上 -->
      <div style=${{position:"absolute",top:18,right:20,display:"flex",alignItems:"center",gap:6}}>
        <svg width="28" height="28" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg"><circle cx="36" cy="36" r="36" fill="rgba(255,255,255,0.2)"/><circle cx="36" cy="36" r="25" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4.5"/><path d="M36 11 A25 25 0 1 1 14.5 50" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="36" cy="36" r="15" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/><line x1="36" y1="36" x2="36" y2="25" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="36" y1="36" x2="43" y2="41" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="36" cy="36" r="2" fill="#fff"/></svg>
        <span style=${{fontSize:13,fontWeight:800,color:"rgba(255,255,255,0.9)",letterSpacing:"1px"}}>JIROKU</span>
      </div>
      <div style=${{fontSize:12,color:"rgba(255,255,255,0.7)",marginBottom:6,letterSpacing:".05em"}}>ACCOUNT</div>
      <div style=${{display:"flex",alignItems:"center",gap:10,marginBottom:2}}>
        <div style=${{width:36,height:36,borderRadius:"50%",background:"rgba(255,255,255,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,flexShrink:0}}>${profile?.avatar||"🦊"}</div>
        <div style=${{fontSize:24,fontWeight:800,color:"#fff"}}>${profile?.nickname||CURRENT_USER.name}</div>
      </div>
      <div style=${{fontSize:13,color:"rgba(255,255,255,0.7)"}}>${CURRENT_USER.email}</div>
    </div>

    <div style=${{padding:"16px 16px 0"}}>

      ${GroupLabel("アカウント")}
      <!-- プロフィール -->
      <${SettingsSec} k="profile" icon="🙂" title="プロフィール" open=${openSec==="profile"} onToggle=${()=>setOpenSec(openSec==="profile"?"":"profile")}>
        <label class="form-lbl" style=${{fontSize:11}}>ニックネーム（他の人に表示される名前）</label>
        <input class="inp" value=${nickname} maxLength=${20} onChange=${e=>setNickname(e.target.value)} style=${{marginBottom:14}}/>
        <div class="form-lbl" style=${{fontSize:11,marginBottom:8}}>アバター</div>
        <div style=${{display:"grid",gridTemplateColumns:"repeat(4, 1fr)",gap:8,marginBottom:8}}>
          ${(showAllAvatars?AVATAR_OPTIONS:AVATAR_OPTIONS.slice(0,8)).map(a=>html`
            <button key=${a} onClick=${()=>setAvatar(a)}
              style=${{fontSize:22,padding:"8px 0",borderRadius:12,border:`2px solid ${avatar===a?"var(--accent)":"var(--border)"}`,background:avatar===a?"var(--accent-bg, rgba(8,145,178,0.1))":"transparent",cursor:"pointer"}}>
              ${a}
            </button>
          `)}
        </div>
        ${!showAllAvatars&&html`
          <button onClick=${()=>setShowAllAvatars(true)}
            style=${{background:"none",border:"none",color:"var(--accent)",fontSize:12.5,fontWeight:600,cursor:"pointer",padding:"2px 0 14px",width:"100%",textAlign:"center"}}>
            もっと見る（他${AVATAR_OPTIONS.length-8}種類）
          </button>
        `}
        ${showAllAvatars&&html`<div style=${{marginBottom:14}}/>`}
        <button class="btn" onClick=${saveProfile}>保存する</button>
      <//>

      ${GroupLabel("目標と記録")}
      <!-- 目標 -->
      <!-- 旧・目標入力（自由記述3つ）。goals_v1 が有効な人には出さず、
           下の「目標」（3か月目標→週間目標）に一本化する -->
      ${!(CURRENT_USER&&CURRENT_USER.goalsV1)&&html`
      <${SettingsSec} k="goals" icon="🎯" title="目標・期限" open=${openSec==="goals"} onToggle=${()=>setOpenSec(openSec==="goals"?"":"goals")}>
        ${goals.map((g,i)=>html`
          <div key=${i} style=${{background:"var(--bg)",borderRadius:12,padding:"14px",marginBottom:10,border:"1px solid var(--border)"}}>
            <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style=${{display:"flex",alignItems:"center",gap:6}}>
                <div style=${{width:6,height:6,borderRadius:"50%",background:i===0?"var(--accent)":i===1?"var(--amber)":"var(--green)"}}/>
                <label class="form-lbl" style=${{margin:0,fontSize:12}}>目標${i+1}${i===0?" （メイン）":""}</label>
              </div>
              ${i>0&&html`<button onClick=${()=>removeGoal(i)} style=${{background:"none",border:"none",color:"var(--sub)",fontSize:18,cursor:"pointer",lineHeight:1,padding:"0 2px"}}>×</button>`}
            </div>
            <textarea class="txa" placeholder=${i===0?"例：英検2級に合格する":"例：毎月売上100万円達成"} value=${g.goal}
              onChange=${e=>{updateGoal(i,"goal",e.target.value);e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px";}}
              ref=${el=>{if(el){el.style.height="auto";el.style.height=el.scrollHeight+"px";}}}
              style=${{minHeight:42,padding:"9px 12px",overflow:"hidden",resize:"none",marginBottom:8}}/>
            <label class="form-lbl" style=${{fontSize:11}}>達成期限</label>
            <input type="date" class="inp" value=${g.deadline} onChange=${e=>updateGoal(i,"deadline",e.target.value)}/>
          </div>
        `)}
        ${goals.length<3&&html`
          <button onClick=${addGoal} style=${{background:"none",border:"1.5px dashed var(--border)",borderRadius:12,padding:"11px",color:"var(--accent)",fontSize:13,fontWeight:600,cursor:"pointer",width:"100%",marginBottom:10}}>
            ＋ 目標を追加する
          </button>
        `}
        <button class="btn" onClick=${saveGoal}>保存する</button>
      <//>`}

      <!-- 新・目標。3か月目標→週間目標の階層。goals_v1 が有効な人はこちらが本体 -->
      ${CURRENT_USER&&CURRENT_USER.goalsV1&&html`
      <${SettingsSec} k="goaltree" icon="🎯" title="目標" open=${openSec==="goaltree"} onToggle=${()=>setOpenSec(openSec==="goaltree"?"":"goaltree")}>
        <div style=${{fontSize:12,color:"var(--sub)",lineHeight:1.7,marginBottom:12}}>
          3か月後にたどり着きたい場所を決めて、その下に「今週やること」をぶら下げます。
          毎時間の記録がどの目標につながっているかを、これから見えるようにしていきます。
        </div>
        <button class="btn" onClick=${()=>setShowGoalTree(true)}>目標を設定する</button>
      <//>`}

      <!-- 1日に使える時間・休む日 -->
      <${SettingsSec} k="capacity" icon="🕰" title="1日に使える時間" open=${openSec==="capacity"} onToggle=${()=>setOpenSec(openSec==="capacity"?"":"capacity")}>
        <${AvailableTimeSection} onToast=${onToast}/>
      <//>

      <!-- タイマー -->
      <${SettingsSec} k="timer" icon="⏱" title="タイマー設定" open=${openSec==="timer"} onToggle=${()=>setOpenSec(openSec==="timer"?"":"timer")}>
        <div style=${{fontSize:12,color:"var(--sub)",marginBottom:10,fontWeight:500}}>集中時間プリセット（最大3つ）</div>
        <div style=${{display:"flex",flexWrap:"wrap",gap:8,marginBottom:18}}>
          ${PRESET_OPTIONS.map(min=>html`
            <button key=${min} onClick=${()=>togglePreset(min)}
              style=${{padding:"5px 12px",borderRadius:16,border:`1.5px solid ${selectedPresets.includes(min)?"var(--accent)":"var(--border)"}`,
              background:selectedPresets.includes(min)?"var(--accent)":"transparent",
              color:selectedPresets.includes(min)?"#fff":"var(--text)",
              fontSize:11,fontWeight:600,cursor:"pointer",
              opacity:!selectedPresets.includes(min)&&selectedPresets.length>=3?0.35:1,
              transition:"all .15s"}}>
              ${min}分
            </button>
          `)}
        </div>
        <div style=${{fontSize:12,color:"var(--sub)",marginBottom:10,fontWeight:500}}>休憩時間</div>
        <div style=${{display:"flex",gap:8,marginBottom:18}}>
          ${[5,10,15,20].map(min=>html`
            <button key=${min} onClick=${()=>setBreakMin(min)}
              style=${{flex:1,padding:"10px 0",borderRadius:12,border:`1.5px solid ${breakMin===min?"var(--accent)":"var(--border)"}`,
              background:breakMin===min?"var(--accent-l)":"transparent",
              color:breakMin===min?"var(--accent)":"var(--text)",
              fontSize:14,fontWeight:breakMin===min?700:400,cursor:"pointer",transition:"all .15s"}}>
              ${min}分
            </button>
          `)}
        </div>
        <div style=${{fontSize:12,color:"var(--sub)",marginBottom:10,fontWeight:500}}>アラーム音の種類</div>
        <div style=${{display:"flex",flexDirection:"column",gap:8,marginBottom:18}}>
          ${ALARM_STYLES.map(s=>html`
            <div key=${s.key} style=${{display:"flex",alignItems:"center",gap:8}}>
              <button onClick=${()=>setAlarmStyle(s.key)}
                style=${{flex:1,textAlign:"left",padding:"10px 14px",borderRadius:12,border:`1.5px solid ${alarmStyle===s.key?"var(--accent)":"var(--border)"}`,
                background:alarmStyle===s.key?"var(--accent-l)":"transparent",
                color:alarmStyle===s.key?"var(--accent)":"var(--text)",
                fontSize:14,fontWeight:alarmStyle===s.key?700:400,cursor:"pointer",transition:"all .15s"}}>
                ${s.label}
              </button>
              <button onClick=${()=>testAlarmStyle(s.key)}
                style=${{padding:"10px 12px",borderRadius:12,border:"1px solid var(--border)",background:"none",color:"var(--sub)",fontSize:13,cursor:"pointer",flexShrink:0}}>🔊</button>
            </div>
          `)}
        </div>
        <button class="btn" onClick=${saveTimerSettings}>保存する</button>
      <//>

      <!-- 時間帯と通知（記録画面の表示範囲とLINE通知が連動） -->
      <${SettingsSec} k="notif" icon="🕐" title="時間帯と通知" open=${openSec==="notif"} onToggle=${()=>setOpenSec(openSec==="notif"?"":"notif")}>
        <div style=${{fontSize:12,color:"var(--sub)",marginBottom:14,lineHeight:1.6}}>記録する時間帯です。記録画面の表示とLINEリマインダーの両方に反映されます</div>
        <div style=${{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <div style=${{flex:1}}>
            <div style=${{fontSize:11,color:"var(--sub)",marginBottom:6,fontWeight:500}}>開始</div>
            <select class="inp" style=${{padding:"10px 8px",textAlign:"center"}} value=${logStart} onChange=${e=>setLogStart(Number(e.target.value))}>
              ${Array.from({length:25},(_,i)=>i).map(h=>html`<option key=${h} value=${h}>${String(h).padStart(2,"0")}:00</option>`)}
            </select>
          </div>
          <div style=${{color:"var(--sub)",marginTop:18,fontSize:18,fontWeight:300}}>→</div>
          <div style=${{flex:1}}>
            <div style=${{fontSize:11,color:"var(--sub)",marginBottom:6,fontWeight:500}}>終了</div>
            <select class="inp" style=${{padding:"10px 8px",textAlign:"center"}} value=${logEnd} onChange=${e=>setLogEnd(Number(e.target.value))}>
              ${Array.from({length:20},(_,i)=>i+6).map(h=>html`<option key=${h} value=${h}>${String(h).padStart(2,"0")}:00</option>`)}
            </select>
          </div>
        </div>
        <div style=${{fontSize:12,color:"var(--sub)",marginBottom:10,fontWeight:500}}>休みの曜日</div>
        <div style=${{display:"flex",gap:5,marginBottom:8}}>
          ${["日","月","火","水","木","金","土"].map((label,d)=>{
            const on=restDays.includes(d);
            return html`<button key=${d} onClick=${()=>toggleRestDay(d)}
              style=${{flex:1,padding:"8px 0",borderRadius:10,border:`1.5px solid ${on?"var(--accent)":"var(--border)"}`,
              background:on?"var(--accent)":"transparent",color:on?"#fff":d===0?"var(--red)":d===6?"var(--accent)":"var(--text)",
              fontSize:13,cursor:"pointer",fontWeight:on?700:400,fontFamily:"inherit",transition:"all .15s"}}>
              ${label}
            </button>`;
          })}
        </div>
        <div style=${{fontSize:11,color:"var(--sub)",marginBottom:16,lineHeight:1.6,padding:"8px 10px",background:"var(--bg)",borderRadius:8}}>
          休みの日はリマインダーが届かず、記録しなくてもXPや連続記録は減りません。コーチのメッセージも休息を尊重した内容になります
        </div>
        <div style=${{fontSize:12,color:"var(--sub)",marginBottom:10,fontWeight:500}}>LINE通知の間隔</div>
        <div style=${{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
          ${[[1,"1時間"],[2,"2時間"],[3,"3時間"],[6,"6時間"],[24,"1日1回"]].map(([v,label])=>html`
            <button key=${v} onClick=${()=>setInterval(v)}
              style=${{padding:"7px 13px",borderRadius:20,border:`1.5px solid ${interval===v?"var(--accent)":"var(--border)"}`,
              background:interval===v?"var(--accent)":"transparent",
              color:interval===v?"#fff":"var(--text)",fontSize:13,cursor:"pointer",fontWeight:interval===v?600:400,transition:"all .15s"}}>
              ${label}
            </button>
          `)}
        </div>
        <div style=${{fontSize:11,color:"var(--sub)",marginBottom:16,lineHeight:1.6,padding:"8px 10px",background:"var(--bg)",borderRadius:8}}>
          ${interval===1?"毎時間リマインドが届きます":interval===24?"1日の開始時間に1回届きます":`${interval}時間ごとにリマインドが届きます`}（22時以降はレポートのみ）
        </div>
        <button class="btn" onClick=${saveTimeSettings}>保存する</button>
      <//>

      ${GroupLabel("連携")}

      <!-- LINE連携（ワンタイムのことば方式）。
           以前はメールアドレスを送るだけで連携できたが、それだと他人になりすまして
           通知の宛先を奪えたため、アプリで発行したことばでのみ連携する -->
      <${SettingsSec} k="linelink" icon="💬" title="LINE連携" open=${openSec==="linelink"} onToggle=${()=>setOpenSec(openSec==="linelink"?"":"linelink")}>
        <${LineLinkSection} onToast=${onToast} linked=${CURRENT_USER&&CURRENT_USER.lineLinked!==false}
          onLinked=${()=>{ if(CURRENT_USER){ CURRENT_USER={...CURRENT_USER,lineLinked:true};
            try{ localStorage.setItem("edventure_user",JSON.stringify(CURRENT_USER)); }catch(e){} }
            onToast&&onToast("LINE連携が完了しました"); setOpenSec("linelink"); setLinkTick(t=>t+1); }}/>
      <//>

      <!-- カレンダー -->
      <${SettingsSec} k="calendar" icon="📅" title="Googleカレンダー連携" sub=${(calLinked||isServerCalendar())?"連携済み":""} open=${openSec==="calendar"} onToggle=${()=>setOpenSec(openSec==="calendar"?"":"calendar")}>
        <p style=${{fontSize:13,color:"var(--sub)",lineHeight:1.7,marginBottom:14}}>${calLinked?"連携済みです。ホームに今日の予定が表示され、記録の「何をしましたか？」に予定が自動入力されます。":"連携すると、ホームに今日の予定が表示され、記録の「何をしましたか？」にカレンダーの予定が自動で入ります。記録の手間が大幅に減ります。"}</p>
        ${calLinked
          ? html`<div>
              <div style=${{display:"flex",alignItems:"center",gap:8,color:"var(--accent)",fontWeight:700,fontSize:14,padding:"10px 14px",background:"var(--accent-l)",borderRadius:10,marginBottom:10}}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>連携済み
              </div>
              ${calWriteGranted
                ? html`<div style=${{display:"flex",alignItems:"center",gap:8,color:"var(--sub)",fontWeight:500,fontSize:12.5,padding:"9px 4px",marginBottom:10}}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>記録のカレンダー書き込みも許可済み
                  </div>`
                : html`<button onClick=${linkCalendar} disabled=${calLoading}
                    style=${{width:"100%",padding:"9px",borderRadius:10,border:"1px solid var(--border)",background:"none",color:"var(--text)",fontSize:12.5,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginBottom:10}}>
                    ${calLoading?"連携中...":"記録をカレンダーに書き込む権限を許可する"}
                  </button>`
              }
              ${calList===null
                ? html`<button onClick=${loadCalList} disabled=${calListLoading}
                    style=${{width:"100%",padding:"9px",borderRadius:10,border:"1px solid var(--border)",background:"none",color:"var(--text)",fontSize:12.5,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
                    ${calListLoading?"読み込み中...":"連携するカレンダーを選ぶ（複数可）"}
                  </button>`
                : html`<div>
                    <div style=${{fontSize:12,color:"var(--sub)",marginBottom:8,fontWeight:500}}>予定を読み込むカレンダー（複数選択できます）</div>
                    ${calList.map(c=>{
                      const on=selectedCalIds.includes(c.id);
                      return html`<button key=${c.id} onClick=${()=>toggleCalId(c.id)}
                        style=${{display:"flex",alignItems:"center",gap:8,width:"100%",padding:"9px 11px",marginBottom:6,borderRadius:9,border:`1.5px solid ${on?"var(--accent)":"var(--border)"}`,background:on?"var(--accent-l)":"transparent",cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
                        <div style=${{width:16,height:16,borderRadius:5,border:`2px solid ${on?"var(--accent)":"var(--border)"}`,background:on?"var(--accent)":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                          ${on&&html`<svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
                        </div>
                        <span style=${{fontSize:13,color:on?"var(--accent)":"var(--text)",fontWeight:on?600:400,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${c.summary}${c.primary?"（メイン）":""}</span>
                      </button>`;
                    })}
                    <div style=${{fontSize:11,color:"var(--sub)",lineHeight:1.6,marginTop:4}}>別のGoogleアカウントのカレンダーを使いたい場合は、そのカレンダーをこのアカウントに共有すると一覧に表示されます。</div>
                  </div>`}
            </div>`
          : html`<button class="btn" onClick=${linkCalendar} disabled=${calLoading}>${calLoading?"連携中...":"Googleカレンダーを連携する"}</button>`
        }
      <//>

      <!-- プッシュ通知 -->
      <${SettingsSec} k="push" icon="🔔" title="プッシュ通知" sub=${pushEnabled?"有効":""} open=${openSec==="push"} onToggle=${()=>setOpenSec(openSec==="push"?"":"push")}>
        <p style=${{fontSize:13,color:"var(--sub)",lineHeight:1.7,marginBottom:14}}>${pushEnabled?"有効になっています。アプリを閉じていたり画面がロックされていても、タイマー終了・記録リマインダーなどの通知が届きます。":"タイマーの音はアプリを開いている間しか鳴りません。有効にすると、アプリを閉じていてもタイマー終了・記録リマインダーなどの通知が端末に届きます。"}</p>
        ${pushEnabled
          ? html`<div style=${{display:"flex",alignItems:"center",gap:8,color:"var(--accent)",fontWeight:700,fontSize:14,padding:"10px 14px",background:"var(--accent-l)",borderRadius:10}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>有効
            </div>`
          : html`<button class="btn" onClick=${enablePush} disabled=${pushLoading}>${pushLoading?"設定中...":"プッシュ通知を有効にする"}</button>`
        }
      <//>

      ${GroupLabel("データ")}
      <!-- データの書き出し -->
      <${SettingsSec} k="export" icon="📤" title="データの書き出し" open=${openSec==="export"} onToggle=${()=>setOpenSec(openSec==="export"?"":"export")}>
        <div style=${{fontSize:12,color:"var(--sub)",marginBottom:14,lineHeight:1.6}}>あなたの記録・日記はあなたのものです。いつでも自分の端末に書き出せます（Markdown / CSV）。</div>
        <div style=${{display:"flex",gap:8}}>
          <button class="btn" style=${{flex:1,opacity:exporting?0.6:1}} disabled=${!!exporting} onClick=${()=>exportData("markdown")}>${exporting==="markdown"?"書き出し中…":"Markdownで書き出す"}</button>
          <button style=${{flex:1,background:"none",border:"1px solid var(--border)",borderRadius:8,padding:"0 12px",fontSize:14,fontWeight:600,color:"var(--text)",cursor:"pointer",fontFamily:"inherit",opacity:exporting?0.6:1}} disabled=${!!exporting} onClick=${()=>exportData("csv")}>${exporting==="csv"?"書き出し中…":"CSVで書き出す"}</button>
        </div>
      <//>

// ログインした環境と方式の短いラベル。
// ★UAそのものは保存しない★ 個人の特定につながる情報を残さないため、
// 「iPhone/gsi」のような粗い分類だけにする。
// これが無いと「スマホで通ったのか」「公式ボタンだったのか」を
// 毎回口頭で確認するしかない。
function deviceLabel(method){
  const ua = navigator.userAgent || "";
  let env = "PC";
  if (/Line\//i.test(ua)) env = "LINE";
  else if (/iPhone|iPod/i.test(ua)) env = "iPhone";
  else if (/iPad/i.test(ua)) env = "iPad";
  else if (/Android/i.test(ua)) env = "Android";
  let disp = "";
  try { if (window.matchMedia("(display-mode: standalone)").matches || navigator.standalone) disp = "/pwa"; } catch {}
  return env + disp + "/" + (method || "unknown");
}

// ══════════════════════════════════════════════════════════════════
// タスクの識別子（task_id）への一本化 ─ 第1段
//
// いまの「今日のタスク」はタスクが文字列そのもので、完了・想定時間・
// 重要度・期限はすべて「タスク名」をキーにしたマップで持っている。
// そのため:
//   ・名前を変えると付随情報が古い名前に取り残される
//   ・同名のタスクを2件作ると区別できない（片方を完了にすると両方完了）
//   ・日付をまたぐと別物になり、持ち越しを追えない
//
// 名前ではなく id で持つようにする。ただし既に保存されている
// 文字列配列を壊さないよう、読むときは両方の形を受け取る。
// ══════════════════════════════════════════════════════════════════

// 保存されているタスク一覧を、必ず [{id,title}] の形にして返す。
// 旧形式（文字列の配列）なら、その場で id を振る。
function normalizeTaskList(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map(function (v, i) {
    if (v && typeof v === "object") {
      const title = String(v.title != null ? v.title : (v.text != null ? v.text : "")).trim();
      if (!title) return null;
      // ★付随情報も一緒に運ぶ★
      //   重要度・期限・想定時間は端末内にしか無く、
      //   スマホで設定してもPCに出てこなかった（実際にそうなった）。
      //   サーバーへ送っているのはタスク名と完了状態だけだったため。
      //   ここへ載せれば、既にある同期の仕組みにそのまま乗る。
      const o = { id: String(v.id || v.task_id || makeLocalTaskId(title, i)), title: title };
      if (v.imp) o.imp = String(v.imp);
      if (v.due) o.due = String(v.due);
      if (v.est !== undefined && v.est !== "" && v.est !== null) o.est = Number(v.est);
      if (v.memo) o.memo = String(v.memo);
      if (v.stt)  o.stt  = String(v.stt);
      return o;
    }
    const title = String(v || "").trim();
    if (!title) return null;
    return { id: makeLocalTaskId(title, i), title: title };
  }).filter(Boolean);
}

// 旧データへ id を振るときの決め方。
// ★同じ入力からは必ず同じ id になるようにする★
// 端末ごとに違う id を振ると、同じタスクが2つに見える。
// 並び順（i）を混ぜるのは、同名タスクが2件あっても別物として扱うため。
// ★旧形式（文字列一覧）の正規化にだけ使う決定的ID★
//   複数の端末が同じ旧データを見ても同じIDになるので、二重登録にならない。
//   新規作成には使わない（タイトルのハッシュは同名で衝突するため）。
function makeLocalTaskId(title, i) {
  let h = 0;
  const src = String(title) + "|" + i;
  for (let k = 0; k < src.length; k++) { h = ((h << 5) - h + src.charCodeAt(k)) | 0; }
  return "lt_" + (h >>> 0).toString(36);
}
// ★新規タスクのID★ ランダムで一意。タイトル・並び順・日付を材料にしない。
//   オフラインでも発行できる（作成→編集→完了がキューで同じIDのまま並ぶ）。
//   IDは認可の代わりではない。サーバーは必ず持ち主で行を引く。
function makeClientTaskId() {
  try { return "task_c_" + crypto.randomUUID(); } catch (e) {}
  const a = new Uint8Array(16);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_,i)=>a[i]=Math.floor(Math.random()*256));
  return "task_c_" + Array.from(a, b => b.toString(16).padStart(2,"0")).join("");
}

// 2つのタスク一覧を、task_id を頼りに1つにまとめる。
//
// ★これが無いと一覧が同期しない★
//   以前は「端末にタスクが無いときだけサーバーの一覧を受け取る」作りだった。
//   両方の端末にタスクがあると、一生混ざらない。
//   実際、PCには「朝食」だけ、スマホには「AI研究」「読書」があり、
//   どちらも相手のタスクを知らないままだった。
//
// ★消したタスクが復活する問題★
//   単純に足し合わせると、片方で消したタスクがもう片方から戻ってくる。
//   完全に防ぐには「消した記録」が要る（Tasksシートへ移す Phase 3 の仕事）。
//   いまは「消したら即座にサーバーへ送る」ことで、次に相手が読むときには
//   消えた状態になっている、という形にしている。
//   同時に別々の編集をした場合は、足し合わせになる。消えるよりは良い。
function mergeTaskLists(local, server) {
  const out = [], seen = {};
  (local || []).forEach(function (t) { if (!seen[t.id]) { seen[t.id] = 1; out.push(t); } });
  (server || []).forEach(function (t) {
    if (seen[t.id]) return;
    // 同じ名前が既にあるなら、別idでも同じタスクとみなす（重複表示を避ける）
    if (out.some(function (x) { return x.title === t.title; })) return;
    seen[t.id] = 1; out.push(t);
  });
  return out;
}

// 保存済みのマップを id キーへ付け替える（Phase 2 の移行）。
// ★取りこぼしても消さない★
//   キーが既に id ならそのまま。名前なら id へ移す。
//   どちらでもない（今日のタスクから消えた等）ものは、触らずに残す。
//   消すと「昨日つけた重要度が無くなった」になる。判断がつかないものは残す。
function migrateMapKeysToId(map, list) {
  if (!map || typeof map !== "object") return {};
  const byId = {}, byTitle = {};
  (list || []).forEach(function (t) { byId[t.id] = 1; if (!byTitle[t.title]) byTitle[t.title] = t.id; });
  const out = {};
  Object.keys(map).forEach(function (k) {
    if (byId[k]) { out[k] = map[k]; return; }          // 既に id
    const id = byTitle[k];
    if (id && out[id] === undefined) { out[id] = map[k]; return; }  // 名前 → id
    out[k] = map[k];                                   // 判断がつかないものは残す
  });
  return out;
}

// 名前をキーにした古いマップを、id をキーに付け替える。
// 同名が2件あるときは、最初の1件にだけ引き継ぐ（推測で複製しない）。
function remapByTaskId(oldMap, list) {
  const out = {}, used = {};
  (list || []).forEach(function (t) {
    if (used[t.title]) return;
    if (oldMap && Object.prototype.hasOwnProperty.call(oldMap, t.title)) {
      out[t.id] = oldMap[t.title];
      used[t.title] = 1;
    }
  });
  return out;
}

// ── タスクの重要度×緊急度（Checkpoint 3）──
// ★色だけで区別しない★
// 色覚には個人差があり、屋外の明るい画面でも色は判別しにくい。
// 必ず文字とアイコンでも分かるようにする。
// 集計に使う4分類。★これは変えない★

const TASK_LABEL = {
  HIGH:   { urgent:{ icon:"🔥", label:"今すぐ", hint:"重要かつ緊急",           color:"#dc2626" },
            other: { icon:"📌", label:"重要",   hint:"重要だが急がない。先に時間を取る", color:"#0891b2" } },

  LOW:    { urgent:{ icon:"⏩", label:"手短に", hint:"急ぎだが重要ではない", color:"#d97706" },
            other: null }
};
function taskLabel(importance, urgency){
  const imp = TASK_LABEL[String(importance||"MEDIUM").toUpperCase()] || TASK_LABEL.MEDIUM;
  return String(urgency).toUpperCase()==="HIGH" ? imp.urgent : imp.other;
}
const IMPORTANCE_LABEL = { HIGH:"高", MEDIUM:"中", LOW:"低" };
// 期限の表示。何日後かが一目で分かるようにする
function dueLabel(dueAt, overdue){
  const raw=String(dueAt||"").trim();
  if(!raw) return "";
  const dateOnly=/^\d{4}-\d{2}-\d{2}$/.test(raw);
  const p=raw.substring(0,10).split("-");
  const due=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
  const t=new Date(); const today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const days=Math.round((due-today)/86400000);
  const time=dateOnly?"":(" "+raw.substring(11,16));
  if(overdue||days<0) return "期限超過（"+(p[1]*1)+"/"+(p[2]*1)+time+"）";
  if(days===0) return "今日まで"+time;
  if(days===1) return "明日まで"+time;
  return days+"日後（"+(p[1]*1)+"/"+(p[2]*1)+time+"）";
}

//   もとは16段階だった。レジェンド＝Lv.100 を頂点にする。
//   XPの稼ぎ方は変えない。伸び方は XP(L)=13.415*(L-1)^1.9（最初は速く、後半はゆっくり）。
//   いまのレジェンド到達点(49,000XP)を新しいレジェンドの入口(Lv.76)に合わせてあるので、
//   すでに貯めた人が階級で降格することはない。
const XP_THRESHOLDS = [
  0, 13, 50, 108, 187, 286, 404, 541, 697, 872,
  1066, 1277, 1507, 1754, 2019, 2302, 2603, 2920, 3255, 3608,

  32068, 33091, 34129, 35183, 36251, 37335, 38434, 39548, 40677, 41821,
  42980, 44154, 45343, 46547, 47766, 49000, 50249, 51512, 52791, 54084,

  69285, 70755, 72240, 73739, 75253, 76781, 78324, 79881, 81453, 83040
];
const getXpLevel = xp => { let lv=1; for(let i=1;i<XP_THRESHOLDS.length;i++){ if(xp>=XP_THRESHOLDS[i]) lv=i+1; else break; } return lv; };
const getXpInLevel = xp => xp - (XP_THRESHOLDS[getXpLevel(xp)-1]||0);
const getXpForNextLevel = xp => { const lv=getXpLevel(xp); return lv<XP_THRESHOLDS.length ? XP_THRESHOLDS[lv]-(XP_THRESHOLDS[lv-1]||0) : null; };

function parseJwt(token) {
  try {
    const base64 = token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
    const json = decodeURIComponent(atob(base64).split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));
    return JSON.parse(json);
  } catch { return null; }
}

function LoginScreen({onLogin}) {
  const [step,setStep]=useState("top"); // "top" | "profile" | "goal" | "line"

  // Googleから戻ってきた直後（URLにid_tokenがある）は、最初の描画から待機表示にする。
  // React起動までの1〜3秒もログインボタンが見えており、
  // 「サインイン画面に戻った」ように見えていたため
  const [loading,setLoading]=useState(()=>{ try{ return /(^|&)id_token=/.test(location.hash.slice(1)); }catch{ return false; } });

  const [showAllAvatars,setShowAllAvatars]=useState(false);

  // Googleリダイレクト後のid_tokenを検出
  useEffect(()=>{
    const hash=new URLSearchParams(location.hash.slice(1));
    const idToken=hash.get("id_token");
    const st=hash.get("state")||"";
    if(idToken){
      history.replaceState(null,"",location.pathname+location.search);
      handleGoogleLogin({credential:idToken, state:st, method:"redirect"});
      return;
    }
    // ★Googleがエラーで返してきた場合★
    // 以前はここを見ていなかったため、ログイン画面が出たまま何も表示されず、
    // 利用者からは「押しても無反応」に見えていた（原因が分からない状態になる）
    const err=hash.get("error");
    if(err){
      history.replaceState(null,"",location.pathname+location.search);
      setLoading(false);
      setError(
        err==="access_denied" ? "ログインがキャンセルされました。もう一度お試しください"
        : "Googleでのログインに失敗しました（"+err+"）。下の「別の方法でログイン」もお試しください"
      );
    }
  },[]);

  // ★Googleの公式ボタン★
  // リダイレクト方式（画面遷移）は、ホーム画面に追加したアプリ（PWA）として
  // 開いている場合に、Googleから戻る先が別のブラウザになってしまい、
  // アプリ側はログイン画面のまま動かない、ということが起きる。
  // 公式ボタンは画面遷移を伴わないので、この問題が起きない。
  // リダイレクト方式は、公式ボタンを出せない環境（LINE内ブラウザ等）のための
  // 予備として残す。
  const [gsiReady,setGsiReady]=useState(false);
  // ログインに失敗したら、理由を出して合言葉を取り直す
  useEffect(()=>{
    const on=()=>{
      setLoading(false);
      setError("ログインの有効期限が切れました。もう一度ボタンを押してください");
    };
    window.addEventListener("jiroku:loginfail",on);
    return ()=>window.removeEventListener("jiroku:loginfail",on);
  },[]);
  useEffect(()=>{
    if(loading) return;
    let alive=true, timer=null;
    const waitGis=()=>new Promise(res=>{
      const limit=Date.now()+8000;
      const tick=()=>{
        if(window.google?.accounts?.id?.renderButton) return res(true);
        if(Date.now()>limit) return res(false);
        setTimeout(tick,150);
      };
      tick();
    });
    const mount=async()=>{
      const el=document.getElementById("gsi-btn-app");
      if(!el) return;
      if(!(await waitGis())) { if(alive) setGsiReady(false); return; }
      let ch=null;
      try{
        const u=new URL(GAS_URL); u.searchParams.set("action","authChallenge");
        const j=await (await fetch(u.toString())).json();
        if(j&&j.ok&&j.challenge_id) ch=j;
      }catch{}
      if(!alive||!ch) { if(alive) setGsiReady(false); return; }
      try{
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          nonce: ch.nonce,
          auto_select: false,
          cancel_on_tap_outside: true,
          callback: (res)=>{
            if(!res||!res.credential){ setError("ログインに失敗しました"); return; }
            handleGoogleLogin({credential:res.credential, state: ch.challenge_id+"~"+ch.state, method:"gsi"});
          }
        });
        el.innerHTML="";
        google.accounts.id.renderButton(el,{type:"standard",theme:"outline",size:"large",
          text:"signin_with",shape:"rectangular",locale:"ja",width:280});
        if(alive){
          setGsiReady(true);
          // challengeは5分で切れる。開いたまま放置されても使えるよう張り直す
          timer=setTimeout(mount, 3*60*1000);
        }
      }catch{ if(alive) setGsiReady(false); }
    };
    mount();

    // ★画面に戻ってきたら合言葉を取り直す★
    //   合言葉は5分で切れる。3分ごとのタイマーで張り直しているが、
    //   スマホでは画面を離れるとOSがタイマーを止める。
    //   他のアプリを見て戻ってきたときには切れていて、
    //   ボタンを押しても「ログインできませんでした」になる。
    //   （実測: 2026-08-01 17:29 に CHALLENGE_EXPIRED が発生）
    //   タイマーに頼らず、戻ってきた事実をきっかけに取り直す。
    const onVisible=()=>{ if(document.visibilityState==="visible" && alive) mount(); };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("pageshow", onVisible);

    return ()=>{
      alive=false;
      if(timer) clearTimeout(timer);
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("pageshow", onVisible);
    };
  },[loading]);

  const handleGoogleSignIn=async()=>{
    // state と nonce はサーバーが発行する。戻ってきた時に必ず突き合わせる
    // （以前はnonceを自分で作って照合していなかったため、リプレイを防げなかった）
    // サーバーが認証基盤に対応しているかを覚えておく。
    // ・未対応と分かっている間は短い待ち時間で打ち切り、従来ログインへ縮退する
    // ・対応済みと分かったら十分に待つ。ここで早々に諦めると、
    //   「サーバーは認証を求めているのに黙って未認証ログインになる」という
    //   一番まずい状態を作ってしまうため
    // サーバーの認証段階を確認する。以前に SESSION_OPTIONAL 以上を見ていれば
    // 通信が不調でもその前提を維持する（勝手に従来方式へ落ちないため）
    let mode = rememberedAuthMode();
    try{
      const cu=new URL(GAS_URL); cu.searchParams.set("action","authConfig");
      const cfg=await (await fetch(cu.toString())).json();
      if(cfg&&cfg.ok&&cfg.auth_mode) mode = noteAuthMode(cfg.auth_mode);
    }catch{}
    const strict = (AUTH_RANK[mode]||0) >= 1;   // SESSION_OPTIONAL 以上は縮退禁止

    let ch=null;
    try{
      const u=new URL(GAS_URL); u.searchParams.set("action","authChallenge");
      const ctl=new AbortController();
      const timer=setTimeout(()=>ctl.abort(), strict ? 15000 : 2500);
      ch=await (await fetch(u.toString(),{signal:ctl.signal})).json();
      clearTimeout(timer);
    }catch{}
    if(strict && !(ch&&ch.ok&&ch.challenge_id)){
      setError("ログインの準備に失敗しました。通信環境を確認して、もう一度お試しください");
      return;   // ★従来のメール方式へは戻さない★
    }
    // サーバー側にまだ認証基盤が無い（段階導入中）場合でも、ログインは従来どおり通す。
    // ここで止めると全利用者が締め出されるため、必ず縮退させる
    // challenge_id を state に埋め込んで往復させる。
    // 以前は sessionStorage に置いていたが、LINE内ブラウザなどでは
    // Googleから戻る際に別のコンテキストになり保存値が消えるため、
    // challengeを一度も消費できずログインが成立しなかった（実測で確認）。
    // stateはGoogleがそのまま返してくるので、保存に頼る必要がない。
    const useCh = !!(ch && ch.ok && ch.challenge_id);
    const stateParam = useCh ? (ch.challenge_id + "~" + ch.state) : "";
    const params=new URLSearchParams({
      client_id: GOOGLE_CLIENT_ID,
      redirect_uri: "https://kaisunagawa.github.io/edventure-app/",
      response_type: "id_token",
      scope: "openid email profile",
      nonce: useCh ? ch.nonce : Math.random().toString(36).slice(2),
    });
    if(useCh) params.set("state", stateParam);
    window.location.href="https://accounts.google.com/o/oauth2/v2/auth?"+params;
  };

  const handleGoogleLogin=async(res)=>{
    // Googleから戻った直後にサーバーへ本人確認を投げる。その数秒間、
    // 何も出ていないとログイン画面へ戻ったように見えるため、真っ先に待機表示を出す
    setLoading(true); setError("");
    const payload=parseJwt(res.credential);
    if(!payload) { setLoading(false); setError("ログインに失敗しました"); return; }

    // ★IDトークンをサーバーへ送り、検証してもらってセッションを受け取る。
    //   ここで初めて「本人であること」がサーバー側で確定する。
    //   受け取ったらIDトークンは即座に捨てる（長期保存しない）。
    // stateは "challenge_id~state" の形でGoogleが返してくる。
    // 本人確認は「後で待つ」形にして、下のユーザー情報取得と並行して走らせる
    // （直列にすると2つのGAS呼び出しで合計6〜8秒かかり、待ち時間が長すぎた）
    const raw=String(res.state||"");
    const sep=raw.indexOf("~");
    const strictNow = (AUTH_RANK[rememberedAuthMode()]||0) >= 1;
    const sessionPromise = (sep>0)
      ? fetch(GAS_URL,{ method:"POST", headers:{"Content-Type":"text/plain"},
          body: JSON.stringify({ action:"login", idToken:res.credential,
                                 challenge_id:raw.slice(0,sep), state:raw.slice(sep+1),
                                 device: deviceLabel(res.method) }) })
          .then(r=>r.json())
          .then(j=>{
            if(j&&j.ok&&j.token) setSessionToken(j.token);
            else {
              try{ localStorage.setItem("auth_last_error", String((j&&j.error)||"UNKNOWN")); }catch{}

              //   「ログインできませんでした」だけだと、何をすればいいか分からない。

              try{ window.dispatchEvent(new CustomEvent("jiroku:loginfail")); }catch{}
