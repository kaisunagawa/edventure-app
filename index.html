// ── ストーリーズ用の画像（1080×1920）──────────────────
// ★今日の時間の使い方を、そのまま人に見せられる形にする★（2026-08-19 Kai要望）
//   画面のスクリーンショットではストーリーズの比率に合わず、余白だらけになる。
//   Instagramの寸法ちょうどで描いて、保存できるようにする。
//   外部の部品は使わない（読み込みが増えると起動が遅くなるため）。
//
// ★色は1つの系統でそろえる★（2026-08-19 Kai指摘）
//   はじめはアプリと同じ分類色（青・紫・緑・橙・水色・灰）を使ったが、
//   出どころの違う色が6つ並ぶだけで、絵として散らかって見えた。
//   落ち着いたアースグリーンの濃淡でひと続きにし、
//   人間関係だけ暖色を差して単調にならないようにする。
//   ロゴ・見出し・ジローの囲みも同じ系統に寄せて、地続きに見せる。
const STORY_W = 1080, STORY_H = 1920;
// Instagramは上下250pxにUI（アイコン・返信バー）が乗るので、中身は 250〜1670 に収める
const STORY_TOP = 250, STORY_BOTTOM = 1670;
// ★アプリと同じ色を使う★（2026-08-20 Kai指摘「なぜか緑。もとのUIと色味も一緒に」）
//   一度アースグリーンに振ったが、アプリ・カレンダー・記録画面と
//   色が食い違うと、同じサービスの絵に見えない。
//   ここは :root と TIME_CLASS_COLOR と同じ色にそろえる約束。片方だけ変えないこと。
const STORY_PAPER = "#F8F8FA";   // --bg
const STORY_CARD  = "#FFFFFF";   // --card
const STORY_INK   = "#1F2937";   // --text
const STORY_SUB   = "#9CA3AF";   // --sub
const STORY_ACCENT= "#0891B2";   // --accent（JIROKUの色）
const STORY_LINE  = "#E5E7EB";   // --border
const STORY_TRACK = "#EEF1F4";   // 帯の下地
const STORY_CLASS_COLOR = {
  GOAL_DIRECT:           "#3B82F6",  // 目標に直結   青
  ASSET_BUILD:           "#8B5CF6",  // 将来への投資 紫
  RECOVERY:              "#22C55E",  // 回復         緑
  RELATIONSHIP:          "#F59E0B",  // 人間関係     橙
  RECOVERY_RELATIONSHIP: "#22C55E",
  OPERATIONS:            "#0891B2",  // 日常業務     JIROKUの色
  UNPLANNED_LEAKAGE:     "#64748B",  // 計画外の時間 灰
  UNSET:                 "#CBD5E1",
};
function storyHM(m){
  const h = Math.floor(m/60), mm = m%60;
  return h>0 ? (mm ? h+"時間"+mm+"分" : h+"時間") : mm+"分";
}
function storyFit(ctx, text, maxW){
  let t = String(text||"");
  if (ctx.measureText(t).width <= maxW) return t;
  while (t.length > 1 && ctx.measureText(t+"…").width > maxW) t = t.slice(0, -1);
  return t + "…";
}
function storyRoundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}
// ★アプリの内訳とそっくり同じにする★（2026-08-20 Kai指摘
//   「それぞれの項目に絵文字がない」「記録の内訳と時間の内訳で見た目が全然違う」）
//   記録画面の「今日の時間の内訳」と同じ形にする。丸いアイコン、
//   分類色の時間、下の帯まで同じ。ここはアプリのマークアップの写しなので、
//   片方を変えたらもう片方も必ず直すこと。
const STORY_ICON_SVG = {
  GOAL_DIRECT:  '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="1" fill="COL" stroke="none"/>',
  ASSET_BUILD:  '<path d="M4 19h16"/><path d="M7 19v-6M12 19V8M17 19v-9"/>',
  RECOVERY:     '<path d="M12 20s-7-4.4-7-9a4 4 0 017-2.6A4 4 0 0119 11c0 4.6-7 9-7 9z"/>',
  RECOVERY_RELATIONSHIP: '<path d="M12 20s-7-4.4-7-9a4 4 0 017-2.6A4 4 0 0119 11c0 4.6-7 9-7 9z"/>',
  RELATIONSHIP: '<circle cx="9" cy="9" r="3"/><path d="M3 19c0-3 2.7-4.6 6-4.6s6 1.6 6 4.6"/><path d="M16 7.5a3 3 0 010 5.4M17.5 19c0-2-.8-3.4-2-4.3"/>',
  OPERATIONS:   '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5.5A1.5 1.5 0 0110.5 4h3A1.5 1.5 0 0115 5.5V7"/>',
  UNPLANNED_LEAKAGE: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M10 15l4 3M14 15l-4 3"/>',
};
function storyIconUrl(key, color, px){
  const inner = (STORY_ICON_SVG[key] || STORY_ICON_SVG.OPERATIONS).replace(/COL/g, color);
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+px+'" height="'+px+'" viewBox="0 0 24 24" '
            + 'fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'
            + inner + '</svg>';
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
// #RRGGBB を、指定した濃さの半透明にする（アプリの color-mix と同じ見え方にする）
function storyAlpha(hex, a){
  const h = String(hex).replace("#","");
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return "rgba(" + r + "," + g + "," + b + "," + a + ")";
}
function storyLoadImage(src){
  return new Promise(function(res){
    const im = new Image();
    im.onload = function(){ res(im); };
    im.onerror = function(){ res(null); };
    im.src = src;
  });
}
// ★ジローくんは、その日の中身を見て喋る★（2026-08-19 Kai要望）
//   図鑑の決めゼリフのままだと、数字と関係のないことを言って浮く。
//   いちばん多かった分類と記録した長さから、一言を選ぶ。
function storyJiroLine(rows, totalMin){
  const shown = rows.filter(r=>r.m>0);
  const top = shown[0];
  const h = totalMin / 60;
  const goal = (rows.find(r=>r.k==="GOAL_DIRECT")||{}).m || 0;
  const leak = (rows.find(r=>r.k==="UNPLANNED_LEAKAGE")||{}).m || 0;
  // ★1行は14文字まで★ 長いと画像の中で切れる（実際に切れた）
  if (goal > 0 && goal / totalMin >= 0.4) return "目標にまっすぐな一日。";
  if (top && top.k === "GOAL_DIRECT")   return "今日の主役は、目標だった。";
  if (top && top.k === "ASSET_BUILD")   return "今日の仕込みが、先で効く。";
  if (top && top.k === "RECOVERY")      return "休めた日も、ちゃんと前進。";
  if (top && top.k === "RELATIONSHIP")  return "人と過ごした時間が長い日。";
  if (top && top.k === "OPERATIONS" && h >= 8) return "回すべきものを、回した日。";
  if (leak > 0 && leak / totalMin >= 0.3) return "流れた時間も、次に活かせる。";
  if (h >= 10) return "よく動いた一日。おつかれ。";
  if (h >= 6)  return "積み上げた時間は、必ず残る。";
  return "書いた分だけ、今日が見える。";
}
async function drawStoryCard(cv, d){
  const ctx = cv.getContext("2d");
  cv.width = STORY_W; cv.height = STORY_H;
  const F = "'DM Sans','Hiragino Sans','Noto Sans JP',sans-serif";
  const INK = STORY_INK, SUB = STORY_SUB, AC = STORY_ACCENT, LINE = STORY_LINE;

  ctx.fillStyle = STORY_PAPER; ctx.fillRect(0, 0, STORY_W, STORY_H);
  const gTop = ctx.createLinearGradient(0, 0, 0, 520);
  gTop.addColorStop(0, "rgba(8,145,178,0.10)"); gTop.addColorStop(1, "rgba(8,145,178,0)");
  ctx.fillStyle = gTop; ctx.fillRect(0, 0, STORY_W, 520);
  ctx.textBaseline = "alphabetic";

  // ── ロゴと日付（ロゴも主色にそろえる）──
  const lx = 118, ly = 300;
  ctx.strokeStyle = "rgba(8,145,178,0.24)"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(lx, ly, 28, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = AC; ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(lx, ly, 28, -Math.PI/2, Math.PI, false); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly-16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx+11, ly+8); ctx.stroke();
  ctx.textAlign = "left"; ctx.fillStyle = INK; ctx.font = "800 36px " + F;
  ctx.fillText("JIROKU", lx + 46, ly + 13);
  ctx.textAlign = "right"; ctx.fillStyle = SUB; ctx.font = "700 30px " + F;
  ctx.fillText(d.dateLabel, 984, ly + 11);

  // ── 合計時間 ＋ 右にスコア ──
  ctx.textAlign = "left"; ctx.fillStyle = SUB; ctx.font = "700 28px " + F;
  ctx.fillText(d.headLabel || "今日、記録した時間", 96, 402);
  ctx.fillStyle = INK; ctx.font = "800 104px " + F;
  ctx.fillText(storyHM(d.totalMin), 92, 500);
  ctx.textAlign = "right";
  if (d.scoreText) {
    ctx.fillStyle = AC; ctx.font = "800 60px " + F;
    ctx.fillText(d.scoreText, 984, 494);
    ctx.fillStyle = SUB; ctx.font = "700 26px " + F;
    ctx.fillText(d.scoreLabel || "", 984, 532);
  }
  ctx.strokeStyle = LINE; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(96, 578); ctx.lineTo(984, 578); ctx.stroke();

  // ── 左：ドーナツ（記録画面と同じ作り。R:SW の比も合わせる）──
  const shown = d.rows.filter(r=>r.m>0);
  const cx = 236, cy = 880, R = 126, SW = 36;
  ctx.lineCap = "butt";
  ctx.strokeStyle = LINE; ctx.lineWidth = SW;   // 下地は --border（アプリと同じ）
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
  let a0 = -Math.PI/2;
  shown.forEach(function(r){
    const a1 = a0 + (r.m/d.totalMin)*Math.PI*2;
    ctx.strokeStyle = STORY_CLASS_COLOR[r.k] || "#64748B";
    ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1); ctx.stroke();
    a0 = a1;
  });
  // 真ん中は「合計 / 時間 / (割合)」。アプリの内訳と同じ並び
  ctx.textAlign = "center";
  ctx.fillStyle = SUB; ctx.font = "700 26px " + F;
  ctx.fillText("合計", cx, cy - 26);
  ctx.fillStyle = INK; ctx.font = "800 44px " + F;
  ctx.fillText(storyHM(d.totalMin), cx, cy + 18);
  ctx.fillStyle = SUB; ctx.font = "700 25px " + F;
  ctx.fillText("(" + (d.coverPct !== undefined ? d.coverPct : 100) + "%)", cx, cy + 54);

  // ── 右：内訳（丸いアイコン・分類色の時間・下の帯。すべてアプリと同じ）──
  const lx0 = 404, lw = 984 - lx0;
  const rowH = 96;
  let ry = cy - ((shown.length - 1) * rowH) / 2;
  for (var ii = 0; ii < shown.length && ii < 6; ii++) {
    const r = shown[ii];
    const col = STORY_CLASS_COLOR[r.k] || "#64748B";
    const pct = Math.round(r.m / d.totalMin * 100);
    // 丸いアイコン（背景26%・枠55%・中は分類色）
    const icx = lx0 + 28, icy = ry - 6, ir = 28;
    ctx.beginPath(); ctx.arc(icx, icy, ir, 0, Math.PI*2);
    ctx.fillStyle = storyAlpha(col, 0.26); ctx.fill();
    ctx.strokeStyle = storyAlpha(col, 0.55); ctx.lineWidth = 2; ctx.stroke();
    const im = d.icons && d.icons[r.k];
    if (im) ctx.drawImage(im, icx - 17, icy - 17, 34, 34);
    // 分類名 → 時間（分類色） → 割合
    ctx.textAlign = "left"; ctx.fillStyle = INK; ctx.font = "700 32px " + F;
    ctx.fillText(storyFit(ctx, r.label, 250), lx0 + 70, ry + 6);
    ctx.textAlign = "right"; ctx.fillStyle = col; ctx.font = "800 31px " + F;
    ctx.fillText(storyHM(r.m), 902, ry + 6);
    ctx.fillStyle = SUB; ctx.font = "700 27px " + F;
    ctx.fillText(pct + "%", 984, ry + 6);
    // 下の帯（下地は --border、伸びるぶんは分類色）
    const tx = lx0 + 70, tw = 984 - tx, th = 11, tyy = ry + 26;
    storyRoundRect(ctx, tx, tyy, tw, th, 6); ctx.fillStyle = LINE; ctx.fill();
    storyRoundRect(ctx, tx, tyy, Math.max(8, tw * pct / 100), th, 6);
    ctx.fillStyle = col; ctx.fill();
    ry += rowH;
  }

  // ── 下：ジローくん ──
  //   ★吹き出しにする★（2026-08-20 Kai指摘「コメントっぽくない。喋ってるように」）
  //     四角い囲みに絵と文を並べただけでは、ジローの言葉に見えない。
  //     ジローは紙の上に立たせ、その口元から吹き出しを出す。
  const jy = 1246, jSize = 234;
  if (d.jiroImg) ctx.drawImage(d.jiroImg, 96, jy + 16, jSize, jSize);
  const bx2 = 362, bw2 = 984 - bx2, by2 = jy + 14, bh3 = 200;
  const ty = by2 + 86;
  ctx.fillStyle = STORY_CARD; ctx.strokeStyle = LINE; ctx.lineWidth = 2;
  // 本体としっぽをひと筆で描く（継ぎ目が出ないように）
  ctx.beginPath();
  ctx.moveTo(bx2 + 28, by2);
  ctx.lineTo(bx2 + bw2 - 28, by2);
  ctx.quadraticCurveTo(bx2 + bw2, by2, bx2 + bw2, by2 + 28);
  ctx.lineTo(bx2 + bw2, by2 + bh3 - 28);
  ctx.quadraticCurveTo(bx2 + bw2, by2 + bh3, bx2 + bw2 - 28, by2 + bh3);
  ctx.lineTo(bx2 + 28, by2 + bh3);
  ctx.quadraticCurveTo(bx2, by2 + bh3, bx2, by2 + bh3 - 28);
  ctx.lineTo(bx2, ty + 20);
  ctx.lineTo(bx2 - 26, ty);          // しっぽの先（ジローの口元へ）
  ctx.lineTo(bx2, ty - 20);
  ctx.lineTo(bx2, by2 + 28);
  ctx.quadraticCurveTo(bx2, by2, bx2 + 28, by2);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.textAlign = "left"; ctx.fillStyle = AC; ctx.font = "800 26px " + F;
  ctx.fillText(d.jiroName || "ジローくん", bx2 + 40, by2 + 58);
  ctx.fillStyle = INK; ctx.font = "800 34px " + F;
  ctx.fillText(storyFit(ctx, d.jiroLine1, bw2 - 80), bx2 + 40, by2 + 116);
  if (d.jiroLine2) {
    ctx.fillStyle = SUB; ctx.font = "700 27px " + F;
    ctx.fillText(storyFit(ctx, d.jiroLine2, bw2 - 80), bx2 + 40, by2 + 166);
  }

  // ── 足元 ──
  ctx.textAlign = "left"; ctx.fillStyle = SUB; ctx.font = "700 28px " + F;
  ctx.fillText(d.footLeft || "", 96, 1616);
  ctx.textAlign = "right"; ctx.fillStyle = AC; ctx.font = "800 30px " + F;
  ctx.fillText("jiroku.jp", 984, 1616);
  return cv;
}

      const rawActions = JSON.parse(localStorage.getItem("jiroku_custom_actions_"+todayKey)||"[]")||[];
      const actions = normalizeTaskList(rawActions);
      const checked = JSON.parse(localStorage.getItem("today_actions")||"{}");
      const est = JSON.parse(localStorage.getItem("jiroku_task_estimates_"+todayKey)||"{}");
      // ★プライベートのタスクは業務報告書に渡さない★（2026-08-05 Kai要望）
      //   仕分けが「プライベート」「健康」のものは外す。
      //   未設定は判断材料が無いので残す（勝手に消さない）。
      const ctx = (()=>{ try{ return JSON.parse(localStorage.getItem("jiroku_task_context_"+todayKey)||"{}")||{}; }catch(e){ return {}; } })();
      const PRIVATE = {PERSONAL:1, HEALTH:1};
      tasks = actions
        .filter(t=>!PRIVATE[String(ctx[t.id]||ctx[t.title]||"").toUpperCase()])
        .map(t=>({
          text: t.title,
          done: !!(checked[t.id] || checked[t.title]),
          min: Number(est[t.id] !== undefined ? est[t.id] : est[t.title]) || 0
        }));
    }catch(e){}
    let intent=null;
    try{ const s=JSON.parse(localStorage.getItem("jiroku_intent")||"null"); if(s&&s.date===todayKey) intent=s; }catch(e){}
    const r = await gasPostJson("generateWorkReport", {date:todayKey, tasks:JSON.stringify(tasks), intent:intent?JSON.stringify(intent):""});

      setWorkReport(r.data.text);
      // 何件をプライベートとして外したかを画面に出す（記録が消えたと誤解させない）
      // ★onToast はこの画面に渡っていない★ 使うと画面ごと落ちる（2026-08-05に2回やった）
      setWorkReportExcluded(Number(r.data.excluded_private||0));
    }

    setWorkReportLoading(false);

                const key=r.date.substring(0,7);
                const g=groups[groups.length-1];
                if(g&&g.key===key) g.items.push(r); else groups.push({key,items:[r]});
              });
              return groups.map(g=>{
                const [y,m]=g.key.split("-");
                const avg=Math.round(g.items.reduce((s,r)=>s+r.score,0)/g.items.length);
                return html`
                  <div key=${g.key} style=${{marginBottom:16}}>
                    <div style=${{display:"flex",alignItems:"baseline",justifyContent:"space-between",padding:"0 4px",marginBottom:8}}>
                      <div style=${{fontSize:13,fontWeight:700,color:"var(--text)"}}>${Number(y)===new Date().getFullYear()?"":y+"年"}${Number(m)}月</div>
                      <div style=${{fontSize:11,color:"var(--sub)"}}>${g.items.length}件 ・ 平均<b style=${{color:SCORE_COLOR(avg)}}> ${avg}</b>点</div>
                    </div>
                    <div class="card">
                    ${g.items.map((r,i)=>html`
                      <button key=${r.date} onClick=${()=>setDate(r.date)}
                        style=${{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",background:"none",border:"none",padding:"13px 0",borderBottom:i<g.items.length-1?"1px solid var(--border)":"none",cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
                        <div>
                          <div style=${{fontSize:14,fontWeight:500,color:"var(--text)"}}>${fmtDate(r.date)}</div>
                          <div style=${{fontSize:11,color:"var(--sub)",marginTop:2}}>${isToday(r.date)?"今日":r.date.substring(0,10)}</div>
                        </div>
                        <div style=${{display:"flex",alignItems:"center",gap:10}}>
                          <div style=${{fontSize:22,fontWeight:700,color:SCORE_COLOR(r.score)}}>${r.score}</div>
                          <div style=${{color:"var(--sub)",fontSize:16}}>›</div>
                        </div>
                      </button>
                    `)}
                    </div>
                  </div>
                `;
              });
            })()}
            <div style=${{marginBottom:8}}></div>
          </div>`
    }
    ${storyModal}${storyMsgBox}
    ${workReport!==null&&html`
      <div style=${{position:"fixed",inset:0,height:"100dvh",background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",padding:16,zIndex:500,overscrollBehavior:"contain"}}
        onClick=${e=>{if(e.target===e.currentTarget)setWorkReport(null);}}>
        <div style=${{position:"relative",background:"var(--card)",width:"100%",maxWidth:420,borderRadius:20,boxShadow:"0 18px 50px rgba(0,0,0,0.35)",padding:"20px 20px 20px",maxHeight:"84dvh",display:"flex",flexDirection:"column",overscrollBehavior:"contain"}}>
          <button onClick=${()=>setWorkReport(null)} aria-label="閉じる"
            style=${{position:"absolute",top:10,right:12,background:"none",border:"none",fontSize:24,color:"var(--sub)",cursor:"pointer",lineHeight:1,padding:6,zIndex:1}}>×</button>
          <div style=${{fontSize:17,fontWeight:800,marginBottom:4,color:"var(--text)"}}>📋 業務報告書</div>
          <div style=${{fontSize:12,color:"var(--sub)",marginBottom:12}}>内容を確認して、コピーしてメールやチャットに貼り付けてください。文面は自由に手直しできます。</div>
          <!-- 長文でもテキストエリア内で確実にスクロールできるようにする（背景側に
               スクロールが伝播して「背景だけ動く」問題があったため、overscrollBehaviorで遮断） -->
          <textarea value=${workReport} onInput=${e=>setWorkReport(e.target.value)}
            style=${{flex:"1 1 auto",minHeight:160,width:"100%",boxSizing:"border-box",border:"1.5px solid var(--border)",borderRadius:12,padding:"12px 14px",fontSize:13,lineHeight:1.7,fontFamily:"inherit",color:"var(--text)",background:"var(--bg)",resize:"none",marginBottom:12,overflowY:"auto",overscrollBehavior:"contain",WebkitOverflowScrolling:"touch"}}/>
          <button class="btn" onClick=${copyWorkReport} style=${{marginBottom:8}}>
            ${workReportCopied?"✓ コピーしました":"報告文をコピー"}
          </button>
          <button onClick=${()=>setWorkReport(null)}
            style=${{width:"100%",padding:"12px",background:"none",border:"none",color:"var(--sub)",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>閉じる</button>
        </div>
      </div>
    `}
  </div>`;

  // ── 詳細表示 ──
  if(loading) return html`<div>
    <div class="ph">
      <button onClick=${()=>setDate(null)} style=${{background:"none",border:"none",color:"var(--accent)",fontSize:14,cursor:"pointer",padding:0,fontFamily:"inherit",marginBottom:4}}>← 一覧に戻る</button>
      <div class="ph-title">${fmtDate(date)}</div>
    </div>
    <div style=${{display:"flex",justifyContent:"center",padding:40}}><div class="spin" style=${{borderColor:"var(--border)",borderTopColor:"var(--accent)",width:24,height:24,borderWidth:2}}/></div>
  </div>`;

  const hasReport = !!report;
  const currentView = hasReport ? view : "diary";

  return html`<div>
    <div class="ph">
      <button onClick=${()=>setDate(null)} style=${{background:"none",border:"none",color:"var(--accent)",fontSize:14,cursor:"pointer",padding:0,fontFamily:"inherit",marginBottom:4}}>← 一覧に戻る</button>
      <div style=${{display:"flex",alignItems:"center",gap:10}}>
        <button onClick=${()=>setDate(addDays(date,-1))} style=${{background:"none",border:"none",fontSize:22,cursor:"pointer",color:"var(--sub)",padding:"0 6px",lineHeight:1}}>‹</button>
        <div class="ph-title" style=${{marginBottom:0}}>${fmtDate(date)}</div>
        <button onClick=${()=>setDate(addDays(date,1))} disabled=${isToday(date)} style=${{background:"none",border:"none",fontSize:22,cursor:isToday(date)?"default":"pointer",color:isToday(date)?"var(--border)":"var(--sub)",padding:"0 6px",lineHeight:1}}>›</button>
      </div>
    </div>

    ${!report&&logs.length===0&&html`<div class="empty" style=${{padding:"20px 24px"}}><div class="empty-title">この日の記録はありません</div><div class="empty-body">下の日記には自由に書けます</div></div>`}

    ${(report||logs.length>0)&&html`
      <div style=${{display:"flex",gap:6,margin:"0 16px 4px",background:"var(--bg)",borderRadius:10,padding:3}}>
        <button onClick=${()=>setView("report")} disabled=${!hasReport}
          style=${{flex:1,padding:"8px",borderRadius:8,border:"none",cursor:hasReport?"pointer":"default",fontFamily:"inherit",fontSize:13,fontWeight:600,
            display:"flex",alignItems:"center",justifyContent:"center",gap:6,
            background:currentView==="report"?"var(--card)":"transparent",color:currentView==="report"?"var(--text)":"var(--sub)",
            boxShadow:currentView==="report"?"0 1px 3px rgba(0,0,0,.08)":"none",opacity:hasReport?1:0.5}}>
          <${S} n="chart" s=${14}/>レポート
        </button>
        <button onClick=${()=>setView("diary")}
          style=${{flex:1,padding:"8px",borderRadius:8,border:"none",cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:600,
            display:"flex",alignItems:"center",justifyContent:"center",gap:6,
            background:currentView==="diary"?"var(--card)":"transparent",color:currentView==="diary"?"var(--text)":"var(--sub)",
            boxShadow:currentView==="diary"?"0 1px 3px rgba(0,0,0,.08)":"none"}}>
          <${S} n="pencil" s=${14}/>日記
        </button>
      </div>
    `}

    <!-- ★新しい日次レポート（self_management_daily_v1）★
         featureがONの人にだけ出す。巨大な点数を主役にせず、
         状態ラベルと「明日の一手」を先に見せる。 -->
    <!-- ★AI日次レポート（self_management_daily_v1）★
         見た目と項目は従来のレポートに合わせる（点数→採点の内訳→フィードバック→
         良かった点／改善点→明日のタスク）。中身の評価だけが新しい方式。
         「今日の経営状態」のような言い方は使わない（人によって伝わらないため）。 -->
    ${currentView==="report"&&ops&&ops.data&&html`<div>
      ${(()=>{
        const x=ops.data;
        const N=x.narrative||{};
        const CATICON={progress:"rocket",execution:"target",time_use:"clock",sustainability:"flame",review:"bulb"};
        // 総合が出ない日は、測れた範囲の点数を出す（点数が消えるとランキングと噛み合わないため）
        const shown = (x.operating_score!==null&&x.operating_score!==undefined) ? x.operating_score : x.partial_score;
        const partial = (x.operating_score===null||x.operating_score===undefined) && shown!==null && shown!==undefined;
        const prog=(N.progress_items||[]).map(p=>p.text);
        return html`
        <div class="report-hero" style=${{paddingTop:8}}>
          <div class="report-score">${shown===null||shown===undefined?"—":shown}</div>
          <div class="report-pts">/ 100点</div>
        </div>
        <div style=${{textAlign:"center",marginTop:-6,marginBottom:14}}>
          <div style=${{fontSize:14,fontWeight:800,color:"var(--text)"}}>${x.operating_state_label}</div>
          ${partial&&html`<div style=${{fontSize:11,color:"var(--sub)",marginTop:3}}>
            測れた範囲での点数（データの充足度 ${Math.round((x.coverage||0)*100)}%）</div>`}
          ${!partial&&x.previous_day_delta!==null&&x.previous_day_delta!==undefined&&html`
            <div style=${{fontSize:11,color:"var(--sub)",marginTop:3}}>昨日比 ${x.previous_day_delta>=0?"+":""}${x.previous_day_delta}</div>`}
        </div>

        <div class="card">
          <div class="card-label">採点の内訳</div>
          <div style=${{display:"flex",flexDirection:"column",gap:14}}>
            ${(x.components||[]).map(c=>{
              const ev=c.state==="evaluated"&&c.score!==null;
              const v=ev?c.score:0;
              const color=!ev?"var(--sub)":v>=80?"var(--green)":v>=50?"var(--amber)":"var(--red)";
              const isOpen=expandedBreakdown===c.key;
              const got=ev?Math.round(c.score*c.weight/100):null;
              return html`<div key=${c.key}>
                <button onClick=${()=>setExpandedBreakdown(isOpen?null:c.key)}
                  style=${{display:"flex",alignItems:"flex-start",gap:10,width:"100%",background:"none",border:"none",padding:0,cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
                  <div style=${{width:34,height:34,borderRadius:11,background:"var(--bg)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--accent)",flexShrink:0,marginTop:1}}><${S} n=${CATICON[c.key]||"target"} s=${17}/></div>
                  <div style=${{flex:1,minWidth:0}}>
                    <div style=${{display:"flex",justifyContent:"space-between",alignItems:"baseline",fontSize:12.5,color:"var(--text)",fontWeight:600,marginBottom:5}}>
                      <span>${c.label}</span>
                      <span>${ev
                        ? html`<b style=${{fontSize:14,color}}>${got}</b><span style=${{color:"var(--sub)",fontWeight:500}}>/${c.weight}</span>`
                        : html`<span style=${{fontSize:11.5,color:"var(--sub)",fontWeight:500}}>データ蓄積中</span>`}</span>
                    </div>
                    <div style=${{height:7,background:"var(--bg)",borderRadius:99,overflow:"hidden"}}>
                      <div style=${{height:"100%",width:(ev?Math.max(0,Math.min(100,v)):0)+"%",background:`linear-gradient(90deg, var(--hero1), ${color})`,borderRadius:99,transition:"width .5s ease"}}/>
                    </div>
                    <!-- ★その数字の根拠★ 何を数えてこの点になったのかを1行で見せる。
                         タップすると全部の内訳が開く（開かなくても理由が分かるように） -->
                    <div style=${{fontSize:10.5,color:"var(--sub)",lineHeight:1.65,marginTop:5}}>
                      ${ev
                        ? (c.components||[]).filter(p=>p.state==="evaluated")
                            .map(p=>p.detail?(p.label+" "+p.detail):(p.label+" "+p.value)).join(" ・ ")
                        : (c.incomplete_reason||c.reason||"")}
                    </div>
                  </div>
                </button>
                ${isOpen&&html`
                  <div style=${{marginTop:8,marginLeft:44,padding:"9px 11px",background:"var(--bg)",borderRadius:9,fontSize:12,lineHeight:1.7,color:"var(--sub)"}}>
                    ${(c.components||[]).map((p,j)=>html`
                      <div key=${j} style=${{display:"flex",gap:8}}>
                        <span style=${{flex:1,minWidth:0}}>${p.label}</span>
                        <span>${p.state==="evaluated"?(p.value+(p.detail?"（"+p.detail+"）":"")):"—"}</span>
                      </div>`)}
                    ${c.incomplete_reason&&html`<div style=${{marginTop:5}}>${c.incomplete_reason}</div>`}
                    ${c.reference&&html`<div style=${{marginTop:5}}>${c.reference}</div>`}
                  </div>`}
              </div>`;
            })}
          </div>
          <!-- ★なぜこの点数なのか★ 何を足してこの点になったのかを言葉にする。
               AIには書かせない（計算そのものなので、必ず画面の数字と一致する） -->
          ${(()=>{
            const ev=(x.components||[]).filter(c=>c.state==="evaluated"&&c.score!==null);
            const pend=(x.components||[]).filter(c=>c.state!=="evaluated");
            if(!ev.length) return "";
            const parts=ev.map(c=>c.label+" "+Math.round(c.score*c.weight/100)+"/"+c.weight);
            const evW=ev.reduce((a,c)=>a+c.weight,0);
            const got=ev.reduce((a,c)=>a+c.score*c.weight/100,0);
            return html`<div style=${{fontSize:11.5,color:"var(--sub)",lineHeight:1.85,marginTop:14,paddingTop:12,borderTop:"1px solid var(--border)"}}>
              <b style=${{color:"var(--text)",fontWeight:700}}>点数の内訳</b><br/>
              ${parts.join(" ＋ ")} ＝ ${Math.round(got)}点 / ${evW}点。
              ${evW===100
                ? "4項目すべてを合計した点数です。"
                : "測れた"+evW+"点分を100点に換算して "+(shown===null||shown===undefined?"—":shown)+"点としています。"}
              ${pend.length>0?html`<br/>${pend.map(c=>c.label).join("と")}は、まだ測れていないので点数に入れていません。`:""}
              <!-- ★点数の意味を取り違えさせない★
                   「人として100点」でも「目標達成100%」でもない。今日の運営の点数。 -->
              <div style=${{marginTop:8,paddingTop:8,borderTop:"1px solid var(--border)"}}>
                この点数は、今日どれだけ<b style=${{color:"var(--text)"}}>自分という事業を運営できたか</b>を表します。
                人としての評価でも、目標の達成率でもありません。
                <button onClick=${()=>setShowScoreMeaning(v=>!v)}
                  style=${{display:"block",marginTop:5,background:"none",border:"none",padding:0,color:"var(--accent)",fontSize:11.5,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                  ${showScoreMeaning?"閉じる":"5つの項目は何を見ている？"}</button>
                ${showScoreMeaning&&html`
                  <div style=${{marginTop:8,background:"var(--bg)",borderRadius:10,padding:"10px 12px",lineHeight:1.9}}>
                    会社の経営で見るものを、自分の1日に置き換えています。<br/>
                    ・売上や利益 → <b style=${{color:"var(--text)"}}>目標の前進</b><br/>
                    ・計画の実行 → <b style=${{color:"var(--text)"}}>決めたことの実行</b><br/>
                    ・人やお金の配分 → <b style=${{color:"var(--text)"}}>時間の使い方</b><br/>
                    ・資金繰りと健全さ → <b style=${{color:"var(--text)"}}>無理なく続ける</b><br/>
                    ・経営会議と改善 → <b style=${{color:"var(--text)"}}>振り返りと改善</b><br/>
                    毎日のこの5つが積み重なって、週の「自己経営力」になり、3か月の成果につながります。
                  </div>`}
              </div>
            </div>`;
          })()}
        </div>

        <div class="card">
          <div class="card-label">フィードバック</div>
          <p style=${{fontSize:14,lineHeight:1.8,color:"var(--text)"}}>
            ${(N.operating_summary&&N.operating_summary.text)||"今日の記録から、まだ十分に読み取れていません。"}</p>
        </div>

        ${(prog.length>0||(N.primary_management_issue&&N.primary_management_issue.text))&&html`
          <div class="card">
            ${prog.length>0&&html`
              <div style=${{marginBottom:12}}>
                <span class="tag t-g">良かった点</span>
                <p style=${{fontSize:14,color:"var(--text)",marginTop:7,lineHeight:1.8}}>${prog.join(" ")}</p>
              </div>`}
            ${N.primary_management_issue&&N.primary_management_issue.text&&html`
              <div>
                <span class="tag t-a">改善点</span>
                <p style=${{fontSize:14,color:"var(--text)",marginTop:7,lineHeight:1.8}}>${N.primary_management_issue.text}</p>
              </div>`}
          </div>`}

        ${N.next_action&&N.next_action.text&&html`
          <div class="card" style=${{marginBottom:24}}>
            <div class="card-label">明日のタスク</div>
            <p style=${{fontSize:14,lineHeight:1.8,color:"var(--text)"}}>${N.next_action.text}</p>
            ${N.next_action.measurable_condition&&html`
              <p style=${{fontSize:12,lineHeight:1.8,color:"var(--sub)",marginTop:4}}>達成の目安：${N.next_action.measurable_condition}</p>`}
          </div>`}`;
      })()}
    </div>`}
    ${currentView==="report"&&report&&!(ops&&ops.data)&&html`<div>
          <div class="report-hero" style=${{paddingTop:8}}>
            <div class="report-score">${report.score}</div>
            <div class="report-pts">/ 100点</div>
          </div>
          ${report.breakdown&&html`
            <div class="card">
              <div class="card-label">採点の内訳</div>
              <div style=${{display:"flex",flexDirection:"column",gap:14}}>
                ${BREAKDOWN_CATS.map(([key,label])=>{
                  const v=Number(report.breakdown[key]||0);
                  const pct=Math.max(0,Math.min(100,v/20*100));
                  const tip=BREAKDOWN_TIPS[key];
                  const color=v>=16?"var(--green)":v>=10?"var(--amber)":"var(--red)";
                  const reason=report.breakdownReasons&&report.breakdownReasons[key];
                  const isOpen=expandedBreakdown===key;
                  return html`<div key=${key}>
                    <button onClick=${()=>setExpandedBreakdown(isOpen?null:key)}
                      style=${{display:"flex",alignItems:"center",gap:10,width:"100%",background:"none",border:"none",padding:0,cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
                      <div style=${{width:34,height:34,borderRadius:11,background:"var(--bg)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--accent)",flexShrink:0}}><${S} n=${tip.icon} s=${17}/></div>
                      <div style=${{flex:1,minWidth:0}}>
                        <div style=${{display:"flex",justifyContent:"space-between",alignItems:"baseline",fontSize:12.5,color:"var(--text)",fontWeight:600,marginBottom:5}}>
                          <span>${label}</span>
                          <span><b style=${{fontSize:14,color}}>${v}</b><span style=${{color:"var(--sub)",fontWeight:500}}>/20</span></span>
                        </div>
                        <div style=${{height:7,background:"var(--bg)",borderRadius:99,overflow:"hidden"}}>
                          <div style=${{height:"100%",width:pct+"%",background:`linear-gradient(90deg, var(--hero1), ${color})`,borderRadius:99,transition:"width .5s ease"}}/>
                        </div>
                      </div>
                    </button>
                    ${isOpen&&html`
                      <div style=${{marginTop:8,marginLeft:44,padding:"9px 11px",background:"var(--bg)",borderRadius:9,fontSize:12,lineHeight:1.7,color:"var(--sub)"}}>
                        ${reason||"このレポートにはまだコメントがありません（古いレポートのため）"}
                      </div>
                    `}
                  </div>`;
                })}
              </div>
            </div>
          `}
          <div class="card">
            <div class="card-label">フィードバック</div>
            <p style=${{fontSize:14,lineHeight:1.8,color:"var(--text)"}}>${report.feedback}</p>
          </div>
          <div class="card">
            ${report.highlights&&html`<div style=${{marginBottom:12}}><span class="tag t-g">良かった点</span><p style=${{fontSize:14,color:"var(--text)",marginTop:7,lineHeight:1.8}}>${report.highlights}</p></div>`}
            ${report.improvement&&html`<div><span class="tag t-a">改善点</span><p style=${{fontSize:14,color:"var(--text)",marginTop:7,lineHeight:1.8}}>${report.improvement}</p></div>`}
          </div>
          ${report.action&&html`<div class="card" style=${{marginBottom:24}}><div class="card-label">明日のタスク</div><p style=${{fontSize:14,lineHeight:1.8,color:"var(--text)"}}>${String(report.action).split(/\n+/).map(s=>s.trim()).filter(Boolean)[0]||report.action}</p></div>`}
        </div>`
    }

    ${currentView==="diary"&&html`<${JournalSection} date=${date} logs=${logs}/>`}

    <!-- ★その日のレポートから、そのままストーリーズを作る★（2026-08-20 Kai要望）
         一覧に置いていたが、1日の区切りは0時ちょうどなので、0時を回ると
         「今日」は0件になり作れなかった。見ているレポートの日付で作れる場所へ移す。 -->
    <div class="card" style=${{margin:"8px 16px 12px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
      <div>
        <div style=${{fontSize:13,fontWeight:700,color:"var(--text)"}}>📱 この日をストーリーズにシェア</div>
        <div style=${{fontSize:11.5,color:"var(--sub)",marginTop:2,lineHeight:1.5}}>時間の使い方を1枚にして保存できます</div>
      </div>
      <button onClick=${()=>makeStory(date)} disabled=${storyBusy}
        style=${{flexShrink:0,background:"var(--accent)",color:"#fff",border:"none",borderRadius:10,padding:"10px 14px",fontSize:12.5,fontWeight:700,cursor:"pointer",fontFamily:"inherit",opacity:storyBusy?0.6:1,display:"flex",alignItems:"center",gap:6}}>
        ${storyBusy?html`<div class="spin" style=${{borderColor:"rgba(255,255,255,.3)",borderTopColor:"#fff",width:12,height:12,borderWidth:2}}/>作成中…`:"ストーリーズを作る"}
      </button>
    </div>
    ${storyModal}${storyMsgBox}
  </div>`;
}

// 目覚まし時計のような「ピピピ」という電子音をWeb Audio APIのオシレーターで
// その場で合成する（録音済みサンプルではなく矩形波のビープ音を鳴らす）。
// 1グループ=短いビープを3回（ピピピ）、グループの間に少し間を空けて繰り返す
const ALARM_STYLES = [
  { key:"soft",     label:"ソフト",     freq:1800, beepMs:110, gapMs:110, groups:2, groupGapMs:450, gain:0.45 },
  { key:"standard", label:"スタンダード", freq:2400, beepMs:120, gapMs:120, groups:2, groupGapMs:450, gain:0.6 },
  { key:"strong",   label:"しっかり",   freq:3000, beepMs:130, gapMs:100, groups:2, groupGapMs:350, gain:0.75 },
];
const getAlarmStyle = () => ALARM_STYLES.find(s=>s.key===localStorage.getItem("timer_alarm_style")) || ALARM_STYLES[1];
let sharedAudioCtx = null;
function getSharedAudioCtx() {
  // iOSはバックグラウンドに回るとAudioContextを勝手にclosedにすることがあるため、
  // その場合は作り直す（closedのcontextはresumeできず、音が一切鳴らなくなる）
  if(!sharedAudioCtx || sharedAudioCtx.state === "closed") sharedAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return sharedAudioCtx;
}
// 音が鳴らせなかった時の保険: クリック音サンプルを連打してアラーム代わりにする
// （HTMLAudioはWeb Audioと復帰条件が異なるため、片方が死んでいても鳴る可能性がある）
let fallbackAlarmEl = null;
function playFallbackAlarm() {
  try {
    if(!fallbackAlarmEl) fallbackAlarmEl = new Audio(TIMER_CLICK_SRC);
    fallbackAlarmEl.volume = 1;
    let n = 0;
    const rep = () => { if(n++>=6) return; fallbackAlarmEl.currentTime = 0; fallbackAlarmEl.play().catch(()=>{}); setTimeout(rep, 250); };
    rep();
  } catch(e){}
}
// 指定スタイルで「ピピピ…」を合成して鳴らす。テスト再生・タイマー完了時の両方から呼ばれる
function scheduleAlarmBeeps(style) {
  const ctx = getSharedAudioCtx();
  // iOSでは電話やバックグラウンド遷移後に"interrupted"や"suspended"のまま戻ってくる。
  // resumeは非同期なので、完了を待ってからオシレーターを組み立てる（suspended中に
  // 組み立てると鳴らないことがある）。0.6秒待っても復帰しなければ保険の音に切り替える
  if(ctx.state !== "running") {
    let done = false;
    const p = ctx.resume && ctx.resume();
    if(p && p.then) {
      p.then(()=>{ if(!done){ done = true; buildAlarmBeeps(ctx, style); } }).catch(()=>{ if(!done){ done = true; playFallbackAlarm(); } });
      setTimeout(()=>{ if(!done){ done = true; playFallbackAlarm(); } }, 600);
      return;
    }
  }
  buildAlarmBeeps(ctx, style);
}
function buildAlarmBeeps(ctx, style) {
  const beepsPerGroup = 3;
  const beepSec = style.beepMs/1000, gapSec = style.gapMs/1000;
  const groupDurSec = beepsPerGroup*(beepSec+gapSec);
  let t = ctx.currentTime;
  for(let g=0; g<style.groups; g++){
    for(let b=0; b<beepsPerGroup; b++){
      const start = t + b*(beepSec+gapSec);
      const osc = ctx.createOscillator();
      osc.type = "square";
      osc.frequency.value = style.freq;
      const gain = ctx.createGain();
      // クリックノイズが出ないよう、立ち上がり・立ち下がりを短くフェードする
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(style.gain, start+0.005);
      gain.gain.setValueAtTime(style.gain, start+beepSec-0.01);
      gain.gain.linearRampToValueAtTime(0, start+beepSec);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start+beepSec+0.02);
    }
    t += groupDurSec + style.groupGapMs/1000;
  }
}

// ── Chat ──
function TimerScreen({onToast, isActive}) {
  const getPresets = () => JSON.parse(localStorage.getItem("timer_presets")||"[25,45,60]");
  const getBreak   = () => Number(localStorage.getItem("timer_break")||"5");

  const loadTimerState = () => {
    try {
      const s = JSON.parse(localStorage.getItem("jiroku_timer_state")||"null");
      if (!s) return null;
      // 実行中だった場合、経過時間を差し引いて残り時間を計算
      if (s.isRunning && s.savedAt) {
        const elapsed = Math.floor((Date.now() - s.savedAt) / 1000);
        s.timeLeft = Math.max(0, s.timeLeft - elapsed);
      }
      return s;
    } catch(e) { return null; }
  };

  const saved = loadTimerState();
  const defaultMin = getPresets()[0];

  const [breakMin]       = useState(getBreak);
  const [selectedMin, setSelectedMin] = useState(saved?.selectedMin ?? defaultMin);
  // 休憩の入れ方: 25分以下の短い集中は休憩なし。25分を超えたら休憩を挟む
  // （45分→10分、60分超→15分）。休憩0＝そのまま次の集中へ戻す
  const breakForFocus = (min) => min <= 25 ? 0 : (min <= 45 ? 10 : 15);
  const [activeBreakMin, setActiveBreakMin] = useState(0);
  // 集中セッション後に「休憩へ入る／休憩なしで集中に戻す」を切り替える
  const goToBreakOrReset = () => {
    const bm = breakForFocus(selectedMin);
    setStartTime(null);
    if(bm > 0){ setActiveBreakMin(bm); setMode("break"); setTimeLeft(bm*60); }
    else { setMode("focus"); setTimeLeft(selectedMin*60); }
  };
  const [timeLeft, setTimeLeft]       = useState(saved?.timeLeft ?? defaultMin*60);
  const [isRunning, setIsRunning]     = useState(saved?.isRunning ?? false);
  const [mode, setMode]               = useState(saved?.mode ?? "focus");
  const [sessionCount, setSessionCount] = useState(saved?.sessionCount ?? 0);
  const [task, setTask]               = useState(saved?.task ?? "");
  const [startTime, setStartTime]     = useState(saved?.startTime ? new Date(saved.startTime) : null);
  const [showModal, setShowModal]     = useState(false);
  // タイマー完了の記録モーダルが開いている間は、自動アップデートのリロードを保留させる
  // （メモ入力中に画面が突然消えるのを防ぐ）。data-entry-openをルート要素に立てる
  useEffect(()=>{
    if(showModal) document.documentElement.setAttribute("data-entry-open","1");
    else document.documentElement.removeAttribute("data-entry-open");
    return ()=>document.documentElement.removeAttribute("data-entry-open");
  },[showModal]);
  // タイマー完了後の記録をワンタップで確定できるよう、自己評価は初期値を入れておく
  // （毎回5段階から選び直す手間を減らす。もちろん自由に変更できる）
  const [logFocus, setLogFocus]       = useState("4 — よくできた");
  const [logMemo, setLogMemo]         = useState("");
  const [logGoalRelated, setLogGoalRelated] = useState(()=>localStorage.getItem("jiroku_timer_goal_related")!=="false");
  const [logTimeClass, setLogTimeClass] = useState("");   // 時間の5分類
  // 分類から「目標に関連しているか」を自動で決める（チェック欄は廃止した）
  const setLogTimeClassAndGoal = (k) => {
    setLogTimeClass(k);
    const v = (k === "GOAL_DIRECT");
    setLogGoalRelated(v);
    try{ localStorage.setItem("jiroku_timer_goal_related", String(v)); }catch(e){}
  };
  const [saving, setSaving]           = useState(false);
  // 今回のセッションの実測結果（予定◯分に対して実際◯分集中したか）。
  // 途中で終えた場合も分単位で記録できるよう、モーダルを開く時点で確定させる
  const [sessionResult, setSessionResult] = useState(null); // {planned, actual} | null
  // ★1セッション＝1つの実行ID★
  //   開始時に決めて、保存に成功するまで変えない。再送・重複送信・
  //   一時停止からの再開でも、サーバー側は同じ1行を更新する。
  const [execId, setExecId] = useState(saved?.execId || null);
  const [linkTaskId, setLinkTaskId] = useState(saved?.linkTaskId || null);
  const newExecId = () => "exec_c_" + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(36).slice(2));

  // ホーム画面の「今日のタスク」を、タイマーの集中対象としてもワンタップで選べるようにする。
  // 各項目は {text, min}（minは想定時間・分）。古い形式（ただの文字列）にも後方互換で対応する
  const normTaskOpts = (items) => (items||[]).map(it => (typeof it==="string" ? {text:it, min:null, id:null} : {text:String(it.text||""), min:(it.min||null), id:(it.id||null)})).filter(o=>o.text);
  const readTodayActions = () => {
    try {
      const s = JSON.parse(localStorage.getItem("jiroku_today_actions_shared")||"null");
      if (s && s.date === formatDateStr(new Date())) return normTaskOpts(s.items);
    } catch(e){}
    return [];
  };
  const [todayActionOptions, setTodayActionOptions] = useState(readTodayActions);
  useEffect(()=>{
    if(!isActive) return;
    setTodayActionOptions(readTodayActions());
    // ボードのカードから「⏱測る」で遷移してきた場合、そのタスクを自動でセットして開始する
    try{
      const p = JSON.parse(localStorage.getItem("jiroku_timer_pending_task")||"null");
      localStorage.removeItem("jiroku_timer_pending_task");
      if(p && p.date===formatDateStr(new Date()) && p.text && !isRunning){
        setTask(p.text);
        setLinkTaskId(p.id||null);
        const m = Number(p.min);
        if(m>0){ setSelectedMin(m); setTimeLeft(m*60); }
      }
    }catch(e){}
  },[isActive]);

  // 状態をlocalStorageに保存
  useEffect(()=>{
    localStorage.setItem("jiroku_timer_state", JSON.stringify({
      selectedMin, timeLeft, isRunning, mode, sessionCount, execId, linkTaskId,
      task, startTime: startTime?.toISOString()||null, savedAt: Date.now()
    }));
  },[selectedMin, timeLeft, isRunning, mode, sessionCount, task, startTime, execId, linkTaskId]);

  // タブに戻った時にプリセット設定を再読込
  const [presets, setPresets] = useState(getPresets);
  useEffect(()=>{ if(isActive) setPresets(getPresets()); },[isActive]);

  // スタート/一時停止は短いクリック音、完了は目覚まし時計風の「ピピピ」ビープで区別する
  const clickElRef = useRef(null);
  const getClickEl = () => {
    if(!clickElRef.current) clickElRef.current = new Audio(TIMER_CLICK_SRC);
    return clickElRef.current;
  };
  const primeAudio = () => {
    try {
      const el = getClickEl();
      el.volume = 0.5;
      el.currentTime = 0;
      el.play().catch(()=>{});
    } catch(e){}
    // ユーザー操作のタイミングでAudioContextを再開しておく
    // （タイマー終了時はユーザー操作の外なので、ここで準備しておかないと鳴らせないことがある）
    try {
      const ctx = getSharedAudioCtx();
      if(ctx.state === "suspended") ctx.resume();
    } catch(e){}
    try { navigator.vibrate?.(60); } catch(e){}
  };
  const playBeep = () => {
    try { scheduleAlarmBeeps(getAlarmStyle()); } catch(e){}
    // 音が出せない環境（マナーモード等）でも気づけるよう振動も併用（アラームらしく長めのパターンに）
    try { navigator.vibrate?.([300,150,300,150,300,150,300]); } catch(e){}
  };

  // バックグラウンド復帰時に経過時間を補正する
  const timeLeftRef = useRef(timeLeft);
  const isRunningRef = useRef(isRunning);
  const selectedMinRef = useRef(selectedMin);
  const modeRef = useRef(mode);
  const taskRef = useRef(task);
  useEffect(()=>{ timeLeftRef.current = timeLeft; },[timeLeft]);
  useEffect(()=>{ isRunningRef.current = isRunning; },[isRunning]);
  useEffect(()=>{ selectedMinRef.current = selectedMin; },[selectedMin]);
  useEffect(()=>{ modeRef.current = mode; },[mode]);
  useEffect(()=>{ taskRef.current = task; },[task]);

  // タイマーの時間が終了した＝そのタスクは完了とみなす。
  // ①今日のタスクに自動でチェックを付け（today_actions）、②タイマーの選択肢から消す。
  // 集中対象が「今日のタスク」の項目に一致する時だけ実行する（フリー入力の時は何もしない）。
  // ホーム側はチェック状態を再読込して✓を反映＆共有リストを更新する。
  // ★タスクIDが分かっているときは、それで完了にする★（2026-08-05 Kai報告）
  //   これまでは名前の一致でしか判定できず、しかもタイマーが最後まで鳴ったときしか
  //   呼ばれていなかった。途中で「完了して記録」しても✓が付かなかった。
  //   タスクを選んで始めた場合は id を持っているので、それで確実に完了にする。
  const completeTaskById = (tid, title) => {
    const id = String(tid||"").trim();
    if(!id) return;
    try {
      const checked = JSON.parse(localStorage.getItem("today_actions")||"{}");
      if(checked[id]) return;
      checked[id] = true;
      localStorage.setItem("today_actions", JSON.stringify(checked));
      gasPostJson("saveTodayActions", {checked: JSON.stringify(checked), noBridge: "1"});
      enqueueTaskMutation("UPDATE", id, { status: "DONE" });
      // タイマーの選択肢からも外す
      const t = String(title||"").trim();
      if(t){
        const shared = JSON.parse(localStorage.getItem("jiroku_today_actions_shared")||"null");
        if(shared && Array.isArray(shared.items)){
          shared.items = shared.items.filter(it=> (typeof it==="string"?it:String(it.text||"")) !== t);
          localStorage.setItem("jiroku_today_actions_shared", JSON.stringify(shared));
        }
      }
      setTodayActionOptions(opts=>opts.filter(o=>String(o.id||"")!==id && o.text!==t));
    } catch(e){}
  };

  const completeTaskIfListed = (taskText) => {
    const t = String(taskText||"").trim();
    if(!t) return;
    if(!todayActionOptions.some(o=>o.text===t)) return; // 今日のタスク由来でなければ対象外
    try {
      // ★完了状態は task_id をキーにする★
      //   ホーム画面側が id キーで持つようになったので、ここだけ名前で
      //   書くと「タイマーで終わらせたのにホームで未完了のまま」になる。
      const d0 = new Date();
      const dayKey = d0.getFullYear()+"-"+String(d0.getMonth()+1).padStart(2,"0")+"-"+String(d0.getDate()).padStart(2,"0");
      let tid = t;
      try {
        const raw = JSON.parse(localStorage.getItem("jiroku_custom_actions_"+dayKey)||"[]")||[];
        const hit = normalizeTaskList(raw).find(x=>x.title===t);
        if (hit) tid = hit.id;
      } catch(e){}
      const checked = JSON.parse(localStorage.getItem("today_actions")||"{}");
      if(!checked[tid] && !checked[t]){
        checked[tid] = true;
        if (tid !== t) delete checked[t];   // 旧形式の掃除
        localStorage.setItem("today_actions", JSON.stringify(checked));
        gasPostJson("saveTodayActions", {checked: JSON.stringify(checked), noBridge: "1"}); // 他端末にも同期
        if (tid !== t) enqueueTaskMutation("UPDATE", tid, { status: "DONE" });   // Tasksシートへも
      }
      // 共有リスト（タイマーの選択肢）からも即座に除外
      const shared = JSON.parse(localStorage.getItem("jiroku_today_actions_shared")||"null");
      if(shared && Array.isArray(shared.items)){
        shared.items = shared.items.filter(it=> (typeof it==="string"?it:String(it.text||"")) !== t);
        localStorage.setItem("jiroku_today_actions_shared", JSON.stringify(shared));
      }
    } catch(e){}
    setTodayActionOptions(opts=>opts.filter(o=>o.text!==t));
  };

  // アプリが閉じられていても気づけるよう、開始時にLINE通知をGAS側に予約し、
  // 一時停止・リセット・アプリ内で完了を検知できたときは予約を取り消す
  const scheduleEndNotify = (secondsLeft, currentMode) => {
    const endTime = Date.now() + secondsLeft*1000;
    const label = currentMode==="focus" ? "集中セッション" : "休憩";
    gasPost("scheduleTimerEnd", {endTime, label});
  };
  const cancelEndNotify = () => { gasPost("cancelTimerEnd"); };

  useEffect(()=>{
    const onVisible = () => {
      if(document.visibilityState === 'visible' && isRunningRef.current) {
        try {
          const s = JSON.parse(localStorage.getItem("jiroku_timer_state")||"null");
          if(s && s.isRunning && s.savedAt) {
            const elapsed = Math.floor((Date.now() - s.savedAt) / 1000);
            const corrected = Math.max(0, s.timeLeft - elapsed);
            setTimeLeft(corrected);
            if(corrected <= 0) {
              setIsRunning(false);
              playBeep();
              cancelEndNotify(); // アプリ内で気づけたのでLINE通知は不要
              if(modeRef.current === "focus"){ setSessionCount(c=>c+1); setSessionResult({planned:selectedMinRef.current, actual:selectedMinRef.current}); completeTaskIfListed(taskRef.current); setShowModal(true); }
              else { setMode("focus"); setTimeLeft(selectedMinRef.current*60); }
            }
          }
        } catch(e){}
      }
    };
    document.addEventListener('visibilitychange', onVisible);
    return ()=>document.removeEventListener('visibilitychange', onVisible);
  },[]);

  useEffect(()=>{
    if(!isRunning) return;
    if(timeLeft<=0){
      setIsRunning(false);
      playBeep();
      cancelEndNotify(); // アプリ内で気づけたのでLINE通知は不要
      if(mode==="focus"){ setSessionCount(c=>c+1); setSessionResult({planned:selectedMin, actual:selectedMin}); completeTaskIfListed(task); setShowModal(true); }
      else { setMode("focus"); setTimeLeft(selectedMin*60); }
      return;
    }
    const t = setTimeout(()=>setTimeLeft(s=>s-1), 1000);
    return ()=>clearTimeout(t);
  },[isRunning, timeLeft]);

  const selectPreset = (min) => {
    setSelectedMin(min); setTimeLeft(min*60);
    setIsRunning(false); setStartTime(null); setMode("focus");
    cancelEndNotify();
  };
  const start = () => {
    primeAudio();
    if(!startTime) setStartTime(new Date());
    if(!execId) setExecId(newExecId());
    setIsRunning(true);
    scheduleEndNotify(timeLeft, mode);
  };
  // 指定した分数でその場からタイマーを開始する（今日のタスクの想定時間で始めるのに使う）
  const startWithMinutes = (min) => {
    primeAudio();
    setSelectedMin(min); setTimeLeft(min*60); setMode("focus");
    setStartTime(new Date()); setIsRunning(true);
    setExecId(newExecId());
    scheduleEndNotify(min*60, "focus");
  };
  // 今日のタスクを選んだ時の挙動：ラベルをセットし、想定時間があればその時間でタイマー開始
  const selectTaskOption = (opt) => {
    if(isRunning) return;
    if(task===opt.text){ setTask(""); setLinkTaskId(null); return; } // もう一度タップで選択解除
    setTask(opt.text); setLinkTaskId(opt.id||null);
    if(opt.min && Number(opt.min)>0) startWithMinutes(Number(opt.min));
  };
  const pause = () => { primeAudio(); setIsRunning(false); cancelEndNotify(); };
  // キャンセル：0分の実績を残さない。実行IDも捨てる（次は別セッション扱い）
  const reset = () => { setIsRunning(false); setTimeLeft(selectedMin*60); setStartTime(null); setMode("focus"); setTask(""); setSessionResult(null); setExecId(null); setLinkTaskId(null); localStorage.removeItem("jiroku_timer_state"); cancelEndNotify(); };

  const saveLog = async () => {
    setSaving(true);
    const st = startTime||new Date();
    const endDt = new Date(st.getTime() + (sessionResult?sessionResult.actual:selectedMin)*60000);
    const fmtHM = d => String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
    // 同じ1時間内に複数回タイマーで測っても記録が上書きされないよう、時間帯キーは
    // 「HH:00-HH:00」の固定枠ではなく、実際の開始〜終了の分単位にする（1回ごとに別の記録として残る）
    const timeBlock = fmtHM(st)+"-"+fmtHM(endDt);
    // 予定に対する実測の集中時間を、メモの末尾に分単位で自動追記する
    // （レポート生成のAIにも渡るため、計画実行力のフィードバック材料になる）
    const timerNote = sessionResult ? `⏱ 集中${sessionResult.actual}分（予定${sessionResult.planned}分）` : "";
    const memoToSave = [logMemo.trim(), timerNote].filter(Boolean).join("\n");
    // メモが長くなるとURLの長さ制限に引っかかる可能性があるため、GETのURL
    // パラメータではなくPOSTのボディで送る（gasPostJson）
    const calTitle = task.trim()||`ポモドーロ${sessionResult?sessionResult.actual:selectedMin}分集中`;
    // ★実測を構造化して送る★ memoの文字列だけに頼らない。
    //   actual_minutes は「設定した予定時間」ではなく、実際に測れた経過時間。
    const measured = sessionResult ? Number(sessionResult.actual) : selectedMin;
    if(!(measured>0)){ onToast("記録できる時間がありません"); setSaving(false); return; }
    const eid = execId || newExecId();
    if(!execId) setExecId(eid);
    const res = await gasPostJson("saveLog", {
      action_execution_id: eid,          // 冪等キー。再送しても行は増えない
      date: formatDateStr(st),
      time_block: timeBlock,
      task: calTitle,
      focus_level: logFocus,
      memo: memoToSave,
      goal_related: logGoalRelated?"true":"false",
      actual_minutes: measured,
      duration_confirmed: "true",        // タイマーで測った値なので確定扱い
      link_task_id: linkTaskId || "",
      // 本人が選んだときだけ送る。送らなければサーバーのルールで決まる
      time_classification: logTimeClass || undefined,
    });
    if(!res.ok){ onToast("記録に失敗しました。もう一度お試しください"); setSaving(false); return; }
    // ★記録できたら、そのタスクにチェックを付ける★（2026-08-05 Kai報告）
    //   タイマーで測って記録まで済んだのに、今日のタスクが未完了のままだった。
    //   IDが分かっていればIDで、無ければ名前で完了にする。
    if(linkTaskId) completeTaskById(linkTaskId, calTitle);
    else completeTaskIfListed(task);
    if(res.xp_gained){ const lv=res.level_up?` → Lv.${res.level}！`:""; onToast(`+${res.xp_gained} XP 獲得${lv}`); }
    else onToast(res.updated?"記録を更新しました":"記録しました");
    setTimeout(()=>announceJiroFound(res), 1200);
    // タイマー記録は1時間枠ではなく「実際に集中した開始〜終了時刻」でカレンダーに書き戻す
    // （同じ時間帯キーを使うので、手動記録側で作ったイベントがあれば実測時刻に更新される）
    upsertCalendarEvent(formatDateStr(st), timeBlock, st.toISOString(), endDt.toISOString(), calTitle, null, false, logTimeClass);
    setSaving(false); setShowModal(false); setLogMemo(""); setTask(""); setSessionResult(null);
    setExecId(null); setLinkTaskId(null); setLogTimeClass("");   // 保存できたので、このセッションは終わり
    goToBreakOrReset();
  };
  const skipLog = () => { setShowModal(false); setTask(""); setSessionResult(null); goToBreakOrReset(); };

  const mins = Math.floor(timeLeft/60);
  const secs = timeLeft%60;
  const totalSec = (mode==="focus"?selectedMin:(activeBreakMin||breakMin))*60;
  const pct = Math.max(0,Math.min(100,((totalSec-timeLeft)/totalSec)*100));
  const r=90, circ=2*Math.PI*r, offset=circ*(1-pct/100);
  const accentColor = mode==="break"?"var(--green)":"var(--accent)";

  return html`<div style=${{paddingBottom:32}}>
    <div class="ph">
      <div class="ph-title-accent">ポモドーロタイマー</div>
    </div>
    <div style=${{padding:"0 16px"}}>

      <div style=${{display:"flex",gap:8,marginBottom:24}}>
        ${presets.map(min=>html`
          <button key=${min} onClick=${()=>!isRunning&&selectPreset(min)}
            style=${{flex:1,padding:"10px 0",borderRadius:10,border:`1.5px solid ${selectedMin===min?"var(--accent)":"var(--border)"}`,
            background:selectedMin===min?"var(--accent-l)":"var(--card)",color:selectedMin===min?"var(--accent)":"var(--sub)",
            fontWeight:600,fontSize:14,cursor:isRunning?"default":"pointer",opacity:isRunning&&selectedMin!==min?0.4:1}}>
            ${min}分
          </button>
        `)}
      </div>

      <div style=${{position:"relative",width:220,height:220,margin:"0 auto",marginBottom:20}}>
        <svg width="220" height="220" viewBox="0 0 220 220" style=${{position:"absolute",top:0,left:0}}>
          <circle cx="110" cy="110" r=${r} fill="none" stroke="var(--border)" stroke-width="10"/>
          <circle cx="110" cy="110" r=${r} fill="none" stroke=${accentColor} stroke-width="10"
            stroke-dasharray=${circ} stroke-dashoffset=${offset}
            stroke-linecap="round" transform="rotate(-90 110 110)"
            style=${{transition:"stroke-dashoffset 1s linear"}}/>
        </svg>
        <div style=${{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <div style=${{fontSize:46,fontWeight:800,color:"var(--text)",lineHeight:1,fontVariantNumeric:"tabular-nums"}}>
            ${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}
          </div>
          <div style=${{fontSize:13,color:mode==="break"?"var(--green)":"var(--sub)",marginTop:8}}>
            ${mode==="focus"?`集中中 · 第${sessionCount+1}セッション`:`休憩中 · 第${sessionCount}セッション完了`}
          </div>
        </div>
      </div>

      ${mode==="focus"&&html`
        <div class="form-grp" style=${{marginBottom:16}}>
          ${!isRunning && todayActionOptions.length>0 && html`
            <div style=${{marginBottom:14}}>
              <div style=${{fontSize:10.5,fontWeight:700,letterSpacing:".04em",color:"var(--sub)",marginBottom:7}}>今日のタスクから選ぶ（⏱想定時間つきはその時間で開始）</div>
              <div style=${{display:"flex",flexDirection:"column",gap:6}}>
                ${todayActionOptions.map((a,i)=>{
                  const on=task===a.text;
                  return html`
                    <button key=${i} onClick=${()=>selectTaskOption(a)}
                      style=${{display:"flex",alignItems:"center",gap:8,width:"100%",textAlign:"left",padding:"10px 12px",borderRadius:10,border:`1.5px solid ${on?"var(--accent)":"var(--border)"}`,background:on?"var(--accent-l)":"var(--bg)",cursor:"pointer",fontFamily:"inherit"}}>
                      <span style=${{fontSize:13,flexShrink:0,opacity:on?1:.7}}>🎯</span>
                      <span style=${{flex:1,minWidth:0,fontSize:12.5,fontWeight:on?700:500,color:on?"var(--accent)":"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${a.text}</span>
                      ${a.min>0&&html`<span style=${{flexShrink:0,fontSize:11,fontWeight:600,color:on?"var(--accent)":"var(--sub)"}}>⏱${a.min}分</span>`}
                      ${on&&html`<span style=${{flexShrink:0,fontSize:12,color:"var(--accent)"}}>✓</span>`}
                    </button>
                  `;
                })}
              </div>
            </div>
          `}
          <label class="form-lbl">何に集中しますか？（任意）</label>
          <input class="inp" placeholder="例：資料作成、家事、勉強など" value=${task}
            onInput=${e=>setTask(e.target.value)} disabled=${isRunning}/>
          <!-- 計測中でも書けるメモ。ここに書いた内容は終了後の記録メモに引き継がれる -->
          <label class="form-lbl" style=${{marginTop:12}}>メモ（計測中も書けます・任意）</label>
          <textarea class="inp" placeholder="気づいたこと・やったことをここにメモ" value=${logMemo}
            onInput=${e=>setLogMemo(e.target.value)}
            style=${{minHeight:isRunning?96:64,resize:"vertical",lineHeight:1.6,fontFamily:"inherit"}}/>
        </div>
      `}

      <div style=${{display:"flex",gap:10,marginBottom:startTime&&!showModal?8:16}}>
        <button onClick=${isRunning?pause:start}
          style=${{flex:1,padding:"15px",borderRadius:12,border:"none",background:accentColor,
          color:"white",fontSize:17,fontWeight:700,cursor:"pointer"}}>
          ${isRunning?"⏸ 一時停止":"▶ スタート"}
        </button>
        <button onClick=${reset}
          style=${{padding:"15px 18px",borderRadius:12,border:"1.5px solid var(--border)",
          background:"var(--card)",color:"var(--sub)",fontSize:18,cursor:"pointer"}}>↺</button>
      </div>

      ${startTime&&!showModal&&html`
        <button onClick=${()=>{
            pause();
            // 途中終了。実際に集中した時間を分単位で確定させる。
            // 休憩中に押した場合は、直前の集中セッションは完走済みなので予定＝実測
            const elapsedSec = selectedMin*60 - timeLeft;
            // ★1分未満は実績として保存しない★
            //   押し間違いや開始直後の停止を「集中1分」として残すと、
            //   実績時間も記録件数も水増しされてしまう
            if(mode==="focus" && elapsedSec < 60){
              onToast("1分未満のため記録しません");
              reset();
              return;
            }
            const actual = mode==="focus" ? Math.max(1, Math.round(elapsedSec/60)) : selectedMin;
            setSessionResult({planned:selectedMin, actual});
            setShowModal(true);
          }}
          style=${{width:"100%",padding:"11px",borderRadius:12,border:"1.5px solid var(--accent)",
          background:"none",color:"var(--accent)",fontSize:14,fontWeight:600,cursor:"pointer",marginBottom:16}}>
          ✓ タスク完了・途中で記録する
        </button>
      `}

      <div style=${{display:"flex",gap:10,marginBottom:20}}>
        <div style=${{flex:1,background:"var(--card)",borderRadius:14,padding:"14px 0",textAlign:"center",border:"1px solid var(--border)"}}>
          <div style=${{fontSize:26,fontWeight:800,color:"var(--accent)",lineHeight:1}}>${sessionCount}</div>
          <div style=${{fontSize:11,color:"var(--sub)",marginTop:4}}>セッション完了</div>
        </div>
        <div style=${{flex:1,background:"var(--card)",borderRadius:14,padding:"14px 0",textAlign:"center",border:"1px solid var(--border)"}}>
          <div style=${{fontSize:26,fontWeight:800,color:"var(--accent)",lineHeight:1}}>${sessionCount*selectedMin}</div>
          <div style=${{fontSize:11,color:"var(--sub)",marginTop:4}}>集中した分数</div>
        </div>
      </div>

      ${(()=>{
        const quotes=[
          {text:"成功は最終的なものではなく、失敗は致命的ではない。大切なのは続ける勇気だ。",author:"ウィンストン・チャーチル"},
          {text:"千里の道も一歩から。",author:"老子"},
          {text:"今日できることを明日に延ばすな。",author:"ベンジャミン・フランクリン"},
          {text:"才能とは、毎日同じことを新鮮な気持ちでできる能力のことである。",author:"古賀稔彦"},
          {text:"行動こそが全てを決める。今すぐ動け。",author:"ゲーテ"},
          {text:"どんな小さな進歩も、昨日の自分を超えている。",author:"匿名"},
          {text:"夢を見るだけでは不十分。行動しなければ夢は夢のままだ。",author:"ヴァルター・スコット"},
          {text:"集中力は、成功への最短ルートだ。",author:"ブルース・リー"},
          {text:"できると思えばできる。できないと思えばできない。どちらも正しい。",author:"ヘンリー・フォード"},
          {text:"一度に一つのことに集中すれば、あなたは多くのことを成し遂げられる。",author:"オグ・マンディーノ"},
          {text:"石の上にも三年。",author:"日本のことわざ"},
          {text:"努力は必ず報われる。もし報われない努力があるならば、それはまだ努力と呼べない。",author:"王貞治"},
          {text:"やってみなければ分からない。やってみれば必ず分かる。",author:"本田宗一郎"},
          {text:"小さなことを重ねることが、とんでもないところへ行くただひとつの道。",author:"イチロー"},
          {text:"人生は今日一日の積み重ねである。",author:"伊藤忠兵衛"},
        ];
        const today=new Date(); const idx=(today.getFullYear()*10000+((today.getMonth()+1)*100)+today.getDate())%quotes.length;
        const q=quotes[idx];
        return html`
          <div style=${{background:"var(--card)",borderRadius:14,padding:"18px 16px",border:"1px solid var(--border)",marginBottom:8}}>
            <div style=${{fontSize:11,color:"var(--accent)",fontWeight:700,marginBottom:8,letterSpacing:"0.05em"}}>TODAY'S QUOTE</div>
            <div style=${{fontSize:14,color:"var(--text)",lineHeight:1.7,fontStyle:"italic",marginBottom:10}}>"${q.text}"</div>
            <div style=${{fontSize:12,color:"var(--sub)",textAlign:"right"}}>— ${q.author}</div>
          </div>
        `;
      })()}
    </div>

    ${showModal&&html`
      <div style=${{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",padding:16,zIndex:200}}
        onClick=${e=>{if(e.target===e.currentTarget)setShowModal(false);}}>
        <div style=${{background:"var(--card)",borderRadius:20,boxShadow:"0 18px 50px rgba(0,0,0,0.35)",padding:"24px 20px 32px",width:"100%",maxWidth:420,boxSizing:"border-box",maxHeight:"84dvh",overflowY:"auto",overscrollBehavior:"contain",WebkitOverflowScrolling:"touch"}}>
          <div style=${{fontSize:20,fontWeight:800,marginBottom:4}}>お疲れ様でした！🎉</div>
          <div style=${{fontSize:13,color:"var(--sub)",marginBottom:20}}>
            ${sessionResult
              ? (sessionResult.actual>=sessionResult.planned
                  ? `${sessionResult.planned}分の集中セッションが完了しました。記録しましょう。`
                  : `予定${sessionResult.planned}分のうち${sessionResult.actual}分集中しました。記録しましょう。`)
              : `${selectedMin}分の集中セッションが完了しました。記録しましょう。`}
          </div>
          <div class="form-grp">
            <label class="form-lbl">何をしましたか？</label>
            <input class="inp" value=${task} onInput=${e=>setTask(e.target.value)}
              placeholder="例：資料作成"/>
          </div>
          <!-- 「目標に関連している」のチェックは廃止（2026-08-05 Kai要望）。下の分類で決まる -->
          <${TimeClassPicker} value=${logTimeClass} onChange=${setLogTimeClassAndGoal}
            hint=${linkTaskId?"タスクから始めたので、目標に紐づいていれば自動で「目標に直結」になります":""}/>
          <div class="form-grp">
            <label class="form-lbl">自己評価</label>
            <${EvalPicker} value=${logFocus} onChange=${setLogFocus}/>
          </div>
          <div class="form-grp" style=${{marginBottom:20}}>
            <div style=${{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8}}>
              <label class="form-lbl" style=${{marginBottom:0}}>メモ（必須）</label>
              <span style=${{fontSize:10.5,color:"var(--sub)",whiteSpace:"nowrap"}}>うまくできたか・感じたこと・改善点</span>
            </div>
            <textarea class="txa" style=${{marginTop:6}} placeholder="うまくいった点、感じたこと、次はこうしたい、など" value=${logMemo}
              onInput=${e=>setLogMemo(e.target.value)}/>
          </div>
          <button class="btn" onClick=${saveLog} disabled=${saving||!logMemo.trim()} style=${{marginBottom:10}}>
            ${saving?html`<span class="spin"/>`:html`記録して休憩へ（${breakMin}分）`}
          </button>
          <button onClick=${skipLog} style=${{width:"100%",background:"none",border:"none",color:"var(--sub)",fontSize:13,padding:"8px",cursor:"pointer"}}>
            スキップ（記録しない）
          </button>
          <button onClick=${()=>{setShowModal(false);}} style=${{width:"100%",background:"none",border:"none",color:"var(--sub)",fontSize:12,padding:"4px",cursor:"pointer",marginTop:2}}>
            ← タイマーに戻る
          </button>
        </div>
      </div>
    `}
  </div>`;
}

function FAQSection(){
  const [openCat,setOpenCat]=useState(0);
  const [open,setOpen]=useState(null); // "catIdx-itemIdx"
  return html`<div style=${{background:"var(--card)",borderRadius:16,border:"1px solid var(--border)",padding:"18px",marginBottom:12}}>
    <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
      <span style=${{fontSize:15}}>📖</span>
      <div style=${{fontSize:14,fontWeight:700,color:"var(--text)"}}>使い方ガイド</div>
    </div>
    <div style=${{fontSize:11.5,color:"var(--sub)",marginBottom:14}}>知りたいカテゴリを開いて、質問をタップすると答えが出ます。</div>
    ${FAQ_CATEGORIES.map((c,ci)=>html`
      <div key=${ci} style=${{border:"1px solid var(--border)",borderRadius:12,marginBottom:10,overflow:"hidden"}}>
        <button onClick=${()=>setOpenCat(openCat===ci?null:ci)}
          style=${{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,width:"100%",background:openCat===ci?"var(--bg)":"transparent",border:"none",padding:"13px 14px",cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
          <span style=${{fontSize:13.5,fontWeight:700,color:"var(--text)"}}>${c.icon} ${c.cat}<span style=${{fontSize:11,fontWeight:500,color:"var(--sub)",marginLeft:6}}>${c.items.length}</span></span>
          <span style=${{fontSize:14,color:"var(--sub)",flexShrink:0,transform:openCat===ci?"rotate(180deg)":"none",transition:"transform .15s"}}>▾</span>
        </button>
        ${openCat===ci&&html`
          <div style=${{padding:"0 14px 6px"}}>
            ${c.items.map((f,ii)=>{
              const key=ci+"-"+ii;
              return html`
                <div key=${ii} style=${{borderTop:"1px solid var(--border)"}}>
                  <button onClick=${()=>setOpen(open===key?null:key)}
                    style=${{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,width:"100%",background:"none",border:"none",padding:"12px 2px",cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
                    <span style=${{fontSize:13,fontWeight:600,color:"var(--text)",lineHeight:1.5}}>${f.q}</span>
                    <span style=${{fontSize:15,color:"var(--sub)",flexShrink:0,transform:open===key?"rotate(45deg)":"none",transition:"transform .15s"}}>＋</span>
                  </button>
                  ${open===key&&html`<div style=${{fontSize:13,color:"var(--sub)",lineHeight:1.8,padding:"0 2px 12px",whiteSpace:"pre-line"}}>${f.a}</div>`}
                </div>
              `;
            })}
          </div>
        `}
      </div>
    `)}
  </div>`;
}
