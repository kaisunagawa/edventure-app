  const [dailyGoalHours, setDailyGoalHours] = useState(getDailyGoalHours);
  // 週の記録目標（自分のペース）の設定画面は、いまの画面構成には無い。
  // 状態だけ残っていて「押しても何も出ない」の元になるため削除した（2026-08-03）。
  const [showDoneTasks, setShowDoneTasks] = useState(false); // 完了タスク（フォルダ）の開閉
  // 0.5〜6時間までは選択肢を並べるだけで済んだが、12時間まで広げると
  // 0.5刻みで24個にもなり選びにくいため、+/-で刻むステッパー形式にする
  const [pendingGoalHours, setPendingGoalHours] = useState(dailyGoalHours);
  const onEditDailyGoal = () => { setPendingGoalHours(dailyGoalHours); setShowGoalTimeEdit(true); };
  const pickDailyGoal = (h) => {
    localStorage.setItem("jiroku_daily_goal_hours", String(h));
    setDailyGoalHours(h);
    setShowGoalTimeEdit(false);
  };
  useEffect(()=>{
    if(!isActive) return;
    // タイマーでタスクが完了扱いになっている場合があるため、チェック状態を再読込して
    // 「今日のタスク」の✓を最新化する（タイマー→ホームに戻った時に反映）
    try { const c = JSON.parse(localStorage.getItem("today_actions")||"{}"); setChecked(c); } catch(e){}
    // キャッシュで即時表示
    const cachedGame = localStorage.getItem("cache_gameStatus");
    const cachedReport = localStorage.getItem("cache_report");
    const cachedRanking = localStorage.getItem("cache_ranking");
    const cachedStatus = localStorage.getItem("cache_status");
    if(cachedGame) { try { const g=JSON.parse(cachedGame); setGame(g); if(g.goals?.length) onGoalSaved(g.goals); } catch(e){} }
    if(cachedReport) { try { setReport(JSON.parse(cachedReport)); } catch(e){} }
    if(cachedRanking) { try { setRanking(JSON.parse(cachedRanking)); } catch(e){} }
    if(cachedStatus) { try { setStatusSummary(JSON.parse(cachedStatus)); } catch(e){} }

    // ホームに必要なデータの適用処理（統合API・従来APIのどちらから来ても同じ形で受ける）
    const todayStr = logicalTodayStr();   // 深夜0〜4時は前の日の続きとして扱う
    const applyHome = (d, genAtFetch)=>{
      if(d.report){ setReport(d.report); localStorage.setItem("cache_report", JSON.stringify(d.report)); }
      if(d.game){
        setGame(d.game);
        localStorage.setItem("cache_gameStatus", JSON.stringify(d.game));
        announceNewlyFound(d.game);   // 増えていたらカードを出す
        if(d.game.goals?.length){ localStorage.setItem("jiroku_goals",JSON.stringify(d.game.goals)); onGoalSaved(d.game.goals); }
      }
      if(d.schedule) setSchedule(d.schedule);
      if(d.condition){ setCond(d.condition);
        try{ localStorage.setItem("cache_condition", JSON.stringify(d.condition)); }catch(e){} }
      if(d.logs){
        setTodayLogs(d.logs);
        // 今日の記録のうち、まだカレンダーに書けていないものを補完（独り言等の取りこぼし対策）
        if(localStorage.getItem("cal_linked")) reconcileCalendarForDate(todayStr, d.logs);
      }
      if(d.ranking){
        // 順位変動（trend）はサーバー側で「前回のランキング開催日の順位」と比較して算出される
        setRanking(d.ranking);
        localStorage.setItem("cache_ranking", JSON.stringify(d.ranking));
      }
      if(d.status){ setStatusSummary(d.status); localStorage.setItem("cache_status", JSON.stringify(d.status)); }
      // ★getHomeData に相乗りしてきたロードマップと自己経営力★（2026-08-05 起動高速化）
      if(d.roadmap){
        if(d.roadmap.sprints){ setSprints(d.roadmap.sprints);
          try { localStorage.setItem("cache_sprints", JSON.stringify(d.roadmap.sprints)); } catch(e){} }
        if(d.roadmap.goalTree){ setGoalTree(d.roadmap.goalTree);
          try { localStorage.setItem("cache_goaltree", JSON.stringify(d.roadmap.goalTree)); } catch(e){} }
      }
      if(d.smp){
        if(d.smp.ok && d.smp.data){ setSmp(d.smp); setSmpOff(false);
          try { localStorage.setItem("cache_smp", JSON.stringify(d.smp)); } catch(e){} }
        else if(d.smp.error === "feature not enabled") setSmpOff(true);
      }
      if(d.weekly){
        setWeekly(d.weekly);
        if(d.weekly.reflection) setWeekReflection(d.weekly.reflection);
        if(d.weekly.nextIntention) setWeekIntention(d.weekly.nextIntention);
      }
      // ★Tasksシートを正とした反映（Phase 3）★
      //   下の Journal.actions 同期より後に走らせる（あとに適用した方が勝つため、
      //   Tasksシートの内容が最終的な画面になる）。
      setTimeout(()=>{ Promise.resolve(applyTasksFromServer(d.tasks, genAtFetch)).catch(e=>{ console.error("[JIROKU] タスク同期の取得に失敗:", e); }); }, 0);
      // 今日のアクションの端末間同期
      if(d.todayActions){
        // ★タスク一覧はサーバーと突き合わせて1つにまとめる★
        //   以前は「端末に無いときだけ」受け取っていたため、
        //   両方にタスクがあると一生混ざらなかった。
        if(d.todayActions.actions !== null){
          const fromServer = normalizeTaskList(d.todayActions.actions);
          let localList = [];
          try {
            const raw = localStorage.getItem("jiroku_custom_actions_"+todayStr);
            localList = raw ? normalizeTaskList(JSON.parse(raw)) : [];
          } catch(e){}
          const merged = mergeTaskLists(localList, fromServer);
          const changed = merged.length !== localList.length ||
                          merged.some((t,i)=>!localList[i] || localList[i].id !== t.id);
          if (changed) {
            setCustomActions(merged);
            localStorage.setItem("jiroku_custom_actions_"+todayStr, JSON.stringify(merged));
            // まとめた結果を相手にも伝える（両方が同じ一覧になるように）
            gasPostJson("saveTodayActions", { actions: JSON.stringify(merged), noBridge: "1" });
          }
        }
        // ★設定（重要度・期限・想定時間・メモ・進捗）は常に受け取る★
        //   以前はこの処理を上の if の中に入れていたため、
        //   端末にタスクがあると一度も動かなかった。
        //   PCには既にタスクがあるので、スマホの設定が永久に届かなかった。
        //   一覧を受け取るかどうかと、設定を受け取るかどうかは別の話。
        if(d.todayActions.actions !== null){
          const meta = normalizeTaskList(d.todayActions.actions);
          //   この端末で既に設定してある値は上書きしない。
          //   上書きすると「さっき変えたのに戻った」になる。
          const takeIn = (cur, pick) => {
            const next = {...cur};
            let changed = false;
            meta.forEach(t=>{
              const v = pick(t);
              if (v === undefined || v === "" || v === null) return;
              if (next[t.id] !== undefined) return;   // この端末の値を優先
              next[t.id] = v; changed = true;
            });
            return changed ? next : null;
          };
          const ni = takeIn(taskImportance, t=>t.imp);
          if (ni) { setTaskImportance(ni); localStorage.setItem("jiroku_task_importance_"+todayStr, JSON.stringify(ni)); }
          const nd = takeIn(taskDue, t=>t.due);
          if (nd) { setTaskDue(nd); localStorage.setItem("jiroku_task_due_"+todayStr, JSON.stringify(nd)); }
          const ne = takeIn(taskEstimates, t=>t.est);
          if (ne) { setTaskEstimates(ne); localStorage.setItem("jiroku_task_estimates_"+todayStr, JSON.stringify(ne)); }
          const nm = takeIn(taskNotes, t=>t.memo);
          if (nm) { setTaskNotes(nm); localStorage.setItem("jiroku_task_memo_"+todayStr, JSON.stringify(nm)); }
          const ns = takeIn(taskStatus, t=>t.stt);
          if (ns) { setTaskStatus(ns); localStorage.setItem("jiroku_task_status_"+todayStr, JSON.stringify(ns)); }
        }
        if(d.todayActions.checked && Object.keys(d.todayActions.checked).length > 0){
          setChecked(prev=>{
            const merged = {...d.todayActions.checked, ...prev};
            localStorage.setItem("today_actions", JSON.stringify(merged));
            return merged;
          });
        }
      }
      // 今日いちばんやりたいこと（サーバーを正として同期。未宣言なら朝〜夕方だけモーダル）
      try {
        const localIntent = JSON.parse(localStorage.getItem("jiroku_intent")||"null");
        // ★中身のある宣言があるときだけ「今日はもう決めた」とみなす★
        //   空の宣言が入っていると、決めていないのに聞かれなくなっていた
        const hasToday = !!(localIntent && localIntent.date === todayStr
                            && String(localIntent.intent || "").trim());
        const skipped = localStorage.getItem("jiroku_intent_skip") === todayStr;
        if(d.intent && String(d.intent.intent || "").trim()){
          const next = {date:todayStr, intent:d.intent.intent, done:d.intent.done, hours:d.intent.hours};
          localStorage.setItem("jiroku_intent", JSON.stringify(next));
          setIntent(next);
          // 別の端末で宣言済みだった場合は、先に出した確認を引っ込める
          // （入力を始めている人の手は止めない）
          setShowIntentModal(prev => (prev && !String(intentInput||"").trim()) ? false : prev);
        } else if(!hasToday && !skipped){
          // ★時間帯でしぼらない★
          //   以前は6時〜18時だけだった。早朝5時台に開いた日は一度も聞かれず、
          //   その日は宣言しないまま終わってしまう（2026-08-03にKaiの端末で発生）。
          //   深夜0〜4時だけは、その日を始める時間ではないので出さない。
          const h = new Date().getHours();
          if(h >= 4){ setIntentEditMode(false); setShowIntentModal(true); }
        }
      } catch(e){}
    };

    // 統合API1本で取得（9本の並列リクエストがGASの同時実行制限で順番待ちになり
    // 遅かったため）。失敗時のみ従来の個別APIにフォールバックする
    const legacyFetch = ()=>{
      gasApi("getWeeklySummary").then(r=>{ if(r.ok) applyHome({weekly:r.data}); });
      Promise.all([
        gasApi("getReport"), gasApi("getGameStatus"), gasApi("getSchedule"),
        gasApi("getLogs"), gasApi("getRanking"), gasApi("getStatusSummary"),
      ]).then(([rep, game, sched, logs, rank, status])=>{
        applyHome({report:rep.ok?rep.data:null, game:game.ok?game.data:null, schedule:sched.ok?sched.data:null,
          logs:logs.ok?logs.data:null, ranking:rank.ok?rank.data:null, status:(status.ok&&status.data)?status.data:null});
      });
      gasApi("getTodayActions").then(r=>{ if(r.ok&&r.data) applyHome({todayActions:r.data}); });
      gasApi("getIntent").then(r=>{ applyHome({intent:(r.ok&&r.data)?r.data:null}); });
    };
    // 相乗りで来なかったぶんだけ、あとから個別に取りに行く。
    // 古い版のサーバーに当たったときの保険で、ふだんは動かない。
    const fetchSmp = ()=>{
    gasApi("getSelfMgmtPower", { withPrev: "1" }).then(r=>{
      if(r && r.ok && r.data){ setSmp(r); setSmpOff(false);
        try { localStorage.setItem("cache_smp", JSON.stringify(r)); } catch(e){} }
      // feature が無い人だけ、従来の「ステータス」を出す。
      // 通信が遅い・失敗しただけの人に古い画面を見せない（二重表示になるため）
      else if(r && r.error === "feature not enabled") setSmpOff(true);
    }).catch(()=>{});
    };
    const fetchRoadmap = ()=>{
    gasApi("getRoadmap").then(r=>{
      if(r && r.ok){
        if(r.sprints){ setSprints(r.sprints);
          try { localStorage.setItem("cache_sprints", JSON.stringify(r.sprints)); } catch(e){} }
        if(r.goalTree){ setGoalTree(r.goalTree);
          try { localStorage.setItem("cache_goaltree", JSON.stringify(r.goalTree)); } catch(e){} }
        return;
      }
      throw new Error("no roadmap");
    }).catch(()=>{
      gasApi("getSprints").then(r=>{
        if(r && r.ok){ setSprints(r);
          try { localStorage.setItem("cache_sprints", JSON.stringify(r)); } catch(e){} }
      }).catch(()=>{});
      gasApi("getGoalTree").then(r=>{
        if(r && r.ok && r.data){ setGoalTree(r.data);
          try { localStorage.setItem("cache_goaltree", JSON.stringify(r.data)); } catch(e){} }
      }).catch(()=>{});
    });
    };

    // 取得を始めた時点の世代。返ってくるまでの間にタスクを足していたら、
    // その一覧はもう古い（applyTasksFromServer が取り直す）
    const pullHome = ()=>{
      const homeGen = taskGen();
      return gasApi("getHomeData").then(r=>{
        if(r && r.ok && r.data){
          applyHome(r.data, homeGen);
          if(!r.data.smp)     fetchSmp();
          if(!r.data.roadmap) fetchRoadmap();
        } else { legacyFetch(); fetchSmp(); fetchRoadmap(); }
      }).catch(()=>{ legacyFetch(); fetchSmp(); fetchRoadmap(); });
    };
    pullHome();
    // もう一方の端末で何か書かれたら、その場でホームも取り直す
    window.addEventListener("jiroku:remotechange", pullHome);
    // ★話して記録した直後も、ホームを取り直す★（2026-08-19 Kai報告
    //   「携帯で声で記録したけど反映されない」）
    //   裏送りにしたとき、書き終わった合図を記録画面にだけ繋いでいた。
    //   マイクのボタンはホームにあるので、ホームで話した人には
    //   いつまでも出てこなかった。入口のある画面が聞いていないと意味がない。
    window.addEventListener("jiroku:logsaved", pullHome);
    __homeCleanup = ()=>{
      window.removeEventListener("jiroku:remotechange", pullHome);
      window.removeEventListener("jiroku:logsaved", pullHome);
    };

    // カレンダー連携済みなら本人権限で直接取得（GAS経由はスクリプト所有者しか読めないためのフォールバック）
    if(localStorage.getItem("cal_linked")){
      // 前回書き込めずにキューに溜まった記録があれば、この機会にまとめて再送する
      flushCalendarQueue();
      // 過去の記録の取りこぼしを1日1回だけ遡って補完する（独り言など、以前カレンダーに
      // 書けていなかった分をここで拾う）。直近14日分を裏でゆっくり処理する
      // ★14往復を1往復にする★（2026-08-10 Kai報告「記録したあとの読み込みが遅い」）
      //   これまでは1日ずつ getLogs を14回、しかも await で直列に呼んでいた。
      //   GASは同じ人のリクエストを1件ずつしか処理しないので、この14本が
      //   終わるまで、ホームもレポートも保存も、ぜんぶ後ろで待たされていた。
      //   1日1回とはいえ、その日の初回起動が丸ごと遅くなる原因になっていた。
      //   同じ内容を1回で取れる getLogsRange が既にあるので、そちらを使う。
      (async ()=>{
        const today = formatDateStr(new Date());
        if(localStorage.getItem("cal_backfill_done")===today) return;
        try{
          const r = await gasApi("getLogsRange", { date: addDays(today,-1), days: 14 });
          if(r && r.ok && r.data){
            for(const d of Object.keys(r.data)){
              try{ await reconcileCalendarForDate(d, r.data[d]); }catch(e){}
            }
            localStorage.setItem("cal_backfill_done", today);
          }
        }catch(e){}
      })();
      fetchCalendarEvents(formatDateStr(new Date())).then(evs=>{
        if(evs&&evs.length) setSchedule(evs.map(e=>({time:e.time,title:e.title,sub:e.sub})));
      });
      // 明日の予定もサーバーに同期しておく（夜のレポート・朝のメッセージが「明日は〜」を
      // 実際の予定に基づいて正しく言えるようにするため。fetchはsyncCalendarで裏で保存される）
      fetchCalendarEvents(addDays(formatDateStr(new Date()),1)).catch(()=>{});
    }

    // 日付が変わったらチェック状態リセット
    const today = formatDateStr(new Date());
    const saved = localStorage.getItem("today_actions_date");
    if(saved !== today){ localStorage.removeItem("today_actions"); localStorage.setItem("today_actions_date", today); setChecked({}); }

    // （今日のアクション同期・今日いちばんやりたいことの同期は、上のapplyHome/統合APIに集約済み）
    return ()=>{ if(__homeCleanup) __homeCleanup(); __homeCleanup = null; };
  },[isActive]);

  const goalsArr = Array.isArray(goalData) ? goalData : (goalData?.goal ? [goalData] : []);
  const mainGoal = goalsArr[0] || null;
  const daysLeft = mainGoal?.deadline
    ? Math.ceil((new Date(mainGoal.deadline) - new Date()) / 86400000)
    : null;

  // 「今日のタスク」は、ユーザーが自分で追加したものだけを表示する。
  // AIコーチレポートの「明日のアクション」は自動でタスクには入れない（提案は
  // レポート画面で見られる）。要望により、勝手にタスクが増えないようにした。
  // 画面はまだ名前で動く（Phase 2 で task_id へ差し替える）。
  // ここで名前の配列へ落として、既存の参照をそのまま生かす。
  const taskList = customActions !== null ? customActions : [];
  const actionItems = taskList.map(function(t){ return t.title; });
  // ★保存するときに使う★ 名前の配列を [{id,title}] へ戻す。
  //   既にあるタスクは id をそのまま保つ（新しく振り直すと別物になる）。
  //   新しく増えたものだけ id を作る。
  const toStored = function(titles){
    const prev = {};
    (customActions||[]).forEach(function(t){ if(!prev[t.title]) prev[t.title]=t.id; });
    const used = {};
    return titles.map(function(title, i){
      let id = prev[title];
      if(!id || used[id]) id = makeClientTaskId();   // 新規・同名2件目はランダムID
      used[id] = 1;
      const o = { id: id, title: title };
      // 端末内のマップから拾って一緒に保存する（他の端末へ届くように）
      const imp = taskImportance[id] || taskImportance[title];
      const due = taskDue[id] || taskDue[title];
      const est = taskEstimates[id] !== undefined ? taskEstimates[id] : taskEstimates[title];
      const memo = taskNotes[id] || taskNotes[title];
      const stt  = taskStatus[id] || taskStatus[title];
      if (imp) o.imp = imp;
      if (due) o.due = due;
      if (est > 0) o.est = Number(est);
      if (memo) o.memo = String(memo);
      if (stt)  o.stt  = String(stt);
      return o;
    });
  };
  // 名前から id を引く（Phase 2 への足がかり。いまは保存にだけ使う）
  const idOfTitle = function(title){
    const hit = taskList.find(function(t){ return t.title===title; });
    return hit ? hit.id : "";
  };

  // タイマー画面の「何に集中しますか？」からも今日のタスクを選べるよう、
  // 完了していない項目を端末に共有しておく（未完了のものだけ、選ぶ意味があるため）。
  // 想定時間(min)も一緒に載せて、タイマーで選んだ時にその時間で始められるようにする
  useEffect(()=>{
    try {
      const remaining = actionItems.filter(item=>!isDone(item))
        .map(t=>({text:t, min:(estOf(t)||null), id:(idOfTitle(t)||null)}));
      localStorage.setItem("jiroku_today_actions_shared", JSON.stringify({date:todayKey, items:remaining}));
    } catch(e){}
  },[actionItems, checked, todayKey, taskEstimates]);

  const toggleCheck = (key) => {
    const idk = idOfTitle(key) || key;
    const cur = (checked[idk] !== undefined) ? checked[idk] : checked[key];
    const next = {...checked, [idk]: !cur};
    if (idk !== key) delete next[key];   // 旧形式（名前キー）の掃除
    setChecked(next);
    localStorage.setItem("today_actions", JSON.stringify(next));
    gasPostJson("saveTodayActions", {checked: JSON.stringify(next), noBridge: "1"}); // 他端末にも同期
    enqueueTaskMutation("UPDATE", idk, { status: !cur ? "DONE" : "TODO" },
                        { status: cur ? "DONE" : (taskStatus[idk]==="doing" ? "IN_PROGRESS" : "TODO") });
  };

  // ── タスクボード用ヘルパー ──
  // 状態: "todo"=予定 / "doing"=実行中 / "done"=完了。未設定はchecked（完了フラグ）から導出
  const statusOf = (task) => {
    const k = idOfTitle(task);
    return (k && taskStatus[k]) || taskStatus[task] || (isDone(task) ? "done" : "todo");
  };
  const setStatus = (task, status) => {
    const sKey = idOfTitle(task) || task;
    const next = {...taskStatus, [sKey]: status};
    if (sKey !== task) delete next[task];
    setTaskStatus(next);
    try { localStorage.setItem("jiroku_task_status_"+todayKey, JSON.stringify(next)); } catch(e){}
    // 完了状態は既存のchecked(today_actions)とも同期し、レポート・完了フォルダ等の互換を保つ
    const nc = {...checked};
    if(status==="done") nc[task]=true; else delete nc[task];
    setChecked(nc);
    localStorage.setItem("today_actions", JSON.stringify(nc));
    gasPostJson("saveTodayActions", {checked: JSON.stringify(nc), noBridge: "1"});
    pushTaskMeta({ stt: next });
    // Tasksシートへ直接（キュー経由でまとめ送り）
    const stMap = { done: "DONE", doing: "IN_PROGRESS", todo: "TODO" };
    enqueueTaskMutation("UPDATE", sKey, { status: stMap[status] || "TODO" },
                        { status: stMap[statusOf(task)] || "TODO" });
  };
  // カードをタップ→タイマー画面へ。想定時間つきならその時間で、タイマー側が自動選択する。
  // タイマーに送ったタスクは「実行中」に進める（着手の可視化）
  const goToTimerWith = (task) => {
    try { localStorage.setItem("jiroku_timer_pending_task", JSON.stringify({text:task, min:(estOf(task)||null), id:(idOfTitle(task)||null), date:todayKey})); } catch(e){}
    if(statusOf(task)==="todo") setStatus(task, "doing");
    onGoTimer && onGoTimer();
  };
  // タスクのメモを保存（詳細画面）
  const setTaskNote = (task, note) => {
    const nKey = idOfTitle(task) || task;
    // ★打ち始める前の値を控える★ 送信は1.2秒後なので、そのときの値を
    //   base に使うと「自分が今打った内容」と比べることになり検出できない
    if (window.__memoBase === undefined || window.__memoBaseKey !== nKey) {
      window.__memoBaseKey = nKey;
      window.__memoBase = taskNotes[nKey] || taskNotes[task] || "";
    }
    const next = {...taskNotes, [nKey]: note};
    if (nKey !== task) delete next[task];
    setTaskNotes(next);
    try { localStorage.setItem("jiroku_task_memo_"+todayKey, JSON.stringify(next)); } catch(e){}
    // メモは打つたびに送ると通信が多すぎるので、少し待ってからまとめて送る
    clearTimeout(window.__jirokuMemoTimer);
    window.__jirokuMemoTimer = setTimeout(()=>{
      pushTaskMeta({ memo: next });
      enqueueTaskMutation("UPDATE", nKey, { memo: String(note || "") },
                          { memo: window.__memoBase || "" });
      window.__memoBase = undefined; window.__memoBaseKey = undefined;
    }, 1200);
  };
  // タスクの想定時間を更新（詳細画面）
  const setTaskTime = (task, min) => {
    const m = Math.round(Number(min));
    const key = idOfTitle(task) || task;
    const next = {...taskEstimates};
    if(m>0 && m<=600) next[key]=m; else delete next[key];
    delete next[task];   // 旧形式（名前キー）の掃除
    setTaskEstimates(next);
    try { localStorage.setItem("jiroku_task_estimates_"+todayKey, JSON.stringify(next)); } catch(e){}
    pushTaskMeta({ est: next });
    enqueueTaskMutation("UPDATE", key, { estimated_minutes: (m>0 && m<=600) ? m : "" },
                        { estimated_minutes: (taskEstimates[key] !== undefined ? taskEstimates[key] : "") });
  };
  // ★手動並び替え★ 自動順位（priority_rank）とは別に、本人の並びを持つ。
  //   期限超過だけは、下へ動かしても一覧の先頭に出す（サーバー側で保証）。
  const moveTask = (task, dir) => {
    const list = incompleteItems.slice();
    const i = list.indexOf(task);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return;
    list.splice(j, 0, list.splice(i, 1)[0]);
    // 並べ替え後の位置を10刻みで振り直す（間に挿し込めるように）
    const next = {...taskOrder};
    list.forEach((t, k) => { const id = idOfTitle(t); if (id) next[id] = (k + 1) * 10; });
    setTaskOrder(next);
    try { localStorage.setItem("jiroku_task_order_"+todayKey, JSON.stringify(next)); } catch(e){}
    list.forEach(t => {
      const id = idOfTitle(t);
      if (!id) return;
      const before = taskOrder[id];
      if (before === next[id]) return;
      // 並び替えは中身ではないので、確認を求めず後勝ちにする（base_valuesを送らない）
      enqueueTaskMutation("UPDATE", id, { sort_order: next[id] });
    });
  };

  // タスクの文脈（仕事/プライベート等）。初期値はUNSET。タイトルから推測しない
  const setTaskCtx = (task, v) => {
    const key = idOfTitle(task) || task;
    const next = {...taskContext};
    if (v && v !== "UNSET") next[key] = v; else delete next[key];
    setTaskContextMap(next);
    try { localStorage.setItem("jiroku_task_context_"+todayKey, JSON.stringify(next)); } catch(e){}
    enqueueTaskMutation("UPDATE", key, { context: v || "UNSET" },
                        { context: taskContext[key] || taskContext[task] || "UNSET" });
  };
  // 持ち越し: 同じtask_idのまま日付を移す（複製しない）。一覧からは外す
  const carryOverLocal = (task, toDate) => {
    const id = idOfTitle(task);
    if (!id) return;
    enqueueTaskMutation("CARRY_OVER", id, { to_date: toDate });
    // 今日の一覧から外す（Tasksシート側は日付が変わるだけで消えない）
    const list = actionItems.filter(x=>x!==task);
    if(list.length===0){ setCustomActions(null); localStorage.removeItem("jiroku_custom_actions_"+todayKey); }
    else { const st=toStored(list); setCustomActions(st); localStorage.setItem("jiroku_custom_actions_"+todayKey, JSON.stringify(st)); }
    gasPostJson("saveTodayActions", {actions: list.length===0?"":JSON.stringify(toStored(list)), noBridge: "1"});
    setCarryPick(null); setDetailTask(null);
  };
  // タスクを削除（詳細画面）。関連する状態・時間・メモ・チェックも掃除する
  const deleteTask = (task) => {
    // ★Tasksシートにも「消えた」と伝える★（キュー経由。残ると復活する）
    const delId = idOfTitle(task);
    if (delId) enqueueTaskMutation("DELETE", delId, {});
    const list = actionItems.filter(t=>t!==task);
    if(list.length===0){ setCustomActions(null); localStorage.removeItem("jiroku_custom_actions_"+todayKey); }
    else { const st=toStored(list); setCustomActions(st); localStorage.setItem("jiroku_custom_actions_"+todayKey, JSON.stringify(st)); }
    const eKey=idOfTitle(task); const est={...taskEstimates}; delete est[eKey]; delete est[task];
    setTaskEstimates(est); localStorage.setItem("jiroku_task_estimates_"+todayKey, JSON.stringify(est));
    const impKey=idOfTitle(task); const imp={...taskImportance}; delete imp[impKey]; delete imp[task];
    setTaskImportance(imp); localStorage.setItem("jiroku_task_importance_"+todayKey, JSON.stringify(imp));
    const duKey=idOfTitle(task); const du={...taskDue}; delete du[duKey]; delete du[task];
    setTaskDue(du); localStorage.setItem("jiroku_task_due_"+todayKey, JSON.stringify(du));
    const k2=idOfTitle(task);
    const stt={...taskStatus}; delete stt[k2]; delete stt[task]; setTaskStatus(stt); localStorage.setItem("jiroku_task_status_"+todayKey, JSON.stringify(stt));
    const nt={...taskNotes}; delete nt[k2]; delete nt[task]; setTaskNotes(nt); localStorage.setItem("jiroku_task_memo_"+todayKey, JSON.stringify(nt));
    const cKey=idOfTitle(task); const nc={...checked}; delete nc[cKey]; delete nc[task];
    setChecked(nc); localStorage.setItem("today_actions", JSON.stringify(nc));
    // ★toStoredを通す★ タイトルだけの配列で保存すると、Journal.actionsが
    //   id無しの旧形式へ退化する（実際にdry-runで退化が見つかった）
    gasPostJson("saveTodayActions", {actions: list.length===0?"":JSON.stringify(toStored(list)), checked: JSON.stringify(nc), noBridge: "1"});
    setDetailTask(null);
  };

  // 現在のタスク(文字列配列)＋想定時間マップから、編集用の {text,min} 配列を作る
  // 重要度・期限の設定。既存の setTaskTime と同じ形にそろえる
  const setTaskImp = (task, v) => {
    // ★id をキーに書く★ 名前で書くと改名で外れる
    const key = idOfTitle(task) || task;
    const next = {...taskImportance};
    if (v) next[key] = v; else delete next[key];
    delete next[task];   // 旧形式（名前キー）が残っていたら掃除する
    setTaskImportance(next);
    localStorage.setItem("jiroku_task_importance_"+todayKey, JSON.stringify(next));
    pushTaskMeta({ imp: next });
    enqueueTaskMutation("UPDATE", key, { importance_level: v || "" },
                        { importance_level: taskImportance[key] || taskImportance[task] || "" });
  };
  // ★サーバー（Tasksシート）を正として画面へ反映する★
  //   これまで「端末の値を優先」で取り込んでいたため、端末間で
  //   食い違いが残り続けた。今後はTasksシートが正。
  //   ただし、この端末で既に操作を始めていたら適用しない。
  //   読み込みが遅れて届いたとき、いま入力した内容を消してしまうため。
  const applyTasksFromServer = async (preloaded, genAtFetch) => {
    // ★守る範囲を絞る★（以前は「何か操作したら以後すべて適用しない」だった）
    //   ・編集モーダルや詳細を開いている間 → 適用しない（入力中の値を消さないため）
    //   ・送信待ち／競合のタスク → そのタスクだけ適用しない
    //   ・それ以外 → サーバーの値へ更新する（古い端末が永久に残らないように）
    if (editMode || detailTask) return;
    // getHomeData に相乗りしてきた分があれば、もう一度取りに行かない（2026-08-05 起動高速化）
    // ★古い一覧は当てない★（2026-08-18 Kai報告「話して足したタスクが後から消えた」）
    //   ホームの取得は実測で8秒かかる。その最中に話してタスクを足すと、
    //   返ってくるのは「まだ無かった頃」の一覧になる。
    //   それを画面にすると、足したばかりのタスクがそのまま消えていた。
    //   取得を始めてから足していたら、この結果は捨てて取り直す。
    if (Array.isArray(preloaded) && genAtFetch !== undefined && genAtFetch !== taskGen()) {
      return applyTasksFromServer();   // 新しく取り直す
    }
    const genStart = taskGen();
    const r = Array.isArray(preloaded) ? { ok: true, data: preloaded }
                                       : await gasApi("getTasks", { includeDone: "1" });
    if (!r || !r.ok || !Array.isArray(r.data)) return;
    if (!Array.isArray(preloaded) && genStart !== taskGen()) return;   // 待っている間に足された
    setTasksLoaded(true);        // 応答が返った＝読み込みは終わっている（0件でも同じ）
    if (editMode || detailTask) return;   // 通信中に開いたら適用しない
    const hold = {};   // 送信待ち・競合中のタスクは端末の値を保つ
    const deleting = {}; // ★削除の送信待ち★ サーバーにはまだ残っているので、ここで外す
    loadTaskQueue().forEach(m => { hold[m.task_id] = 1; if (m.op === "DELETE") deleting[m.task_id] = 1; });
    // 今日の分だけ。ARCHIVED は画面に出さない。
    // ★消したタスクが戻ってこないように★ 削除がまだ届いていない間も一覧から外す
    //   （以前はサーバーの一覧をそのまま反映していたため、消しても復活していた）
    const rows = r.data.filter(t => String(t.date).slice(0,10) === todayKey && t.status !== "ARCHIVED"
                                    && !deleting[t.task_id]);
    if (!rows.length && !(customActions||[]).length) return;
    // サーバーの進捗語彙（大文字）を画面の語彙（小文字）へ
    const sttOf = s => s === "DONE" ? "done" : s === "IN_PROGRESS" ? "doing" : "todo";
    // 並び順はこの端末の今の並びを保つ（勝手に入れ替わると探せなくなる）。
    // この端末に無いタスクは後ろへ足す
    const curIds = (customActions || []).map(t => t.id);
    rows.sort((a, b) => {
      const ia = curIds.indexOf(a.task_id), ib = curIds.indexOf(b.task_id);
      return (ia === -1 ? 1e9 : ia) - (ib === -1 ? 1e9 : ib);
    });
    // 版を控える（次の更新で base_version として送る）
    rows.forEach(t => setTaskVersion(t.task_id, t.version));
    // 送信待ちのタスクは端末の姿を保つ（サーバーにまだ届いていない変更を消さない）
    const heldLocal = (customActions||[]).filter(t => hold[t.id] && !rows.some(x => x.task_id === t.id));
    // ★出来たてのタスクは、サーバーの一覧に無くても消さない★
    //   送信が落ちた・取りこぼした・古い一覧が返ってきた、のどれであっても
    //   黙って消えるのが一番困る。10分だけ猶予を持たせ、作り直しを送る。
    const births = loadTaskBirths();
    const NEWBORN_MS = 10 * 60 * 1000;
    const newborn = (customActions||[]).filter(t =>
      !hold[t.id] && !deleting[t.id] && !rows.some(x => x.task_id === t.id) &&
      births[t.id] && (Date.now() - Number(births[t.id])) < NEWBORN_MS);
    newborn.forEach(t => {
      console.warn("[JIROKU] サーバーに届いていないタスクを送り直します:", t.title);
      enqueueTaskMutation("CREATE", t.id, {
        title: t.title, date: todayKey,
        importance_level: taskImportance[t.id] || "", due_at: taskDue[t.id] || "",
        estimated_minutes: taskEstimates[t.id] !== undefined ? taskEstimates[t.id] : "",
        memo: taskNotes[t.id] || "" });
    });
    const keepLocal = heldLocal.concat(newborn.filter(t => !heldLocal.some(x => x.id === t.id)));
    const list = rows.map(t => ({ id: t.task_id, title: t.title })).concat(
      keepLocal.map(t => ({ id: t.id, title: t.title })));
    const imp = {}, due = {}, est = {}, memo = {}, stt = {}, chk = {}, ctx = {}, cry = {}, why = {}, ord = {};
    rows.forEach(t => {
      if (t.priority_label) why[t.task_id] = t.manual_order ? "自分で上に置いた" : t.priority_label;
      if (t.sort_order !== null && t.sort_order !== undefined) ord[t.task_id] = Number(t.sort_order);
      if (t.context && t.context !== "UNSET") ctx[t.task_id] = t.context;
      cry[t.task_id] = Number(t.carryover_count || 0);
      if (hold[t.task_id]) {   // 端末の値を優先
        // ★仕分けが元に戻る不具合★
        //   送信待ちのあいだはサーバーがまだ UNSET のため、
        //   サーバーの値で上書きすると、いま選んだ分類が消えていた
        const lc = taskContext[t.task_id];
        if (lc) ctx[t.task_id] = lc; else delete ctx[t.task_id];
        if (taskImportance[t.task_id]) imp[t.task_id] = taskImportance[t.task_id];
        if (taskDue[t.task_id]) due[t.task_id] = taskDue[t.task_id];
        if (taskEstimates[t.task_id] !== undefined) est[t.task_id] = taskEstimates[t.task_id];
        if (taskNotes[t.task_id]) memo[t.task_id] = taskNotes[t.task_id];
        if (taskStatus[t.task_id]) stt[t.task_id] = taskStatus[t.task_id];
        if (isDone(t.title)) chk[t.task_id] = true;
        return;
      }
      // ★サーバーが空のときは、端末の値を消さない★
      //   「かかる時間を入れたのに、あとで消えている」不具合（2026-08-03 Kai報告）。
      //   サーバーにまだ届いていない・保存されていない項目まで空で上書きしていた。
      //   値があるときだけサーバーを採用し、無ければこの端末の値を残す。
      if (t.importance_level && !t.importance_is_suggestion) imp[t.task_id] = t.importance_level;
      else if (taskImportance[t.task_id]) imp[t.task_id] = taskImportance[t.task_id];
      if (t.due_at) due[t.task_id] = t.due_at;
      else if (taskDue[t.task_id]) due[t.task_id] = taskDue[t.task_id];
      if (Number(t.estimated_minutes) > 0) est[t.task_id] = Number(t.estimated_minutes);
      else if (taskEstimates[t.task_id] !== undefined && Number(taskEstimates[t.task_id]) > 0) {
        est[t.task_id] = Number(taskEstimates[t.task_id]);
        // 端末にしか無い ＝ サーバーへ届いていない。もう一度送る
        enqueueTaskMutation("UPDATE", t.task_id, { estimated_minutes: Number(taskEstimates[t.task_id]) },
                            { estimated_minutes: "" });
      }
      if (t.memo) memo[t.task_id] = String(t.memo);
      else if (taskNotes[t.task_id]) memo[t.task_id] = taskNotes[t.task_id];
      if (!t.context || t.context === "UNSET") { if (taskContext[t.task_id]) ctx[t.task_id] = taskContext[t.task_id]; }
      stt[t.task_id] = sttOf(t.status);
      if (t.status === "DONE") chk[t.task_id] = true;
    });
    keepLocal.forEach(t => {
      if (taskContext[t.id]) ctx[t.id] = taskContext[t.id];
      if (taskImportance[t.id]) imp[t.id] = taskImportance[t.id];
      if (taskDue[t.id]) due[t.id] = taskDue[t.id];
      if (taskEstimates[t.id] !== undefined) est[t.id] = taskEstimates[t.id];
      if (taskNotes[t.id]) memo[t.id] = taskNotes[t.id];
      if (taskStatus[t.id]) stt[t.id] = taskStatus[t.id];
      if (isDone(t.title)) chk[t.id] = true;
    });
    setCustomActions(list); localStorage.setItem("jiroku_custom_actions_"+todayKey, JSON.stringify(list));
    setTaskImportance(imp); localStorage.setItem("jiroku_task_importance_"+todayKey, JSON.stringify(imp));
    setTaskDue(due);        localStorage.setItem("jiroku_task_due_"+todayKey, JSON.stringify(due));
    setTaskEstimates(est);  localStorage.setItem("jiroku_task_estimates_"+todayKey, JSON.stringify(est));
    setTaskNotes(memo);     localStorage.setItem("jiroku_task_memo_"+todayKey, JSON.stringify(memo));
    setTaskStatus(stt);     localStorage.setItem("jiroku_task_status_"+todayKey, JSON.stringify(stt));
    setChecked(chk);        localStorage.setItem("today_actions", JSON.stringify(chk));
    setTaskContextMap(ctx); localStorage.setItem("jiroku_task_context_"+todayKey, JSON.stringify(ctx));
    setTaskCarry(cry);      localStorage.setItem("jiroku_task_carry_"+todayKey, JSON.stringify(cry));
    setTaskWhy(why);
    setTaskOrder(ord);      localStorage.setItem("jiroku_task_order_"+todayKey, JSON.stringify(ord));
  };

  // 送信が済んだら最新を取り直す（他端末の変更もここで届く）
  useEffect(()=>{
    // ★確認待ち（旧: 競合）が残っていても取得は止めない★
    //   確認待ちのタスクは applyTasksFromServer 側が個別に守るので、
    //   他のタスクの同期まで道連れにしない。以前は「キューが空のときだけ
    //   取得」にしていたため、確認待ち3件が居座るとスマホが一切
    //   同期しなくなった（実際に起きた）。
    // ★送信待ちがあっても、いつまでも取得を止めない★（2026-08-05 Kai報告）
    //   送信待ちが1件でもあると取得を丸ごと止めていたため、
    //   送れないものが1つ居座るだけで、その端末だけ永久に古いままになっていた。
    //   送信待ちのタスクは applyTasksFromServer 側が個別に守る（hold）ので、
    //   他のタスクまで巻き添えにする必要はない。
    //   直後の二重取得だけ避けたいので、10秒以内にできた送信待ちがある時だけ見送る。
    const refetch = () => {
      const q = loadTaskQueue();
      const fresh = q.some(x => x.state==="pending" && (Date.now() - Number(x.queued_at||0)) < 10000);
      if (!fresh) applyTasksFromServer();
    };
    const onVis = () => { if (document.visibilityState === "visible") refetch(); };
    window.addEventListener("jiroku:taskflushed", refetch);
    document.addEventListener("visibilitychange", onVis);
    // ★PCは visibilitychange が起きにくい★
    //   ウィンドウを切り替えただけでは発火しないため、PCだけ古いままになる。
    //   focus でも取りに行く。
    window.addEventListener("focus", refetch);
    window.addEventListener("jiroku:remotechange", refetch); // もう一方の端末の変更を数秒で受け取る
    const timer = setInterval(refetch, 60000);   // 印を取りこぼしても1分で追いつく（保険）
    return () => { window.removeEventListener("jiroku:taskflushed", refetch);
                   window.removeEventListener("jiroku:remotechange", refetch);
                   document.removeEventListener("visibilitychange", onVis);
                   window.removeEventListener("focus", refetch);
                   clearInterval(timer); };
  });

  // ★設定を変えたら、その場でサーバーへ送る★
  //   これまでは localStorage に書くだけで、タスクの追加や編集をした
  //   ついでにしか送られていなかった。重要度や期限だけ変えても
  //   他の端末に届かない（実際にそうなった）。
  //   setState は非同期なので、変更後の値を引数で受け取る。
  const pushTaskMeta = (over) => {
    const o = over || {};
    const imp = o.imp || taskImportance, due = o.due || taskDue;
    const est = o.est || taskEstimates, memo = o.memo || taskNotes, stt = o.stt || taskStatus;
    const list = (customActions||[]);
    if (!list.length) return;
    const payload = list.map(t=>{
      const x = { id:t.id, title:t.title };
      const a = imp[t.id]  || imp[t.title];   if (a) x.imp = a;
      const b = due[t.id]  || due[t.title];   if (b) x.due = b;
      const c = est[t.id] !== undefined ? est[t.id] : est[t.title]; if (c > 0) x.est = Number(c);
      const d = memo[t.id] || memo[t.title];  if (d) x.memo = String(d);
      const e = stt[t.id]  || stt[t.title];   if (e) x.stt = String(e);
      return x;
    });
    gasPostJson("saveTodayActions", { actions: JSON.stringify(payload), noBridge: "1" });
  };

  // ★読み出しは必ずここを通す★
  //   「idで引き、無ければ名前で引く」を11箇所に散らすと必ず書き漏らす。
  // ★完了状態も id で引く★
  //   checked は customActions より前に宣言されているので、
  //   初期化の時点では付け替えられない。読むときに両方見て、
  //   別途まとめて付け替える（下の useEffect）。
  const isDone = (task) => {
    const k = idOfTitle(task);
    return !!((k && checked[k] !== undefined) ? checked[k] : checked[task]);
  };
  const dueOf = (task) => taskDue[idOfTitle(task)] || taskDue[task] || "";
  // 想定時間も同じく1本化する。散らすと必ず書き漏らす
  const estOf = (task) => {
    const k = idOfTitle(task);
    const v = (k && taskEstimates[k] !== undefined) ? taskEstimates[k] : taskEstimates[task];
    return (v === undefined || v === null || v === "") ? "" : v;
  };
  const setTaskDueAt = (task, v) => {
    const key = idOfTitle(task) || task;
    const next = {...taskDue};
    if (v) next[key] = v; else delete next[key];
    delete next[task];   // 旧形式（名前キー）の掃除
    setTaskDue(next);
    localStorage.setItem("jiroku_task_due_"+todayKey, JSON.stringify(next));
    pushTaskMeta({ due: next });
    enqueueTaskMutation("UPDATE", key, { due_at: v || "" },
                        { due_at: taskDue[key] || taskDue[task] || "" });
  };
  // ★緊急度と4分類は保存しない★
  // 期限から都度出す。保存すると日付が変わっても古い判定が残る。
  // 判定の中身はサーバー（computeUrgency / classifyTask）と同じ規則。
  const quadrantOf = (task) => {
    const impKey = idOfTitle(task);
    const imp = (impKey && taskImportance[impKey]) || taskImportance[task] || "MEDIUM";
    const due = dueOf(task);
    let urg = "NONE", overdue = false;
    if (due) {
      const p = String(due).substring(0,10).split("-");
      const d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
      const n = new Date(); const t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
      const days = Math.round((d - t0) / 86400000);
      if (days < 0) { urg = "HIGH"; overdue = true; }
      else if (days <= 1) urg = "HIGH";
      else if (days <= 3) urg = "MEDIUM";
      else urg = "LOW";
    }
    const important = imp === "HIGH", urgent = urg === "HIGH";
    const q = important && urgent ? "DO_NOW"
            : important ? "SCHEDULE"
            : urgent ? "DELEGATE_OR_LIMIT" : "DEFER_OR_DELETE";
    return { importance: imp, urgency: urg, overdue: overdue, quadrant: q,
             isSuggestion: !((impKey && taskImportance[impKey]) || taskImportance[task]) };
  };

  // ★重要度と期限も一緒に持ち運ぶ★
  // タスク名がそのまま識別子になっているため、名前を変えると
  // 名前をキーにした情報（想定時間・重要度・期限）が古い名前に取り残される。
  // 想定時間は編集フォームを経由するので生き残っていたが、
  // 重要度と期限はフォームに無いため、改名すると消えていた（実装直後の不具合）。
  // 行に載せて一緒に運ぶ。
  const toEditRows = (arr) => arr.map(t=>({
    text:t,
    min:(estOf(t)!==""?String(estOf(t)):""),
    imp:(taskImportance[idOfTitle(t)]||taskImportance[t]||""),
    due:dueOf(t)
  }));
  // 編集モーダルには「未完了のタスクだけ」を出す。完了済みは編集対象にしない
  // （完了フォルダにそのまま残す）。保存時に完了タスクは保持してマージする
  const openEdit = () => {
    const incomplete = actionItems.filter(t=>!isDone(t));
    setEditItems(incomplete.length===0 ? [{text:"",min:""}] : toEditRows(incomplete));
    setEditMode(true);
  };
  // ★編集画面を開くたびに前回の警告を消す★
  // 残っていると、直したのに怒られ続けているように見える
  useEffect(()=>{ if(editMode) setEditError(""); },[editMode]);
  // ★Tasksシートへの移行（Phase 3）の下見★
  //   いまタスクは Journal の1列にJSONで入っており、Tasksシートは空。
  //   移すと日をまたいだ持ち越しを追えるようになる。
  //   まず「何件どうなるか」だけを出す。実行はしない。
  //   window から呼べるようにしておく（画面には出さない。運用者用）。
  useEffect(()=>{
    window.jirokuTaskMigrationDryRun = async () => {
      const items = (customActions||[]).map(t=>({
        id:t.id, title:t.title,
        imp:taskImportance[t.id]||"", due:taskDue[t.id]||"",
        est:taskEstimates[t.id]||"", memo:taskNotes[t.id]||"", stt:taskStatus[t.id]||""
      }));
      const r = await gasApi("migrateTasksToSheet", { items: JSON.stringify(items), date: todayKey });
      console.log("[JIROKU] タスク移行の下見:", r);
      return r;
    };
  },[customActions, taskImportance, taskDue, taskEstimates, taskNotes, taskStatus, todayKey]);

  // 「＋ タスクを追加」用。未完了タスクに空欄を1つ足した状態で編集モーダルを開き、すぐ入力できる
  const openAddTask = () => {
    setEditItems([...toEditRows(actionItems.filter(t=>!isDone(t))), {text:"",min:""}]);
    setEditMode(true);
  };
  const saveEdit = () => {
    const rows = editItems.map(r=>({text:String(r.text||"").trim(), min:r.min, imp:r.imp, due:r.due})).filter(r=>r.text.length>0);

    // ★同じ名前のタスクを2件作らせない（暫定の防御）★
    //   いまタスクは名前そのものが識別子で、完了・想定時間・重要度・期限は
    //   すべて名前をキーに持っている。同名が2件あると区別できず、
    //   片方を完了にすると両方が完了になる。データが静かに壊れる。
    //   本来は task_id で持つべきで、その変換層は用意した。
    //   画面の差し替えが済むまでは、作らせないことで防ぐ。
    const seen = {}, dup = [];
    rows.forEach(function(r){ if(seen[r.text]) { if(dup.indexOf(r.text)===-1) dup.push(r.text); } seen[r.text]=1; });
    if (dup.length) {
      setEditError("同じ名前のタスクが2つあります：「"+dup[0]+"」\n区別できないので、どちらかの名前を変えてください。");
      return;
    }
    setEditError("");
    const editedTexts = rows.map(r=>r.text);
    // 完了済みタスクは編集画面に出していないので、ここで保持してマージする（未完了→完了の順）
    const completed = actionItems.filter(t=>isDone(t) && !editedTexts.includes(t));
    const finalList = [...editedTexts, ...completed];
    // ★キーはタスクIDにそろえる★（2026-08-05 Kai報告「PCで入れた時間が携帯に出ない」）
    //   ここだけ「タスク名」をキーにしていた。他はすべてIDキーなので食い違う。
    //   さらに、この直後の toStored() は state を読むが、setTaskEstimates は
    //   すぐには反映されないため、送る値が「編集前のまま」になっていた。
    //   その結果、差分なしと判定されてサーバーへ送られず、他の端末に届かなかった。
    //   先にIDを確定させ、そのIDで新しい値を組み立ててから送る。
    const storedList = toStored(finalList);
    const idByTitle = {};
    storedList.forEach(t=>{ if(idByTitle[t.title]===undefined) idByTitle[t.title]=t.id; });

    const est = {}, impMap = {}, dueMap = {};
    rows.forEach(r=>{
      const id = idByTitle[r.text] || r.text;
      const m = Math.round(Number(r.min));
      if(m>0 && m<=600) est[id]=m;
      if(r.imp) impMap[id]=r.imp;
      if(r.due) dueMap[id]=r.due;
    });
    completed.forEach(c=>{ const ck=idOfTitle(c)||c;
      if(taskEstimates[ck]>0) est[ck]=taskEstimates[ck];
      if(taskImportance[ck]) impMap[ck]=taskImportance[ck];
      if(taskDue[ck]) dueMap[ck]=taskDue[ck]; });
    // 送る中身も、いま編集した値で組み直す（state待ちにしない）
    storedList.forEach(t=>{
      t.est = est[t.id]!==undefined ? est[t.id] : "";
      t.imp = impMap[t.id] || "";
      t.due = dueMap[t.id] || "";
    });

    setTaskEstimates(est);
    try { localStorage.setItem("jiroku_task_estimates_"+todayKey, JSON.stringify(est)); }catch(e){}
    setTaskImportance(impMap); setTaskDue(dueMap);
    try {
      localStorage.setItem("jiroku_task_importance_"+todayKey, JSON.stringify(impMap));
      localStorage.setItem("jiroku_task_due_"+todayKey, JSON.stringify(dueMap));
    }catch(e){}
    // 完了タスクのチェック状態は保持する
    const newChecked = {};
    completed.forEach(c=>{ newChecked[idOfTitle(c)||c]=true; });
    setChecked(newChecked);
    localStorage.setItem("today_actions", JSON.stringify(newChecked));
    // 空で保存したらAIアクションに戻す
    // ★編集の差分をTasksシートへ（キュー経由）★
    //   新規=CREATE / 変更があったものだけUPDATE / 消えたものはDELETE。
    //   変更のないタスクまで送ると、versionが無意味に増えて他端末と競合する。
    const prevById = {};
    (customActions||[]).forEach(t=>{ prevById[t.id] = t.title; });
    storedList.forEach(t=>{
      if (prevById[t.id] === undefined) {
        enqueueTaskMutation("CREATE", t.id, {
          title: t.title, date: todayKey,
          importance_level: t.imp || "", due_at: t.due || "",
          estimated_minutes: t.est || "", memo: t.memo || "" });
        return;
      }
      const ch = {};
      if (prevById[t.id] !== t.title) ch.title = t.title;
      const oldImp = taskImportance[t.id] || "", oldDue = taskDue[t.id] || "";
      const oldEst = taskEstimates[t.id] !== undefined ? taskEstimates[t.id] : "";
      if (String(t.imp||"") !== String(oldImp)) ch.importance_level = t.imp || "";
      if (String(t.due||"") !== String(oldDue)) ch.due_at = t.due || "";
      if (String(t.est||"") !== String(oldEst)) ch.estimated_minutes = t.est || "";
      if (Object.keys(ch).length) {
        const bv = {};
        if (ch.title !== undefined) bv.title = prevById[t.id] || "";
        if (ch.importance_level !== undefined) bv.importance_level = oldImp;
        if (ch.due_at !== undefined) bv.due_at = oldDue;
        if (ch.estimated_minutes !== undefined) bv.estimated_minutes = oldEst;
        enqueueTaskMutation("UPDATE", t.id, ch, bv);
      }
    });
    (customActions||[]).forEach(t=>{
      if (!storedList.some(x=>x.id===t.id)) enqueueTaskMutation("DELETE", t.id, {});
    });
    if(finalList.length===0){ setCustomActions(null); localStorage.removeItem("jiroku_custom_actions_"+todayKey); }
    else { setCustomActions(storedList); localStorage.setItem("jiroku_custom_actions_"+todayKey, JSON.stringify(storedList)); }
    // 他端末にも同期
    gasPostJson("saveTodayActions", {actions: finalList.length===0?"":JSON.stringify(storedList), checked: JSON.stringify(newChecked), noBridge: "1"});
    setEditMode(false);
  };

  const isZoom = (s="") => /zoom\.us|meet\.google|teams\.microsoft/i.test(s);

  const today = new Date().toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"});

  const hour = new Date().getHours();
  const greeting = hour < 12 ? "おはようございます" : hour < 18 ? "こんにちは" : "お疲れ様です";
  const checkedCount = actionItems.filter(item=>isDone(item)).length;
  // タスクを「未完了」「完了」で分けて表示する（完了は下に折りたたみ）。
  // 元の並び順を保ったまま、チェック状態でフォルダ分けする
  // contextフィルタ（表示のみ）。UNSETは「すべて」でだけ見える…にすると
  // 未設定のタスクが仕事ビューから消えて事故るので、未設定は常に表示する
  const ctxVisible = (item) => {
    if (ctxFilter === "ALL") return true;
    const k = idOfTitle(item);
    const c = (k && taskContext[k]) || taskContext[item] || "UNSET";
    return c === ctxFilter || c === "UNSET";
  };
  // 手動で並べ替えた分は、その順で表示する（期限超過は必ず先頭）。
  // サーバーの再取得を待たずに、押した直後から反映されるようにする
  const orderKey = (item) => {
    const id = idOfTitle(item);
    const o = (id && taskOrder[id] !== undefined) ? Number(taskOrder[id]) : null;
    return o === null ? Infinity : o;
  };
  const incompleteItems = actionItems.filter(item=>!isDone(item)&&ctxVisible(item)).sort((a,b)=>{
    const oa = quadrantOf(a).overdue, ob = quadrantOf(b).overdue;
    if (oa !== ob) return oa ? -1 : 1;
    return orderKey(a) - orderKey(b);
  });
  const completedItems = actionItems.filter(item=>isDone(item)&&ctxVisible(item));
  const doneCount = actionItems.filter(item=>statusOf(item)==="done").length;

  return html`<div style=${{paddingBottom:52}}>

    ${showInCommunity!==false && html`<${AchievementBanner} onOpenCommunity=${()=>setShowCommunity(true)}/>`}

    <!-- Hero Header -->
    <div style=${{background:"linear-gradient(135deg, var(--hero1) 0%, var(--hero2) 100%)",padding:"36px 20px 28px",position:"relative",overflow:"hidden"}}>
      <!-- 右下: 大きなロゴマーク装飾 -->
      <svg style=${{position:"absolute",bottom:-30,right:-30,opacity:0.07}} width="160" height="160" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg"><circle cx="36" cy="36" r="36" fill="#fff"/><circle cx="36" cy="36" r="25" fill="none" stroke="#fff" stroke-width="4.5"/><path d="M36 11 A25 25 0 1 1 14.5 50" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="36" cy="36" r="15" fill="none" stroke="#fff" stroke-width="2"/><line x1="36" y1="36" x2="36" y2="25" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="36" y1="36" x2="43" y2="41" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="36" cy="36" r="2" fill="#fff"/></svg>
      <!-- 右上: ロゴ -->
      <div style=${{position:"absolute",top:18,right:20,display:"flex",alignItems:"center",gap:6}}>
        <svg width="28" height="28" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg"><circle cx="36" cy="36" r="36" fill="rgba(255,255,255,0.2)"/><circle cx="36" cy="36" r="25" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4.5"/><path d="M36 11 A25 25 0 1 1 14.5 50" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="36" cy="36" r="15" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/><line x1="36" y1="36" x2="36" y2="25" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="36" y1="36" x2="43" y2="41" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="36" cy="36" r="2" fill="#fff"/></svg>
        <span style=${{fontSize:13,fontWeight:800,color:"rgba(255,255,255,0.9)",letterSpacing:"1px"}}>JIROKU</span>
        <!-- 通知の設定へ。押しても何も起きないボタンは置かない -->
        <button onClick=${()=>onGoSettings&&onGoSettings()} aria-label="通知の設定"
          style=${{marginLeft:2,background:"none",border:"none",padding:"2px 0 2px 6px",cursor:"pointer",lineHeight:0}}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
      </div>
      <div style=${{fontSize:13,color:"rgba(255,255,255,0.75)",marginBottom:10}}>${today} · ${greeting}</div>

      <!-- ★見出しまわり★（2026-08-05 Kai指定のデザイン）
           左に階級のキャラクターを大きく、右に名前・階級の札・XPの進み具合。
           階級が上がってもキャラの大きさは変わらないよう、絵の側でそろえてある。 -->
      ${(()=>{
        const rank = game ? getRank(game.level) : null;
        // ★会えた子は、しばらくここに出す★（2026-08-06 Kai要望）
        //   図鑑を開かない人にも「会えた」ことが伝わるように、
        //   3日だけホームのジローくんと入れ替える。絵が無い子は入れ替えない。
        const feat = game && game.jiro && game.jiro.featured;
        // 会えた子のうち、絵がある子だけが切り替えの対象
        // ★ホームで回せるのは直近の5体まで★（2026-08-06 Kai要望）
        //   何十体もあると押して探すのが大変。全部は図鑑で見る。
        // ★図鑑で選んだ子は、古くても必ず入れる★（2026-08-06 Kai要望）
        //   直近5体だけだと、図鑑から選んでもホームに出せない子が出てしまう。
        //   選んだ子を先頭に置き、残りを新しい順に足して5体まで。
        const foundAll = ((game && game.jiro && game.jiro.found) || [])
          .map(id => HIDDEN_JIRO.find(x => x.id === id)).filter(x => x && x.art);
        const owned = (()=>{
          const fnd = (game && game.jiro && game.jiro.found) || [];
          const ids = [];
          if (pickedJiro && pickedJiro !== "rank" && fnd.indexOf(pickedJiro) !== -1) ids.push(pickedJiro);
          fnd.slice().reverse().forEach(id => {
            if (ids.indexOf(id) === -1 && ids.length < 5) ids.push(id);
          });
          return ids.map(id => HIDDEN_JIRO.find(x => x.id === id)).filter(x => x && x.art);
        })();
        // ★今日のジロー★（2026-08-06 Kai「出現頻度のバランスを考えて」）
        //   ホームの主役は階級のジローくん。それが「いまの自分」を表す絵だから。
        //   ただし会えた子が出ないままだと、集める意味がなくなる。
        //   そこで3日に1日だけ、会えた子が順ぐりに遊びに来る日をつくる。
        //   日付から決めるので、同じ日は何度開いても同じ子（端末が変わっても同じ）。
        const dayNo = Math.floor((Date.now() + 9 * 3600000) / 86400000);   // JSTの通し日
        const isGuestDay = foundAll.length > 0 && (dayNo % 3 === 0);
        const guestJ = isGuestDay
          ? foundAll[Math.floor(dayNo / 3) % foundAll.length] : null;
        // ★既定は階級のジローくん★（2026-08-06 Kai指摘「階級キャラが表示されなくなった」）
        //   出現カードで「3日たったら階級のジローくんに戻ります」と約束しているのに、

        //   1. 自分で選んでいれば、それ（"rank" を選べば階級）

        //   4. それ以外は階級のジローくん（ふだんの主役）
        const picked = (pickedJiro && pickedJiro !== "rank")
          ? (owned.find(x => x.id === pickedJiro) || null) : null;
        const featJ = picked
          || ((!pickedJiro && feat) ? (foundAll.find(x => x.id === feat.id) || null) : null)
          || (!pickedJiro ? guestJ : null);
        const showRank = !featJ;
        const artPath = (!showRank && featJ) ? featJ.art : (rank ? (RANK_ART[rank.name] || "") : "");
        const art  = artPath ? (artPath + "?v=" + APP_BUILD) : "";
        // 名前を出す高さ。下いっぱいまで描かれている子だけ、その分だけ下げる。
        //   絵は118pxの枠に上下-14pxで置いてあるので、絵の下端は 118*比率-14。
        //   枠の下(90px)を越えたぶんだけ名前を逃がす。かぶっていない子は11pxのまま。
        const artBottomPx = 118 * (ART_BOTTOM[artPath] || 0.85) - 14;
        const nameBottom = -Math.min(23, Math.max(11, artBottomPx - 90 + 14));
        // タップで次の子へ（階級 → 会えた子 → …と回る）
        const cycle = () => {
          if (!owned.length) return;
          const order = ["rank"].concat(owned.map(x => x.id));
          const cur = order.indexOf(showRank ? "rank" : featJ.id);
          pickHomeJiro(order[(cur + 1) % order.length]);
        };
        const lvLabel = rank
          ? `Lv.${game.level}`
          : "";
        const inLv  = game ? getXpInLevel(game.xp) : 0;
        const forNxt= game ? getXpForNextLevel(game.xp) : 0;
        const pct = forNxt ? Math.max(3, Math.min(100, Math.round(inLv / forNxt * 100))) : 100;
        return html`
        <!-- 名前を下げたぶん、下の列との間をあける（2026-08-06 Kai指摘・下余白はまだ余っている） -->
        <div style=${{display:"flex",alignItems:"center",gap:11,marginBottom:26}}>
          ${art
            /* 隠しジローも背景を抜いてあるので、階級のキャラと同じ置き方にする
               （2026-08-06 Kai指摘。丸枠にすると階級のときと形が変わって落ち着かない）
               会えた子が複数いるときは、押すたびに切り替わる（2026-08-06 Kai要望） */
            ? (owned.length
              ? html`<button onClick=${cycle} aria-label="ジローくんを切り替える"
                  style=${{position:"relative",background:"none",border:"none",padding:0,margin:0,
                           flexShrink:0,cursor:"pointer",lineHeight:0,fontFamily:"inherit"}}>
                  <img src=${art} alt=${showRank?(rank?rank.name:""):featJ.name} width="118" height="118"
                    style=${{width:118,height:118,objectFit:"contain",display:"block",
                             marginTop:-14,marginBottom:-14,marginLeft:-12,marginRight:-6}}/>
                  <!-- ★誰と一緒かは絵のすぐ下に置く★（2026-08-06 Kai指摘「スペースとりすぎ」）
                       独立した帯にすると1段まるごと増える。絵の余白に重ねれば高さは増えない。 -->
                  <!-- 階級のときも名前を出す。押すと切り替わることが分かるように、
                       いま誰が出ているかを必ず1行で示す（2026-08-06 Kai指摘） -->
                  <span style=${{position:"absolute",left:0,right:0,bottom:nameBottom,
                                 fontSize:9,fontWeight:700,lineHeight:1.2,textAlign:"center",
                                 color:"rgba(255,255,255,0.82)",overflow:"hidden",
                                 textOverflow:"ellipsis",whiteSpace:"nowrap",display:"block"}}>
                    ${(!showRank&&featJ) ? featJ.name : (rank ? rank.name : "")}</span>
                </button>`
              : html`<img src=${art} alt=${rank?rank.name:""} width="118" height="118"
                     style=${{width:118,height:118,objectFit:"contain",display:"block",flexShrink:0,
                              marginTop:-14,marginBottom:-14,marginLeft:-12,marginRight:-6}}/>`)
            : html`<div style=${{width:56,height:56,borderRadius:"50%",background:"rgba(255,255,255,0.2)",
                                 display:"flex",alignItems:"center",justifyContent:"center",

          <div style=${{flex:1,minWidth:0}}>

      const num = v => (v===null||v===undefined||v==="") ? null : Number(v);

      //   分からないときは出さない（それらしい数字をでっち上げない）。
      const qProb = (()=>{
        const req = num(p.requiredPerWeek), act = num(p.actualPerWeek);
        if (req===null || act===null || !(req>0)) return null;
        return Math.max(1, Math.min(99, Math.round(act/req*90)));

      // ── 2週間Sprintの進み具合 ──
      const sPct = (sp && sp.progress) ? sp.progress.percent : null;
      // 今のペースのまま今週の残り日数を進めたら、Sprintの達成率はどこまで行くか
      const sForecast = (()=>{

        let addPerDay = 0, daysLeft = 0;
        wg.forEach(w=>{ if(w.actual_per_day>0) addPerDay += Number(w.actual_per_day);
                        daysLeft = Math.max(daysLeft, Number(w.days_left)||0); });
        if (!(daysLeft>0)) daysLeft = Math.max(0, sp.daysLeft||0);
        if (!(daysLeft>0)) return null;
        // ★%で言う★（2026-08-05 Kai指摘）
        //   Sprintの進捗は、単位の違う週間目標（6件・300件・1件…）を
        //   足した数字なので、「1日1834」のように人が読めない値になっていた。
        //   割合なら単位が要らず、どの目標でも同じ意味で読める。
        const remainPct = Math.max(0, 100 - (sp.progress.percent||0));
        const needPctPerDay = Math.max(0.1, Math.round(remainPct/daysLeft*10)/10);
        if (addPerDay>0) {
          const projected = sp.progress.actual + addPerDay*daysLeft;
          return { kind:"pace", days:daysLeft,
                   percent: Math.min(999, Math.round(projected/sp.progress.target*100)),
                   needPctPerDay: needPctPerDay };

        return { kind:"need", days:daysLeft, needPctPerDay: needPctPerDay,

      })();

      const wPct = (()=>{
        const ok = wg.filter(w=>{ const t=Number(w.std_line)>0?Number(w.std_line):Number(w.target_total);
                                  return !isNaN(t)&&t>0; });
        if (!ok.length) return null;
        const sum = ok.reduce((a,w)=>{ const t=Number(w.std_line)>0?Number(w.std_line):Number(w.target_total);
                                       return a + Math.min(1,(Number(w.actual_value)||0)/t); }, 0);
        return Math.round(sum/ok.length*100);
      })();

      // ── 今日できる一歩：いちばん残っている今週の目標から作る ──
      const step = (()=>{
        let best=null, bestRemain=0;
        wg.forEach(w=>{ const t=Number(w.std_line)>0?Number(w.std_line):Number(w.target_total);
          if(isNaN(t)||!(t>0)) return;
          const r = t - (Number(w.actual_value)||0);
          if(r>bestRemain){ bestRemain=r; best=w; } });
        if(!best) return null;
        const u = best.unit || (best.metric_type==="DURATION"?"分":"件");
        const perDay = best.required_per_day>0 ? best.required_per_day : Math.ceil(bestRemain/Math.max(1,best.days_left||1));
        return best.title+"に向けて、まず"+ (Math.round(perDay*10)/10) + u + "のアプローチをしましょう。";

              <span style=${{display:"block"}}>

                <!-- 目盛り。目標を4等分して、いまどのあたりかを読めるようにする -->

                  <div style=${{display:"flex",justifyContent:"space-between",marginTop:-4,marginBottom:6}}>
                    ${[0,0.25,0.5,0.75,1].map((f,k)=>html`
                      <span key=${k} style=${{fontSize:9.5,color:"var(--sub)",fontVariantNumeric:"tabular-nums"}}>
                        ${f===0?"0":fmt(num(p.target)*f)+(p.unit||"")}</span>`)}
                  </div>`}</span>
            </div>
            <div style=${{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8,fontSize:12.5}}>
              <span style=${{minWidth:0}}>
                ${num(p.target)!==null
                  ? html`<b style=${{color:C_Q,fontWeight:800}}>${fmt(p.current)}${p.unit||""}</b><span style=${{color:"var(--sub)"}}> / ${fmt(p.target)}${p.unit||""}</span>`
                  : html`<span style=${{color:"var(--sub)"}}>数値が決まっていません</span>`}
              </span>
              ${num(p.remaining)!==null&&html`
                <span style=${{flexShrink:0,color:"var(--sub)",fontSize:11.5}}>残り ${fmt(p.remaining)}${p.unit||""}</span>`}
            </div>
            ${qProb!==null&&InfoBox({ color:C_Q, onClick:()=>setOpenRow(openRow==="goal"?"":"goal"),
              icon: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>`,
              children: html`このペースなら達成確率は <b style=${{color:C_Q,fontWeight:800}}>${qProb}%</b> です` })}
            ${openRow==="goal"&&html`
              <div style=${{fontSize:12.5,color:"var(--sub)",lineHeight:1.9,marginTop:10}}>
                ${goals.length>1&&html`<div style=${{marginBottom:7}}>
                  3か月目標が${goals.length}件あります。
                  <b style=${{color:"var(--text)"}}>1本に絞るほど進みます</b>（上の点で切り替えられます）
                </div>`}
                ${num(p.target)!==null&&html`
                  ${p.remainingDays!==undefined&&html`あと <b style=${{color:"var(--text)"}}>${p.remainingDays}日</b>　`}
                  ${num(p.requiredPerWeek)!==null&&html`必要 <b style=${{color:"var(--text)"}}>${fmt(p.requiredPerWeek)}${p.unit||""}/週</b>　`}
                  ${num(p.actualPerWeek)!==null&&html`実績 <b style=${{color:"var(--text)"}}>${fmt(p.actualPerWeek)}${p.unit||""}/週</b>`}
                  ${num(p.forecast)!==null&&html`<br/>このままなら <b style=${{color:"var(--text)"}}>${fmt(p.forecast)}${p.unit||""}</b> で着地`}
                  ${p.forecastWarning&&html`<br/><span style=${{color:"var(--amber,#BA7517)"}}>⚠ ${p.forecastWarning}</span>`}`}
                ${g.success_condition&&html`<br/><b style=${{color:"var(--text)"}}>できたと言える状態</b>：${g.success_condition}`}
                ${curValDraft!==null ? html`
                  <div style=${{display:"flex",gap:8,alignItems:"center",marginTop:10,flexWrap:"wrap"}}>
                    <input class="inp" type="number" inputmode="decimal" value=${curValDraft}
                      onInput=${e=>setCurValDraft(e.target.value)} style=${{margin:0,width:120,textAlign:"right"}}/>
                    <span style=${{fontSize:12,color:"var(--sub)"}}>／ ${fmt(p.target)}${p.unit||""}</span>
                    <button disabled=${curValSaving} onClick=${async()=>{
                        setCurValSaving(true);
                        const body = {...g};
                        delete body.pace; delete body.paceLabel; delete body.weeklyGoals;
                        delete body.current_value_source; delete body.evidence;
                        body.current_value = curValDraft;
                        const r = await gasPostJson("saveGoal", body);
                        setCurValSaving(false);
                        if(r&&r.ok){ setCurValDraft(null); onToast&&onToast("いまの数字を更新しました"); onGoalSaved&&onGoalSaved(); }
                        else onToast&&onToast((r&&r.error)||"更新できませんでした");
                      }}
                      style=${{padding:"8px 16px",borderRadius:8,border:"none",background:C_Q,color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                      ${curValSaving?"保存中…":"保存"}</button>
                    <button onClick=${()=>setCurValDraft(null)}
                      style=${{background:"none",border:"none",color:"var(--sub)",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>やめる</button>
                  </div>` : ""}
                <div style=${{display:"flex",gap:8,marginTop:9,flexWrap:"wrap"}}>
                  ${curValDraft===null&&num(p.target)!==null&&html`
                    <button onClick=${()=>setCurValDraft(num(p.current)===null?"":String(num(p.current)))}
                      style=${{padding:"7px 14px",borderRadius:8,border:`1px solid ${C_Q}`,background:`color-mix(in srgb, ${C_Q} 14%, transparent)`,color:C_Q,fontSize:11.5,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                      いまの数字を更新</button>`}
                  <button onClick=${()=>setHomeGoalSheet(true)}
                    style=${{padding:"7px 14px",borderRadius:8,border:"1px solid var(--border)",background:"none",color:"var(--accent)",fontSize:11.5,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                    目標・数字・期限を変更</button>
                  <button onClick=${()=>setDeepenGoal(g)}
                    style=${{padding:"7px 14px",borderRadius:8,border:"1px solid var(--border)",background:"none",color:"var(--accent)",fontSize:11.5,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                    ${g.success_condition?"5つの質問を見直す":"5つの質問で深掘りする"}</button>
                </div>
              </div>`}
          ` : html`
            ${Pill({color:C_Q, text:"3か月目標"})}
            <button onClick=${()=>setHomeGoalSheet(true)}
              style=${{display:"block",background:"none",border:"none",padding:0,textAlign:"left",cursor:"pointer",fontFamily:"inherit",
                       fontSize:15,fontWeight:700,color:C_Q,lineHeight:1.5}}>＋ 3か月後どうなりたいかを決める</button>` })}

        <!-- ── 2週間Sprint ── -->
        ${Node({ color:C_S, last:false,
          icon: html`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`,
          children: sp ? html`
            <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:2}}>
              <span style=${{flex:1,minWidth:0}}>${Pill({color:C_S, text:"2週間Sprint"})}</span>
              <button onClick=${()=>setSprintEntry(sp)}
                style=${{flexShrink:0,display:"flex",alignItems:"center",gap:2,padding:"3px 7px",borderRadius:7,
                         border:`1px solid ${C_S}`,background:"transparent",color:C_S,
                         fontSize:9.5,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
                <span style=${{fontSize:10.5,lineHeight:1}}>＋</span> 追加する</button>
            </div>
            <div style=${{display:"flex",alignItems:"flex-end",gap:10,marginTop:7,marginBottom:3}}>
              <button onClick=${()=>setOpenRow(openRow==="sprint"?"":"sprint")}
                style=${{flex:1,minWidth:0,background:"none",border:"none",padding:0,textAlign:"left",cursor:"pointer",fontFamily:"inherit"}}>
                <span style=${{display:"block",fontSize:14,fontWeight:800,color:"var(--text)",lineHeight:1.45}}>${sp.name}</span>
              </button>
              ${sPct!==null&&html`
                <span style=${{flexShrink:0,display:"flex",alignItems:"baseline",gap:1,color:C_S}}>
                  <span style=${{fontSize:26,fontWeight:800,lineHeight:1,fontVariantNumeric:"tabular-nums"}}>${sPct}</span>
                  <span style=${{fontSize:13,fontWeight:700}}>%</span></span>`}
            </div>
            ${Bar({color:C_S, percent: sPct!==null ? sPct
                    : (sp.totalDays>0 ? Math.round(sp.dayIndex/sp.totalDays*100) : 0)})}
            <div style=${{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8,fontSize:12.5}}>
              <span><b style=${{color:C_S,fontWeight:800}}>${sp.dayIndex}日目</b><span style=${{color:"var(--sub)"}}> / ${sp.totalDays}日</span></span>
              <span style=${{color:"var(--sub)",fontSize:11.5}}>残り ${Math.max(0,sp.daysLeft)}日</span>
            </div>
            ${sForecast
              ? InfoBox({ color:C_S, onClick:()=>setOpenRow(openRow==="sprint"?"":"sprint"),
                  icon: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
                  // ★1行に収める★（2026-08-05 Kai指摘）2行になると読みにくい
                  children: (sForecast.kind==="pace" && sForecast.percent>=100)
                    // 残り日数はすぐ上に出ているので繰り返さない（1行に収めるため）
                    ? html`このペースならやり切れます`
                    : html`1日 <b style=${{color:C_S,fontWeight:800}}>${sForecast.needPctPerDay}%</b> ずつでやり切れます` })
              : (sPct===null ? InfoBox({ color:C_S, onClick:()=>setWgSheet(true),
                  icon: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>`,
                  children: html`今週の目標を数字で決めると、ここに進み具合が出ます` }) : "")}
            ${openRow==="sprint"&&html`
              <div style=${{fontSize:12.5,color:"var(--sub)",lineHeight:1.9,marginTop:10}}>
                ${sp.progress&&html`今週の目標${sp.progress.goal_count}件の積み上げ（${sp.progress.weeks}週ぶん・${sp.progress.actual}/${sp.progress.target}）<br/>`}
                ${sp.action_metric&&html`自分でやる：<b style=${{color:"var(--text)"}}>${sp.action_metric}</b><br/>`}
                ${sp.target_state&&html`2週間後：${sp.target_state}<br/>`}
                ${sp.bottleneck&&html`詰まり：${sp.bottleneck}<br/>`}
                ${sp.if_then&&html`もし〜なら：${sp.if_then}<br/>`}
                ${curSp.length>1&&html`<span style=${{color:"var(--amber,#BA7517)"}}>⚠ 進行中が${curSp.length}本あります。1本に絞るほど進みます</span><br/>`}
                <button onClick=${()=>setSprintSheet(sp)}
                  style=${{marginTop:6,padding:"7px 14px",borderRadius:8,border:"1px solid var(--border)",background:"none",color:"var(--accent)",fontSize:11.5,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>編集</button>
              </div>`}
          ` : html`
            ${Pill({color:C_S, text:"2週間Sprint"})}
            <button onClick=${()=>{ if(goals.length) setSprintSheet({}); }}
              style=${{display:"block",background:"none",border:"none",padding:0,textAlign:"left",cursor:"pointer",fontFamily:"inherit",
                       fontSize:15,fontWeight:700,color:goals.length?C_S:"var(--sub)",lineHeight:1.5}}>
              ${goals.length?"＋ 2週間でやることを決める":"先に3か月目標を決めてください"}</button>` })}

        <!-- ── 今週の目標 ── -->
        ${Node({ color:C_W, last:false,
          icon: html`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 21V4"/><path d="M6 4h11l-2.2 4L17 12H6"/></svg>`,
          children: html`
            ${Pill({color:C_W, text:"今週の目標"})}
            ${wg.length ? html`
              <div>
                ${wg.map((w,k)=>{
                  const t = Number(w.std_line)>0?Number(w.std_line):Number(w.target_total);
                  const u = w.unit || (w.metric_type==="DURATION"?"分":"件");
                  const a = Number(w.actual_value)||0;
                  const pct = (!isNaN(t)&&t>0) ? Math.min(100, a/t*100) : 0;
                  // 行ごとにアイコンを変えて、見分けがつくようにする
                  const ICONS = [
                    html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg>`,
                    html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5l3 .6 1 3.4-2 1.6a12 12 0 006.4 6.4l1.6-2 3.4 1 .6 3A2 2 0 0118.4 20 15.5 15.5 0 014 5.6a2 2 0 012.5-2.1z"/></svg>`,
                    html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="12" r="1.1" fill="currentColor"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/><circle cx="15.5" cy="12" r="1.1" fill="currentColor"/></svg>`,
                  ];
                  const step = (w.metric_type==="DURATION")?30:1;
                  // ★ボタンの中にボタンを置かない★（2026-08-05 Kai報告）
                  //   ＋を押したのに「今週やること」を決める画面へ飛んでいた。
                  //   行そのものをボタンにしていたため、＋の押下が行のボタンにも
                  //   伝わっていた。行を入れ物にして、中に別々のボタンを並べる。
                  return html`
                  <div key=${k}
                    style=${{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"11px 2px"}}>
                    <!-- ★バーはタイトルの下に敷く★（2026-08-05）
                         1行に アイコン・名前・バー・数字・＋ を並べると、
                         375pxの画面では名前が必ず切れる。名前を優先する。 -->
                    <button onClick=${()=>setWgSheet(w)}
                      style=${{flex:1,minWidth:0,display:"flex",alignItems:"center",gap:10,
                               background:"none",border:"none",padding:0,cursor:"pointer",
                               fontFamily:"inherit",textAlign:"left"}}>
                      <span style=${{flexShrink:0,color:C_W,display:"flex"}}>${ICONS[k%3]}</span>
                      <span style=${{flex:1,minWidth:0}}>
                        <span style=${{display:"flex",alignItems:"baseline",gap:8}}>
                          <span style=${{flex:1,minWidth:0,fontSize:12.5,fontWeight:600,color:"var(--text)",
                                         overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${w.title}</span>
                          <span style=${{flexShrink:0,fontSize:12,whiteSpace:"nowrap"}}>
                            <b style=${{color:C_W,fontWeight:800}}>${a}</b><span style=${{color:"var(--sub)"}}> / ${isNaN(t)?"—":t}${u}</span></span>
                        </span>
                        <span style=${{display:"block",height:4,marginTop:7,background:"var(--border)",borderRadius:99,overflow:"hidden"}}>
                          <span style=${{display:"block",height:"100%",width:pct+"%",background:C_W,borderRadius:99}}/>
                        </span>
                      </span>
                    </button>
                    <!-- ★数で数える目標だけ「＋」を出す★（2026-08-05）
                         「できた/できていない」で見る目標や、「何日やったか」で
                         数える目標に数を足すと、二重に数えてしまう。
                         数え方が合わないものには＋を出さず、押し間違いを防ぐ。 -->
                    ${(w.metric_type==="COUNT"||w.metric_type==="DURATION"||!w.metric_type)
                      ? html`<button title="実績を入れる（長押しで履歴）" onClick=${()=>setWeeklyEntry(w)}
                          onContextMenu=${e=>{e.preventDefault(); setHistoryWeekly(w);}}
                          onTouchStart=${e=>{ const t=setTimeout(()=>setHistoryWeekly(w),550);
                                              const cl=()=>{clearTimeout(t); e.target.removeEventListener("touchend",cl); e.target.removeEventListener("touchmove",cl);};
                                              e.target.addEventListener("touchend",cl); e.target.addEventListener("touchmove",cl); }}
                          style=${{flexShrink:0,width:26,height:26,padding:0,border:"none",background:"none",
                                   color:C_W,display:"flex",alignItems:"center",justifyContent:"center",
                                   fontSize:19,fontWeight:600,cursor:"pointer",lineHeight:1,fontFamily:"inherit"}}>＋</button>`
                      : html`<span title=${w.metric_type==="DAYS"?"記録した日数で自動的に数えます":"「できた」に変えると達成になります"}
                          style=${{flexShrink:0,width:26,height:26,display:"flex",alignItems:"center",
                                   justifyContent:"center",color:"var(--sub)",fontSize:13}}>自動</span>`}
                  </div>`;
                })}
              </div>
              ${wPct!==null&&InfoBox({ color:C_W, onClick:()=>setOpenRow(openRow==="week"?"":"week"),
                icon: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>`,
                children: html`<span style=${{display:"flex",alignItems:"center",gap:10}}>
                  <span style=${{flexShrink:0,fontSize:12,fontWeight:700,color:"var(--text)"}}>今週の達成率</span>
                  <!-- 真ん中が空いて枠だけ大きく見えていたので、バーで埋めて高さを他の枠にそろえた（2026-08-05 Kai要望） -->
                  <span style=${{flex:1,minWidth:20,height:6,borderRadius:99,background:"var(--border)",
                                 display:"block",overflow:"hidden"}}>
                    <span style=${{display:"block",height:"100%",borderRadius:99,background:C_W,
                                   width:Math.max(0,Math.min(100,wPct))+"%"}}/></span>
                  <span style=${{flexShrink:0,color:C_W,fontWeight:800,fontSize:17,lineHeight:1,fontVariantNumeric:"tabular-nums"}}>
                    ${wPct}<span style=${{fontSize:11}}>%</span></span></span>` })}
              ${openRow==="week"&&html`
                <div style=${{fontSize:12,color:"var(--sub)",lineHeight:1.9,marginTop:9}}>
                  ${wg.map((w,k)=>{ const u=w.unit||(w.metric_type==="DURATION"?"分":"件");
                    return html`<div key=${k}>
                      <b style=${{color:"var(--text)"}}>${w.title}</b>：
                      ${!w.has_records ? "まだ今週の記録がありません（0ではなく、未記録という意味です）"
                        : html`残り ${w.days_left}日${w.required_per_day>0?` ・必要 ${w.required_per_day}${u}/日`:""}${w.actual_per_day!==null?` ・実績 ${w.actual_per_day}${u}/日`:""}`}
                      ${w.pending_unconfirmed>0&&html`<br/><span style=${{color:"var(--amber,#BA7517)"}}>数えていない候補が ${w.pending_unconfirmed}${u} あります（記録に数量・実測が入っていないため）</span>`}
                    </div>`; })}
                  <button onClick=${()=>setWgSheet(true)}
                    style=${{marginTop:6,padding:"7px 14px",borderRadius:8,border:"1px solid var(--border)",background:"none",color:"var(--accent)",fontSize:11.5,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>＋ 追加</button>
                </div>`}
            ` : html`
              <button onClick=${()=>{ if(curSp.length) setWgSheet(true); }}
                style=${{display:"block",background:"none",border:"none",padding:0,textAlign:"left",cursor:"pointer",fontFamily:"inherit",
                         fontSize:15,fontWeight:700,color:curSp.length?C_W:"var(--sub)",lineHeight:1.5}}>
                ${curSp.length?"＋ 今週やる数字を決める":"先に2週間スプリントを決めてください"}</button>`}` })}

        <!-- ── 今日のフォーカス ──
             ★ホームにあった「今日のフォーカス」カードをここへ移した★（2026-08-05 Kai要望）
             同じものが2か所にあると、どちらを見ればいいのか分からなくなる。
             3か月→2週間→今週 と落ちてきた先が「今日」なので、この位置が自然。 -->
        <div style=${{display:"flex",alignItems:"center",gap:11,marginTop:14,padding:"13px 13px",
                      borderRadius:13,border:"1px solid var(--border)",background:"transparent"}}>
          ${intent
            ? html`
              <button onClick=${toggleIntentDone} aria-label=${intent.done?"未達成に戻す":"達成にする"}
                style=${{flexShrink:0,width:26,height:26,padding:0,borderRadius:"50%",
                         border:`2px solid ${C_STAR}`,background:intent.done?C_STAR:"transparent",
                         display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
                ${intent.done
                  ? html`<svg width="16" height="16" viewBox="0 0 10 10" fill="none"><path d="M2 5l2.5 2.5L8 3" stroke="var(--card)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`
                  : ""}
              </button>`
            : html`
              <span style=${{flexShrink:0,color:C_STAR,display:"flex"}}>
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
                  <path d="M12 3.2l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.5l6-.8L12 3.2z"/></svg></span>`}
          <span style=${{flex:1,minWidth:0}}>
            <span style=${{display:"block",fontSize:12.5,fontWeight:800,color:C_STAR,marginBottom:3}}>⭐ 今日のフォーカス</span>
            ${intent
              ? html`<span style=${{display:"block",fontSize:12,color:"var(--text)",lineHeight:1.6,overflowWrap:"anywhere",
                                    textDecoration:intent.done?"line-through":"none",opacity:intent.done?0.55:1}}>${intent.intent}</span>`
              : html`<span style=${{display:"block",fontSize:12.5,color:"var(--sub)",lineHeight:1.65}}>
                  ${step||"今日いちばん達成したいことを1つ決めましょう。"}</span>`}
          </span>
          ${intent
            ? html`<button onClick=${openEditIntent}
                style=${{flexShrink:0,whiteSpace:"nowrap",padding:"8px 11px",borderRadius:9,
                         border:"1px solid var(--border)",background:"none",color:"var(--text)",
                         fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>変更 ›</button>`
            : html`<button onClick=${()=>{ setIntentEditMode(true); setShowIntentModal(true); }}
                style=${{flexShrink:0,whiteSpace:"nowrap",padding:"8px 11px",borderRadius:9,
                         border:`1px solid ${C_STAR}`,background:"none",color:C_STAR,
                         fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>決める ›</button>`}
        </div>
      </div>`;
    })()}

    ${entrySheet&&html`<${GoalEntrySheet} goal=${entrySheet.goal} entry=${entrySheet.entry}
      weekly=${!!entrySheet.weekly}
      onClose=${()=>setEntrySheet(null)}
      onSaved=${()=>{
        gasApi("getGoalTree").then(r=>{ if(r&&r.ok&&r.data){ setGoalTree(r.data);
          try { localStorage.setItem("cache_goaltree", JSON.stringify(r.data)); } catch(e){} } });
        if(entrySheet.weekly) gasApi("getSprints").then(r=>{ if(r&&r.ok){ setSprints(r);
          try { localStorage.setItem("cache_sprints", JSON.stringify(r)); } catch(e){} } });

                     <div>📱 この端末: ${FIELD[f]||f} = <b>${show((conflictItem.changes||{})[f])}</b></div>

              : html`<div>🖥 別の端末: 「${name}」</div>

          <button class="btn" style=${{marginBottom:8}} onClick=${()=>{

                m.base_values[conflictItem.field_name] = conflictItem.server_value;
              }
              delete m.field_name; delete m.server_value; delete m.base_value;

          <button style=${{width:"100%",padding:"10px",background:"none",border:"none",color:"var(--sub)",fontSize:12.5,cursor:"pointer"}}

          })()}

      </div>`}
    <!-- タスクボード（予定/実行中/完了。PC=ドラッグ、スマホ=移動ボタン。カードタップでタイマー） -->
    <div style=${{margin:"12px 16px 0",background:"var(--card)",borderRadius:16,border:"1px solid var(--border)",overflow:"hidden"}}>

          ${taskSync.pending>0&&html`<span title="保存中" style=${{width:7,height:7,borderRadius:"50%",background:"var(--sub)",display:"inline-block"}}></span>`}

      ${actionItems.length>0&&html`

              // 何件がその分類か（未設定はどのタブでも見えるので、数には入れない）
              const n = v==="ALL" ? actionItems.length : actionItems.filter(it=>{

          ${(()=>{
            // ★仕分けができていないと、どのタブも同じ一覧に見える★

          ${taskSync.failed>0&&html`<button onClick=${()=>{

            title="押すともう一度送ります">保存できず ${taskSync.failed}件・再送</button>`}
          ${taskSync.pending>0&&html`<span style=${{fontSize:11,color:"var(--sub)"}}>保存待ち ${taskSync.pending}件</span>`}
          <!-- 今日の計画量。利用可能時間が未設定のうちは判定しない（勝手に8時間と仮定しない） -->
          ${(()=>{
            const fmtMin = m => m>=60 ? `${Math.floor(m/60)}時間${m%60?`${m%60}分`:""}` : `${m}分`;
            let total=0, impMin=0, overMin=0, noEst=0;
            actionItems.forEach(it=>{
              const e2 = Number(estOf(it))||0;
              // 終わったタスクの「時間が未入力」は数えない（もう見積もる意味がないため）
              if (e2>0) total+=e2; else if (!isDone(it)) noEst++;
              const q = quadrantOf(it);

            return html`<div style=${{fontSize:11,color:"var(--sub)",lineHeight:1.6}}>
