<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JIROKU</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="JIROKU" />
  <meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#101417" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-iPOMe3E8jVgp/PepuDy7lJvw7L/QP97X5POfi+X1EVyDVQi8Kuv/MooNVB5OFXVN" src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #F8F8FA;
      --card:     #FFFFFF;
      --border:   #E5E7EB;
      --text:     #1F2937;
      --sub:      #9CA3AF;
      --accent:   #0891B2;
      --accent-l: #CFFAFE;
      --glow:     rgba(8,145,178,.12);
      --green:    #22C55E;
      --green-l:  #F0FDF4;
      --amber:    #F59E0B;
      --amber-l:  #FFFBEB;
      --red:      #EF4444;
      --red-l:    #FEF2F2;
      --nav-h:    64px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --r:        14px;
      --hero1:    #0891B2;
      --hero2:    #0e7490;
    }

    html, body {
      height: 100%; background: var(--bg);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      color: var(--text); -webkit-font-smoothing: antialiased;
    }
    #root { height: 100%; width: 100%; position: relative; background: var(--bg); overflow: hidden; }

    .screen {
      position: absolute; inset: 0;
      bottom: calc(var(--nav-h) + var(--safe-bottom));
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }

    /* ── Nav ── */
    .nav {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: calc(var(--nav-h) + var(--safe-bottom));
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex; padding-bottom: var(--safe-bottom);
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      border: none; background: none; cursor: pointer;
      color: var(--sub); -webkit-tap-highlight-color: transparent;
      transition: color .15s;
    }
    .nav-btn.on { color: var(--accent); }
    .nav-lbl { font-size: 10px; font-weight: 500; letter-spacing: .1px; }

    /* ── Page header ── */
    .ph { padding: 24px 20px 8px; }
    .ph-title { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -.3px; }
    .ph-title-accent { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -.3px; }
    .ph-sub { font-size: 13px; color: var(--sub); margin-top: 2px; }
    .ph-label { display: none; }

    /* ── Cards ── */
    .card {
      background: var(--card); border-radius: 12px;
      padding: 16px; margin: 0 16px 8px;
      border: 1px solid var(--border);
    }
    .card-label {
      font-size: 11px; font-weight: 500; color: var(--sub);
      margin-bottom: 12px; letter-spacing: .1px;
    }

    /* ── Stat tiles (unused but kept for compat) ── */
    .stat-row { display: flex; gap: 8px; margin: 0 16px 8px; }
    .stat-tile { flex: 1; background: var(--card); border-radius: 10px; padding: 14px 12px; text-align: center; border: 1px solid var(--border); }
    .stat-v { font-size: 24px; font-weight: 700; line-height: 1; color: var(--text); }
    .stat-l { font-size: 10px; color: var(--sub); margin-top: 4px; font-weight: 500; }
    .streak-tile { }
    .streak-tile .stat-v { color: var(--amber); }
    .level-v { color: var(--accent); }

    /* ── XP bar ── */
    .xp-wrap { margin: 0 16px 12px; }
    .xp-top { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); font-weight: 500; margin-bottom: 6px; }
    .xp-track { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .xp-fill { height: 4px; border-radius: 99px; background: var(--accent); transition: width .6s cubic-bezier(.4,0,.2,1); }

    /* ── Badge pills ── */
    .badge-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 16px 10px; }
    .badge-pill { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 20px; background: var(--bg); border: 1px solid var(--border); color: var(--sub); }

    /* ── Score ring ── */
    .ring-wrap { display: flex; align-items: center; gap: 16px; }
    .ring { width: 68px; height: 68px; flex-shrink: 0; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--pct)*1%), var(--border) 0); display: flex; align-items: center; justify-content: center; }
    .ring-inner { width: 52px; height: 52px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .ring-num { font-size: 18px; font-weight: 700; color: var(--text); line-height: 1; }
    .ring-unit { font-size: 9px; color: var(--sub); }

    /* ── Schedule ── */
    .sched-row { display: flex; align-items: flex-start; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .sched-row:last-child { border-bottom: none; }
    .sched-time { font-size: 12px; font-weight: 600; color: var(--accent); min-width: 40px; padding-top: 1px; flex-shrink: 0; }
    .sched-title { font-size: 14px; font-weight: 500; color: var(--text); }
    .sched-sub { font-size: 11px; color: var(--sub); margin-top: 2px; }

    /* ── Section header ── */
    .sec-head { padding: 16px 20px 8px; }
    .sec-head h2 { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }

    /* ── Time bar ── */
    .time-bar { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; border-bottom: 1px solid var(--border); }
    .time-bar::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; padding: 6px 12px; border-radius: 7px;
      font-size: 12px; font-weight: 500; cursor: pointer;
      border: 1px solid var(--border); background: var(--card);
      color: var(--sub); transition: all .12s; -webkit-tap-highlight-color: transparent;
    }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .chip.done { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .chip.on.done { background: var(--accent); color: #fff; }

    /* ── Form ── */
    .form-wrap { padding: 14px 16px 16px; }
    .form-grp { margin-bottom: 13px; }
    .form-lbl { font-size: 12px; font-weight: 500; color: var(--sub); margin-bottom: 6px; display: block; }
    .inp, .txa {
      width: 100%; padding: 11px 13px; border: 1px solid var(--border);
      border-radius: 9px; font-size: 15px; font-family: inherit;
      background: var(--card); color: var(--text); outline: none; transition: border-color .12s;
      box-sizing: border-box;
    }
    .inp:focus, .txa:focus { border-color: var(--accent); }
    input[type="date"].inp, input[type="date"].login-inp { -webkit-appearance: none; appearance: none; text-align: center; }
    .txa { resize: none; min-height: 68px; line-height: 1.6; overflow: hidden; }

    /* ── Eval buttons ── */
    .eval-btn {
      width: 100%; padding: 8px 12px; margin-bottom: 4px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card);
      font-size: 13.5px; font-weight: 500; cursor: pointer; text-align: left;
      color: var(--sub); transition: all .12s; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .eval-btn:last-child { margin-bottom: 0; }
    .e5 { background: var(--green-l); border-color: #86EFAC; color: #15803D; }
    .e4 { background: var(--accent-l); border-color: #A5B4FC; color: #3730A3; }
    .e3 { background: var(--amber-l); border-color: #FCD34D; color: #92400E; }
    .e2 { background: var(--red-l); border-color: #FCA5A5; color: #991B1B; }
    .e1 { background: var(--red-l); border-color: #FCA5A5; color: #991B1B; }

    /* ── Primary button ── */
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: var(--accent); color: #fff;
      font-size: 15px; font-weight: 600; cursor: pointer;
      font-family: inherit; letter-spacing: .1px;
      transition: opacity .12s, transform .1s; -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: .85; transform: scale(.99); }
    .btn:disabled { background: var(--border); color: var(--sub); cursor: default; }

    /* ── Ghost button ── */
    .btn-g {
      width: 100%; padding: 13px; border-radius: 9px;
      border: 1px solid var(--border); background: transparent;
      color: var(--red); font-size: 14px; font-weight: 500;
      cursor: pointer; font-family: inherit;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px);
      left: 50%; transform: translateX(-50%);
      background: #111827; color: #fff;
      padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
      z-index: 999; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.2);
      animation: up .2s ease;
    }
    @keyframes up { from { opacity:0; transform: translateX(-50%) translateY(6px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }

    /* ── Report ── */
    .report-hero { padding: 28px 20px 16px; text-align: center; }
    .report-date { font-size: 11px; font-weight: 500; color: var(--sub); margin-bottom: 12px; }
    .report-score { font-size: 72px; font-weight: 800; line-height: 1; letter-spacing: -3px; color: var(--text); }
    .report-pts { font-size: 13px; color: var(--sub); margin-top: 4px; }

    /* ── Tag ── */
    .tag { display: inline-block; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 500; }
    .t-g { background: var(--green-l); color: #15803D; }
    .t-a { background: var(--amber-l); color: #92400E; }

    /* ── Log rows ── */
    .log-row { display: flex; align-items: flex-start; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border); }
    .log-row:last-child { border-bottom: none; }
    .log-row > div:last-child { flex: 1; min-width: 0; }
    /* 時間帯を主役に：はっきり読める大きさ・色。範囲(HH:MM-HH:MM)も折り返さず表示 */
    .log-time { font-size: 12.5px; font-weight: 700; color: var(--accent); min-width: 92px; padding-top: 1px; flex-shrink: 0; letter-spacing: .01em; white-space: nowrap; }
    .log-task { font-size: 14.5px; font-weight: 600; color: var(--text); line-height: 1.5; overflow-wrap: anywhere; word-break: break-word; }
    /* 集中度は小さなチップに。メモは独立行で読みやすく */
    .log-focus { display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; font-size: 11px; font-weight: 600; color: var(--sub); background: var(--bg); border-radius: 20px; padding: 2px 9px 2px 7px; }
    .log-focus .dot { flex-shrink: 0; }
    .log-memo { font-size: 12.5px; color: var(--text); opacity: .78; line-height: 1.7; margin-top: 6px; overflow-wrap: anywhere; word-break: break-word; white-space: pre-wrap; }
    .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

    /* ── Chat ── */
    .chat-head { padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .chat-av { width: 34px; height: 34px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text); flex-shrink: 0; }
    .chat-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .chat-status { font-size: 11px; color: var(--sub); }

    .msgs { padding: 16px; display: flex; flex-direction: column; gap: 8px; min-height: 100%; }
    .bubble { max-width: 76%; padding: 10px 14px; font-size: 14px; line-height: 1.6; overflow-wrap: break-word; word-break: break-word; white-space: pre-wrap; border-radius: 14px; min-width: 130px; }
    .b-in { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .b-out { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .btime { font-size: 10px; color: var(--sub); margin-top: 3px; }
    .btime-r { text-align: right; }

    .chat-bar { padding: 10px 14px; background: var(--card); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; }
    .chat-inp { flex: 1; padding: 10px 13px; border: 1px solid var(--border); border-radius: 9px; font-size: 15px; font-family: inherit; outline: none; resize: none; max-height: 100px; line-height: 1.4; background: var(--bg); color: var(--text); }
    .chat-inp:focus { border-color: var(--accent); }
    .send { width: 38px; height: 38px; border-radius: 9px; background: var(--accent); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
    .send:disabled { background: var(--border); color: var(--sub); cursor: default; }

    /* ── Settings ── */
    .s-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .s-row:last-child { border-bottom: none; }
    .s-k { color: var(--sub); font-weight: 400; }
    .s-v { font-weight: 500; color: var(--text); }
    select { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border); font-size: 14px; background: var(--card); color: var(--text); font-family: inherit; outline: none; }
    select:focus { border-color: var(--accent); }

    /* ── Date nav ── */
    .date-nav { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
    .date-nav button { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--sub); padding: 0 4px; line-height: 1; }
    .date-nav button:disabled { color: var(--border); cursor: default; }
    .date-nav span { font-size: 13px; font-weight: 600; color: var(--text); }

    /* ── Spinner ── */
    .spin { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: rot .6s linear infinite; display: inline-block; }
    @keyframes rot { to { transform: rotate(360deg); } }

    /* ── 独り言FABの上に出る、モコモコの雲（インラインSVG） ── */
    .quick-hint {
      position: absolute; right: -14px; bottom: 100%; margin-bottom: -12px;
      width: 96px; height: 76px; pointer-events: none; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      animation: quickHintIn .5s cubic-bezier(.34,1.56,.64,1), quickHintFloat 3.4s ease-in-out .5s infinite;
      transform-origin: bottom center;
    }
    .quick-hint svg.cloud {
      position: absolute; inset: 0; width: 100%; height: 100%;
      filter: drop-shadow(0 5px 9px rgba(8,145,178,0.18));
    }
    .quick-hint svg.cloud circle { fill: var(--card); }
    .quick-hint .t {
      position: relative; z-index: 1; color: var(--text);
      font-size: 10px; font-weight: 700; letter-spacing: .02em; white-space: nowrap;
      margin-top: -6px; /* しっぽの分、本体中心に文字を寄せる */
    }
    @keyframes quickHintIn { from { opacity: 0; transform: translateY(6px) scale(.8); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes quickHintFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

    /* ── Empty ── */
    .empty { padding: 48px 24px; text-align: center; }
    .empty-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .empty-body { font-size: 13px; color: var(--sub); line-height: 1.7; }

    /* ── Login ── */
    .login-wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; background: var(--bg); }
    .login-logo { width: 72px; height: 72px; margin: 0 auto 18px; }
    .login-title { font-size: 24px; font-weight: 700; letter-spacing: -.4px; text-align: center; color: var(--text); }
    .login-sub { font-size: 13px; color: var(--sub); text-align: center; margin: 5px 0 32px; line-height: 1.6; }
    .login-box { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 8px; }
    .login-inp { width: 100%; padding: 13px 14px; border-radius: 9px; border: 1px solid var(--border); font-size: 15px; background: var(--card); color: var(--text); outline: none; font-family: inherit; transition: border-color .12s; box-sizing: border-box; }
    .login-inp:focus { border-color: var(--accent); }
    .login-err { font-size: 12px; color: var(--red); font-weight: 500; }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:       #101417;
        --card:     #1A2025;
        --border:   #2B333A;
        --text:     #E8ECEF;
        --sub:      #7E8A94;
        --accent:   #22B8D4;
        --accent-l: #123A44;
        --glow:     rgba(34,184,212,.15);
        --green:    #34D399;
        --green-l:  #0E2B21;
        --amber:    #FBBF24;
        --amber-l:  #2E2410;
        --red:      #F87171;
        --red-l:    #331717;
        --hero1:    #0B4A5A;
        --hero2:    #093642;
      }
      .nav { background: rgba(20,25,30,.96); }
      .toast { background: #E8ECEF; color: #111827; }
      .e5 { background: var(--green-l); border-color: #14532D; color: #4ADE80; }
      .e4 { background: var(--accent-l); border-color: #164E63; color: #67E8F9; }
      .e3 { background: var(--amber-l); border-color: #78350F; color: #FCD34D; }
      .e2, .e1 { background: var(--red-l); border-color: #7F1D1D; color: #FCA5A5; }
      .t-g { background: var(--green-l); color: #4ADE80; }
      .t-a { background: var(--amber-l); color: #FCD34D; }
      input[type="date"].inp, input[type="date"].login-inp, select { color-scheme: dark; }
    }
  
/* ログイン待ちのくるくる。待っている間に何も動かないと不安なので必ず出す */
@keyframes jrk-spin { to { transform: rotate(360deg); } }
.jrk-spinner {
  width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.18);
  border-top-color: var(--accent, #0891B2);
  animation: jrk-spin .8s linear infinite;
  margin: 0 auto 14px;
}
</style>
</head>
<body>
<div id="root">
  <div id="splash" style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:20px">
    <!-- 案Aロゴ: リングマーク -->
    <svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <circle cx="40" cy="40" r="40" fill="#0891B2"/>
      <circle cx="40" cy="40" r="28" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="5"/>
      <path d="M40 12 A28 28 0 1 1 16.4 55.6" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <circle cx="40" cy="40" r="17" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
      <line x1="40" y1="40" x2="40" y2="27" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <line x1="40" y1="40" x2="49" y2="46" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <circle cx="40" cy="40" r="2" fill="#fff"/>
    </svg>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="font-family:'DM Sans',-apple-system,sans-serif;font-size:26px;font-weight:800;color:var(--text);letter-spacing:-.3px">JIROKU</div>
      <div style="font-family:'DM Sans',-apple-system,sans-serif;font-size:10px;font-weight:500;color:#9CA3AF;letter-spacing:2px">HABIT DESIGN</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:8px">
      <div style="width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp 0.7s linear infinite"></div>

// ライブラリ側の変換にバグがあると「must contain a valid P-256 public key」で
// 失敗することがあるため、確実な変換で自前のUint8Arrayを作る
function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function flushTaskQueue(){

  if (!pending.length) return;

      base_version: x.base_version, base_values: x.base_values, changes: x.changes }));

      const res = byMid[x.mid];

        x.server_value = res.server_value;

        return true;
      }
      if (res.result === "DELETED_REJECTED") return false;   // 恒久エラー。再試行しても無駄
      x.tries = (x.tries||0)+1;
      return x.tries < 8;   // 無限再試行しない
    });

  } finally { __taskQueueFlushing = false; }
}

//   フィールド単位で止められたもの（field_name あり）はそのまま要確認に残す。
(function rescueStuckConflicts(){
  try {
    const q = loadTaskQueue();

    q.forEach(x => {

      if (x.field_name) return;                 // 同じ項目の衝突。本人に選ばせる

    });

  } catch (e) {}
})();

// ── 認証が切れた時の預かりと再試行 ──
// 「記録しようとしたらログインが切れていて、入力が消えた」を防ぐ。
// 保存系の操作だけを預かる（読み取りはやり直せばよいので預からない）。
const PENDING_KEY = "jiroku_pending_ops";
const RETRYABLE_ACTIONS = {
  saveLog:1, saveLogMulti:1, quickLog:1, saveSettings:1, saveTodayActions:1,
  saveGoal:1, saveWeeklyGoal:1, archiveGoalItem:1, saveWeeklyReflection:1,
  saveIntent:1, submitSurvey:1, deleteLog:1

// ★サーバーが SESSION_INVALID を返したときの手順★
// 順序が重要。先にトークンを消すと、預ける前に本人が分からなくなる。
//   1. 無効セッションの応答を受ける（ここ）
//   2. 未保存の操作を一時保存      ← 先にやる
//   3. 古いトークンを削除
//   4. 再ログインを要求
// 5〜8（新しいセッション取得・本人確定・1回だけ再試行・一時保存の削除）は
// ログイン成功後の flushPendingOps 側で行う。
function handleSessionInvalid(j, action, body) {
  if (!j || j.ok !== false || j.error !== "SESSION_INVALID") return false;
  try { stashPendingOp(action, body || {}); } catch {}
  try { localStorage.removeItem(SESSION_KEY); } catch {}

  try { localStorage.setItem("jiroku_reauth_needed", "1"); } catch {}
  try { window.dispatchEvent(new CustomEvent("jiroku:reauth")); } catch {}
  return true;
}

function stashPendingOp(action, body) {
  if (!RETRYABLE_ACTIONS[action]) return;
  try {
    const list = JSON.parse(localStorage.getItem(PENDING_KEY) || "[]");
    // 同じ操作が積み上がらないよう、直近10件まで
    list.push({ action, body, at: Date.now() });
    localStorage.setItem(PENDING_KEY, JSON.stringify(list.slice(-10)));
  } catch {}
}
function pendingOpCount() {
  try { return JSON.parse(localStorage.getItem(PENDING_KEY) || "[]").length; } catch { return 0; }
}
// ログイン成功後に呼ぶ。預かっていた操作を順にやり直す
async function flushPendingOps() {
  let list = [];
  try { list = JSON.parse(localStorage.getItem(PENDING_KEY) || "[]"); } catch { return { done:0, failed:0 }; }
  if (!list.length || !getSessionToken()) return { done:0, failed:0 };
  const rest = [];
  let done = 0;
  let dropped = 0;
  for (const op of list) {
    // 古すぎるものは捨てる（3日以上前の記録を勝手に復活させない）
    if (Date.now() - (op.at || 0) > 3 * 86400000) { dropped++; continue; }
    // ★再試行は1操作につき1回まで★
    // 以前は失敗したものを rest に戻し続けていたため、サーバー側が
    // 恒久的に拒否する操作（権限が無い等）が毎回のログインでやり直され、
    // 事実上の無限再試行になっていた。
    if ((op.tries || 0) >= 1) { dropped++; continue; }
    try {
      const r = await fetch(GAS_URL, {
        method: "POST", headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: op.action, studentEmail: CURRENT_USER.email,
                               token: getSessionToken(), ...op.body })
      }).then(x => x.json());
      if (r && r.ok) done++;
      else rest.push({ ...op, tries: (op.tries || 0) + 1 });
    } catch { rest.push({ ...op, tries: (op.tries || 0) + 1 }); }
  }

    if (rest.length) localStorage.setItem(PENDING_KEY, JSON.stringify(rest));
    else localStorage.removeItem(PENDING_KEY);
  } catch {}

}

// ── セッション（Auth CP1）──

// コンソールにも出さない。
const SESSION_KEY = "jiroku_session";

//   LEGACY … 従来ログインのみ
//   SESSION_OPTIONAL … 基盤稼働。既存APIは未強制だが、認証に失敗したら従来ログインへ戻さない
//   SESSION_REQUIRED … セッション必須
const AUTH_MODE_KEY = "auth_mode_seen";

function rememberedAuthMode(){
  try { return localStorage.getItem(AUTH_MODE_KEY) || "LEGACY"; } catch { return "LEGACY"; }
}

function noteAuthMode(mode){
  const m = String(mode||"").toUpperCase();
  if (AUTH_RANK[m] === undefined) return rememberedAuthMode();
  const prev = rememberedAuthMode();
  if ((AUTH_RANK[m]||0) >= (AUTH_RANK[prev]||0)) { try{ localStorage.setItem(AUTH_MODE_KEY, m); }catch{} return m; }
  return prev;  // 降格は受け付けない
}
function getSessionToken() {

}
function setSessionToken(t) {

      // 以前は flushPendingOps の末尾でしか消しておらず、
      // 預かりが0件だと早期returnで通り抜けて印が残り続けた。
      // その結果、ログインに成功しても起動時に再ログイン画面が出て、
      // 「ログイン → サインイン画面へ戻る」を延々と繰り返した（2026-08-01に発生）。

      // ログインに成功しても再ログイン画面が出続ける。

      try { window.dispatchEvent(new CustomEvent("jiroku:authed")); } catch {}
    } else {
      localStorage.removeItem(SESSION_KEY);
    }
  } catch {}
}
// 認証付きPOST。CP1では既存APIへの強制はまだ行わないが、
// これから追加するAPIはすべてこれを通す
async function authedPost(action, body = {}) {
  const token = getSessionToken();
  if (!token) return { ok:false, error:"AUTH_REQUIRED" };
  try {
    const r = await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ action, token, ...body })
    });
    return await r.json();
  } catch { return { ok:false, error:"NETWORK" }; }
}

// ── Googleカレンダー（各ユーザー本人の権限でブラウザから直接読む） ──
// GAS(CalendarApp)はスクリプト所有者のアカウントでしか読めないため、
// 他ユーザーのカレンダーはクライアント側で取得する
let gcalToken=null, gcalTokenExp=0;
// GISスクリプト（async defer読み込み）の準備を最大4秒待つ
function waitForGis(ms=4000){
  return new Promise(resolve=>{
    const t0=Date.now();
    (function check(){
      if(window.google?.accounts?.oauth2) return resolve(true);
      if(Date.now()-t0>ms) return resolve(false);
      setTimeout(check,200);
    })();
  });
}
async function getCalendarToken(interactive){
  if(gcalToken && Date.now() < gcalTokenExp-60000) return gcalToken;
  // 再読み込みでメモリ上のトークンは消えるため、localStorageに保存した
  // アクセストークン（約1時間有効）を再利用する。これで毎回の起動時にGISを
  // 呼ばずに済み、「毎回一瞬Googleのサインイン画面が出る」現象を防ぐ
  try{ const s=JSON.parse(localStorage.getItem("gcal_token")||"null"); if(s&&s.token&&Date.now()<s.exp-60000){ gcalToken=s.token; gcalTokenExp=s.exp; return gcalToken; } }catch(e){}
  // ★重要: 非対話（起動時の予定取得・記録の書き戻し等）では、絶対にGoogleへ
  // トークン要求(requestAccessToken)をしない。GISのサイレント要求は実際には
  // accounts.google.comへページ遷移して「しばらくお待ちください」画面を一瞬出すため、
  // 「毎回Googleのサインイン画面が出る」現象の原因になっていた。
  // 保存済みトークンが無ければnullを返し、読み取りはサーバーキャッシュ、書き込みは
  // キューに退避する。トークンの取得・更新はユーザーが明示的に操作した時(interactive)だけ行う。
  if(!interactive) return null;
  const ready=await waitForGis();
  if(!ready) return null;
  return new Promise((resolve)=>{
    // サイレント認証（prompt:"none"）はサードパーティCookieがブロックされていると
    // コールバックも呼ばれずに固まることがあり、そのままだとフォールバック（サーバーの
    // 共有キャッシュ）にも進めなくなる。タイムアウトで必ず抜けられるようにする
    let done=false;
    const finish=(v)=>{ if(done) return; done=true; resolve(v); };
    const timeout=setTimeout(()=>finish(null), interactive ? 20000 : 4000);
    try{
      const client=google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: "https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/calendar.events",
        // FedCMのプロンプトはサイレント認証(prompt:"none")でも一瞬Googleの画面を出すため使わない
        callback: (t)=>{
          clearTimeout(timeout);
          if(t.error){ finish(null); return; }
          gcalToken=t.access_token;
          gcalTokenExp=Date.now()+(Number(t.expires_in)||3600)*1000;
          try{ localStorage.setItem("gcal_token", JSON.stringify({token:gcalToken, exp:gcalTokenExp})); }catch(e){}
          finish(gcalToken);
        },
        error_callback: ()=>{ clearTimeout(timeout); finish(null); },
      });
      client.requestAccessToken({prompt: interactive ? "" : "none"});
    }catch{ clearTimeout(timeout); finish(null); }
  });
}
const gcalCache={}, gcalCacheAt={}, gcalSynced={}, gcalInFlight={};
const GCAL_LS="gcal_evs_";
// 今日の予定は後から追加・変更されることがあるため、キャッシュは10分で期限切れにして
// 再取得する（以前は一度取得したら丸1日使い回していたため、後から入れた予定が
// 記録タブの自動入力に反映されなかった）
const GCAL_TTL_MS = 10*60*1000;
const gcalFresh = dateStr => gcalCache[dateStr] && (Date.now()-(gcalCacheAt[dateStr]||0)) < GCAL_TTL_MS;
// 連携カレンダーの選択を変えた時などに、古い選択で取得済みのキャッシュを全て破棄する
function clearCalendarCache(){
  Object.keys(gcalCache).forEach(k=>delete gcalCache[k]);
  Object.keys(gcalCacheAt).forEach(k=>delete gcalCacheAt[k]);
  Object.keys(gcalSynced).forEach(k=>delete gcalSynced[k]);
  try{ Object.keys(localStorage).forEach(k=>{ if(k.startsWith(GCAL_LS)) localStorage.removeItem(k); }); }catch{}
}
function cleanupGcalLS(){
  try{
    const limit=addDays(formatDateStr(new Date()),-7);
    Object.keys(localStorage).forEach(k=>{
      if(k.startsWith(GCAL_LS) && k.slice(GCAL_LS.length)<limit) localStorage.removeItem(k);
      if(k.startsWith(CAL_EVT_LS) && k.slice(CAL_EVT_LS.length)<limit) localStorage.removeItem(k);
    });
  }catch{}
}
// 記録をGoogleカレンダーへ自動で書き戻す（メインカレンダーのみ）。
// 「日付ごとの {時間帯: eventId} マップ」を端末に持ち、同じ時間帯の再保存では
// イベントを新規作成せず既存イベントを更新する（編集のたびに重複しないように）。
// カレンダー未連携・書き込み権限が未許可（再連携前）の場合は静かに何もしない。
// 記録の保存自体はGAS側で完了済みなので、ここで失敗しても記録には影響しない
const CAL_EVT_LS = "jiroku_cal_evt_";
// カレンダー書き込みの永続キュー。通信エラー・トークン一時失効・タブが閉じられた等で
// 最終的に書き込めなかった記録をここに退避し、次回起動時などにまとめて再送する。
// これで「JIROKUには記録があるのにカレンダーに反映されない」取りこぼしを無くす
const CAL_QUEUE_LS = "jiroku_cal_queue";
function readCalQueue(){ try{ return JSON.parse(localStorage.getItem(CAL_QUEUE_LS)||"[]"); }catch(e){ return []; } }
function writeCalQueue(q){ try{ localStorage.setItem(CAL_QUEUE_LS, JSON.stringify(q.slice(-200))); }catch(e){} }
function enqueueCalWrite(item){
  const q = readCalQueue().filter(x=>!(x.dateStr===item.dateStr && x.key===item.key)); // 同じ枠は最新で上書き
  q.push({...item, ts: Date.now()});
  writeCalQueue(q);
}
function dequeueCalWrite(dateStr, key){
  writeCalQueue(readCalQueue().filter(x=>!(x.dateStr===dateStr && x.key===key)));
}
// キューに溜まった書き込みを順に再送する。トークンが取れなければ何もしない（次の機会に再試行）
let _calFlushing = false;
async function flushCalendarQueue(){
  if(_calFlushing) return;
  if(!localStorage.getItem("cal_linked")) return;
  const q = readCalQueue();
  if(q.length===0) return;
  const token = await getCalendarToken(false);
  if(!token) return; // トークン無しなら今回は見送り（キューは保持）
  _calFlushing = true;
  try{
    for(const it of q.slice()){
      // upsertCalendarEvent側が成功時にdequeue、失敗時に再enqueueするので、ここでは呼ぶだけ
      await upsertCalendarEvent(it.dateStr, it.key, it.startISO, it.endISO, it.title, it.exactOriginalEventId||null, true);
    }
  }catch(e){}
  _calFlushing = false;
}
// 実際にやったこと（JIROKUが書き込む/更新する予定）は色を統一し、予定していただけの
// 予定と見分けられるようにする（8 = Graphite、目立たない灰色。✅マークで判別できるため
// 色自体は主張しすぎないものにする）
const JIROKU_RECORD_COLOR_ID = "8";
// 通信エラーやトークンの一時的な失効で書き込みに失敗すると、以前は何の痕跡も残らず
// 静かに諦めていたため、原因が特定できなかった。1回だけ再試行し、それでも失敗したら
// コンソールにログを残す（ユーザー体験は変えず、次に同じ問題が起きた時に調査できるように）
async function upsertCalendarEvent(dateStr, key, startISO, endISO, title, exactOriginalEventId, isRetry){
  try{
    // サーバー(Kai権限)がカレンダー書き込みを担う本人は、クライアント側では書かない（二重登録防止）
    if(localStorage.getItem("server_calendar")) return;
    if(!localStorage.getItem("cal_linked") || !title) return;
    const token = await getCalendarToken(false);
    if(!token) {
      if(!isRetry) console.warn("[JIROKU calendar] token取得失敗、1秒後に再試行", {dateStr, key, title});
      if(!isRetry) return setTimeout(()=>upsertCalendarEvent(dateStr, key, startISO, endISO, title, exactOriginalEventId, true), 1000);
      console.error("[JIROKU calendar] token取得に再試行しても失敗→キューに退避", {dateStr, key, title});
      enqueueCalWrite({dateStr, key, startISO, endISO, title, exactOriginalEventId});
      return;
    }
    let map = {};
    try{ map = JSON.parse(localStorage.getItem(CAL_EVT_LS+dateStr)||"{}"); }catch{}
    const base = "https://www.googleapis.com/calendar/v3/calendars/primary/events";
    const headers = { Authorization:"Bearer "+token, "Content-Type":"application/json" };
    // 色分け(colorId)はGoogleカレンダーの表示上あまり目立たず、見分けがつきにくいという
    // フィードバックがあったため、タイトル自体に「✅ 」を付けて、どの画面・端末でも
    // 文字で確実に「実際にやったこと」と分かるようにする（色は補助的な扱いにする）
    const recordTitle = "✔️ " + title;
    // extendedProperties.private.jirokuRecordで「JIROKUの記録から書き込んだ/更新した予定」と
    // 印を付けておく。カレンダー上は普通の予定として見えるが、アプリ側の「今日の予定」
    // 表示や自動入力では、既に完了したことをまた"予定"として出さないようこの印で除外する
    const body = JSON.stringify({ summary: recordTitle, start:{ dateTime:startISO }, end:{ dateTime:endISO },
      colorId: JIROKU_RECORD_COLOR_ID, extendedProperties:{ private:{ jirokuRecord:"1" } } });

    // 元の予定と記録内容のタイトルが文字通り完全一致する場合だけ、新規に別イベントを
    // 作らずその予定へ✅マークを追加する（内容が同じなので上書きしても情報は失われない）。
    // 一致しない場合にここで上書きすると、元の予定の文言が消えてしまうため、
    // 完全一致以外は必ず別イベントとして作成・更新する
    const alreadyClaimed = Object.values(map).includes(exactOriginalEventId);
    if(exactOriginalEventId && !map[key] && !alreadyClaimed){
      const titleOnlyBody = JSON.stringify({ summary: recordTitle,
        colorId: JIROKU_RECORD_COLOR_ID, extendedProperties:{ private:{ jirokuRecord:"1" } } });
      const r0 = await fetch(base+"/"+encodeURIComponent(exactOriginalEventId), { method:"PATCH", headers, body:titleOnlyBody });
      if(r0.ok){
        map[key] = exactOriginalEventId;
        try{ localStorage.setItem(CAL_EVT_LS+dateStr, JSON.stringify(map)); }catch{}
        dequeueCalWrite(dateStr, key);
        return;
      }
      // 更新に失敗した場合は下の通常フローで新規作成にフォールバックする
    }

    if(map[key]){
      const r = await fetch(base+"/"+encodeURIComponent(map[key]), { method:"PATCH", headers, body });
      if(r.ok){ dequeueCalWrite(dateStr, key); return; }
      // カレンダー側で手動削除されていた場合(404/410)だけ作り直す。それ以外の失敗は
      // 一時的な通信エラーの可能性があるため、1回だけ再試行してから諦める
      if(r.status!==404 && r.status!==410){
        if(!isRetry){
          console.warn("[JIROKU calendar] 更新失敗、1秒後に再試行", {dateStr, key, title, status:r.status});
          setTimeout(()=>upsertCalendarEvent(dateStr, key, startISO, endISO, title, exactOriginalEventId, true), 1000);
        } else {
          console.error("[JIROKU calendar] 更新に再試行しても失敗→キューに退避", {dateStr, key, title, status:r.status});
          enqueueCalWrite({dateStr, key, startISO, endISO, title, exactOriginalEventId});
        }
        return;
      }
    }
    const r2 = await fetch(base, { method:"POST", headers, body });
    if(r2.ok){
      const ev = await r2.json();
      map[key] = ev.id;
      try{ localStorage.setItem(CAL_EVT_LS+dateStr, JSON.stringify(map)); }catch{}
      dequeueCalWrite(dateStr, key);
    } else if(!isRetry){
      console.warn("[JIROKU calendar] 新規作成失敗、1秒後に再試行", {dateStr, key, title, status:r2.status});
      setTimeout(()=>upsertCalendarEvent(dateStr, key, startISO, endISO, title, exactOriginalEventId, true), 1000);
    } else {
      console.error("[JIROKU calendar] 新規作成に再試行しても失敗→キューに退避", {dateStr, key, title, status:r2.status});
      enqueueCalWrite({dateStr, key, startISO, endISO, title, exactOriginalEventId});
    }
  }catch(e){
    if(!isRetry){
      console.warn("[JIROKU calendar] 書き込み中に例外、1秒後に再試行", {dateStr, key, title, error:String(e)});
      setTimeout(()=>upsertCalendarEvent(dateStr, key, startISO, endISO, title, exactOriginalEventId, true), 1000);
    } else {
      console.error("[JIROKU calendar] 再試行しても例外→キューに退避", {dateStr, key, title, error:String(e)});
      enqueueCalWrite({dateStr, key, startISO, endISO, title, exactOriginalEventId});
    }
  }
}
// その日の「記録(logs)」と「カレンダーに書き込み済みか(端末の対応表)」を突き合わせ、
// まだカレンダーに書けていない記録を書き込む（＝取りこぼしの遡り補完）。
// 独り言で作った過去の記録や、書き込み前にタブを閉じた分などをここで拾う。
async function reconcileCalendarForDate(dateStr, logs){
  if(localStorage.getItem("server_calendar")) return; // サーバーが書き込むので補完不要
  if(!localStorage.getItem("cal_linked") || !Array.isArray(logs) || logs.length===0) return;
  let map={}; try{ map=JSON.parse(localStorage.getItem(CAL_EVT_LS+dateStr)||"{}"); }catch(e){}
  for(const l of logs){
    const tb=String(l.time_block||""); if(!tb || map[tb]) continue; // 既に書き込み済みはスキップ
    const [s,e]=tb.split("-");
    const stt=new Date(dateStr+"T"+String(s).slice(0,5)+":00"); if(isNaN(stt)) continue;
    const ett=e?new Date(dateStr+"T"+String(e).slice(0,5)+":00"):null;
    const endDt=(ett&&ett>stt)?ett:new Date(stt.getTime()+3600000);
    await upsertCalendarEvent(dateStr, tb, stt.toISOString(), endDt.toISOString(), l.task||"記録", null);
  }
}
// 取得戦略: メモリ → 端末キャッシュ → 本人認証で取得 → サーバーの共有キャッシュ
// 一度どこかで取得できれば端末とサーバーの両方に残るので、以後は認証なしで自動表示される。
// ホーム・記録・日記など複数画面が同時にマウントされており、同じ日付を
// ほぼ同時に呼び出すと、Googleへのサイレント認証リクエストが競合して
// 片方が失敗することがあったため、同じ日付の取得は1つの実行を共有する
async function fetchCalendarEvents(dateStr, interactive=false){
  if(gcalFresh(dateStr)) return gcalCache[dateStr];
  // interactive(ボタン手動タップ)はユーザー操作なので毎回必ず新規実行し、
  // 裏で動いているサイレント取得の使い回しはしない
  if(!interactive && gcalInFlight[dateStr]) return gcalInFlight[dateStr];
  const p=fetchCalendarEventsUncached(dateStr, interactive);
  if(!interactive) gcalInFlight[dateStr]=p;
  try{ return await p; } finally { if(!interactive) delete gcalInFlight[dateStr]; }
}
async function fetchCalendarEventsUncached(dateStr, interactive=false){
  if(gcalFresh(dateStr)) return gcalCache[dateStr];
  if(!interactive){
    try{
      const ls=localStorage.getItem(GCAL_LS+dateStr);
      if(ls){
        const parsed=JSON.parse(ls);
        // 新形式{t,evs}と旧形式（配列そのまま）の両方を受け付ける
        const evs=Array.isArray(parsed)?parsed:parsed.evs;
        const t=Array.isArray(parsed)?0:(parsed.t||0);
        if(evs && (Date.now()-t) < GCAL_TTL_MS){
          gcalCache[dateStr]=evs; gcalCacheAt[dateStr]=t; gcalSynced[dateStr]=1;
          return evs;
        }
        // 期限切れでも下の再取得が失敗した時のフォールバックとしてメモリには入れておく
        if(evs){ gcalCache[dateStr]=evs; gcalCacheAt[dateStr]=0; }
      }
    }catch{}
  }
  const token=await getCalendarToken(interactive);
  if(token){
    try{
      const timeMin=new Date(dateStr+"T00:00:00").toISOString();
      const timeMax=new Date(dateStr+"T23:59:59").toISOString();
      // 連携するカレンダーは複数選択できる（仕事用＋プライベート用など）。
      // 未設定ならメインカレンダー（primary）のみ
      const calIds=JSON.parse(localStorage.getItem("jiroku_cal_ids")||'["primary"]');
      const responses=await Promise.all(calIds.map(id=>
        fetch("https://www.googleapis.com/calendar/v3/calendars/"+encodeURIComponent(id)+"/events?singleEvents=true&orderBy=startTime&maxResults=50&timeMin="+encodeURIComponent(timeMin)+"&timeMax="+encodeURIComponent(timeMax),
          {headers:{Authorization:"Bearer "+token}}).then(r=>r.json()).catch(()=>null)
      ));
      const items=[];
      responses.forEach(r=>{ if(r&&r.items) items.push(...r.items); });
      if(responses.some(r=>r&&r.items)){
        // JIROKUの記録から自動で書き込んだ予定は、既に完了したことなので
        // 「今日の予定」表示・記録の自動入力からは除外する。判定は3段構え：
        // (1) jirokuRecordの印付き (2) この端末が書き込んだイベントID
        // (3) タイトルが✅/✔️始まり（印が付く前に作られた古い記録や他端末分の保険。
        // マークを✅→✔️に変更した経緯があるため両方を見る）
        let jirokuIds = {};
        try{ jirokuIds = JSON.parse(localStorage.getItem(CAL_EVT_LS+dateStr)||"{}"); }catch{}
        const jirokuIdSet = new Set(Object.values(jirokuIds));
        const evs=items.filter(e=>{
          const summary = String(e.summary||"");
          return e.status!=="cancelled" &&
            !e.extendedProperties?.private?.jirokuRecord &&
            !jirokuIdSet.has(e.id) &&
            !summary.startsWith("✅") && !summary.startsWith("✔️");
        }).map(e=>{
          const s=e.start?.dateTime?new Date(e.start.dateTime):null;
          const en=e.end?.dateTime?new Date(e.end.dateTime):null;
          return {
            id:e.id, title:e.summary||"(無題)", allDay:!s,
            startHour:s?s.getHours()+s.getMinutes()/60:null,
            endHour:en?en.getHours()+en.getMinutes()/60:null,
            time:s?s.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}):"終日",
            sub:e.location||(e.hangoutLink?"Zoom/Meet":"")
          };
        }).sort((a,b)=>(a.startHour??-1)-(b.startHour??-1));
        gcalCache[dateStr]=evs; gcalCacheAt[dateStr]=Date.now();
        try{ localStorage.setItem(GCAL_LS+dateStr, JSON.stringify({t:Date.now(),evs})); cleanupGcalLS(); }catch{}
        // サーバーへ同期（コーチのプロンプト用＆次回起動・他端末のフォールバック）
        if(CURRENT_USER && !gcalSynced[dateStr]){
          gcalSynced[dateStr]=1;
          try{ fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
            body:JSON.stringify({action:"syncCalendar",studentEmail:CURRENT_USER.email,date:dateStr,events:JSON.stringify(evs).slice(0,6000)})}); }catch{}
        }
        return evs;
      }
    }catch{}
  }
  // 認証できない場合はサーバーの共有キャッシュから復元
  try{
    const r=await gasApi("getCalendar",{date:dateStr});
    if(r.ok && r.data){
      gcalCache[dateStr]=r.data; gcalCacheAt[dateStr]=Date.now(); gcalSynced[dateStr]=1;
      try{ localStorage.setItem(GCAL_LS+dateStr, JSON.stringify({t:Date.now(),evs:r.data})); }catch{}
      return r.data;
    }
  }catch{}
  // 再取得に失敗した場合は、期限切れでも手元にあるキャッシュを返す（何も出ないよりまし）
  return gcalCache[dateStr]||null;
}
// 時間ブロック（例 "10:00-11:00"）に重なる予定タイトル一覧
function eventsForBlock(evs, block){
  if(!evs) return [];
  const h=parseInt(block);
  return evs.filter(e=>!e.allDay && e.startHour!==null && e.startHour<h+1 && e.endHour>h).map(e=>e.title);
}
// 記録した内容が、その時間帯にあった予定のタイトルと文字通り完全一致する場合だけ、
// 別イベントを作らずその予定に✅マークを追加する（内容が違う場合に上書きして
// 消してしまわないよう、完全一致の時だけの限定的な救済措置）
function exactEventForBlock(evs, block, taskText){
  if(!evs) return null;
  const h=parseInt(block);
  const matches=evs.filter(e=>!e.allDay && e.startHour!==null && e.startHour<h+1 && e.endHour>h && e.id && e.title===taskText);
  return matches.length===1 ? matches[0] : null;

  const closeIntentModal = () => { setShowIntentModal(false); setIntentEditMode(false); };
  // 達成⇄未達成のトグル（間違えて押しても、もう一度タップで戻せる）
  const toggleIntentDone = () => {
    if(!intent) return;
    const next = {...intent, done:!intent.done};
    localStorage.setItem("jiroku_intent", JSON.stringify(next));
    setIntent(next);
    gasPostJson("saveIntent", {intent_done: next.done ? "true" : "false"});
  };
  // 週次ふりかえり（月曜に今週のまとめが出たら、ホームで振り返り＋来週の一言を記入）
  const [weekly, setWeekly] = useState(null);
  const [weekReflection, setWeekReflection] = useState("");
  const [weekIntention, setWeekIntention] = useState("");
  const [weekSaving, setWeekSaving] = useState(false);
  const [weekDismissed, setWeekDismissed] = useState(false);
  const saveWeekly = async () => {
    if(!weekly) return;
    setWeekSaving(true);
    const r = await gasPostJson("saveWeeklyReflection", {week_start:weekly.weekStart, reflection:weekReflection.trim(), intention:weekIntention.trim()});
    setWeekSaving(false);
    if(r.ok){ setWeekly({...weekly, reflected:true, reflection:weekReflection.trim(), nextIntention:weekIntention.trim()}); }
  };
  const [showGoalTimeEdit, setShowGoalTimeEdit] = useState(false);
  const [dailyGoalHours, setDailyGoalHours] = useState(getDailyGoalHours);
  // 週の記録目標（自分のペース）。毎日=7 / 週5 / 週4 / 週3 / 週2。既定は週3。
  // 「毎日じゃない＝サボり」ではなく「自分で決めたペースを守れたか」で評価するための土台
  const [weeklyGoal, setWeeklyGoal] = useState(()=>Number(localStorage.getItem("jiroku_weekly_goal"))||3);
  const [showWeeklyGoalEdit, setShowWeeklyGoalEdit] = useState(false);
  const [showDoneTasks, setShowDoneTasks] = useState(false); // 完了タスク（フォルダ）の開閉
  const pickWeeklyGoal = (n)=>{ localStorage.setItem("jiroku_weekly_goal", String(n)); setWeeklyGoal(n); setShowWeeklyGoalEdit(false); };
  // 0.5〜6時間までは選択肢を並べるだけで済んだが、12時間まで広げると
  // 0.5刻みで24個にもなり選びにくいため、+/-で刻むステッパー形式にする
  const [pendingGoalHours, setPendingGoalHours] = useState(dailyGoalHours);
  const onEditDailyGoal = () => { setPendingGoalHours(dailyGoalHours); setShowGoalTimeEdit(true); };
  const pickDailyGoal = (h) => {
    localStorage.setItem("jiroku_daily_goal_hours", String(h));
    setDailyGoalHours(h);
    setShowGoalTimeEdit(false);
  };
  useEffect(()=>{
    if(!isActive) return;
    // タイマーでタスクが完了扱いになっている場合があるため、チェック状態を再読込して
    // 「今日のタスク」の✓を最新化する（タイマー→ホームに戻った時に反映）
    try { const c = JSON.parse(localStorage.getItem("today_actions")||"{}"); setChecked(c); } catch(e){}
    // キャッシュで即時表示
    const cachedGame = localStorage.getItem("cache_gameStatus");
    const cachedReport = localStorage.getItem("cache_report");
    const cachedRanking = localStorage.getItem("cache_ranking");
    const cachedStatus = localStorage.getItem("cache_status");
    if(cachedGame) { try { const g=JSON.parse(cachedGame); setGame(g); if(g.goals?.length) onGoalSaved(g.goals); } catch(e){} }
    if(cachedReport) { try { setReport(JSON.parse(cachedReport)); } catch(e){} }
    if(cachedRanking) { try { setRanking(JSON.parse(cachedRanking)); } catch(e){} }
    if(cachedStatus) { try { setStatusSummary(JSON.parse(cachedStatus)); } catch(e){} }

    // ホームに必要なデータの適用処理（統合API・従来APIのどちらから来ても同じ形で受ける）
    const todayStr = formatDateStr(new Date());
    const applyHome = (d)=>{
      if(d.report){ setReport(d.report); localStorage.setItem("cache_report", JSON.stringify(d.report)); }
      if(d.game){
        setGame(d.game);
        localStorage.setItem("cache_gameStatus", JSON.stringify(d.game));
        if(d.game.goals?.length){ localStorage.setItem("jiroku_goals",JSON.stringify(d.game.goals)); onGoalSaved(d.game.goals); }
      }
      if(d.schedule) setSchedule(d.schedule);
      if(d.logs){
        setTodayLogs(d.logs);
        // 今日の記録のうち、まだカレンダーに書けていないものを補完（独り言等の取りこぼし対策）
        if(localStorage.getItem("cal_linked")) reconcileCalendarForDate(todayStr, d.logs);
      }
      if(d.ranking){
        // 順位変動（trend）はサーバー側で「前回のランキング開催日の順位」と比較して算出される
        setRanking(d.ranking);
        localStorage.setItem("cache_ranking", JSON.stringify(d.ranking));
      }
      if(d.status){ setStatusSummary(d.status); localStorage.setItem("cache_status", JSON.stringify(d.status)); }
      if(d.weekly){
        setWeekly(d.weekly);
        if(d.weekly.reflection) setWeekReflection(d.weekly.reflection);
        if(d.weekly.nextIntention) setWeekIntention(d.weekly.nextIntention);
      }
      // ★Tasksシートを正とした反映（Phase 3）★
      //   下の Journal.actions 同期より後に走らせる（あとに適用した方が勝つため、
      //   Tasksシートの内容が最終的な画面になる）。
      setTimeout(()=>{ Promise.resolve(applyTasksFromServer()).catch(e=>{ console.error("[JIROKU] タスク同期の取得に失敗:", e); }); }, 0);
      // 今日のアクションの端末間同期
      if(d.todayActions){
        // ★タスク一覧はサーバーと突き合わせて1つにまとめる★
        //   以前は「端末に無いときだけ」受け取っていたため、
        //   両方にタスクがあると一生混ざらなかった。
        if(d.todayActions.actions !== null){
          const fromServer = normalizeTaskList(d.todayActions.actions);
          let localList = [];
          try {
            const raw = localStorage.getItem("jiroku_custom_actions_"+todayStr);
            localList = raw ? normalizeTaskList(JSON.parse(raw)) : [];
          } catch(e){}
          const merged = mergeTaskLists(localList, fromServer);
          const changed = merged.length !== localList.length ||
                          merged.some((t,i)=>!localList[i] || localList[i].id !== t.id);
          if (changed) {
            setCustomActions(merged);
            localStorage.setItem("jiroku_custom_actions_"+todayStr, JSON.stringify(merged));
            // まとめた結果を相手にも伝える（両方が同じ一覧になるように）
            gasPostJson("saveTodayActions", { actions: JSON.stringify(merged), noBridge: "1" });
          }
        }
        // ★設定（重要度・期限・想定時間・メモ・進捗）は常に受け取る★
        //   以前はこの処理を上の if の中に入れていたため、
        //   端末にタスクがあると一度も動かなかった。
        //   PCには既にタスクがあるので、スマホの設定が永久に届かなかった。
        //   一覧を受け取るかどうかと、設定を受け取るかどうかは別の話。
        if(d.todayActions.actions !== null){
          const meta = normalizeTaskList(d.todayActions.actions);
          //   この端末で既に設定してある値は上書きしない。
          //   上書きすると「さっき変えたのに戻った」になる。
          const takeIn = (cur, pick) => {
            const next = {...cur};
            let changed = false;
            meta.forEach(t=>{
              const v = pick(t);
              if (v === undefined || v === "" || v === null) return;
              if (next[t.id] !== undefined) return;   // この端末の値を優先
              next[t.id] = v; changed = true;
            });
            return changed ? next : null;
          };
          const ni = takeIn(taskImportance, t=>t.imp);
          if (ni) { setTaskImportance(ni); localStorage.setItem("jiroku_task_importance_"+todayStr, JSON.stringify(ni)); }
          const nd = takeIn(taskDue, t=>t.due);
          if (nd) { setTaskDue(nd); localStorage.setItem("jiroku_task_due_"+todayStr, JSON.stringify(nd)); }
          const ne = takeIn(taskEstimates, t=>t.est);
          if (ne) { setTaskEstimates(ne); localStorage.setItem("jiroku_task_estimates_"+todayStr, JSON.stringify(ne)); }
          const nm = takeIn(taskNotes, t=>t.memo);
          if (nm) { setTaskNotes(nm); localStorage.setItem("jiroku_task_memo_"+todayStr, JSON.stringify(nm)); }
          const ns = takeIn(taskStatus, t=>t.stt);
          if (ns) { setTaskStatus(ns); localStorage.setItem("jiroku_task_status_"+todayStr, JSON.stringify(ns)); }
        }
        if(d.todayActions.checked && Object.keys(d.todayActions.checked).length > 0){
          setChecked(prev=>{
            const merged = {...d.todayActions.checked, ...prev};
            localStorage.setItem("today_actions", JSON.stringify(merged));
            return merged;
          });
        }
      }
      // 今日いちばんやりたいこと（サーバーを正として同期。未宣言なら朝〜夕方だけモーダル）
      try {
        const localIntent = JSON.parse(localStorage.getItem("jiroku_intent")||"null");
        const hasToday = localIntent && localIntent.date === todayStr;
        const skipped = localStorage.getItem("jiroku_intent_skip") === todayStr;
        if(d.intent && d.intent.intent){
          const next = {date:todayStr, intent:d.intent.intent, done:d.intent.done, hours:d.intent.hours};
          localStorage.setItem("jiroku_intent", JSON.stringify(next));
          setIntent(next);
        } else if(!hasToday && !skipped){
          const h = new Date().getHours();
          if(h >= 6 && h < 18){ setIntentEditMode(false); setShowIntentModal(true); }
        }
      } catch(e){}
    };

    // 統合API1本で取得（9本の並列リクエストがGASの同時実行制限で順番待ちになり
    // 遅かったため）。失敗時のみ従来の個別APIにフォールバックする
    const legacyFetch = ()=>{
      gasApi("getWeeklySummary").then(r=>{ if(r.ok) applyHome({weekly:r.data}); });
      Promise.all([
        gasApi("getReport"), gasApi("getGameStatus"), gasApi("getSchedule"),
        gasApi("getLogs"), gasApi("getRanking"), gasApi("getStatusSummary"),
      ]).then(([rep, game, sched, logs, rank, status])=>{
        applyHome({report:rep.ok?rep.data:null, game:game.ok?game.data:null, schedule:sched.ok?sched.data:null,
          logs:logs.ok?logs.data:null, ranking:rank.ok?rank.data:null, status:(status.ok&&status.data)?status.data:null});
      });
      gasApi("getTodayActions").then(r=>{ if(r.ok&&r.data) applyHome({todayActions:r.data}); });
      gasApi("getIntent").then(r=>{ applyHome({intent:(r.ok&&r.data)?r.data:null}); });
    };
    gasApi("getHomeData").then(r=>{
      if(r && r.ok && r.data) applyHome(r.data);
      else legacyFetch();
    }).catch(legacyFetch);

    // カレンダー連携済みなら本人権限で直接取得（GAS経由はスクリプト所有者しか読めないためのフォールバック）
    if(localStorage.getItem("cal_linked")){
      // 前回書き込めずにキューに溜まった記録があれば、この機会にまとめて再送する
      flushCalendarQueue();
      // 過去の記録の取りこぼしを1日1回だけ遡って補完する（独り言など、以前カレンダーに
      // 書けていなかった分をここで拾う）。直近14日分を裏でゆっくり処理する
      (async ()=>{
        const today = formatDateStr(new Date());
        if(localStorage.getItem("cal_backfill_done")===today) return;
        for(let k=1;k<=14;k++){
          const d = addDays(today,-k);
          try{ const r = await gasApi("getLogs",{date:d}); if(r&&r.ok) await reconcileCalendarForDate(d, r.data); }catch(e){}
        }
        localStorage.setItem("cal_backfill_done", today);
      })();
      fetchCalendarEvents(formatDateStr(new Date())).then(evs=>{
        if(evs&&evs.length) setSchedule(evs.map(e=>({time:e.time,title:e.title,sub:e.sub})));
      });
      // 明日の予定もサーバーに同期しておく（夜のレポート・朝のメッセージが「明日は〜」を
      // 実際の予定に基づいて正しく言えるようにするため。fetchはsyncCalendarで裏で保存される）
      fetchCalendarEvents(addDays(formatDateStr(new Date()),1)).catch(()=>{});
    }

    // 日付が変わったらチェック状態リセット
    const today = formatDateStr(new Date());
    const saved = localStorage.getItem("today_actions_date");
    if(saved !== today){ localStorage.removeItem("today_actions"); localStorage.setItem("today_actions_date", today); setChecked({}); }

    // （今日のアクション同期・今日いちばんやりたいことの同期は、上のapplyHome/統合APIに集約済み）
  },[isActive]);

  const goalsArr = Array.isArray(goalData) ? goalData : (goalData?.goal ? [goalData] : []);
  const mainGoal = goalsArr[0] || null;
  const daysLeft = mainGoal?.deadline
    ? Math.ceil((new Date(mainGoal.deadline) - new Date()) / 86400000)
    : null;

  // 「今日のタスク」は、ユーザーが自分で追加したものだけを表示する。
  // AIコーチレポートの「明日のアクション」は自動でタスクには入れない（提案は
  // レポート画面で見られる）。要望により、勝手にタスクが増えないようにした。
  // 画面はまだ名前で動く（Phase 2 で task_id へ差し替える）。
  // ここで名前の配列へ落として、既存の参照をそのまま生かす。
  const taskList = customActions !== null ? customActions : [];
  const actionItems = taskList.map(function(t){ return t.title; });
  // ★保存するときに使う★ 名前の配列を [{id,title}] へ戻す。
  //   既にあるタスクは id をそのまま保つ（新しく振り直すと別物になる）。
  //   新しく増えたものだけ id を作る。
  const toStored = function(titles){
    const prev = {};
    (customActions||[]).forEach(function(t){ if(!prev[t.title]) prev[t.title]=t.id; });
    const used = {};
    return titles.map(function(title, i){
      let id = prev[title];
      if(!id || used[id]) id = makeClientTaskId();   // 新規・同名2件目はランダムID
      used[id] = 1;
      const o = { id: id, title: title };
      // 端末内のマップから拾って一緒に保存する（他の端末へ届くように）
      const imp = taskImportance[id] || taskImportance[title];
      const due = taskDue[id] || taskDue[title];
      const est = taskEstimates[id] !== undefined ? taskEstimates[id] : taskEstimates[title];
      const memo = taskNotes[id] || taskNotes[title];
      const stt  = taskStatus[id] || taskStatus[title];
      if (imp) o.imp = imp;
      if (due) o.due = due;
      if (est > 0) o.est = Number(est);
      if (memo) o.memo = String(memo);
      if (stt)  o.stt  = String(stt);
      return o;
    });
  };
  // 名前から id を引く（Phase 2 への足がかり。いまは保存にだけ使う）
  const idOfTitle = function(title){
    const hit = taskList.find(function(t){ return t.title===title; });
    return hit ? hit.id : "";
  };

  // タイマー画面の「何に集中しますか？」からも今日のタスクを選べるよう、
  // 完了していない項目を端末に共有しておく（未完了のものだけ、選ぶ意味があるため）。
  // 想定時間(min)も一緒に載せて、タイマーで選んだ時にその時間で始められるようにする
  useEffect(()=>{
    try {
      const remaining = actionItems.filter(item=>!isDone(item)).map(t=>({text:t, min:(estOf(t)||null)}));
      localStorage.setItem("jiroku_today_actions_shared", JSON.stringify({date:todayKey, items:remaining}));
    } catch(e){}
  },[actionItems, checked, todayKey, taskEstimates]);

  const toggleCheck = (key) => {
    const idk = idOfTitle(key) || key;
    const cur = (checked[idk] !== undefined) ? checked[idk] : checked[key];
    const next = {...checked, [idk]: !cur};
    if (idk !== key) delete next[key];   // 旧形式（名前キー）の掃除
    setChecked(next);
    localStorage.setItem("today_actions", JSON.stringify(next));
    gasPostJson("saveTodayActions", {checked: JSON.stringify(next), noBridge: "1"}); // 他端末にも同期
    enqueueTaskMutation("UPDATE", idk, { status: !cur ? "DONE" : "TODO" },
                        { status: cur ? "DONE" : (taskStatus[idk]==="doing" ? "IN_PROGRESS" : "TODO") });
  };

  // ── タスクボード用ヘルパー ──
  // 状態: "todo"=予定 / "doing"=実行中 / "done"=完了。未設定はchecked（完了フラグ）から導出
  const statusOf = (task) => {
    const k = idOfTitle(task);
    return (k && taskStatus[k]) || taskStatus[task] || (isDone(task) ? "done" : "todo");
  };
  const setStatus = (task, status) => {
    const sKey = idOfTitle(task) || task;
    const next = {...taskStatus, [sKey]: status};
    if (sKey !== task) delete next[task];
    setTaskStatus(next);
    try { localStorage.setItem("jiroku_task_status_"+todayKey, JSON.stringify(next)); } catch(e){}
    // 完了状態は既存のchecked(today_actions)とも同期し、レポート・完了フォルダ等の互換を保つ
    const nc = {...checked};
    if(status==="done") nc[task]=true; else delete nc[task];
    setChecked(nc);
    localStorage.setItem("today_actions", JSON.stringify(nc));
    gasPostJson("saveTodayActions", {checked: JSON.stringify(nc), noBridge: "1"});
    pushTaskMeta({ stt: next });
    // Tasksシートへ直接（キュー経由でまとめ送り）
    const stMap = { done: "DONE", doing: "IN_PROGRESS", todo: "TODO" };
    enqueueTaskMutation("UPDATE", sKey, { status: stMap[status] || "TODO" },
                        { status: stMap[statusOf(task)] || "TODO" });
  };
  // カードをタップ→タイマー画面へ。想定時間つきならその時間で、タイマー側が自動選択する。
  // タイマーに送ったタスクは「実行中」に進める（着手の可視化）
  const goToTimerWith = (task) => {
    try { localStorage.setItem("jiroku_timer_pending_task", JSON.stringify({text:task, min:(estOf(task)||null), date:todayKey})); } catch(e){}
    if(statusOf(task)==="todo") setStatus(task, "doing");
    onGoTimer && onGoTimer();
  };
  // タスクのメモを保存（詳細画面）
  const setTaskNote = (task, note) => {
    const nKey = idOfTitle(task) || task;
    // ★打ち始める前の値を控える★ 送信は1.2秒後なので、そのときの値を
    //   base に使うと「自分が今打った内容」と比べることになり検出できない
    if (window.__memoBase === undefined || window.__memoBaseKey !== nKey) {
      window.__memoBaseKey = nKey;
      window.__memoBase = taskNotes[nKey] || taskNotes[task] || "";
    }
    const next = {...taskNotes, [nKey]: note};
    if (nKey !== task) delete next[task];
    setTaskNotes(next);
    try { localStorage.setItem("jiroku_task_memo_"+todayKey, JSON.stringify(next)); } catch(e){}
    // メモは打つたびに送ると通信が多すぎるので、少し待ってからまとめて送る
    clearTimeout(window.__jirokuMemoTimer);
    window.__jirokuMemoTimer = setTimeout(()=>{
      pushTaskMeta({ memo: next });
      enqueueTaskMutation("UPDATE", nKey, { memo: String(note || "") },
                          { memo: window.__memoBase || "" });
      window.__memoBase = undefined; window.__memoBaseKey = undefined;
    }, 1200);
  };
  // タスクの想定時間を更新（詳細画面）
  const setTaskTime = (task, min) => {
    const m = Math.round(Number(min));
    const key = idOfTitle(task) || task;
    const next = {...taskEstimates};
    if(m>0 && m<=600) next[key]=m; else delete next[key];
    delete next[task];   // 旧形式（名前キー）の掃除
    setTaskEstimates(next);
    try { localStorage.setItem("jiroku_task_estimates_"+todayKey, JSON.stringify(next)); } catch(e){}
    pushTaskMeta({ est: next });
    enqueueTaskMutation("UPDATE", key, { estimated_minutes: (m>0 && m<=600) ? m : "" },
                        { estimated_minutes: (taskEstimates[key] !== undefined ? taskEstimates[key] : "") });
  };
  // タスクの文脈（仕事/プライベート等）。初期値はUNSET。タイトルから推測しない
  const setTaskCtx = (task, v) => {
    const key = idOfTitle(task) || task;
    const next = {...taskContext};
    if (v && v !== "UNSET") next[key] = v; else delete next[key];
    setTaskContextMap(next);
    try { localStorage.setItem("jiroku_task_context_"+todayKey, JSON.stringify(next)); } catch(e){}
    enqueueTaskMutation("UPDATE", key, { context: v || "UNSET" },
                        { context: taskContext[key] || taskContext[task] || "UNSET" });
  };
  // 持ち越し: 同じtask_idのまま日付を移す（複製しない）。一覧からは外す
  const carryOverLocal = (task, toDate) => {
    const id = idOfTitle(task);
    if (!id) return;
    enqueueTaskMutation("CARRY_OVER", id, { to_date: toDate });
    // 今日の一覧から外す（Tasksシート側は日付が変わるだけで消えない）
    const list = actionItems.filter(x=>x!==task);
    if(list.length===0){ setCustomActions(null); localStorage.removeItem("jiroku_custom_actions_"+todayKey); }
    else { const st=toStored(list); setCustomActions(st); localStorage.setItem("jiroku_custom_actions_"+todayKey, JSON.stringify(st)); }
    gasPostJson("saveTodayActions", {actions: list.length===0?"":JSON.stringify(toStored(list)), noBridge: "1"});
    setCarryPick(null); setDetailTask(null);
  };
  // タスクを削除（詳細画面）。関連する状態・時間・メモ・チェックも掃除する
  const deleteTask = (task) => {
    // ★Tasksシートにも「消えた」と伝える★（キュー経由。残ると復活する）
    const delId = idOfTitle(task);
    if (delId) enqueueTaskMutation("DELETE", delId, {});
    const list = actionItems.filter(t=>t!==task);
    if(list.length===0){ setCustomActions(null); localStorage.removeItem("jiroku_custom_actions_"+todayKey); }
    else { const st=toStored(list); setCustomActions(st); localStorage.setItem("jiroku_custom_actions_"+todayKey, JSON.stringify(st)); }
    const eKey=idOfTitle(task); const est={...taskEstimates}; delete est[eKey]; delete est[task];
    setTaskEstimates(est); localStorage.setItem("jiroku_task_estimates_"+todayKey, JSON.stringify(est));
    const impKey=idOfTitle(task); const imp={...taskImportance}; delete imp[impKey]; delete imp[task];
    setTaskImportance(imp); localStorage.setItem("jiroku_task_importance_"+todayKey, JSON.stringify(imp));
    const duKey=idOfTitle(task); const du={...taskDue}; delete du[duKey]; delete du[task];
    setTaskDue(du); localStorage.setItem("jiroku_task_due_"+todayKey, JSON.stringify(du));
    const k2=idOfTitle(task);
    const stt={...taskStatus}; delete stt[k2]; delete stt[task]; setTaskStatus(stt); localStorage.setItem("jiroku_task_status_"+todayKey, JSON.stringify(stt));
    const nt={...taskNotes}; delete nt[k2]; delete nt[task]; setTaskNotes(nt); localStorage.setItem("jiroku_task_memo_"+todayKey, JSON.stringify(nt));
    const cKey=idOfTitle(task); const nc={...checked}; delete nc[cKey]; delete nc[task];
    setChecked(nc); localStorage.setItem("today_actions", JSON.stringify(nc));
    // ★toStoredを通す★ タイトルだけの配列で保存すると、Journal.actionsが
    //   id無しの旧形式へ退化する（実際にdry-runで退化が見つかった）
    gasPostJson("saveTodayActions", {actions: list.length===0?"":JSON.stringify(toStored(list)), checked: JSON.stringify(nc), noBridge: "1"});
    setDetailTask(null);
  };

  // 現在のタスク(文字列配列)＋想定時間マップから、編集用の {text,min} 配列を作る
  // 重要度・期限の設定。既存の setTaskTime と同じ形にそろえる
  const setTaskImp = (task, v) => {
    // ★id をキーに書く★ 名前で書くと改名で外れる
    const key = idOfTitle(task) || task;
    const next = {...taskImportance};
    if (v) next[key] = v; else delete next[key];
    delete next[task];   // 旧形式（名前キー）が残っていたら掃除する
    setTaskImportance(next);
    localStorage.setItem("jiroku_task_importance_"+todayKey, JSON.stringify(next));
    pushTaskMeta({ imp: next });
    enqueueTaskMutation("UPDATE", key, { importance_level: v || "" },
                        { importance_level: taskImportance[key] || taskImportance[task] || "" });
  };
  // ★サーバー（Tasksシート）を正として画面へ反映する★
  //   これまで「端末の値を優先」で取り込んでいたため、端末間で
  //   食い違いが残り続けた。今後はTasksシートが正。
  //   ただし、この端末で既に操作を始めていたら適用しない。
  //   読み込みが遅れて届いたとき、いま入力した内容を消してしまうため。
  const applyTasksFromServer = async () => {
    // ★守る範囲を絞る★（以前は「何か操作したら以後すべて適用しない」だった）
    //   ・編集モーダルや詳細を開いている間 → 適用しない（入力中の値を消さないため）
    //   ・送信待ち／競合のタスク → そのタスクだけ適用しない
    //   ・それ以外 → サーバーの値へ更新する（古い端末が永久に残らないように）
    if (editMode || detailTask) return;
    const r = await gasApi("getTasks", { includeDone: "1" });
    if (!r || !r.ok || !Array.isArray(r.data)) return;
    if (editMode || detailTask) return;   // 通信中に開いたら適用しない
    const hold = {};   // 送信待ち・競合中のタスクは端末の値を保つ
    loadTaskQueue().forEach(m => { hold[m.task_id] = 1; });
    // 今日の分だけ。ARCHIVED は画面に出さない
    const rows = r.data.filter(t => String(t.date).slice(0,10) === todayKey && t.status !== "ARCHIVED");
    if (!rows.length && !(customActions||[]).length) return;
    // サーバーの進捗語彙（大文字）を画面の語彙（小文字）へ
    const sttOf = s => s === "DONE" ? "done" : s === "IN_PROGRESS" ? "doing" : "todo";
    // 並び順はこの端末の今の並びを保つ（勝手に入れ替わると探せなくなる）。
    // この端末に無いタスクは後ろへ足す
    const curIds = (customActions || []).map(t => t.id);
    rows.sort((a, b) => {
      const ia = curIds.indexOf(a.task_id), ib = curIds.indexOf(b.task_id);
      return (ia === -1 ? 1e9 : ia) - (ib === -1 ? 1e9 : ib);
    });
    // 版を控える（次の更新で base_version として送る）
    rows.forEach(t => setTaskVersion(t.task_id, t.version));
    // 送信待ちのタスクは端末の姿を保つ（サーバーにまだ届いていない変更を消さない）
    const heldLocal = (customActions||[]).filter(t => hold[t.id] && !rows.some(x => x.task_id === t.id));
    const list = rows.map(t => ({ id: t.task_id, title: t.title })).concat(
      heldLocal.map(t => ({ id: t.id, title: t.title })));
    const imp = {}, due = {}, est = {}, memo = {}, stt = {}, chk = {}, ctx = {}, cry = {};
    rows.forEach(t => {
      if (t.context && t.context !== "UNSET") ctx[t.task_id] = t.context;
      cry[t.task_id] = Number(t.carryover_count || 0);
      if (hold[t.task_id]) {   // 端末の値を優先
        if (taskImportance[t.task_id]) imp[t.task_id] = taskImportance[t.task_id];
        if (taskDue[t.task_id]) due[t.task_id] = taskDue[t.task_id];
        if (taskEstimates[t.task_id] !== undefined) est[t.task_id] = taskEstimates[t.task_id];
        if (taskNotes[t.task_id]) memo[t.task_id] = taskNotes[t.task_id];
        if (taskStatus[t.task_id]) stt[t.task_id] = taskStatus[t.task_id];
        if (isDone(t.title)) chk[t.task_id] = true;
        return;
      }
      if (t.importance_level && !t.importance_is_suggestion) imp[t.task_id] = t.importance_level;
      if (t.due_at) due[t.task_id] = t.due_at;
      if (Number(t.estimated_minutes) > 0) est[t.task_id] = Number(t.estimated_minutes);
      if (t.memo) memo[t.task_id] = String(t.memo);
      stt[t.task_id] = sttOf(t.status);
      if (t.status === "DONE") chk[t.task_id] = true;
    });
    heldLocal.forEach(t => {
      if (taskImportance[t.id]) imp[t.id] = taskImportance[t.id];
      if (taskDue[t.id]) due[t.id] = taskDue[t.id];
      if (taskEstimates[t.id] !== undefined) est[t.id] = taskEstimates[t.id];
      if (taskNotes[t.id]) memo[t.id] = taskNotes[t.id];
      if (taskStatus[t.id]) stt[t.id] = taskStatus[t.id];
      if (isDone(t.title)) chk[t.id] = true;
    });
    setCustomActions(list); localStorage.setItem("jiroku_custom_actions_"+todayKey, JSON.stringify(list));
    setTaskImportance(imp); localStorage.setItem("jiroku_task_importance_"+todayKey, JSON.stringify(imp));
    setTaskDue(due);        localStorage.setItem("jiroku_task_due_"+todayKey, JSON.stringify(due));
    setTaskEstimates(est);  localStorage.setItem("jiroku_task_estimates_"+todayKey, JSON.stringify(est));
    setTaskNotes(memo);     localStorage.setItem("jiroku_task_memo_"+todayKey, JSON.stringify(memo));
    setTaskStatus(stt);     localStorage.setItem("jiroku_task_status_"+todayKey, JSON.stringify(stt));
    setChecked(chk);        localStorage.setItem("today_actions", JSON.stringify(chk));
    setTaskContextMap(ctx); localStorage.setItem("jiroku_task_context_"+todayKey, JSON.stringify(ctx));
    setTaskCarry(cry);      localStorage.setItem("jiroku_task_carry_"+todayKey, JSON.stringify(cry));
  };

  // 送信が済んだら最新を取り直す（他端末の変更もここで届く）
  useEffect(()=>{
    // ★確認待ち（旧: 競合）が残っていても取得は止めない★
    //   確認待ちのタスクは applyTasksFromServer 側が個別に守るので、
    //   他のタスクの同期まで道連れにしない。以前は「キューが空のときだけ
    //   取得」にしていたため、確認待ち3件が居座るとスマホが一切
    //   同期しなくなった（実際に起きた）。
    const refetch = () => { if (!loadTaskQueue().some(x=>x.state==="pending")) applyTasksFromServer(); };
    const onVis = () => { if (document.visibilityState === "visible") refetch(); };
    window.addEventListener("jiroku:taskflushed", refetch);
    document.addEventListener("visibilitychange", onVis);
    const timer = setInterval(refetch, 60000);   // 画面を開きっぱなしでも1分ごとに追いつく
    return () => { window.removeEventListener("jiroku:taskflushed", refetch);
                   document.removeEventListener("visibilitychange", onVis);
                   clearInterval(timer); };
  });

  // ★設定を変えたら、その場でサーバーへ送る★
  //   これまでは localStorage に書くだけで、タスクの追加や編集をした
  //   ついでにしか送られていなかった。重要度や期限だけ変えても
  //   他の端末に届かない（実際にそうなった）。
  //   setState は非同期なので、変更後の値を引数で受け取る。
  const pushTaskMeta = (over) => {
    const o = over || {};
    const imp = o.imp || taskImportance, due = o.due || taskDue;
    const est = o.est || taskEstimates, memo = o.memo || taskNotes, stt = o.stt || taskStatus;
    const list = (customActions||[]);
    if (!list.length) return;
    const payload = list.map(t=>{
      const x = { id:t.id, title:t.title };
      const a = imp[t.id]  || imp[t.title];   if (a) x.imp = a;
      const b = due[t.id]  || due[t.title];   if (b) x.due = b;
      const c = est[t.id] !== undefined ? est[t.id] : est[t.title]; if (c > 0) x.est = Number(c);
      const d = memo[t.id] || memo[t.title];  if (d) x.memo = String(d);
      const e = stt[t.id]  || stt[t.title];   if (e) x.stt = String(e);
      return x;
    });
    gasPostJson("saveTodayActions", { actions: JSON.stringify(payload), noBridge: "1" });
  };

  // ★読み出しは必ずここを通す★
  //   「idで引き、無ければ名前で引く」を11箇所に散らすと必ず書き漏らす。
  // ★完了状態も id で引く★
  //   checked は customActions より前に宣言されているので、
  //   初期化の時点では付け替えられない。読むときに両方見て、
  //   別途まとめて付け替える（下の useEffect）。
  const isDone = (task) => {
    const k = idOfTitle(task);
    return !!((k && checked[k] !== undefined) ? checked[k] : checked[task]);
  };
  const dueOf = (task) => taskDue[idOfTitle(task)] || taskDue[task] || "";
  // 想定時間も同じく1本化する。散らすと必ず書き漏らす
  const estOf = (task) => {
    const k = idOfTitle(task);
    const v = (k && taskEstimates[k] !== undefined) ? taskEstimates[k] : taskEstimates[task];
    return (v === undefined || v === null || v === "") ? "" : v;
  };
  const setTaskDueAt = (task, v) => {
    const key = idOfTitle(task) || task;
    const next = {...taskDue};
    if (v) next[key] = v; else delete next[key];
    delete next[task];   // 旧形式（名前キー）の掃除
    setTaskDue(next);
    localStorage.setItem("jiroku_task_due_"+todayKey, JSON.stringify(next));
    pushTaskMeta({ due: next });
    enqueueTaskMutation("UPDATE", key, { due_at: v || "" },
                        { due_at: taskDue[key] || taskDue[task] || "" });
  };
  // ★緊急度と4分類は保存しない★
  // 期限から都度出す。保存すると日付が変わっても古い判定が残る。
  // 判定の中身はサーバー（computeUrgency / classifyTask）と同じ規則。
  const quadrantOf = (task) => {
    const impKey = idOfTitle(task);
    const imp = (impKey && taskImportance[impKey]) || taskImportance[task] || "MEDIUM";
    const due = dueOf(task);
    let urg = "NONE", overdue = false;
    if (due) {
      const p = String(due).substring(0,10).split("-");
      const d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
      const n = new Date(); const t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
      const days = Math.round((d - t0) / 86400000);
      if (days < 0) { urg = "HIGH"; overdue = true; }
      else if (days <= 1) urg = "HIGH";
      else if (days <= 3) urg = "MEDIUM";
      else urg = "LOW";
    }
    const important = imp === "HIGH", urgent = urg === "HIGH";
    const q = important && urgent ? "DO_NOW"
            : important ? "SCHEDULE"
            : urgent ? "DELEGATE_OR_LIMIT" : "DEFER_OR_DELETE";
    return { importance: imp, urgency: urg, overdue: overdue, quadrant: q,
             isSuggestion: !((impKey && taskImportance[impKey]) || taskImportance[task]) };
  };

  // ★重要度と期限も一緒に持ち運ぶ★
  // タスク名がそのまま識別子になっているため、名前を変えると
  // 名前をキーにした情報（想定時間・重要度・期限）が古い名前に取り残される。
  // 想定時間は編集フォームを経由するので生き残っていたが、
  // 重要度と期限はフォームに無いため、改名すると消えていた（実装直後の不具合）。
  // 行に載せて一緒に運ぶ。
  const toEditRows = (arr) => arr.map(t=>({
    text:t,
    min:(estOf(t)!==""?String(estOf(t)):""),
    imp:(taskImportance[idOfTitle(t)]||taskImportance[t]||""),
    due:dueOf(t)
  }));
  // 編集モーダルには「未完了のタスクだけ」を出す。完了済みは編集対象にしない
  // （完了フォルダにそのまま残す）。保存時に完了タスクは保持してマージする
  const openEdit = () => {
    const incomplete = actionItems.filter(t=>!isDone(t));
    setEditItems(incomplete.length===0 ? [{text:"",min:""}] : toEditRows(incomplete));
    setEditMode(true);
  };
  // ★編集画面を開くたびに前回の警告を消す★
  // 残っていると、直したのに怒られ続けているように見える
  useEffect(()=>{ if(editMode) setEditError(""); },[editMode]);
  // ★Tasksシートへの移行（Phase 3）の下見★
  //   いまタスクは Journal の1列にJSONで入っており、Tasksシートは空。
  //   移すと日をまたいだ持ち越しを追えるようになる。
  //   まず「何件どうなるか」だけを出す。実行はしない。
  //   window から呼べるようにしておく（画面には出さない。運用者用）。
  useEffect(()=>{
    window.jirokuTaskMigrationDryRun = async () => {
      const items = (customActions||[]).map(t=>({
        id:t.id, title:t.title,
        imp:taskImportance[t.id]||"", due:taskDue[t.id]||"",
        est:taskEstimates[t.id]||"", memo:taskNotes[t.id]||"", stt:taskStatus[t.id]||""
      }));
      const r = await gasApi("migrateTasksToSheet", { items: JSON.stringify(items), date: todayKey });
      console.log("[JIROKU] タスク移行の下見:", r);
      return r;
    };
  },[customActions, taskImportance, taskDue, taskEstimates, taskNotes, taskStatus, todayKey]);

  // 「＋ タスクを追加」用。未完了タスクに空欄を1つ足した状態で編集モーダルを開き、すぐ入力できる
  const openAddTask = () => {
    setEditItems([...toEditRows(actionItems.filter(t=>!isDone(t))), {text:"",min:""}]);
    setEditMode(true);
  };
  const saveEdit = () => {
    const rows = editItems.map(r=>({text:String(r.text||"").trim(), min:r.min, imp:r.imp, due:r.due})).filter(r=>r.text.length>0);

    // ★同じ名前のタスクを2件作らせない（暫定の防御）★
    //   いまタスクは名前そのものが識別子で、完了・想定時間・重要度・期限は
    //   すべて名前をキーに持っている。同名が2件あると区別できず、
    //   片方を完了にすると両方が完了になる。データが静かに壊れる。
    //   本来は task_id で持つべきで、その変換層は用意した。
    //   画面の差し替えが済むまでは、作らせないことで防ぐ。
    const seen = {}, dup = [];
    rows.forEach(function(r){ if(seen[r.text]) { if(dup.indexOf(r.text)===-1) dup.push(r.text); } seen[r.text]=1; });
    if (dup.length) {
      setEditError("同じ名前のタスクが2つあります：「"+dup[0]+"」\n区別できないので、どちらかの名前を変えてください。");
      return;
    }
    setEditError("");
    const editedTexts = rows.map(r=>r.text);
    // 完了済みタスクは編集画面に出していないので、ここで保持してマージする（未完了→完了の順）
    const completed = actionItems.filter(t=>isDone(t) && !editedTexts.includes(t));
    const finalList = [...editedTexts, ...completed];
    // 想定時間マップを作り直す（編集分＋完了分の既存値を維持）
    const est = {};
    rows.forEach(r=>{ const m=Math.round(Number(r.min)); if(m>0 && m<=600) est[r.text]=m; });
    completed.forEach(c=>{ const ck=idOfTitle(c)||c; if(taskEstimates[ck]>0) est[ck]=taskEstimates[ck]; });
    setTaskEstimates(est);
    try { localStorage.setItem("jiroku_task_estimates_"+todayKey, JSON.stringify(est)); }catch(e){}
    // 重要度・期限も新しい名前で作り直す（改名で失わないため）
    const impMap = {}, dueMap = {};
    editItems.forEach(r=>{ const t=String(r.text||"").trim(); if(!t) return;
      if(r.imp) impMap[t]=r.imp; if(r.due) dueMap[t]=r.due; });
    completed.forEach(c=>{ const ck=idOfTitle(c)||c; if(taskImportance[ck]) impMap[ck]=taskImportance[ck];
                           const dk=idOfTitle(c)||c; if(taskDue[dk]) dueMap[dk]=taskDue[dk]; });
    setTaskImportance(impMap); setTaskDue(dueMap);
    try {
      localStorage.setItem("jiroku_task_importance_"+todayKey, JSON.stringify(impMap));
      localStorage.setItem("jiroku_task_due_"+todayKey, JSON.stringify(dueMap));
    }catch(e){}
    // 完了タスクのチェック状態は保持する
    const newChecked = {};
    completed.forEach(c=>{ newChecked[idOfTitle(c)||c]=true; });
    setChecked(newChecked);
    localStorage.setItem("today_actions", JSON.stringify(newChecked));
    // 空で保存したらAIアクションに戻す
    const storedList = toStored(finalList);
    // ★編集の差分をTasksシートへ（キュー経由）★
    //   新規=CREATE / 変更があったものだけUPDATE / 消えたものはDELETE。
    //   変更のないタスクまで送ると、versionが無意味に増えて他端末と競合する。
    const prevById = {};
    (customActions||[]).forEach(t=>{ prevById[t.id] = t.title; });
    storedList.forEach(t=>{
      if (prevById[t.id] === undefined) {
        enqueueTaskMutation("CREATE", t.id, {
          title: t.title, date: todayKey,
          importance_level: t.imp || "", due_at: t.due || "",
          estimated_minutes: t.est || "", memo: t.memo || "" });
        return;
      }
      const ch = {};
      if (prevById[t.id] !== t.title) ch.title = t.title;
      const oldImp = taskImportance[t.id] || "", oldDue = taskDue[t.id] || "";
      const oldEst = taskEstimates[t.id] !== undefined ? taskEstimates[t.id] : "";
      if (String(t.imp||"") !== String(oldImp)) ch.importance_level = t.imp || "";
      if (String(t.due||"") !== String(oldDue)) ch.due_at = t.due || "";
      if (String(t.est||"") !== String(oldEst)) ch.estimated_minutes = t.est || "";
      if (Object.keys(ch).length) {
        const bv = {};
        if (ch.title !== undefined) bv.title = prevById[t.id] || "";
        if (ch.importance_level !== undefined) bv.importance_level = oldImp;
        if (ch.due_at !== undefined) bv.due_at = oldDue;
        if (ch.estimated_minutes !== undefined) bv.estimated_minutes = oldEst;
        enqueueTaskMutation("UPDATE", t.id, ch, bv);
      }
    });
    (customActions||[]).forEach(t=>{
      if (!storedList.some(x=>x.id===t.id)) enqueueTaskMutation("DELETE", t.id, {});
    });
    if(finalList.length===0){ setCustomActions(null); localStorage.removeItem("jiroku_custom_actions_"+todayKey); }
    else { setCustomActions(storedList); localStorage.setItem("jiroku_custom_actions_"+todayKey, JSON.stringify(storedList)); }
    // 他端末にも同期
    gasPostJson("saveTodayActions", {actions: finalList.length===0?"":JSON.stringify(storedList), checked: JSON.stringify(newChecked), noBridge: "1"});
    setEditMode(false);
  };

  const isZoom = (s="") => /zoom\.us|meet\.google|teams\.microsoft/i.test(s);

  const today = new Date().toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"});

  const hour = new Date().getHours();
  const greeting = hour < 12 ? "おはようございます" : hour < 18 ? "こんにちは" : "お疲れ様です";
  const checkedCount = actionItems.filter(item=>isDone(item)).length;
  // タスクを「未完了」「完了」で分けて表示する（完了は下に折りたたみ）。
  // 元の並び順を保ったまま、チェック状態でフォルダ分けする
  // contextフィルタ（表示のみ）。UNSETは「すべて」でだけ見える…にすると
  // 未設定のタスクが仕事ビューから消えて事故るので、未設定は常に表示する
  const ctxVisible = (item) => {
    if (ctxFilter === "ALL") return true;
    const k = idOfTitle(item);
    const c = (k && taskContext[k]) || taskContext[item] || "UNSET";
    return c === ctxFilter || c === "UNSET";
  };
  const incompleteItems = actionItems.filter(item=>!isDone(item)&&ctxVisible(item));
  const completedItems = actionItems.filter(item=>isDone(item)&&ctxVisible(item));
  const doneCount = actionItems.filter(item=>statusOf(item)==="done").length;

  return html`<div style=${{paddingBottom:40}}>

    ${showInCommunity!==false && html`<${AchievementBanner} onOpenCommunity=${()=>setShowCommunity(true)}/>`}

    <!-- Hero Header -->
    <div style=${{background:"linear-gradient(135deg, var(--hero1) 0%, var(--hero2) 100%)",padding:"36px 20px 28px",position:"relative",overflow:"hidden"}}>
      <!-- 右下: 大きなロゴマーク装飾 -->

            <span style=${{flex:1,minWidth:0,fontSize:15,fontWeight:700,color:"var(--text)",lineHeight:1.4,textDecoration:intent.done?"line-through":"none",opacity:intent.done?0.6:1,overflow:"hidden",textOverflow:"ellipsis"}}>${intent.intent}</span>

          const targetH=Number(intent.hours)||dailyGoalHours;

          const pct=Math.min(100,Math.round(goalMins/targetMins*100));

            <div style=${{display:"flex",alignItems:"baseline",gap:6,marginBottom:8}}>
