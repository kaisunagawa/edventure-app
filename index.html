              ${impMin>0&&html` ・重要 ${fmtMin(impMin)}`}

                ${isDone(item)&&html`<svg width="11" height="11" viewBox="0 0 10 10" fill="none"><path d="M2 5l2.5 2.5L8 3" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`}

              <!-- ★タイトルに最低幅を持たせる★ 並び替えボタンを足したぶん幅が減り、

                   入りきらないラベルは下の行へ回す（flexWrap） -->
              <!-- ★1行におさめる★ 札や時間が下の行へ回ると、1件が2段になって読みにくい。

              <span style=${{flex:"1 1 auto",minWidth:0,fontSize:14,color:isDone(item)?"var(--sub)":"var(--text)",

                  return html`<span style=${{fontSize:10.5,fontWeight:700,color:L.color,border:"1px solid "+L.color,borderRadius:20,padding:"1px 7px",whiteSpace:"nowrap"}} title=${L.hint}>${L.icon}${L.label}</span>`; })()}

            ${COLS.map(column)}

    <!-- ★今週の自己経営の状態★（feature: self_mgmt_power_v1）

        if (m.evaluation_state === "not_evaluable") return { kind:"txt", label:"今週は評価対象なし" };

        return { kind:"txt", label:"データ不足" };

      };
      // ★このカードのUIはKaiの指定した形で作る★（2026-08-05）
      //   左に総合スコアと前週比、右に5角形。その下に「伸びている／のびしろ」、

        // ★「要確認」を灰色にしない★（2026-08-05 Kai指摘）
        //   灰色は「まだ測れていない」の色。要確認は測れたうえで低いので、
        //   気づける色にする。強み→安定→要確認→改善優先が
        //   青→緑→黄→赤と一段ずつ強くなるようにそろえた。
        "要確認":   {fg:"#F59E0B", bg:"rgba(245,158,11,0.15)"},
        "改善優先": {fg:"#EF4444", bg:"rgba(239,68,68,0.15)"},
        // 暫定は「まだ測れていない」ので灰色のまま
        "暫定":     {fg:"var(--sub)", bg:"rgba(148,163,184,0.14)"},
      };
      const ICON = {
        result_power: html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>`,
        time_allocation_power: html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>`,
        execution_power: html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
        continuity_power: html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 12a3 3 0 105 2.2l4-4.4A3 3 0 1117 12a3 3 0 01-5-2.2l-4 4.4A3 3 0 017 12z" stroke-linejoin="round"/></svg>`,
        recovery_power: html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 4v4h4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v4.5l3 1.8" stroke-linecap="round"/></svg>`,
      };
      const ev2 = M.filter(m=>m.evaluation_state==="evaluated"&&m.score!==null);
      const best2 = ev2.slice().sort((a,b)=>b.score-a.score)[0];
      const worst2 = ev2.slice().sort((a,b)=>a.score-b.score)[0];
      const pend2 = M.filter(m=>!(m.evaluation_state==="evaluated"&&m.score!==null)).map(m=>m.label);
      return html`
      <div style=${{margin:"12px 16px 0",background:"var(--card)",borderRadius:16,border:"1px solid var(--border)",padding:"16px 16px 14px"}}>
        <div style=${{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,marginBottom:6}}>
          <span style=${{flex:1,minWidth:0}}>
            <span style=${{display:"block",fontSize:15,fontWeight:800,color:"var(--text)"}}>今週の自己経営の状態</span>
            <span style=${{display:"block",fontSize:11,color:"var(--sub)",marginTop:4,lineHeight:1.5}}>5つの自己経営力から、今の状態を確認します</span>
          </span>
          <button onClick=${()=>setSmpDetail(true)}
            style=${{flexShrink:0,whiteSpace:"nowrap",background:"none",border:"none",color:"var(--accent)",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",padding:0}}>詳細を見る ›</button>
        </div>

        <!-- 総合スコア（左）と5角形（右）を並べる -->
        <div style=${{display:"flex",alignItems:"center",gap:2,marginBottom:12}}>
          <!-- 左端に貼りつくと窮屈に見えるので、少し内側へ寄せる（2026-08-05 Kai指摘） -->
          <div style=${{flex:"1 1 auto",minWidth:0,paddingLeft:10}}>
            ${ov!==null&&ov!==undefined ? html`
              <div style=${{fontSize:12,fontWeight:700,color:"var(--accent)",marginBottom:2}}>総合スコア</div>
              <div style=${{display:"flex",alignItems:"baseline",gap:3}}>
                <span style=${{fontSize:48,fontWeight:800,color:"var(--text)",lineHeight:1,letterSpacing:"-0.02em",fontVariantNumeric:"tabular-nums"}}>${ov}</span>
                <span style=${{fontSize:15,color:"var(--sub)",fontWeight:600}}>/ 100</span>
              </div>
              <!-- ★2つのバッジは同じ形にそろえる★（2026-08-05 Kai指摘）
                   片方だけ枠と背景の色を変えていたため、隣り合ったときに
                   大きさも重さもちぐはぐに見えていた。
                   枠・背景・文字の大きさは共通にして、変えるのは数字の色だけにする。 -->
              ${(()=>{
                const pill = {display:"inline-flex",alignItems:"center",gap:4,padding:"4px 9px",
                              borderRadius:8,border:"1px solid var(--border)",background:"var(--bg)"};
                const lbl  = {fontSize:9.5,color:"var(--sub)",fontWeight:600};
                const valS = {fontSize:11.5,fontWeight:800};
                return html`
                <div style=${{display:"flex",flexWrap:"wrap",gap:6,marginTop:9}}>
                  ${diff!==null&&html`
                    <span style=${pill}>
                      <span style=${lbl}>前週比</span>
                      <span style=${{...valS,color:diff>0?"var(--accent)":diff<0?"#F87171":"var(--sub)"}}>
                        ${diff>0?"+":""}${diff}</span>
                      <span style=${{fontSize:10,color:diff>0?"var(--accent)":diff<0?"#F87171":"var(--sub)"}}>
                        ${diff>0?"↗":diff<0?"↘":"→"}</span>
                    </span>`}
                  <!-- 同じ仲間（cohort）の中での位置。比べる相手が5人に満たないときは出さない -->
                  ${smp.data.top_percent&&html`
                    <span title=${smp.data.rank_total+"人中"+smp.data.rank+"位"} style=${pill}>
                      <span style=${lbl}>上位</span>
                      <span style=${{...valS,color:"var(--accent)"}}>${smp.data.top_percent}%</span>
                    </span>`}
                </div>`;
              })()}
              <div style=${{fontSize:10.5,color:"var(--sub)",marginTop:9,lineHeight:1.6}}>
                ${smp.data.evaluated_count}項目の平均（全${smp.data.metric_count}項目）${smp.data.provisional_count?"・うち暫定"+smp.data.provisional_count+"項目":""}
                ${smp.data.rank_total?html`<br/>${smp.data.rank_total}人中 ${smp.data.rank}位`:""}</div>
            ` : html`
              <div style=${{fontSize:12,color:"var(--sub)",lineHeight:1.8}}>
                記録がたまると、<br/>ここに総合スコアが出ます。</div>`}
          </div>
          <div style=${{flexShrink:0,marginLeft:"auto"}}>
            <${SelfMgmtRadar} metrics=${M} size=${186}/>
          </div>
        </div>

        <!-- いま伸びている ／ のびしろ -->
        ${ev2.length>0&&html`
          <div style=${{display:"flex",alignItems:"stretch",border:"1px solid var(--border)",borderRadius:12,
                        background:"var(--bg)",padding:"11px 6px",marginBottom:10}}>
            <div style=${{flex:1,minWidth:0,display:"flex",alignItems:"center",gap:9,padding:"0 8px"}}>
              <span style=${{flexShrink:0,color:"var(--accent)",display:"flex"}}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 17l6-6 4 4 8-8" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M15 7h6v6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              <span style=${{minWidth:0}}>
                <span style=${{display:"block",fontSize:10.5,color:"var(--sub)"}}>いま伸びている</span>
                <span style=${{display:"block",fontSize:13,fontWeight:800,color:"var(--accent)",marginTop:1}}>
                  ${best2.label} ${best2.score}</span>
              </span>
            </div>
            ${ev2.length>1&&html`
              <div style=${{width:1,background:"var(--border)",flexShrink:0}}/>
              <div style=${{flex:1,minWidth:0,display:"flex",alignItems:"center",gap:9,padding:"0 8px"}}>
                <span style=${{flexShrink:0,color:"var(--accent)",display:"flex"}}>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 3h12M6 21h12" stroke-linecap="round"/>
                    <path d="M8 3v3.5L12 11l4-4.5V3M8 21v-3.5L12 13l4 4.5V21" stroke-linejoin="round"/></svg></span>
                <span style=${{minWidth:0}}>
                  <span style=${{display:"block",fontSize:10.5,color:"var(--sub)"}}>のびしろ</span>
                  <span style=${{display:"block",fontSize:13,fontWeight:800,color:"var(--accent)",marginTop:1}}>
                    ${worst2.label} ${worst2.score}</span>
                </span>
              </div>`}
          </div>`}

        <!-- 5項目の一覧 -->
        <div style=${{border:"1px solid var(--border)",borderRadius:12,overflow:"hidden",marginBottom:10}}>
          ${M.map((m,i)=>{ const v=view(m);
            // ★暫定でも点数を隠さない★（2026-08-05 Kaiの判断）
            //   測れた要素が半分未満の項目を非表示にしていたため、
            //   素点があるのに何も出ない項目が生まれ「消えた」と見えていた。
            //   点数は出し、まだ測れていないものを下に添えて伝える。
            const num = v.kind==="num";
            const band = m.provisional ? "暫定" : (m.status_label||"");
            const bc = BADGE[band]||BADGE["要確認"];
            const notYet = (m.components||[]).filter(c=>c.state!=="evaluated"&&c.label).map(c=>c.label);
            return html`
            <div key=${m.key} style=${{padding:"11px 12px",borderTop:i?"1px solid var(--border)":"none"}}>
            <div style=${{display:"flex",alignItems:"center",gap:10}}>
              <span style=${{flexShrink:0,width:32,height:32,borderRadius:"50%",background:"var(--bg)",
                             display:"flex",alignItems:"center",justifyContent:"center",color:"var(--accent)"}}>
                ${ICON[m.key]||""}</span>
              <span style=${{flexShrink:0,width:66,fontSize:12.5,fontWeight:700,color:"var(--text)"}}>${m.label}</span>
              ${num
                ? html`
                  <span style=${{flex:1,minWidth:16,height:6,background:"var(--bg)",borderRadius:99,overflow:"hidden",display:"block"}}>
                    <span style=${{display:"block",height:"100%",width:Math.max(0,Math.min(100,m.score))+"%",
                                   background:"var(--accent)",borderRadius:99}}/>
                  </span>
                  <!-- ★点数とバッジは幅を固定してそろえる★（2026-08-05 Kai指摘）
                       バッジの文字数（強み／改善優先）で幅が変わり、
                       点数の位置が行ごとに横へずれて見えていた。 -->
                  <span style=${{flexShrink:0,width:54,display:"flex",alignItems:"baseline",justifyContent:"flex-end",gap:1}}>
                    <span style=${{fontSize:16,fontWeight:800,color:"var(--text)",fontVariantNumeric:"tabular-nums"}}>${m.score}</span>
                    <span style=${{fontSize:10,color:"var(--sub)"}}>/100</span>
                  </span>`
                : html`<span style=${{flex:1,minWidth:0,fontSize:11,color:"var(--sub)",textAlign:"right"}}>${v.label}</span>`}
              ${num&&html`
                <span style=${{flexShrink:0,width:58,textAlign:"center",fontSize:10.5,fontWeight:700,
                               padding:"3px 0",borderRadius:7,
                               color:bc.fg,background:bc.bg,whiteSpace:"nowrap"}}>${band}</span>`}
            </div>
            ${(num&&m.provisional&&notYet.length>0)&&html`
              <div style=${{fontSize:10,color:"var(--sub)",lineHeight:1.7,marginTop:4,marginLeft:42}}>
                まだ測れていません：${notYet.join("・")}</div>`}
            <!-- ★設定への導線★（2026-08-05 Kai指摘）
                 「1日に使える時間を設定すると見られます」と出るのに、
                 そこから設定へ行けず、押しても何も起きなかった。 -->
            ${(m.components||[]).some(c2=>c2.reason_code==="AVAILABLE_TIME_MISSING")&&html`
              <button onClick=${()=>onGoSettings&&onGoSettings("capacity")}
                style=${{marginTop:5,marginLeft:42,padding:"5px 10px",borderRadius:8,
                         border:"1px solid var(--accent)",background:"transparent",color:"var(--accent)",
                         fontSize:10.5,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                1日に使える時間を設定する ›</button>`}
            </div>`; })}
        </div>

        ${pend2.length>0&&html`
          <div style=${{fontSize:10.5,color:"var(--sub)",lineHeight:1.7,marginBottom:10}}>
            点線の軸（${pend2.join("・")}）は、まだ測っていません</div>`}

        <!-- 今週の改善ポイント -->
        ${weak&&html`
          <div style=${{border:"1px solid var(--border)",borderRadius:12,background:"var(--bg)",padding:"12px 14px"}}>
            <div style=${{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
              <span style=${{color:"var(--accent)",display:"flex"}}>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 18h6M10 21h4" stroke-linecap="round"/>
                  <path d="M12 3a6 6 0 00-3.5 10.9c.5.4.8 1 .9 1.6h5.2c.1-.6.4-1.2.9-1.6A6 6 0 0012 3z" stroke-linejoin="round"/></svg></span>
              <span style=${{fontSize:12,fontWeight:800,color:"var(--accent)"}}>今週の改善ポイント</span>
            </div>
            <div style=${{fontSize:12.5,color:"var(--text)",lineHeight:1.8}}>
              今週は<b>${weak.label}</b>に改善の余地があります。${HINT[weak.key]||""}
            </div>
          </div>`}
      </div>`;
    })()}

    <!-- ステータス（自己経営力がONの人には出さない。二重表示にしない）-->
    ${statusSummary&&smpOff&&!(smp&&smp.data)&&html`
      <button onClick=${()=>setShowStatusTip(v=>!v)}
        style=${{display:"block",width:"calc(100% - 32px)",margin:"12px 16px 0",background:"var(--card)",borderRadius:16,border:"1px solid var(--border)",overflow:"hidden",textAlign:"left",cursor:"pointer",fontFamily:"inherit",padding:0}}>
        <div style=${{padding:"14px 16px 4px",display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
          <div style=${{fontSize:12,fontWeight:700,color:"var(--text)",letterSpacing:".02em"}}>ステータス</div>
          <div style=${{fontSize:11,color:"var(--sub)"}}>合計 <b style=${{color:"var(--text)",fontSize:14}}>${statusSummary.score}</b> / 100点</div>
        </div>
        <div style=${{padding:"6px 16px 16px",display:"flex",alignItems:"center",gap:14,flexWrap:"wrap",justifyContent:"center"}}>
          <${BreakdownRadar} breakdown=${statusSummary.breakdown}/>
          <div style=${{display:"flex",flexDirection:"column",gap:8,flex:"1 1 150px",minWidth:150}}>
            ${BREAKDOWN_CATS.map(([key])=>{
              const v = Number(statusSummary.breakdown[key]||0);
              const lb = BREAKDOWN_LABELS[key];
              const pct = Math.max(0,Math.min(100,v/20*100));
              return html`<div key=${key}>
                <div style=${{display:"flex",alignItems:"baseline",gap:5,marginBottom:3}}>
                  <span style=${{fontSize:10,fontWeight:800,letterSpacing:"0.3px",color:"var(--text)"}}>${lb.en}</span>
                  <span style=${{fontSize:9,color:"var(--sub)",opacity:0.65}}>${lb.jp}</span>
                  <span style=${{marginLeft:"auto",fontSize:11,fontWeight:700,color:"var(--text)"}}>${v}<span style=${{fontSize:9,color:"var(--sub)",fontWeight:400}}>/20</span></span>
                </div>
                <div style=${{height:4,background:"var(--bg)",borderRadius:99,overflow:"hidden"}}>
                  <div style=${{height:"100%",width:pct+"%",background:"var(--hero1)",borderRadius:99}}/>
                </div>
              </div>`;
            })}
          </div>
        </div>
        ${showStatusTip&&(()=>{
          const weakestKey = BREAKDOWN_CATS.map(([key])=>key).sort((a,b)=>Number(statusSummary.breakdown[a]||0)-Number(statusSummary.breakdown[b]||0))[0];
          const tip = BREAKDOWN_TIPS[weakestKey];
          return html`
            <div style=${{display:"flex",gap:8,alignItems:"flex-start",padding:"12px 16px",borderTop:"1px solid var(--border)",background:"var(--bg)"}}>
              <span style=${{color:"var(--accent)",flexShrink:0,display:"flex"}}><${S} n=${tip.icon} s=${16}/></span>
              <div style=${{fontSize:12,color:"var(--sub)",lineHeight:1.6}}>
                <b style=${{color:"var(--text)"}}>${BREAKDOWN_LABELS[weakestKey].jp}</b>を伸ばすヒント：${tip.text}
              </div>
            </div>
          `;
        })()}
        <div style=${{textAlign:"center",fontSize:10,color:"var(--sub)",padding:"6px 0",borderTop:showStatusTip?"none":"1px solid var(--border)"}}>${showStatusTip?"閉じる ▲":"タップでヒントを見る ▼"}</div>
      </button>
    `}

    <!-- Edit Modal -->
    ${editMode&&html`
      <div style=${{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",padding:16,zIndex:200}}>
        <div style=${{background:"var(--card)",borderRadius:20,boxShadow:"0 18px 50px rgba(0,0,0,0.35)",padding:"24px 20px 32px",width:"100%",maxWidth:420,boxSizing:"border-box",maxHeight:"84dvh",overflowY:"auto"}}>
          <div style=${{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10,marginBottom:4}}>
            <div style=${{fontSize:17,fontWeight:800}}>今日のタスクを編集</div>
            <!-- ★ここからも話すだけで作れる★（2026-08-17 Kai要望）
                 朝のポップアップを待たなくても使えるようにする。 -->
            <button onClick=${()=>setTalkOpen(v=>!v)}
              style=${{flexShrink:0,display:"inline-flex",alignItems:"center",gap:6,height:30,
                       background:talkOpen?"var(--accent-l)":"linear-gradient(135deg, var(--hero1) 0%, var(--hero2) 100%)",
                       border:"none",borderRadius:15,padding:"0 12px 0 10px",cursor:"pointer",fontFamily:"inherit"}}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke=${talkOpen?"var(--accent)":"#fff"}
                   stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
                <path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
              <span style=${{fontSize:11.5,fontWeight:800,color:talkOpen?"var(--accent)":"#fff",whiteSpace:"nowrap",lineHeight:1}}>話すだけ</span>
            </button>
          </div>
          <div style=${{fontSize:12,color:"var(--sub)",marginBottom:16}}>やることと、想定時間（分・任意）を入力できます。タイマーでそのタスクを選ぶと、その時間で始まります。</div>
          ${talkOpen&&html`
            <div style=${{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:12,
                          padding:"10px 11px",marginBottom:14}}>
              <div style=${{fontSize:11,color:"var(--sub)",lineHeight:1.7,marginBottom:7}}>
                今日やることを、思いつくまま話してください。<br/>
                キーボードのマイクを押すと声で入力できます。
              </div>
              <textarea class="inp" rows="3" value=${talkText} disabled=${talkBusy}
                placeholder="例：午前は提案書を1時間、そのあと新規に架電。夕方ジムに行く。"
                style=${{margin:0,resize:"vertical",lineHeight:1.7}}
                onInput=${e=>setTalkText(e.target.value)}/>
              <button onClick=${()=>makeTasksFromTalk("edit")} disabled=${!talkText.trim()||talkBusy}
                style=${{width:"100%",marginTop:8,padding:"10px",borderRadius:10,border:"none",
                         background:"var(--accent)",color:"#fff",fontSize:12.5,fontWeight:700,
                         cursor:talkText.trim()&&!talkBusy?"pointer":"default",
                         opacity:talkText.trim()&&!talkBusy?1:0.5,fontFamily:"inherit"}}>
                ${talkBusy?"分けています…":"タスクにする"}</button>
            </div>`}
          ${editItems.map((item,i)=>html`
            <div key=${i} style=${{display:"flex",gap:8,alignItems:"center",marginBottom:10}}>
              <input class="inp" style=${{flex:1,margin:0}} value=${item.text}
                onInput=${e=>{ const a=[...editItems]; a[i]={...a[i],text:e.target.value}; setEditItems(a); }}
                placeholder="タスクを入力..."/>
              <div style=${{display:"flex",alignItems:"center",gap:3,flexShrink:0}}>
                <input class="inp" type="number" inputmode="numeric" min="1" max="600" value=${item.min}
                  onInput=${e=>{ const a=[...editItems]; a[i]={...a[i],min:e.target.value}; setEditItems(a); }}
                  placeholder="分" style=${{width:56,margin:0,textAlign:"center",padding:"10px 6px"}}/>
                <span style=${{fontSize:12,color:"var(--sub)"}}>分</span>
              </div>
              <button onClick=${()=>setEditItems(editItems.filter((_,j)=>j!==i))}
                style=${{background:"none",border:"none",color:"var(--sub)",fontSize:20,cursor:"pointer",flexShrink:0,padding:"0 4px"}}>×</button>
            </div>
          `)}
          <button onClick=${()=>setEditItems([...editItems,{text:"",min:""}])}
            style=${{width:"100%",padding:"10px",borderRadius:10,border:"1.5px dashed var(--border)",background:"none",color:"var(--accent)",fontSize:14,fontWeight:600,cursor:"pointer",marginBottom:16}}>
            ＋ タスクを追加
          </button>
          ${editError && html`<div style=${{background:"var(--red-l)",border:"1px solid var(--red)",color:"var(--red)",
            borderRadius:10,padding:"10px 12px",fontSize:12.5,lineHeight:1.8,marginBottom:10,whiteSpace:"pre-wrap"}}>${editError}</div>`}
          <button class="btn" onClick=${saveEdit} style=${{marginBottom:10}}>保存する</button>
          <button onClick=${()=>{setEditMode(false);setTalkOpen(false);setTalkText("");}}
            style=${{width:"100%",background:"none",border:"none",color:"var(--sub)",fontSize:13,padding:"8px",cursor:"pointer"}}>キャンセル</button>
        </div>
      </div>
    `}

    <!-- Schedule -->
    ${schedule.length>0&&html`
      <div style=${{margin:"12px 16px 0",background:"var(--card)",borderRadius:16,border:"1px solid var(--border)",overflow:"hidden"}}>
        <div style=${{padding:"14px 16px",borderBottom:"1px solid var(--border)"}}>
          <div style=${{fontSize:12,fontWeight:700,color:"var(--text)"}}>今日の予定</div>
        </div>
        ${schedule.map((ev,i)=>{
          const hasZoom=isZoom(ev.sub||"");
          return html`<div key=${i} style=${{display:"flex",gap:12,padding:"12px 16px",borderBottom:i<schedule.length-1?"1px solid var(--border)":"none",alignItems:"flex-start"}}>

const RANK_MEDALS = ["🥇","🥈","🥉"];
function RankingRow({rank, avatar, nickname, isMe, scoreValue, scoreUnit, sub, isLast}) {

// ランキングは全員載せると長くなり見づらいため上位のみに絞る。
// ただし自分の順位は気になるはずなので、上位圏外なら自分の行だけ「…」区切りで下に添える
const RANKING_TOP_N = 5;
function trimRanking(list) {
  if (!list || list.length <= RANKING_TOP_N) return { top: list||[], me: null, meRank: 0 };
  const top = list.slice(0, RANKING_TOP_N);
  const meIdx = list.findIndex(u => u.isMe);
  if (meIdx === -1 || meIdx < RANKING_TOP_N) return { top, me: null, meRank: 0 };
  return { top, me: list[meIdx], meRank: meIdx+1 };
}
// ★前に開いたときの内容を端末に控えておく★（2026-08-05 Kai要望「2秒で開きたい」）
//   GASは1往復するだけで1〜2秒かかり、この画面は5つのシートを読むので
//   毎回作り直すかぎり待ち時間はゼロにできない。
//   前回の内容をすぐ出して、裏で最新に差し替える。
//   （中身は「みんなの状況」なので、数分前のものが一瞬見えても困らない）
const COMMUNITY_CACHE_KEY = "jiroku_community_cache_v1";
function loadCommunityCache() {
  try {
    const raw = localStorage.getItem(COMMUNITY_CACHE_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    // 古すぎるものは出さない（1日以上前の順位を見せない）
    if (!o || !o.at || Date.now() - o.at > 86400000) return null;
    return o.payload || null;
  } catch (e) { return null; }
}
function saveCommunityCache(payload) {
  try { localStorage.setItem(COMMUNITY_CACHE_KEY,
        JSON.stringify({ at: Date.now(), payload: payload })); } catch (e) {}
}

function LogScreen({onToast, isActive}) {
  const todayStr = logicalTodayStr();   // 深夜0〜4時は前の日の続きとして扱う
  const [date, setDate] = useState(todayStr);
  const [logs, setLogs] = useState([]);
  // ★メモは押したときだけ開く★（2026-08-10 Kai要望）
  //   一覧に全文が並ぶと、その日に何をしたかの流れが読み取りにくい。
  //   既定は畳んでおき、押した記録だけ開く。
  const [openMemo, setOpenMemo] = useState({});
  const [saving, setSaving] = useState(false);
  const timeRef = useRef(null);
  // ★「今の時間」は必ず出す★（2026-08-05 Kai報告）
  //   時間帯の一覧は5時〜23時ぶんしか用意しておらず、さらに
  //   「記録できる時間」の初期値が6〜23時だった。そのため深夜4時半に開くと
  //   今の時間の枠が無く、いちばん後ろの23時台が選ばれてしまっていた。
  //   設定の範囲外でも、今の時間の枠だけは足して、必ず選べるようにする。
  const hourBlockOf = (h) => String(h).padStart(2,"0")+":00-"+String(h+1).padStart(2,"0")+":00";
  const timeBlocks = (()=>{
    const base = getTimeBlocks();
    if(!isToday(date)) return base;
    const cur = hourBlockOf(new Date().getHours());
    if(base.indexOf(cur) !== -1) return base;
    return base.concat([cur]).sort((a,b)=>parseInt(a)-parseInt(b));
  })();

  const getCurrentBlock = () => {
    const h = new Date().getHours();
    return timeBlocks.find(t => parseInt(t) === h) || hourBlockOf(h);
  };

  const [block, setBlock] = useState(getCurrentBlock);
  // まとめて記録: multiModeがONの間は、チップのタップで追加の時間帯を
  // 選択でき、1回の保存で全ブロックに同じ内容を書き込む
  const [multiMode, setMultiMode] = useState(false);
  const [extraBlocks, setExtraBlocks] = useState([]);

  const [task, setTask] = useState("");
  const [focus, setFocus] = useState("");
  const [memo, setMemo] = useState("");
  // 「目標に関連している」は毎回チェックし直すのを忘れやすいため、
  // 最後に選んだ状態を記憶して新しい時間帯のデフォルトにする（タイマーと同じ方式）
  const goalRelatedDefault = () => localStorage.getItem("jiroku_log_goal_related") === "true";
  const [goalRelated, setGoalRelated] = useState(goalRelatedDefault);
  // ★前回選んだ分類を初期値にする★（2026-08-05）
  //   毎回ゼロから選ばせると、面倒で選ばなくなる（実際、記録1,724件のうち
  //   分類が入っているものはごくわずかだった）。直前と同じ種類の時間が続くことは
  //   多いので、最後に選んだものを出しておき、違うときだけ押し直してもらう。
  const [timeClass, setTimeClass] = useState(()=>localStorage.getItem("jiroku_log_time_class")||"");
  // ★分類から「目標に関連しているか」を決める★（2026-08-05）
  //   goal_related は、分類がまだ十分に付いていない期間の予備の手がかりとして
  //   採点で使われている。チェック欄を消したぶん、分類から自動で埋める。
  const setTimeClassAndGoal = (k) => {
    setTimeClass(k);
    const v = (k === "GOAL_DIRECT");
    setGoalRelated(v);
    try{
      localStorage.setItem("jiroku_log_goal_related", String(v));
      localStorage.setItem("jiroku_log_time_class", k);   // 次の記録の初期値にする
    }catch(e){}
  };
  const [clsEditing, setClsEditing] = useState(null);  // 分類を選び直している記録のlog_id
  // 記録カードから分類を変える。サーバーが USER として保存し、以後ルールで上書きしない
  const saveClass = async (l, k) => {
    setClsEditing(null);
    setLogs(prev=>prev.map(x=>x.log_id===l.log_id
      ? {...x, time_classification:k, classification_method:"USER", classification_reason_code:"USER_SELECTED"} : x));
    const r = await gasPostJson("setLogClassification", { log_id: l.log_id, time_classification: k });
    if(!r || !r.ok){ onToast("分類を変更できませんでした"); return; }
    // ★カレンダーの色も塗り直す★（2026-08-05）
    //   分類を変えたのに、カレンダー側だけ前の色のまま残ると食い違う。
    //   既に書き込んだ予定があれば、同じキーで色だけ更新される。
    try{
      if(localStorage.getItem("cal_linked")){
        const tb = String(l.time_block||"");
        const stt = new Date(date+"T"+tb.slice(0,5)+":00");
        if(!isNaN(stt)){
          const mins = blockMinutes(tb) || 60;
          upsertCalendarEvent(date, tb, stt.toISOString(),
            new Date(stt.getTime()+mins*60000).toISOString(), l.task||"記録", null, false, k);
        }
      }
    }catch(e){}
  };

  // カレンダー予定の自動入力。端末キャッシュ→本人認証→サーバー共有
  // キャッシュの順にまず自動で試すが、Safari等でサードパーティCookieが
  // ブロックされていると裏側の認証自体が失敗し続けることがあるため、
  // 自動取得できなかった場合だけ手動で読み込むボタンを出す
  const [dayEvents, setDayEvents] = useState(null);
  const [calNeedsTap, setCalNeedsTap] = useState(false);
  const autoFillRef = useRef("");
  useEffect(()=>{
    if(!isActive) return;
    setCalNeedsTap(false);
    fetchCalendarEvents(date).then(evs=>{
      if(evs) setDayEvents(evs);
      else setCalNeedsTap(true);
    });
  },[date, isActive]);
  const loadCalByTap=()=>{
    fetchCalendarEvents(date, true).then(evs=>{
      if(evs){ setDayEvents(evs); setCalNeedsTap(false); onToast("予定を読み込みました"); flushCalendarQueue(); }
      else onToast("予定の読み込みに失敗しました");
    });
  };
  // 未記録ブロックを選んだとき、入力が空なら予定タイトルを自動セット
  useEffect(()=>{
    if(!dayEvents) return;
    if(logs.find(l=>l.time_block===block)) return;
    const titles=eventsForBlock(dayEvents, block);
    if(titles.length===0){
      if(task===autoFillRef.current && task!=="") { setTask(""); autoFillRef.current=""; }
      return;
    }
    const suggestion=titles.join("、");
    if(task==="" || task===autoFillRef.current){ setTask(suggestion); autoFillRef.current=suggestion; }
  },[block, dayEvents, logs]);

  // ブロック切替時に既存ログを読み込んでフォームに反映。
  // lastLoadedRefには「フォームに最後に流し込んだ値」を控えておき、
  // 裏で取得した最新データを反映してよいか（=ユーザーが編集を始めて
  // いないか）の判定に使う
  const lastLoadedRef = useRef({task:"",focus:"",memo:"",goalRelated:false});
  // 保存ボタンを押す前に他のタブに切り替えて戻ってきても、入力途中の内容が
  // 消えないよう、時間帯ごとに下書きをlocalStorageへ自動保存しておく
  const DRAFT_LS = "jiroku_log_draft_";
  const draftKey = (d, b) => DRAFT_LS + d + "_" + b;
  const loadBlockData = (b, currentLogs) => {
    const existing = currentLogs.find(l => l.time_block === b);
    let v;
    if (existing) {
      // ★保存済みの分類も読み込む★（2026-08-05）
      //   前回の分類を初期値にするようにしたので、読み込まないと
      //   「開いた記録の分類」と「画面に出ている分類」が食い違う。
      v = {task:existing.task||"", focus:existing.focus_level||"", memo:existing.memo||"",
           goalRelated:existing.goal_related==="true"||existing.goal_related===true,
           timeClass:existing.time_classification||""};
    } else {
      let draft = null;
      try{ draft = JSON.parse(localStorage.getItem(draftKey(date, b))||"null"); }catch(e){}
      v = draft || {task:"", focus:"", memo:"", goalRelated:goalRelatedDefault(),
                    timeClass:localStorage.getItem("jiroku_log_time_class")||""};
    }
    setTask(v.task); setFocus(v.focus); setMemo(v.memo); setGoalRelated(v.goalRelated);
    setTimeClass(v.timeClass||"");
    lastLoadedRef.current = v;
  };

  // ★時間を細かく決める★ 開始・終了を5分きざみで指定できるようにする
  const [bulkOpen, setBulkOpen] = useState(false);   // まとめて分類する画面
  const [timeFixLog, setTimeFixLog] = useState(null);  // 時間を直す画面
  const [fineOpen, setFineOpen] = useState(false);
  const [fineFrom, setFineFrom] = useState(()=>{
    const d=new Date(); const m=Math.floor(d.getMinutes()/5)*5;
    return String(d.getHours()).padStart(2,"0")+":"+String(m).padStart(2,"0");
  });
  const [fineTo, setFineTo] = useState(()=>{
    const d=new Date(); d.setMinutes(Math.floor(d.getMinutes()/5)*5+30);
    return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  });
  const hmToMin = (v)=>{ const p2=String(v||"").split(":"); return (Number(p2[0])||0)*60+(Number(p2[1])||0); };
  const addMinutesToHM = (v,add)=>{ let t=hmToMin(v)+add; t=((t%1440)+1440)%1440;
    return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"); };
  const fineMinutes = (()=>{ let d=hmToMin(fineTo)-hmToMin(fineFrom); if(d<0) d+=1440; return d; })();

  const handleBlockSelect = (b) => {
    setBlock(b);
    loadBlockData(b, logs);
  };

  // ★「＋ 記録を追加する」の行き先★（2026-08-05 Kai指摘）
  //   これまでは今の時間帯を選び直すだけだった。最初からそこが選ばれているので、
  //   押しても画面が何も変わらず、壊れているように見えていた。
  //   まだ記録の無い枠を探して開き、入力欄まで寄せる。
  const taskInputRef = useRef(null);
  const firstEmptyBlock = () => {
    const covered = (b) => logs.some(l => l.time_block === b || blocksOverlap(l.time_block, b));
    const cur = getCurrentBlock();
    if (!covered(cur)) return cur;
    const i = timeBlocks.indexOf(cur);
    // まず今より前（記録し忘れた時間）を新しい順に見る
    for (let k = i - 1; k >= 0; k--) if (!covered(timeBlocks[k])) return timeBlocks[k];
    // それも無ければ、今より後ろ
    for (let k = i + 1; k < timeBlocks.length; k++) if (!covered(timeBlocks[k])) return timeBlocks[k];
    return null;   // 全部埋まっている
  };
  const addRecord = () => {
    const b = firstEmptyBlock();
    if (!b) { onToast && onToast("今日の時間はすべて記録済みです。直したい時間を押してください"); return; }
    handleBlockSelect(b);
    // 画面の上（入力欄）まで寄せて、そのまま書き始められるようにする
    setTimeout(()=>{
      try {
        const el = taskInputRef.current;
        if (el) { el.scrollIntoView({ behavior:"smooth", block:"center" }); el.focus({ preventScroll:true }); }
        else window.scrollTo?.({ top:0, behavior:"smooth" });
      } catch(e) { window.scrollTo?.(0,0); }
    }, 60);
  };

  // チップタップ: 通常は選択切り替え。まとめて記録モード中は追加選択のON/OFF
  const handleChipTap = (b) => {
    if(!multiMode){
      // ★またいでいる記録に含まれる時間なら、その1件を開く★
      //   例: 13:00-15:40 の記録がある状態で 14:00 を押したとき、
      //   空の14:00枠を新しく作ると同じ内容が2件になる。元の1件を開く。
      const cover = logs.find(l => l.time_block!==b && blocksOverlap(l.time_block, b));
      handleBlockSelect(cover ? cover.time_block : b);
      return;
    }
    if(b===block) return; // 基準ブロックは外せない
    setExtraBlocks(prev => prev.includes(b) ? prev.filter(x=>x!==b) : [...prev, b]);
  };
  const toggleMultiMode = () => {
    setMultiMode(v=>{ if(v) setExtraBlocks([]); return !v; });
  };

  // 現在のフォーム値・選択ブロックを非同期コールバックから読むためのミラー
  const formRef = useRef(null);
  formRef.current = {task, focus, memo, goalRelated};
  const curBlockRef = useRef(block);
  curBlockRef.current = block;

  // 入力するたびに下書きを保存しておく（空なら消す）。保存済みログと同じ内容を
  // 保存し直すだけの場合も無害なので、既存ログかどうかは区別せずそのまま保存する
  useEffect(()=>{
    const k = draftKey(date, block);
    if(!task.trim() && !memo.trim()){ localStorage.removeItem(k); return; }
    try{ localStorage.setItem(k, JSON.stringify({task, focus, memo, goalRelated})); }catch(e){}
  },[task, focus, memo, goalRelated, date, block]);
  // 保存のたびに増やすバージョン番号。背景取得（getLogs）が開始した後に保存が
  // 行われた場合、その取得結果は保存前の古いデータなので適用しない判定に使う
  const saveVersionRef = useRef(0);

  // 記録タブの読み込み: まず端末キャッシュで即座に画面を組み立て（体感ゼロ秒）、
  // 最新データはGASから裏で取得して静かに差し替える。以前はGASの応答
  // （数百ms〜数秒）を待ってから画面を作っていたため遅く感じられていた
  const LOGS_LS="jiroku_logs_";
  useEffect(()=>{
    if(!isActive) return;
    let cached=null;
    try{ cached=JSON.parse(localStorage.getItem(LOGS_LS+date)||"null"); }catch(e){}
    const base = cached||[];
    setLogs(base);
    const def = isToday(date) ? getCurrentBlock() : (base[0]?.time_block || timeBlocks[0]);
    setBlock(def);
    setMultiMode(false); setExtraBlocks([]);
    loadBlockData(def, base);
    setTimeout(()=>{ const el=timeRef.current?.querySelector(".chip.on"); if(el) el.scrollIntoView({inline:"center",behavior:"smooth"}); },100);

    const versionAtFetchStart = saveVersionRef.current;
    gasApi("getLogs",{date}).then(r=>{
      if(!r.ok) return;
      // この取得が始まった後に保存が完了していた場合、この結果は保存前の古い
      // スナップショットなので適用しない（保存直後に「済み」マークやチェックが
      // 一瞬消える競合状態を防ぐ。ローカル側は既に保存内容で最新になっている）
      if(saveVersionRef.current !== versionAtFetchStart) return;
      const data = r.data;
      try{
        localStorage.setItem(LOGS_LS+date, JSON.stringify(data));
        const limit=addDays(formatDateStr(new Date()),-7);
        Object.keys(localStorage).forEach(k=>{
          if(k.startsWith(LOGS_LS)&&k.slice(LOGS_LS.length)<limit) localStorage.removeItem(k);
          if(k.startsWith(DRAFT_LS)&&k.slice(DRAFT_LS.length)<limit) localStorage.removeItem(k);
        });
      }catch(e){}
      // 記録タブでその日を表示した時にも、カレンダー未反映の記録を補完する
      // （独り言などの直近の記録を、ホームに戻らなくてもここで同期する）
      if(localStorage.getItem("cal_linked")) reconcileCalendarForDate(date, data);
      setLogs(data);
      // ユーザーがまだ入力を始めていない場合だけ、選択中ブロックのフォームも最新化
      const f=formRef.current, l=lastLoadedRef.current;
      if(f.task===l.task && f.focus===l.focus && f.memo===l.memo && f.goalRelated===l.goalRelated){
        loadBlockData(curBlockRef.current, data);
      }
    });
  },[date, isActive]);

  // ★記録も、画面に戻るたびに取り直す★（2026-08-05 Kai報告）
  //   これまで記録の取得は「タブを開いた瞬間」の1回だけだった。
  //   そのため、パソコンで開きっぱなしにしていると、スマホで足した記録が
  //   いつまでも出てこず、端末によって中身が違う状態になっていた。
  //   入力中に画面を書き換えないよう、フォームに手が入っていない時だけ差し替える。
  useEffect(()=>{
    if(!isActive) return;
    let alive = true;
    const pull = () => {
      if(!alive || document.visibilityState !== "visible") return;
      const at = saveVersionRef.current;
      gasApi("getLogs",{date}).then(r=>{
        if(!alive || !r.ok || saveVersionRef.current !== at) return;
        setLogs(r.data);
        try{ localStorage.setItem(LOGS_LS+date, JSON.stringify(r.data)); }catch(e){}
        const f=formRef.current, l=lastLoadedRef.current;
        if(f.task===l.task && f.focus===l.focus && f.memo===l.memo && f.goalRelated===l.goalRelated){
          loadBlockData(curBlockRef.current, r.data);
        }
      });
    };
    const onVis = () => { if(document.visibilityState === "visible") pull(); };
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("focus", pull);      // PCはこちらが主
    window.addEventListener("jiroku:logsaved", pull); // 独り言が裏で書き終わったとき
    window.addEventListener("jiroku:remotechange", pull); // もう一方の端末で何か書かれたとき
    const t = setInterval(pull, 60000);
    return ()=>{ alive=false; document.removeEventListener("visibilitychange", onVis);
                 window.removeEventListener("focus", pull);
                 window.removeEventListener("jiroku:logsaved", pull);
                 window.removeEventListener("jiroku:remotechange", pull); clearInterval(t); };
  },[date, isActive]);

  const save = async ()=>{
    if(!task.trim()) return;
    setSaving(true);
    saveVersionRef.current++;
    // まとめて記録: 選択された全ブロックを1回のリクエストで保存する。
    // メモが長くなるとURLの長さ制限に引っかかる可能性があるため、GETのURL
    // パラメータではなくPOSTのボディで送る（gasPostJson）
    let blocks = [block, ...extraBlocks].sort((a,b)=>a>b?1:-1);
    // ★連続した時間帯は1件にまとめる★（2026-08-05 Kai要望）
    //   13時・14時・15時を選ぶと、これまでは同じ内容の記録が3件できていた。
    //   実際にやったのは「13:00-16:00 の1つのこと」なので、1件として残す。
    //   飛び飛びに選んだ場合（13時と17時など）は別々の出来事なので、従来どおり分けて保存する。
    if(blocks.length>1 && blocks.every(isFullHourBlock)){
      const spans = blocks.map(blockSpan);
      const contiguous = spans.every((sp,i)=> i===0 || sp.start===spans[i-1].end);
      if(contiguous) blocks = [blocks[0].slice(0,5)+"-"+blocks[blocks.length-1].slice(6,11)];
    }
    const payload = {
      date,
      task: task.trim(), focus_level: focus, memo: memo.trim(),
      goal_related: goalRelated ? "true" : "false",
      time_classification: timeClass || undefined,   // 選ばなければサーバーのルール
    };
    if(blocks.length>1) payload.time_blocks = blocks.join(",");
    else payload.time_block = block;
    // ★先に画面へ反映してから送る★（2026-08-05 Kai報告「入力後の反映が遅い」）
    //
    //   これまではサーバーの応答を待ってから一覧を書き換えていた。
    //   保存処理はシート全体の読み込み・カレンダー書き込み・XP計算まで行うため
    //   数秒かかり、そのあいだ画面が止まって見えていた。
    //   保存する内容はこちらで分かっているので、先に一覧へ入れてしまう。
    //   失敗したときは、入れた内容を戻して知らせる（黙って無かったことにしない）。
    const before = logs;
    let next = [...logs];
    blocks.forEach(b=>{
      const saved = {time_block:b, task:task.trim(), focus_level:focus, memo:memo.trim(), goal_related:goalRelated?"true":"false",
                     time_classification:timeClass||"", classification_method:timeClass?"USER":""};
      const i = next.findIndex(l=>l.time_block===b);
      if(i>=0) next[i] = {...next[i], ...saved}; else next.push(saved);
    });
    next = sortLogsByTime(next);
    setLogs(next);
    try{ localStorage.setItem(LOGS_LS+date, JSON.stringify(next)); }catch(e){}
    blocks.forEach(b=>{ try{ localStorage.removeItem(draftKey(date, b)); }catch(e){} });
    if(blocks.length>1){ setMultiMode(false); setExtraBlocks([]); }
    setSaving(false);            // ボタンはここで戻す。送信は裏で続ける

    const res = await gasPostJson(blocks.length>1 ? "saveLogMulti" : "saveLog", payload);
    if(!res || !res.ok){
      // 入れたものを元に戻す（サーバーに無いものを画面に残さない）
      setLogs(before);
      try{ localStorage.setItem(LOGS_LS+date, JSON.stringify(before)); }catch(e){}
      onToast("保存できませんでした。もう一度お試しください");
      return;
    }
    if(res.xp_gained){ const lv=res.level_up?`  →  Lv.${res.level} へ！`:""; onToast(`+${res.xp_gained} XP 獲得${lv}`); }
    else onToast(res.updated?"記録を上書きしました"
      :(blocks.length>1 ? blocks.length+"個の時間帯に保存しました"
        : (blockMinutes(blocks[0])>60 ? blocks[0]+" を1件として保存しました" : "保存しました")));
    setTimeout(()=>announceJiroFound(res), 1200);
    // Googleカレンダーへ書き戻し（連携済みのときだけ・待たずに裏で実行）。
    // 元の予定とタイトルが完全一致するブロックだけ、新規作成せずその予定に
    // ✅を追加する（内容が違う場合は別イベントとして作成し、予定の文言を守る）
    const taskTrimmed = task.trim();
    blocks.forEach(b=>{
      const stt = new Date(date+"T"+b.slice(0,5)+":00");
      if(isNaN(stt)) return;
      const exactMatch = exactEventForBlock(dayEvents, b, taskTrimmed);
      // またいだ記録は、実際の長さぶんの予定として書く（1時間固定にしない）
      const mins = blockMinutes(b) || 60;
      upsertCalendarEvent(date, b, stt.toISOString(), new Date(stt.getTime()+mins*60000).toISOString(), taskTrimmed, exactMatch ? exactMatch.id : null, false, timeClass);
    });
  };

  // 間違えて記録した時間帯を削除する（編集画面で「何をしましたか」とメモを空にして
  // 削除ボタンを押すと、その時間帯の記録が消える）
  const del = async ()=>{
    if(saving) return;
    if(!confirm("この記録を削除しますか？")) return;
    setSaving(true);
    saveVersionRef.current++;
    const res = await gasPostJson("deleteLog", { date, time_block: block });
    if(!res||!res.ok){ onToast("削除に失敗しました。もう一度お試しください"); setSaving(false); return; }
    const next = logs.filter(l=>l.time_block!==block);
    setLogs(next);
    try{ localStorage.setItem(LOGS_LS+date, JSON.stringify(next)); }catch(e){}
    try{ localStorage.removeItem(draftKey(date, block)); }catch(e){}
    setTask(""); setMemo("");
    onToast("記録を削除しました");
    setSaving(false);
  };

  // ★またいだ記録を「1件のまま」扱う★（2026-08-05 Kai要望）
  //   13:00-15:40 のように複数の時間にまたがる記録を、1時間ごとにコピーして
  //   持つのはやめた（同じ内容が3件並び、件数も実績時間も水増しされる）。
  //   代わりに、記録は1件のまま置き、チップ側が「この時間は、あの記録に
  //   含まれている」と分かるようにする。
  //   ・またいでいる時間のチップは全て「済み」になる
  //   ・その時間のチップを押すと、元の1件がそのまま開く（新しい空の枠を作らない）
  const logCovering = (t) => logs.find(l => blocksOverlap(l.time_block, t));
  const recorded = { has: t => !!logCovering(t) };
  // 手動記録は「HH:00-HH:00」の1時間枠、タイマー記録は実測の分単位キーで保存されるため、
  // 同じ1時間の中に複数の記録が混在しうる。選択中のブロックと同じ時間の他の記録を
  // 一覧で見せて、上書きではなく別記録として追加される旨も明示する
  const isFullHourBlock = tb => /^\d{2}:00-\d{2}:00$/.test(String(tb||""));
  const hourSiblingLogs = logs.filter(l => l.time_block!==block && blocksOverlap(l.time_block, block));
  // いま選んでいるのが「複数の時間にまたがる1件」かどうか
  const spanMinutes = blockMinutes(block);
  const isSpanBlock = spanMinutes > 60;

  return html`<div>
    <div class="ph">
      <!-- ★見出しと同じ行に置く★（2026-08-10 Kai指摘「段落を使いすぎ」）
           1段まるごと使わず、「記録を入力」の右に小さく置く。 -->
      <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
        <div class="ph-title-accent" style=${{lineHeight:1.35}}>記録を入力</div>
        <button onClick=${()=>{ try{ window.dispatchEvent(new CustomEvent("jiroku:openquick")); }catch(e){} }}
          title="話すだけで記録する"
          style=${{flexShrink:0,display:"flex",alignItems:"center",gap:6,height:32,
                   background:"linear-gradient(135deg, var(--hero1) 0%, var(--hero2) 100%)",
                   border:"none",borderRadius:16,padding:"0 13px 0 11px",cursor:"pointer",
                   fontFamily:"inherit",boxShadow:"0 2px 8px rgba(8,145,178,0.28)"}}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3"
               stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          <span style=${{fontSize:12.5,fontWeight:800,color:"#fff",whiteSpace:"nowrap",lineHeight:1}}>話すだけ</span>
        </button>
      </div>
      <div class="date-nav">
        <button onClick=${()=>setDate(addDays(date,-1))}>‹</button>
        <span>${isToday(date)?"今日":date}</span>
        <button onClick=${()=>setDate(addDays(date,1))} disabled=${isToday(date)}>›</button>
      </div>
    </div>

    <div>
      <div ref=${timeRef} class="time-bar">
        ${timeBlocks.map(t=>html`<button key=${t}
          class=${"chip"+((block===t||extraBlocks.includes(t))?" on":"")+(recorded.has(t)?" done":"")}
          onClick=${()=>handleChipTap(t)}>${t}</button>`)}
      </div>
      <div class="form-wrap">
        <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,gap:8}}>
          <div style=${{fontSize:12,color:"var(--sub)"}}>
            ${multiMode
              ? `⧉ ${1+extraBlocks.length}個の時間帯を選択中（チップをタップで追加）`
              : !isToday(date) ? "🗓 過去の記録を追加・編集できます（XPは付きません）" : recorded.has(block) ? "✏️ 記録済み（編集できます）" : "📝 未記録"}
          </div>
          <div style=${{display:"flex",gap:6,flexShrink:0}}>
            <!-- ★時間を細かく決める★（2026-08-04 Kai要望）
                 1時間の枠だけだと、30分の打ち合わせや15分の移動が記録できない。
                 開始と終了を5分きざみで指定できるようにする。 -->
            <button onClick=${()=>setFineOpen(v=>!v)}
              style=${{padding:"4px 10px",borderRadius:20,border:`1.5px solid ${fineOpen?"var(--accent)":"var(--border)"}`,background:fineOpen?"var(--accent-l)":"transparent",color:fineOpen?"var(--accent)":"var(--sub)",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
              ⏱ 時間を細かく
            </button>
            <button onClick=${toggleMultiMode}
              style=${{padding:"4px 10px",borderRadius:20,border:`1.5px solid ${multiMode?"var(--accent)":"var(--border)"}`,background:multiMode?"var(--accent)":"transparent",color:multiMode?"#fff":"var(--sub)",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
              ${multiMode?"選択をやめる":"⧉ まとめて"}
            </button>
          </div>
        </div>
        ${fineOpen&&html`
          <div style=${{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:10,padding:"11px 12px",marginBottom:12}}>
            <div style=${{fontSize:11.5,color:"var(--sub)",lineHeight:1.7,marginBottom:8}}>
              開始と終了を決めると、その時間で記録します（5分きざみ）。
            </div>
            <div style=${{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <input class="inp" type="time" step="300" value=${fineFrom} onInput=${e=>setFineFrom(e.target.value)}
                style=${{width:120,margin:0}}/>
              <span style=${{color:"var(--sub)"}}>〜</span>
              <input class="inp" type="time" step="300" value=${fineTo} onInput=${e=>setFineTo(e.target.value)}
                style=${{width:120,margin:0}}/>
              <span style=${{fontSize:11.5,color:"var(--sub)"}}>${fineMinutes>0?fineMinutes+"分":""}</span>
            </div>
            <div style=${{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
              ${[15,30,45,60,90].map(m=>html`<button key=${m} onClick=${()=>setFineTo(addMinutesToHM(fineFrom,m))}
                style=${{padding:"5px 10px",borderRadius:20,fontSize:11,cursor:"pointer",fontFamily:"inherit",
                         border:"1px solid var(--border)",background:"transparent",color:"var(--sub)"}}>${m}分</button>`)}
            </div>
            <button class="btn" style=${{marginTop:10,opacity:fineMinutes>0?1:0.5}} disabled=${!(fineMinutes>0)}
              onClick=${()=>{
                // ★1件として記録する★
                //   ここで「まとめて記録」が残っていると、同じ内容が時間帯ごとに
                //   コピーされてしまう。細かい時間を決めた時点で必ず解除する。
                setMultiMode(false); setExtraBlocks([]);
                handleBlockSelect(fineFrom+"-"+fineTo); setFineOpen(false);
              }}>
              この時間で記録する（${fineMinutes>=60?Math.floor(fineMinutes/60)+"時間"+(fineMinutes%60?fineMinutes%60+"分":""):fineMinutes+"分"}を1件として）</button>
          </div>`}
        ${calNeedsTap&&html`
          <button onClick=${loadCalByTap} style=${{display:"flex",alignItems:"center",gap:8,width:"100%",padding:"10px 14px",marginBottom:12,borderRadius:10,border:"1.5px dashed var(--accent)",background:"var(--accent-l)",color:"var(--accent)",fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
            📅 タップしてカレンダーの予定を読み込む
          </button>
        `}
        ${hourSiblingLogs.length>0&&html`
          <div style=${{background:"var(--accent-l)",border:"1px solid var(--accent)",borderRadius:10,padding:"10px 12px",marginBottom:12}}>
            <div style=${{fontSize:12,fontWeight:700,color:"var(--accent)",marginBottom:6}}>⏱ この時間帯には他に${hourSiblingLogs.length}件の記録があります</div>
            ${hourSiblingLogs.map(l=>html`
              <div key=${l.time_block} onClick=${()=>handleBlockSelect(l.time_block)}
                style=${{display:"flex",justifyContent:"space-between",gap:8,padding:"4px 0",cursor:"pointer"}}>
                <span style=${{fontSize:11.5,color:"var(--sub)",flexShrink:0}}>${l.time_block}</span>
                <span style=${{fontSize:11.5,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${l.task}</span>
              </div>
            `)}
            <div style=${{fontSize:10.5,color:"var(--sub)",marginTop:4}}>ここで保存すると上書きではなく別の記録として追加されます</div>
          </div>
        `}
        <div class="form-grp">
          <label class="form-lbl">何をしましたか？</label>
          <input class="inp" ref=${taskInputRef} placeholder="例：資料作成、家事、勉強など" value=${task} onInput=${e=>setTask(e.target.value)} />
          ${task!==""&&task===autoFillRef.current&&html`
            <div style=${{fontSize:11,color:"var(--accent)",marginTop:5,display:"flex",alignItems:"center",gap:4}}>
              📅 カレンダーの予定から自動入力しました（編集できます）
            </div>
          `}
        </div>
        <!-- ★「この時間は目標に関連している」のチェックは廃止★（2026-08-05 Kai要望）
             すぐ下の分類で「目標に直結」を選べば同じことが言えるため、
             同じ質問を2回されている状態だった。分類から自動で決める。 -->
        <${TimeClassPicker} value=${timeClass} onChange=${setTimeClassAndGoal}/>
        <div class="form-grp">
          <label class="form-lbl">自己評価</label>
          <${EvalPicker} value=${focus} onChange=${setFocus}/>
        </div>
        <div class="form-grp">
          <div style=${{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:8}}>
            <label class="form-lbl" style=${{marginBottom:0}}>メモ（必須）</label>
            <span style=${{fontSize:10.5,color:"var(--sub)",whiteSpace:"nowrap"}}>うまくできたか・感じたこと・改善点</span>
          </div>
          <textarea class="txa" style=${{marginTop:6,maxHeight:280,overflowY:"auto"}}
            placeholder="うまくいった点、感じたこと、次はこうしたい、など" value=${memo}
            onInput=${e=>{setMemo(e.target.value);e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,280)+"px";}}
            ref=${el=>{if(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,280)+"px";}}} />
        </div>
        ${(()=>{
          // この時間帯に、実際に保存済みの記録があるか（またいだ記録の一部ではなく、
          // いま開いているキーそのものの記録があるときだけ削除できる）
          const savedHere = logs.some(l => l.time_block === block);
          return html`
            <button class="btn" onClick=${save} disabled=${!task.trim()||!memo.trim()||saving}>
              ${saving?html`<span class="spin"/>`:savedHere?"更新する":"保存する"}</button>
            <!-- ★削除は「全部消してから」ではなく、いつでも押せる★（2026-08-05 Kai要望）
                 ただし誤タップで記録が消えるのが一番困るので、目立つ赤いボタンにはせず、
                 保存ボタンの下に小さな文字リンクとして置く（押すと確認が出る）。 -->
            ${savedHere&&html`
              <div style=${{textAlign:"center",marginTop:10}}>
                <button onClick=${del} disabled=${saving}
                  style=${{background:"none",border:"none",padding:"6px 10px",fontSize:12,fontFamily:"inherit",
                           color:"var(--sub)",textDecoration:"underline",cursor:"pointer"}}>
                  この記録（${block}）を削除する</button>
              </div>`}`;
        })()}
      </div>
    </div>

    <!-- ★今日の時間の内訳★（2026-08-05 Kai指定のデザインで作り直し）
         ドーナツで全体の形を、右の一覧で内訳を見せる。
         分類ごとの色は、この画面・レポートの14日分・Googleカレンダーで同じにする。 -->
    ${logs.length>0&&(()=>{
      const mins = l => { const n=Number(l.actual_minutes); return n>0 ? n : (blockMinutes(l.time_block)||0); };
      const total = logs.reduce((a,l)=>a+mins(l),0);
      const byCls = {}; let unclassifiedMin=0, unconfirmed=0, classifiedCount=0, measuredMin=0;
      logs.forEach(l=>{
        const m=mins(l);
        if(Number(l.actual_minutes)>0) measuredMin+=m; else unconfirmed++;
        const k=String(l.time_classification||"");
        if(k){ classifiedCount++; if(m) byCls[k]=(byCls[k]||0)+m; }
        else if(m) unclassifiedMin+=m;
      });
      const classifiedMin = Object.values(byCls).reduce((a,b)=>a+b,0);
      const timeCov = total>0 ? Math.round(classifiedMin/total*100) : 0;
      const cntCov = logs.length>0 ? Math.round(classifiedCount/logs.length*100) : 0;
      const hm = m => m>=60 ? html`${Math.floor(m/60)}<span style=${{fontSize:"0.62em",fontWeight:700}}>時間</span>${m%60?html`${m%60}<span style=${{fontSize:"0.62em",fontWeight:700}}>分</span>`:""}`
                            : html`${m}<span style=${{fontSize:"0.62em",fontWeight:700}}>分</span>`;
      const hmPlain = m => m>=60 ? (Math.floor(m/60)+"時間"+(m%60?(m%60)+"分":"")) : (m+"分");

      // 多いものから並べる（0のものは下にそのまま残して、全部の枠が見えるようにする）
      const rows = TIME_CLASS_OPTS.map(([k,label])=>({k,label,m:byCls[k]||0}))
        .concat(Object.keys(byCls).filter(k=>!TIME_CLASS_OPTS.some(([o])=>o===k))
          .map(k=>({k,label:TIME_CLASS_LABEL[k]||k,m:byCls[k]})))
        .sort((a,b)=>b.m-a.m);

      // ドーナツ
      const R=42, SW=12, CIRC=2*Math.PI*R;
      let acc=0;
      const segs = rows.filter(r=>r.m>0).map(r=>{
        const frac = total>0 ? r.m/total : 0;
        const seg = { k:r.k, dash:CIRC*frac, offset:-CIRC*acc };
        acc += frac; return seg;
      });
      const restFrac = Math.max(0, 1-acc);

      return html`
      <!-- 寸法は他のカード(.card)と同じにする。ここだけ全幅だと横がそろわない（2026-08-05 Kai指摘） -->
      <div style=${{margin:"0 16px 8px",background:"var(--card)",borderRadius:12,border:"1px solid var(--border)",padding:16}}>
        <div style=${{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
          <span style=${{flexShrink:0,color:"var(--cyan)",display:"flex"}}>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg></span>
          <span style=${{flex:1,minWidth:0,fontSize:15,fontWeight:800,color:"var(--text)"}}>
            ${isToday(date)?"今日の時間の内訳":date+" の時間の内訳"}</span>
          <button onClick=${()=>setBulkOpen(true)}
            style=${{flexShrink:0,whiteSpace:"nowrap",background:"none",border:"none",color:"var(--cyan)",
                     fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",padding:0}}>詳細を見る ›</button>
        </div>

        ${total===0
          ? html`<div style=${{fontSize:12.5,color:"var(--sub)",lineHeight:1.8}}>
              まだ時間が記録されていません。記録するとここに積み上がります。</div>`
          : html`
          <div style=${{display:"flex",alignItems:"center",gap:10}}>
            <!-- ドーナツ -->
            <div style=${{position:"relative",flexShrink:0,width:104,height:104}}>
              <svg width="104" height="104" viewBox="0 0 104 104" style=${{transform:"rotate(-90deg)"}}>
                <circle cx="52" cy="52" r=${R} fill="none" stroke="var(--border)" stroke-width=${SW}/>
                ${segs.map((sg,i)=>html`
                  <circle key=${i} cx="52" cy="52" r=${R} fill="none"
                    stroke=${TIME_CLASS_COLOR[sg.k]||"#64748B"} stroke-width=${SW}
                    stroke-dasharray=${sg.dash+" "+(CIRC-sg.dash)} stroke-dashoffset=${sg.offset}/>`)}
              </svg>
              <div style=${{position:"absolute",inset:0,display:"flex",flexDirection:"column",
                            alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
                <div style=${{fontSize:10,color:"var(--sub)",marginBottom:1}}>合計</div>
                <div style=${{fontSize:15,fontWeight:800,color:"var(--text)",lineHeight:1.15,fontVariantNumeric:"tabular-nums"}}>${hm(total)}</div>
                <div style=${{fontSize:10.5,color:"var(--sub)",marginTop:2}}>(${Math.round((1-restFrac)*100)}%)</div>
              </div>
            </div>

            <!-- 内訳 -->
            <div style=${{flex:1,minWidth:0}}>
              ${rows.map(r=>{
                const c = TIME_CLASS_COLOR[r.k]||"#64748B";
                const pct = total>0?Math.round(r.m/total*100):0;
                return html`<div key=${r.k} style=${{marginBottom:9}}>
                  <div style=${{display:"flex",alignItems:"center",gap:7}}>
                    <span style=${{flexShrink:0,width:24,height:24,borderRadius:"50%",
                                   background:`color-mix(in srgb, ${c} 26%, transparent)`,
                                   border:`1px solid color-mix(in srgb, ${c} 55%, transparent)`,
                                   color:c,display:"flex",alignItems:"center",justifyContent:"center"}}>
                      ${TIME_CLASS_ICON[r.k]||TIME_CLASS_ICON.OPERATIONS}</span>
                    <span style=${{flex:1,minWidth:0,fontSize:12,color:"var(--text)",
                                   overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${r.label}</span>
                    <span style=${{flexShrink:0,fontSize:11.5,fontWeight:800,color:c,
                                   fontVariantNumeric:"tabular-nums"}}>${hmPlain(r.m)}</span>
                    <span style=${{flexShrink:0,width:30,textAlign:"right",fontSize:11,color:"var(--sub)",
                                   fontVariantNumeric:"tabular-nums"}}>${pct}%</span>
                  </div>
                  <div style=${{height:4,background:"var(--border)",borderRadius:99,overflow:"hidden",marginTop:5}}>
                    <div style=${{height:"100%",width:pct+"%",background:c,borderRadius:99}}/>
                  </div>
                </div>`;
              })}
            </div>
          </div>

          ${unclassifiedMin>0&&html`
            <div style=${{fontSize:12.5,color:"var(--sub)",marginTop:4,lineHeight:1.8}}>
              未分類 ${hmPlain(unclassifiedMin)}（「詳細を見る」からまとめて分類できます）</div>`}

          <div style=${{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",
                        borderTop:"1px solid var(--border)",marginTop:10,paddingTop:11}}>
            <span style=${{flexShrink:0,color:"var(--cyan)",display:"flex"}}>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                <path d="M12 3a9 9 0 109 9h-9V3z"/><path d="M15 3.6A9 9 0 0120.4 9H15V3.6z"/></svg></span>
            <span style=${{fontSize:11.5,color:"var(--sub)"}}>
              分類できた時間 <b style=${{color:"var(--cyan)"}}>${timeCov}%</b>
              　・分類できた件数 <b style=${{color:"var(--cyan)"}}>${cntCov}%</b></span>
            ${unconfirmed>0&&html`
              <span title="実測していない記録は、時間帯の長さで数えています"
                style=${{marginLeft:"auto",flexShrink:0,fontSize:11.5,color:"var(--sub)",display:"flex",alignItems:"center",gap:5}}>
                実測していない記録 ${unconfirmed}件
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01" stroke-linecap="round"/></svg>
              </span>`}
          </div>`}
      </div>`;
    })()}

    <!-- ★まとめて分類する★
         デザイン差し替えのときに、この入口とシートごと消してしまっていた
         （2026-08-05に発見）。「詳細を見る」を押しても何も開かない状態だった。 -->
    ${(()=>{
      const un = logs.filter(l=>!String(l.time_classification||"").trim());
      if(!un.length) return "";
      return html`
        <button onClick=${()=>setBulkOpen(true)}
          style=${{display:"flex",alignItems:"center",gap:10,width:"calc(100% - 32px)",margin:"0 16px 8px",
                   boxSizing:"border-box",
                   padding:"12px 14px",borderRadius:12,border:"1.5px dashed var(--cyan)",
                   background:"transparent",cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
          <span style=${{fontSize:16,flexShrink:0}}>🗂</span>
          <span style=${{flex:1,minWidth:0}}>
            <span style=${{display:"block",fontSize:12.5,fontWeight:700,color:"var(--cyan)"}}>
              まだ分類していない記録が ${un.length}件あります</span>
            <span style=${{display:"block",fontSize:11,color:"var(--sub)",marginTop:2}}>
              まとめて分類すると、時間の使い方が正しく出ます</span>
          </span>
          <span style=${{flexShrink:0,fontSize:14,color:"var(--cyan)"}}>›</span>
        </button>`;
    })()}

    ${timeFixLog&&html`<${LogTimeSheet} log=${timeFixLog} date=${date}
      onClose=${()=>setTimeFixLog(null)}
      onSaved=${(tb,mins)=>{
        setLogs(prev=>prev.map(x=>x.log_id===timeFixLog.log_id
          ? {...x, time_block:tb, actual_minutes:(Number(x.actual_minutes)>0?mins:x.actual_minutes)} : x));
        // 直した時間の記録を開いていたら、選択もそちらへ移す
        if(block===timeFixLog.time_block) setBlock(tb);
      }}
      onToast=${onToast}/>`}

    ${bulkOpen&&html`<${BulkClassifySheet} date=${date} onClose=${()=>setBulkOpen(false)}
      onSaved=${(id,k)=>setLogs(prev=>prev.map(x=>x.log_id===id
        ? {...x, time_classification:k, classification_method:"USER", classification_reason_code:"USER_SELECTED"} : x))}
      onToast=${onToast}/>`}

    <!-- ★本日の記録★（2026-08-05 Kai指定のデザイン）
         左に時刻の線を通し、1件ずつを時系列に見せる。 -->
    ${logs.length>0&&html`
      <div style=${{margin:"0 16px 24px",background:"var(--card)",borderRadius:12,border:"1px solid var(--border)",padding:16}}>
        <div style=${{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
          <span style=${{flexShrink:0,color:"var(--cyan)",display:"flex"}}>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">

const SCORE_COLOR = s => s >= 80 ? "var(--green)" : s >= 60 ? "var(--amber)" : "var(--red)";

// スコア推移グラフ（直近14日）
function ScoreTrend({list}) {
  if(!list || list.length < 2) return null;
  const pts = [...list].slice(0,14).reverse(); // 古い→新しい
  const W=320, H=96, PX=14, PT=12, PB=20;
  const iw=W-PX*2, ih=H-PT-PB;
  const x=i=>PX+(pts.length===1?iw/2:i*(iw/(pts.length-1)));
  const y=s=>PT+ih-(Math.max(0,Math.min(100,s))/100)*ih;
  const path=pts.map((p,i)=>`${i===0?"M":"L"}${x(i).toFixed(1)},${y(p.score).toFixed(1)}`).join(" ");
  const area=`${path} L${x(pts.length-1).toFixed(1)},${PT+ih} L${x(0).toFixed(1)},${PT+ih} Z`;
  const avg=Math.round(pts.reduce((s,p)=>s+p.score,0)/pts.length);
  const diff=pts.length>=2?pts[pts.length-1].score-pts[0].score:0;
  const fmtMD=d=>{const [,m,dd]=(d||"").substring(0,10).split("-");return Number(m)+"/"+Number(dd);};
  return html`
    <div class="card" style=${{marginBottom:8}}>
      <div style=${{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:4}}>
        <div class="card-label" style=${{marginBottom:0}}>レポートスコア推移（直近${pts.length}回）</div>
        <div style=${{fontSize:11,color:"var(--sub)"}}>平均 <b style=${{color:"var(--text)"}}>${avg}</b>点
          <span style=${{marginLeft:8,color:diff>0?"var(--green)":diff<0?"var(--red)":"var(--sub)",fontWeight:600}}>${diff>0?"↑":diff<0?"↓":"→"}${Math.abs(diff)}</span>
        </div>
      </div>
      <svg viewBox=${`0 0 ${W} ${H}`} style=${{width:"100%",height:"auto",display:"block"}}>
        ${[25,50,75].map(g=>html`<line key=${g} x1=${PX} x2=${W-PX} y1=${y(g)} y2=${y(g)} stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"/>`)}
        <path d=${area} fill="var(--accent)" opacity="0.08"/>
        <path d=${path} fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        ${pts.map((p,i)=>html`<circle key=${i} cx=${x(i)} cy=${y(p.score)} r=${i===pts.length-1?4:2.5} fill=${i===pts.length-1?"var(--accent)":"var(--card)"} stroke="var(--accent)" stroke-width="1.5"/>`)}
        <text x=${x(0)} y=${H-4} font-size="9" fill="var(--sub)" text-anchor="start">${fmtMD(pts[0].date)}</text>
        <text x=${x(pts.length-1)} y=${H-4} font-size="9" fill="var(--sub)" text-anchor="end">${fmtMD(pts[pts.length-1].date)}</text>
      </svg>
    </div>`;
}

// 振り返り（数値化＋事実の整理＋自分の日記）
// この日の数値サマリー（レポートのスコアの直下に置く）
function JournalStats({logs}) {
  const goalBlocks=logs.filter(l=>l.goal_related==="true"||l.goal_related===true).length;
  const goalPct=logs.length?Math.round(goalBlocks/logs.length*100):0;
  const focusNums=logs.map(l=>parseInt(l.focus_level)||0).filter(n=>n>0);
  const avgFocus=focusNums.length?(focusNums.reduce((a,b)=>a+b,0)/focusNums.length).toFixed(1):"−";
  const memoCount=logs.filter(l=>l.memo&&l.memo.trim()).length;
  return html`<div class="card">
    <div class="card-label">この日の数値</div>
    <div style=${{display:"flex",gap:8}}>
      ${[["記録",logs.length+"時間"],["目標関連",goalBlocks+"時間 ("+goalPct+"%)"],["平均集中",avgFocus+" / 5"],["メモ",memoCount+"個"]].map(([l,v])=>html`
        <div key=${l} style=${{flex:1,background:"var(--bg)",borderRadius:10,padding:"10px 6px",textAlign:"center"}}>
          <div style=${{fontSize:13,fontWeight:800,color:"var(--accent)",lineHeight:1.3}}>${v}</div>
          <div style=${{fontSize:10,color:"var(--sub)",marginTop:3}}>${l}</div>
        </div>
      `)}
    </div>
  </div>`;
}

function JournalSection({date, logs}) {
  const [diary,setDiary]=useState("");
  const [autoSummary,setAutoSummary]=useState("");
  const [summaryLoading,setSummaryLoading]=useState(true);
  const [loaded,setLoaded]=useState(false);
  const [saving,setSaving]=useState(false);
  const [savedMsg,setSavedMsg]=useState(false);
  const [events,setEvents]=useState(null);
  useEffect(()=>{
    setDiary(""); setAutoSummary(""); setSummaryLoading(true); setLoaded(false); setEvents(null); setSavedMsg(false);
    gasApi("getDiary",{date}).then(r=>{
      if(r.ok&&r.data){ setDiary(r.data.diary||""); setAutoSummary(r.data.autoSummary||""); }
      setLoaded(true); setSummaryLoading(false);
    });
    if(localStorage.getItem("cal_linked")) fetchCalendarEvents(date).then(setEvents);
  },[date]);
  const save=async()=>{
    setSaving(true);
    try{
      await fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
        body:JSON.stringify({action:"saveDiary",studentEmail:CURRENT_USER.email,date,diary})});
      setSavedMsg(true); setTimeout(()=>setSavedMsg(false),2500);
    }catch{}
    setSaving(false);
  };

  // 予定と記録の対比: 予定の時間帯と重なる記録があるか（時間の重なり優先、なければタイトル一致で補完）
  const isDone=(ev)=>{
    if(!ev.allDay && ev.startHour!=null){
      const byTime=logs.some(l=>{ const lh=parseInt(l.time_block); return !isNaN(lh) && lh < ev.endHour && (lh+1) > ev.startHour; });
      if(byTime) return true;
    }
    return logs.some(l=>l.task&&(l.task.includes(ev.title)||ev.title.includes(l.task)));
  };

  return html`<div>
    <!-- この日の数値 -->
    ${logs.length>0&&html`<${JournalStats} logs=${logs}/>`}

    <!-- 時間ログ＋カレンダーをもとにAIが事実だけを整理したまとめ -->
    ${logs.length>0&&html`
      <div class="card">
        <div class="card-label">📋 この日の事実まとめ（AI）</div>
        ${summaryLoading
          ? html`<div style=${{display:"flex",justifyContent:"center",padding:16}}><div class="spin" style=${{borderColor:"var(--border)",borderTopColor:"var(--accent)",width:18,height:18,borderWidth:2}}/></div>`
          : autoSummary
            ? html`<p style=${{fontSize:14,lineHeight:1.8,color:"var(--text)"}}>${autoSummary}</p>`
            : html`<div style=${{fontSize:12,color:"var(--sub)"}}>まとめを生成できませんでした</div>`
        }
      </div>
    `}

    <!-- 自分の日記 -->
    <div class="card">
      <div class="card-label" style=${{display:"flex",alignItems:"center",gap:6}}><${S} n="pencil" s=${12}/>日記</div>
      <textarea class="txa" style=${{minHeight:110}} placeholder="この日を自由に振り返って書き残せます"
        value=${diary} onInput=${e=>setDiary(e.target.value)} disabled=${!loaded}/>
      <button class="btn" onClick=${save} disabled=${saving||!loaded} style=${{marginTop:10}}>
        ${saving?html`<span class="spin"/>`:"日記を保存"}
      </button>
      ${savedMsg&&html`<div style=${{fontSize:12,color:"var(--green)",fontWeight:600,textAlign:"center",marginTop:8}}>保存しました ✓</div>`}
    </div>

    <!-- 予定と実績 -->
    ${events&&events.length>0&&html`
      <div class="card">
        <div class="card-label">予定と実績</div>
        <div style=${{fontSize:11,color:"var(--sub)",marginBottom:10,lineHeight:1.6}}>予定の時間帯に記録があれば「記録あり」になります</div>
        ${events.map((ev,i)=>html`
          <div key=${i} style=${{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:i<events.length-1?"1px solid var(--border)":"none"}}>
            <div style=${{fontSize:11,fontWeight:600,color:"var(--sub)",minWidth:42,flexShrink:0}}>${ev.time}</div>
            <div style=${{flex:1,fontSize:13,color:"var(--text)"}}>${ev.title}</div>
            <div style=${{fontSize:11,fontWeight:600,flexShrink:0,color:isDone(ev)?"var(--green)":"var(--sub)"}}>${isDone(ev)?"✓ 記録あり":"記録なし"}</div>
          </div>
        `)}
      </div>
    `}

    <!-- 時間ログ -->
    ${logs.length>0&&html`
      <div class="card" style=${{marginBottom:24}}>
        <div class="card-label">時間ログ</div>
        ${logs.map((l,i)=>{
          const num=l.focus_level?.charAt(0);
          return html`<div key=${i} class="log-row">
            <div class="log-time">${l.time_block}</div>
            <div><div class="log-task">${l.task}</div><div class="log-meta"><span class="dot" style=${{background:DOT[num]||"var(--sub)"}}/>${l.focus_level}${l.memo?` · ${l.memo}`:""}</div></div>

        })}
      </div>
    `}
  </div>`;
}

// ★3軸のレーダー（睡眠・運動・食事）★（2026-08-18 Kai要望）
//   旧ステータス用の BreakdownRadar は5軸に固定だったので、別に小さく描く。
//   まだ記録が無い軸は線を引かない（0点として描くと、入れていないだけなのに
//   「できていない」ように見えてしまうため）。
const COND_AXES = [["sleep","睡眠"],["exercise","運動"],["meal","食事"]];
function ConditionRadar({axes, size}) {
  const S = size || 132;
  const cx = S/2, cy = S/2 + 4, maxR = S*0.34;
  const start = -Math.PI/2, step = (Math.PI*2)/3;
  const pt = (i, frac) => {
    const a = start + i*step;
    return [cx + Math.cos(a)*maxR*frac, cy + Math.sin(a)*maxR*frac];
  };
  const ring = f => COND_AXES.map((_,i)=>pt(i,f).map(n=>n.toFixed(1)).join(",")).join(" ");
  const vals = COND_AXES.map(([k])=>{
    const v = axes && axes[k];
    return (v===null||v===undefined) ? null : Math.max(0,Math.min(100,Number(v)))/100;
  });
  const known = vals.filter(v=>v!==null).length;
  const poly = COND_AXES.map((_,i)=>pt(i, vals[i]===null?0:vals[i]).map(n=>n.toFixed(1)).join(",")).join(" ");
  return html`
    <svg width=${S} height=${S} viewBox=${"0 0 "+S+" "+S} style=${{display:"block",flexShrink:0}}>
      ${[0.34,0.67,1].map(f=>html`
        <polygon key=${f} points=${ring(f)} fill="none" stroke="var(--border)" stroke-width="1"/>`)}
      ${COND_AXES.map((_,i)=>{
        const [x,y]=pt(i,1);
        return html`<line key=${i} x1=${cx} y1=${cy} x2=${x.toFixed(1)} y2=${y.toFixed(1)}
                      stroke="var(--border)" stroke-width="1"/>`;
      })}
      ${known>=2&&html`<polygon points=${poly} fill="var(--accent)" fill-opacity="0.18"
                        stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`}
      ${COND_AXES.map(([k,label],i)=>{
        const [x,y]=pt(i,1.42);
        return html`<text key=${k} x=${x.toFixed(1)} y=${(y+4).toFixed(1)} text-anchor="middle"
                      font-size="10.5" font-weight="700" fill="var(--sub)">${label}</text>`;
      })}
    </svg>`;
}

function BreakdownRadar({breakdown}) {
  const N = BREAKDOWN_CATS.length;
  const cx = 80, cy = 80, maxR = 54, maxVal = 20;
  const startAngle = -Math.PI/2;
  const angleStep = (Math.PI*2)/N;
  const pt = (i, frac, r) => {
    const a = startAngle + i*angleStep;
    return [cx + Math.cos(a)*r*frac, cy + Math.sin(a)*r*frac];
  };
  const ringFracs = [0.25,0.5,0.75,1];
  const ringPoints = ringFracs.map(f => BREAKDOWN_CATS.map((_,i)=>pt(i,f,maxR).join(",")).join(" "));
  const axisEnds = BREAKDOWN_CATS.map((_,i)=>pt(i,1,maxR));
  const dataPoints = BREAKDOWN_CATS.map(([key],i)=>{
    const v = Math.max(0,Math.min(maxVal,Number(breakdown[key]||0)));
    return pt(i, v/maxVal, maxR);
  });
  const dataPolygon = dataPoints.map(p=>p.join(",")).join(" ");
  const labelPos = BREAKDOWN_CATS.map((_,i)=>pt(i,1,maxR*1.27));
  const gid = "radarGrad";

  return html`
    <svg width="160" height="160" viewBox="0 0 160 160" style=${{flexShrink:0}}>
      <defs>
        <linearGradient id=${gid} x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--hero1)"/>
          <stop offset="100%" stop-color="var(--hero2)"/>
        </linearGradient>
      </defs>
      ${ringPoints.map((pts,i)=>html`<polygon key=${i} points=${pts} fill="none" stroke="var(--border)" stroke-width="1"/>`)}
      ${axisEnds.map((p,i)=>html`<line key=${i} x1=${cx} y1=${cy} x2=${p[0]} y2=${p[1]} stroke="var(--border)" stroke-width="1"/>`)}
      <polygon points=${dataPolygon} fill=${`url(#${gid})`} fill-opacity="0.32" stroke=${`url(#${gid})`} stroke-width="2.5" stroke-linejoin="round"/>
      ${dataPoints.map((p,i)=>html`<circle key=${i} cx=${p[0]} cy=${p[1]} r="3" fill="var(--hero1)"/>`)}
      ${BREAKDOWN_CATS.map(([key],i)=>{
        const [lx,ly] = labelPos[i];
        return html`<text key=${key} x=${lx} y=${ly+3} text-anchor="middle" font-size="10" font-weight="400" fill="var(--sub)" opacity="0.6" style=${{fontFamily:"inherit"}}>${BREAKDOWN_LABELS[key].jp}</text>`;
      })}
    </svg>
  `;
}

// ★自己経営力のレーダー★
//   ステータスの5角形と同じ見せ方にそろえる（Kaiの指示）。
//   ちがうのは、測れていない項目を「0」として描かないこと。
//   0で描くと「できていない」に見えるが、実際は「まだ測っていない」。
//   測れていない軸は点線の外枠だけにして、面には含めない。
// 5角形のラベル。長いと枠から出て切れるので短くする
const SMP_SHORT = { result_power:"成果", time_allocation_power:"時間配分",
                    execution_power:"実行", continuity_power:"継続", recovery_power:"立て直し" };

// ★「なぜこの数字なのか」「どうすれば上がるのか」★（2026-08-05 Kai要望）
//
//   これまでは「要改善」とだけ出ていて、理由も打ち手も見えなかった。
//   点数は内訳（components）の積み上げで決まっているので、
//   ・いちばん足を引っぱっている内訳はどれか
//   ・その内訳を上げるには、明日なにをすればいいのか
//   を、そのまま言葉にして出す。一般論ではなく、その人の内訳に紐づける。
const SMP_ADVICE = {
  "目標に向けた時間":         "記録するとき、分類で「目標に直結」を選べる時間を1つ増やしましょう。朝いちばんの1時間をそこに充てるのが、いちばん効きます。",
  "目標に直結した時間の割合": "1日のうち、目標に直結する時間の枠を先に決めてから、他の予定を入れてみましょう。",
  "今日いちばんの達成":       "今日のフォーカスを1つだけ決めて、それが終わったら記録に書きましょう。",
  "大事なタスクが進んだか":   "重要と決めたタスクを、その日の最初に着手する順番に変えてみましょう。",
  "予定したタスクの実行":     "予定を減らして、必ず終わる量にしてみましょう。3つ立てて1つ終わるより、1つ立てて1つ終わるほうが上がります。",
  "期限に間に合った割合":     "期限が来ているタスクを先に片づけ、間に合わないものは期限を引き直しましょう。",
  "翌日に残さなかった割合":   "終わらなかったタスクは翌日へ送るのではなく、その場で小さく割ってから残しましょう。",
  "明日に残る量":             "1日の終わりに、残ったタスクを見直して量を減らしましょう。",
  "5分類での配分":            "記録の分類を選ぶ習慣をつけると、配分が正確に出ます。未分類が多いと実態より低く出ます。",
  "計画外に流れた時間の少なさ":"割り込みが入った時間を「計画外」で記録しておくと、何に取られているかが見えます。まずは1つ断ってみましょう。",
  "集中して使えた時間の割合": "タイマーを使って測る時間を1日1回つくりましょう。実測が入ると数字が安定します。",
  "集中できた時間":           "集中できた時間を増やすより、まず測る回数を増やすと正確になります。",
  "予定を詰め込みすぎていないか":"使える時間に対して予定が多すぎます。今日やることを1つ減らしましょう。",
  "休む時間があったか":       "休んだ時間も記録しましょう。分類の「回復・人間関係」を選べば、休息として数えられます。",
  "ふりかえりを書いた割合":   "メモを1行でいいので毎回書きましょう。「できた／できなかった」だけでも数えられます。",
  "ふりかえりの中身":         "メモに「次はこうする」を1文だけ足してみましょう。改善が書かれている記録は高く数えます。",
  "持ち越したことの立て直し": "前の日に終わらなかったことを、翌日の最初に小さく再開しましょう。",
};
// 内訳から「理由」と「打ち手」を組み立てる
function smpExplain(m, fallbackHint) {
  const comps = (m.components || []).filter(c => c.state === "evaluated" && c.label !== "測れた日");
  const why = comps.map(c => ({
    label: c.label,
    value: c.value,
    detail: c.detail || "",
    // 100点満点でない内訳（％など）もあるが、低いものほど足を引っぱっているのは同じ
    n: Number(c.value)
  }));
  // いちばん低い内訳＝いま点数を下げている原因
  const weakest = why.filter(x => !isNaN(x.n)).sort((a, b) => a.n - b.n)[0];
  const how = (weakest && SMP_ADVICE[weakest.label]) || fallbackHint || "";
  return { why, weakest, how };
}
function SelfMgmtRadar({metrics, size}) {
  const M = (metrics || []).slice(0, 5);
  const N = M.length || 5;
  // ホームでは総合スコアと横に並べるため、少し小さくして描く（既定は従来どおり）
  const k = (Number(size) || 190) / 190;
  const cx = 95, cy = 88, maxR = 52;
  const start = -Math.PI / 2, step = (Math.PI * 2) / N;
  const pt = (i, frac) => [cx + Math.cos(start + i * step) * maxR * frac,
                           cy + Math.sin(start + i * step) * maxR * frac];
  // 暫定でも形に含める。欠けていると「その力が無い」ように見えてしまう
  const shown = (m) => m && m.evaluation_state === "evaluated" && m.score !== null;
  const rings = [0.25, 0.5, 0.75, 1].map(f => M.map((_, i) => pt(i, f).join(",")).join(" "));
  const axes = M.map((_, i) => pt(i, 1));
  // 面は「測れた軸」だけで作る。測れていない軸は中心へ寄せず、その軸を飛ばす
  const okIdx = M.map((m, i) => shown(m) ? i : -1).filter(i => i >= 0);
  const poly = okIdx.map(i => pt(i, Math.max(0.04, Math.min(100, M[i].score) / 100)).join(",")).join(" ");
  const labels = M.map((_, i) => pt(i, 1.3));
  return html`
    <svg width=${190*k} height=${176*k} viewBox="0 0 190 176" style=${{flexShrink:0,overflow:"visible"}}>
      <defs>
        <linearGradient id="smpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--hero1)"/><stop offset="100%" stop-color="var(--hero2)"/>
        </linearGradient>
      </defs>
      ${rings.map((pts,i)=>html`<polygon key=${i} points=${pts} fill="none" stroke="var(--border)" stroke-width="1"/>`)}
      ${axes.map((p,i)=>html`<line key=${i} x1=${cx} y1=${cy} x2=${p[0]} y2=${p[1]}
        stroke="var(--border)" stroke-width="1" stroke-dasharray=${shown(M[i])?"":"2 3"}/>`)}
      ${okIdx.length>=3&&html`<polygon points=${poly} fill="url(#smpGrad)" fill-opacity="0.32"
        stroke="url(#smpGrad)" stroke-width="2.5" stroke-linejoin="round"/>`}
      ${okIdx.length===2&&html`<line x1=${pt(okIdx[0],Math.min(100,M[okIdx[0]].score)/100)[0]} y1=${pt(okIdx[0],Math.min(100,M[okIdx[0]].score)/100)[1]}
        x2=${pt(okIdx[1],Math.min(100,M[okIdx[1]].score)/100)[0]} y2=${pt(okIdx[1],Math.min(100,M[okIdx[1]].score)/100)[1]}
        stroke="url(#smpGrad)" stroke-width="2.5"/>`}
      ${okIdx.map(i=>{ const p=pt(i, Math.max(0.04, Math.min(100,M[i].score)/100));
        return html`<circle key=${i} cx=${p[0]} cy=${p[1]} r="3" fill="var(--hero1)"/>`; })}
      ${M.map((m,i)=>{ const [lx,ly]=labels[i];
        // 上下の軸は中央寄せ、左右の軸は外へ逃がして切れないようにする
        const anchor = Math.abs(lx-cx) < 6 ? "middle" : (lx > cx ? "start" : "end");
        return html`<text key=${m.key} x=${lx} y=${ly+3} text-anchor=${anchor} font-size="10"
          fill="var(--sub)" opacity=${shown(m)?0.8:0.45} style=${{fontFamily:"inherit"}}>${SMP_SHORT[m.key]||String(m.label||"").slice(0,4)}</text>`; })}
    </svg>`;
}
