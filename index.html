function GoalField({label, hint, children}) {
  return html`
    <div style=${{marginBottom:12}}>
      <label class="form-lbl" style=${{fontSize:11.5,marginBottom:4,display:"block"}}>${label}</label>
      ${children}
      ${hint&&html`<div style=${{fontSize:10.5,color:"var(--sub)",marginTop:4,lineHeight:1.5}}>${hint}</div>`}
    </div>`;
}

const EMPTY_GOAL = {quarterly_goal_id:"",title:"",category:"",target_value:"",unit:"",start_date:"",end_date:"",why:"",success_condition:"",guardrails:"",priority:3};
const EMPTY_WG = {weekly_goal_id:"",link_quarterly_goal_id:"",title:"",metric_type:"count",unit:"",target_total:"",min_line:"",std_line:"",stretch_line:""};
const METRIC_LABELS = {count:"回数（何回やるか）", minutes:"時間（何分やるか）", boolean:"やったかどうか"};

function GoalEditor({draft, setDraft, onSave, onCancel, saving}) {
  const f=(k)=>(e)=>setDraft({...draft,[k]:e.target.value});
  return html`
    <div style=${{background:"var(--bg)",borderRadius:12,padding:14,border:"1px solid var(--border)",marginBottom:10}}>
      <${GoalField} label="3か月で達成したいこと">
        <textarea class="txa" placeholder="例：月商100万円を安定して出せるようにする" value=${draft.title}
          onChange=${f("title")} style=${{minHeight:44,padding:"9px 12px",resize:"none"}}/>
      <//>
      <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <${GoalField} label="目標の数値"><input class="inp" type="number" inputmode="decimal" placeholder="100" value=${draft.target_value} onChange=${f("target_value")}/><//>
        <${GoalField} label="単位"><input class="inp" placeholder="万円 / 件 / kg" value=${draft.unit} onChange=${f("unit")}/><//>
        <${GoalField} label="開始日"><input class="inp" type="date" value=${draft.start_date} onChange=${f("start_date")}/><//>
        <${GoalField} label="期限"><input class="inp" type="date" value=${draft.end_date} onChange=${f("end_date")}/><//>
      </div>
      <${GoalField} label="なぜこれをやるのか" hint="迷ったときに立ち返る場所です。うまく書けなくても大丈夫。">
        <textarea class="txa" placeholder="例：家族との時間を増やしたいから、収入を仕組みで作れるようにしたい" value=${draft.why}
          onChange=${f("why")} style=${{minHeight:44,padding:"9px 12px",resize:"none"}}/>
      <//>
      <${GoalField} label="達成したと言える条件" hint="「なんとなく頑張った」で終わらせないための線引きです。">
        <textarea class="txa" placeholder="例：3か月連続で月商100万円を超えている" value=${draft.success_condition}
          onChange=${f("success_condition")} style=${{minHeight:44,padding:"9px 12px",resize:"none"}}/>
      <//>
      <div style=${{display:"flex",gap:8}}>
        <button class="btn" onClick=${onSave} disabled=${saving} style=${{flex:1,opacity:saving?.6:1}}>${saving?"保存中…":"保存する"}</button>
        <button onClick=${onCancel} style=${{background:"none",border:"1px solid var(--border)",borderRadius:10,padding:"0 16px",color:"var(--sub)",fontSize:13,fontWeight:600,cursor:"pointer"}}>やめる</button>
      </div>
    </div>`;
}

function WeeklyGoalEditor({draft, setDraft, onSave, onCancel, saving}) {
  const f=(k)=>(e)=>setDraft({...draft,[k]:e.target.value});

    <div style=${{background:"var(--card)",borderRadius:10,padding:12,border:"1px dashed var(--accent)",marginBottom:8}}>

        </select>

      ${!isBool&&html`
        <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>

      </div>

}

function GoalTreeSheet({onClose, onToast}) {
  const [tree,setTree]=useState(null);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const [goalDraft,setGoalDraft]=useState(null);   // 3か月目標の編集中データ
  const [wgDraft,setWgDraft]=useState(null);       // 週間目標の編集中データ

  const load=async()=>{
    setLoading(true);
    const r=await gasApi("getGoalTree");
    if(r&&r.ok) setTree(r.data); else onToast&&onToast(r&&r.error?r.error:"読み込みに失敗しました");
    setLoading(false);
  };
  useEffect(()=>{load();},[]);

  const saveGoalRow=async()=>{
    if(!String(goalDraft.title||"").trim()){ onToast&&onToast("目標を入力してください"); return; }
    setSaving(true);
    const r=await gasPostJson("saveGoal", goalDraft);
    setSaving(false);
    if(r&&r.ok){ setGoalDraft(null); onToast&&onToast("保存しました"); load(); }
    else onToast&&onToast(r&&r.error?r.error:"保存に失敗しました");
  };
  const saveWgRow=async()=>{
    if(!String(wgDraft.title||"").trim()){ onToast&&onToast("やることを入力してください"); return; }
    setSaving(true);
    const r=await gasPostJson("saveWeeklyGoal", wgDraft);
    setSaving(false);
    if(r&&r.ok){ setWgDraft(null); onToast&&onToast("保存しました"); load(); }
    else onToast&&onToast(r&&r.error?r.error:"保存に失敗しました");
  };
  const archive=async(kind,id)=>{
    const msg = kind==="goal" ? "この3か月目標と、ぶら下がっている週間目標をしまいます。よろしいですか？" : "この週間目標をしまいます。よろしいですか？";
    if(!confirm(msg)) return;
    const body = kind==="goal" ? {kind:"goal",quarterly_goal_id:id} : {kind:"weekly",weekly_goal_id:id};
    const r=await gasPostJson("archiveGoalItem", body);
    if(r&&r.ok){ onToast&&onToast("しまいました"); load(); } else onToast&&onToast("失敗しました");
  };

  const goals = (tree&&tree.goals)||[];
  return html`
    <div style=${{position:"fixed",inset:0,zIndex:400,background:"var(--bg)",display:"flex",flexDirection:"column"}}>
      <div style=${{display:"flex",alignItems:"center",gap:10,padding:"14px 16px",borderBottom:"1px solid var(--border)",flexShrink:0,paddingTop:"calc(14px + var(--safe-top, 0px))"}}>
        <div style=${{fontSize:15,fontWeight:800,color:"var(--text)",flex:1}}>目標のつながり</div>
        <button onClick=${onClose} style=${{background:"none",border:"none",color:"var(--sub)",fontSize:22,cursor:"pointer",lineHeight:1,padding:"0 4px"}}>×</button>
      </div>

      <div style=${{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"14px 16px calc(28px + var(--safe-bottom, 0px))"}}>
        <div style=${{fontSize:12,color:"var(--sub)",lineHeight:1.7,marginBottom:14}}>
          3か月後にたどり着きたい場所を決めて、その下に「今週やること」をぶら下げます。
          毎時間の記録がどの目標につながっているかを、これから見えるようにしていきます。
        </div>

        ${loading&&html`<div style=${{textAlign:"center",padding:"40px 0",color:"var(--sub)",fontSize:13}}>読み込み中…</div>`}

        ${!loading&&goals.length===0&&!goalDraft&&html`
          <div style=${{textAlign:"center",padding:"28px 16px",color:"var(--sub)",fontSize:13,lineHeight:1.7}}>
            まだ3か月目標がありません。<br/>まずは1つだけ決めてみましょう。
          </div>`}

        ${goals.map(g=>html`
          <div key=${g.quarterly_goal_id} style=${{marginBottom:14}}>
            ${goalDraft&&goalDraft.quarterly_goal_id===g.quarterly_goal_id
              ? html`<${GoalEditor} draft=${goalDraft} setDraft=${setGoalDraft} onSave=${saveGoalRow} onCancel=${()=>setGoalDraft(null)} saving=${saving}/>`
              : html`
              <div class="card" style=${{padding:14}}>
                <div style=${{display:"flex",alignItems:"flex-start",gap:8,marginBottom:6}}>
                  <div style=${{fontSize:14.5,fontWeight:800,color:"var(--text)",flex:1,lineHeight:1.5}}>${g.title}</div>
                  <button onClick=${()=>setGoalDraft({...EMPTY_GOAL,...g})} style=${{background:"none",border:"none",color:"var(--accent)",fontSize:12,fontWeight:700,cursor:"pointer",flexShrink:0}}>編集</button>
                  <button onClick=${()=>archive("goal",g.quarterly_goal_id)} style=${{background:"none",border:"none",color:"var(--sub)",fontSize:16,cursor:"pointer",lineHeight:1,flexShrink:0}}>×</button>
                </div>
                ${(g.target_value!==""&&g.target_value!=null)&&html`
                  <div style=${{fontSize:12,color:"var(--sub)",marginBottom:4}}>目標 ${g.target_value}${g.unit||""}${g.end_date?"　/　期限 "+g.end_date:""}</div>`}
                ${g.why&&html`<div style=${{fontSize:11.5,color:"var(--sub)",lineHeight:1.6,marginBottom:8}}>${g.why}</div>`}

                <div style=${{borderTop:"1px solid var(--border)",marginTop:10,paddingTop:10}}>
                  <div style=${{fontSize:11,fontWeight:700,color:"var(--sub)",marginBottom:8}}>今週やること</div>
                  ${(g.weeklyGoals||[]).map(w=>html`
                    <div key=${w.weekly_goal_id}>
                      ${wgDraft&&wgDraft.weekly_goal_id===w.weekly_goal_id
                        ? html`<${WeeklyGoalEditor} draft=${wgDraft} setDraft=${setWgDraft} onSave=${saveWgRow} onCancel=${()=>setWgDraft(null)} saving=${saving}/>`
                        : html`
                        <div style=${{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",background:"var(--bg)",borderRadius:9,marginBottom:6}}>
                          <div style=${{flex:1,minWidth:0}}>
                            <div style=${{fontSize:12.5,fontWeight:600,color:"var(--text)"}}>${w.title}</div>
                            <div style=${{fontSize:10.5,color:"var(--sub)",marginTop:2}}>
                              ${w.metric_type==="boolean"?"やったかどうか":(w.target_total!==""&&w.target_total!=null?"目標 "+w.target_total+(w.unit||""):"目標未設定")}
                              ${(w.min_line!==""&&w.min_line!=null)?"　最低 "+w.min_line+(w.unit||""):""}
                            </div>
                          </div>
                          <button onClick=${()=>setWgDraft({...EMPTY_WG,...w})} style=${{background:"none",border:"none",color:"var(--accent)",fontSize:11.5,fontWeight:700,cursor:"pointer",flexShrink:0}}>編集</button>
                          <button onClick=${()=>archive("weekly",w.weekly_goal_id)} style=${{background:"none",border:"none",color:"var(--sub)",fontSize:15,cursor:"pointer",lineHeight:1,flexShrink:0}}>×</button>
                        </div>`}
                    </div>
                  `)}
                  ${wgDraft&&!wgDraft.weekly_goal_id&&wgDraft.link_quarterly_goal_id===g.quarterly_goal_id
                    ? html`<${WeeklyGoalEditor} draft=${wgDraft} setDraft=${setWgDraft} onSave=${saveWgRow} onCancel=${()=>setWgDraft(null)} saving=${saving}/>`
                    : html`
                    <button onClick=${()=>setWgDraft({...EMPTY_WG,link_quarterly_goal_id:g.quarterly_goal_id})}
                      style=${{background:"none",border:"1.5px dashed var(--border)",borderRadius:9,padding:"8px",color:"var(--accent)",fontSize:12,fontWeight:600,cursor:"pointer",width:"100%"}}>
                      ＋ 今週やることを足す
                    </button>`}
                </div>
              </div>`}
          </div>
        `)}

        ${goalDraft&&!goalDraft.quarterly_goal_id&&html`
          <${GoalEditor} draft=${goalDraft} setDraft=${setGoalDraft} onSave=${saveGoalRow} onCancel=${()=>setGoalDraft(null)} saving=${saving}/>`}

        ${!loading&&!goalDraft&&html`
          <button onClick=${()=>setGoalDraft({...EMPTY_GOAL})}
            style=${{background:"none",border:"1.5px dashed var(--border)",borderRadius:12,padding:"12px",color:"var(--accent)",fontSize:13,fontWeight:700,cursor:"pointer",width:"100%"}}>
            ＋ 3か月目標を追加する
          </button>`}

        ${!loading&&tree&&(tree.orphanWeeklyGoals||[]).length>0&&html`
          <div style=${{marginTop:16}}>
            <div style=${{fontSize:11,fontWeight:700,color:"var(--sub)",marginBottom:8}}>どの目標にもつながっていないもの</div>
            ${tree.orphanWeeklyGoals.map(w=>html`
              <div key=${w.weekly_goal_id} style=${{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",background:"var(--bg)",borderRadius:9,marginBottom:6}}>
                <div style=${{flex:1,fontSize:12.5,color:"var(--text)"}}>${w.title}</div>
                <button onClick=${()=>setWgDraft({...EMPTY_WG,...w})} style=${{background:"none",border:"none",color:"var(--accent)",fontSize:11.5,fontWeight:700,cursor:"pointer"}}>編集</button>
              </div>`)}
          </div>`}
      </div>
    </div>`;
}

// セキュリティ強化にともなう一度きりの再ログイン案内。
// 既にログイン済みの人はログイン画面を通らないため、そのままではセッションを
// 取得できない。ここで一度だけ入り直してもらう。データや設定は消えない。
// ログイン待ちの表示。回るマークに加えて、経過に応じて文言を変える。
// 同じ画面のまま止まって見えると「固まった」と感じてしまうため。
function LoginWaiting() {
  const [sec,setSec]=useState(0);
  useEffect(()=>{ const t=setInterval(()=>setSec(x=>x+1),1000); return ()=>clearInterval(t); },[]);
  const msg = sec<4 ? "ログインしています…"

// 週次ふりかえりを出してよいかの判定。
// 以前は「土日なら出す」だけだったため、次の2つの問題があった。
//  ① 記入していないまとめが、何週間前のものでも週末のたびに出続けた
//     （実際に8日以上前に終わった週のまとめが表示されていた）
//  ② 深夜1時でも暦上は土曜なので、金曜の夜に「今週をふりかえろう」が出た
// そこで「日曜の朝7時〜夜23時」「直近に終わった週のものだけ」に限定する。
// 深夜0〜4時は本人の感覚ではまだ前日なので、土曜の深夜に出さないよう日付をずらす。
function shouldShowWeeklyReview(weekly) {
  if (!weekly || !weekly.weekEnd) return false;
  const now = new Date();
  const eff = new Date(now.getTime() - (now.getHours() < 4 ? 4 * 3600 * 1000 : 0));
  if (eff.getDay() !== 0) return false;                       // 日曜だけ
  const h = eff.getHours();
  if (h < 7 || h >= 23) return false;                         // 朝7時〜夜23時のあいだ
  const end = new Date(String(weekly.weekEnd) + "T00:00:00");
  const days = Math.floor((eff - end) / 86400000);
  return days >= 0 && days <= 9;                              // 直近に終わった週のものだけ
}

      <!-- JIROKUロゴ 右上 -->
      <div style=${{position:"absolute",top:18,right:20,display:"flex",alignItems:"center",gap:6}}>
        <svg width="28" height="28" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg"><circle cx="36" cy="36" r="36" fill="rgba(255,255,255,0.2)"/><circle cx="36" cy="36" r="25" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4.5"/><path d="M36 11 A25 25 0 1 1 14.5 50" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="36" cy="36" r="15" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2"/><line x1="36" y1="36" x2="36" y2="25" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="36" y1="36" x2="43" y2="41" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="36" cy="36" r="2" fill="#fff"/></svg>
        <span style=${{fontSize:13,fontWeight:800,color:"rgba(255,255,255,0.9)",letterSpacing:"1px"}}>JIROKU</span>
      </div>
      <div style=${{fontSize:12,color:"rgba(255,255,255,0.7)",marginBottom:6,letterSpacing:".05em"}}>ACCOUNT</div>
      <div style=${{display:"flex",alignItems:"center",gap:10,marginBottom:2}}>
        <div style=${{width:36,height:36,borderRadius:"50%",background:"rgba(255,255,255,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:19,flexShrink:0}}>${profile?.avatar||"🦊"}</div>
        <div style=${{fontSize:24,fontWeight:800,color:"#fff"}}>${profile?.nickname||CURRENT_USER.name}</div>
      </div>
      <div style=${{fontSize:13,color:"rgba(255,255,255,0.7)"}}>${CURRENT_USER.email}</div>
    </div>

    <div style=${{padding:"16px 16px 0"}}>

      ${GroupLabel("アカウント")}
      <!-- プロフィール -->
      <${SettingsSec} k="profile" icon="🙂" title="プロフィール" open=${openSec==="profile"} onToggle=${()=>setOpenSec(openSec==="profile"?"":"profile")}>
        <label class="form-lbl" style=${{fontSize:11}}>ニックネーム（他の人に表示される名前）</label>
        <input class="inp" value=${nickname} maxLength=${20} onChange=${e=>setNickname(e.target.value)} style=${{marginBottom:14}}/>
        <div class="form-lbl" style=${{fontSize:11,marginBottom:8}}>アバター</div>
        <div style=${{display:"grid",gridTemplateColumns:"repeat(4, 1fr)",gap:8,marginBottom:8}}>
          ${(showAllAvatars?AVATAR_OPTIONS:AVATAR_OPTIONS.slice(0,8)).map(a=>html`
            <button key=${a} onClick=${()=>setAvatar(a)}
              style=${{fontSize:22,padding:"8px 0",borderRadius:12,border:`2px solid ${avatar===a?"var(--accent)":"var(--border)"}`,background:avatar===a?"var(--accent-bg, rgba(8,145,178,0.1))":"transparent",cursor:"pointer"}}>
              ${a}
            </button>
          `)}
        </div>
        ${!showAllAvatars&&html`
          <button onClick=${()=>setShowAllAvatars(true)}
            style=${{background:"none",border:"none",color:"var(--accent)",fontSize:12.5,fontWeight:600,cursor:"pointer",padding:"2px 0 14px",width:"100%",textAlign:"center"}}>
            もっと見る（他${AVATAR_OPTIONS.length-8}種類）
          </button>
        `}
        ${showAllAvatars&&html`<div style=${{marginBottom:14}}/>`}
        <button class="btn" onClick=${saveProfile}>保存する</button>
      <//>

      ${GroupLabel("目標と記録")}
      <!-- 目標 -->
      <!-- 旧・目標入力（自由記述3つ）。goals_v1 が有効な人には出さず、
           下の「目標」（3か月目標→週間目標）に一本化する -->
      ${!(CURRENT_USER&&CURRENT_USER.goalsV1)&&html`
      <${SettingsSec} k="goals" icon="🎯" title="目標・期限" open=${openSec==="goals"} onToggle=${()=>setOpenSec(openSec==="goals"?"":"goals")}>
        ${goals.map((g,i)=>html`
          <div key=${i} style=${{background:"var(--bg)",borderRadius:12,padding:"14px",marginBottom:10,border:"1px solid var(--border)"}}>
            <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div style=${{display:"flex",alignItems:"center",gap:6}}>
                <div style=${{width:6,height:6,borderRadius:"50%",background:i===0?"var(--accent)":i===1?"var(--amber)":"var(--green)"}}/>
                <label class="form-lbl" style=${{margin:0,fontSize:12}}>目標${i+1}${i===0?" （メイン）":""}</label>
              </div>
              ${i>0&&html`<button onClick=${()=>removeGoal(i)} style=${{background:"none",border:"none",color:"var(--sub)",fontSize:18,cursor:"pointer",lineHeight:1,padding:"0 2px"}}>×</button>`}
            </div>
            <textarea class="txa" placeholder=${i===0?"例：英検2級に合格する":"例：毎月売上100万円達成"} value=${g.goal}
              onChange=${e=>{updateGoal(i,"goal",e.target.value);e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px";}}
              ref=${el=>{if(el){el.style.height="auto";el.style.height=el.scrollHeight+"px";}}}
              style=${{minHeight:42,padding:"9px 12px",overflow:"hidden",resize:"none",marginBottom:8}}/>
            <label class="form-lbl" style=${{fontSize:11}}>達成期限</label>
            <input type="date" class="inp" value=${g.deadline} onChange=${e=>updateGoal(i,"deadline",e.target.value)}/>
          </div>
        `)}
        ${goals.length<3&&html`
          <button onClick=${addGoal} style=${{background:"none",border:"1.5px dashed var(--border)",borderRadius:12,padding:"11px",color:"var(--accent)",fontSize:13,fontWeight:600,cursor:"pointer",width:"100%",marginBottom:10}}>
            ＋ 目標を追加する
          </button>
        `}
        <button class="btn" onClick=${saveGoal}>保存する</button>
      <//>`}

      <!-- 新・目標。3か月目標→週間目標の階層。goals_v1 が有効な人はこちらが本体 -->
      ${CURRENT_USER&&CURRENT_USER.goalsV1&&html`
      <${SettingsSec} k="goaltree" icon="🎯" title="目標" open=${openSec==="goaltree"} onToggle=${()=>setOpenSec(openSec==="goaltree"?"":"goaltree")}>
        <div style=${{fontSize:12,color:"var(--sub)",lineHeight:1.7,marginBottom:12}}>
          3か月後にたどり着きたい場所を決めて、その下に「今週やること」をぶら下げます。
          毎時間の記録がどの目標につながっているかを、これから見えるようにしていきます。
        </div>
        <button class="btn" onClick=${()=>setShowGoalTree(true)}>目標を設定する</button>
      <//>`}

      <!-- タイマー -->
      <${SettingsSec} k="timer" icon="⏱" title="タイマー設定" open=${openSec==="timer"} onToggle=${()=>setOpenSec(openSec==="timer"?"":"timer")}>
        <div style=${{fontSize:12,color:"var(--sub)",marginBottom:10,fontWeight:500}}>集中時間プリセット（最大3つ）</div>
        <div style=${{display:"flex",flexWrap:"wrap",gap:8,marginBottom:18}}>
          ${PRESET_OPTIONS.map(min=>html`
            <button key=${min} onClick=${()=>togglePreset(min)}
              style=${{padding:"5px 12px",borderRadius:16,border:`1.5px solid ${selectedPresets.includes(min)?"var(--accent)":"var(--border)"}`,
              background:selectedPresets.includes(min)?"var(--accent)":"transparent",
              color:selectedPresets.includes(min)?"#fff":"var(--text)",
              fontSize:11,fontWeight:600,cursor:"pointer",
              opacity:!selectedPresets.includes(min)&&selectedPresets.length>=3?0.35:1,
              transition:"all .15s"}}>
              ${min}分
            </button>
          `)}
        </div>
        <div style=${{fontSize:12,color:"var(--sub)",marginBottom:10,fontWeight:500}}>休憩時間</div>
        <div style=${{display:"flex",gap:8,marginBottom:18}}>
          ${[5,10,15,20].map(min=>html`
            <button key=${min} onClick=${()=>setBreakMin(min)}
              style=${{flex:1,padding:"10px 0",borderRadius:12,border:`1.5px solid ${breakMin===min?"var(--accent)":"var(--border)"}`,
              background:breakMin===min?"var(--accent-l)":"transparent",
              color:breakMin===min?"var(--accent)":"var(--text)",
              fontSize:14,fontWeight:breakMin===min?700:400,cursor:"pointer",transition:"all .15s"}}>
              ${min}分
            </button>
          `)}
        </div>
        <div style=${{fontSize:12,color:"var(--sub)",marginBottom:10,fontWeight:500}}>アラーム音の種類</div>
        <div style=${{display:"flex",flexDirection:"column",gap:8,marginBottom:18}}>
          ${ALARM_STYLES.map(s=>html`
            <div key=${s.key} style=${{display:"flex",alignItems:"center",gap:8}}>
              <button onClick=${()=>setAlarmStyle(s.key)}
                style=${{flex:1,textAlign:"left",padding:"10px 14px",borderRadius:12,border:`1.5px solid ${alarmStyle===s.key?"var(--accent)":"var(--border)"}`,
                background:alarmStyle===s.key?"var(--accent-l)":"transparent",
                color:alarmStyle===s.key?"var(--accent)":"var(--text)",
                fontSize:14,fontWeight:alarmStyle===s.key?700:400,cursor:"pointer",transition:"all .15s"}}>
                ${s.label}
              </button>
              <button onClick=${()=>testAlarmStyle(s.key)}
                style=${{padding:"10px 12px",borderRadius:12,border:"1px solid var(--border)",background:"none",color:"var(--sub)",fontSize:13,cursor:"pointer",flexShrink:0}}>🔊</button>
            </div>
          `)}
        </div>
        <button class="btn" onClick=${saveTimerSettings}>保存する</button>
      <//>

      <!-- 時間帯と通知（記録画面の表示範囲とLINE通知が連動） -->
      <${SettingsSec} k="notif" icon="🕐" title="時間帯と通知" open=${openSec==="notif"} onToggle=${()=>setOpenSec(openSec==="notif"?"":"notif")}>
        <div style=${{fontSize:12,color:"var(--sub)",marginBottom:14,lineHeight:1.6}}>記録する時間帯です。記録画面の表示とLINEリマインダーの両方に反映されます</div>
        <div style=${{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <div style=${{flex:1}}>
            <div style=${{fontSize:11,color:"var(--sub)",marginBottom:6,fontWeight:500}}>開始</div>
            <select class="inp" style=${{padding:"10px 8px",textAlign:"center"}} value=${logStart} onChange=${e=>setLogStart(Number(e.target.value))}>
              ${Array.from({length:20},(_,i)=>i+5).map(h=>html`<option key=${h} value=${h}>${String(h).padStart(2,"0")}:00</option>`)}
            </select>
          </div>
          <div style=${{color:"var(--sub)",marginTop:18,fontSize:18,fontWeight:300}}>→</div>
          <div style=${{flex:1}}>
            <div style=${{fontSize:11,color:"var(--sub)",marginBottom:6,fontWeight:500}}>終了</div>
            <select class="inp" style=${{padding:"10px 8px",textAlign:"center"}} value=${logEnd} onChange=${e=>setLogEnd(Number(e.target.value))}>
              ${Array.from({length:20},(_,i)=>i+6).map(h=>html`<option key=${h} value=${h}>${String(h).padStart(2,"0")}:00</option>`)}
            </select>
          </div>
        </div>
        <div style=${{fontSize:12,color:"var(--sub)",marginBottom:10,fontWeight:500}}>休みの曜日</div>
        <div style=${{display:"flex",gap:5,marginBottom:8}}>
          ${["日","月","火","水","木","金","土"].map((label,d)=>{
            const on=restDays.includes(d);
            return html`<button key=${d} onClick=${()=>toggleRestDay(d)}
              style=${{flex:1,padding:"8px 0",borderRadius:10,border:`1.5px solid ${on?"var(--accent)":"var(--border)"}`,
              background:on?"var(--accent)":"transparent",color:on?"#fff":d===0?"var(--red)":d===6?"var(--accent)":"var(--text)",
              fontSize:13,cursor:"pointer",fontWeight:on?700:400,fontFamily:"inherit",transition:"all .15s"}}>
              ${label}
            </button>`;
          })}
        </div>
        <div style=${{fontSize:11,color:"var(--sub)",marginBottom:16,lineHeight:1.6,padding:"8px 10px",background:"var(--bg)",borderRadius:8}}>
          休みの日はリマインダーが届かず、記録しなくてもXPや連続記録は減りません。コーチのメッセージも休息を尊重した内容になります
        </div>
        <div style=${{fontSize:12,color:"var(--sub)",marginBottom:10,fontWeight:500}}>LINE通知の間隔</div>
        <div style=${{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
          ${[[1,"1時間"],[2,"2時間"],[3,"3時間"],[6,"6時間"],[24,"1日1回"]].map(([v,label])=>html`
            <button key=${v} onClick=${()=>setInterval(v)}
              style=${{padding:"7px 13px",borderRadius:20,border:`1.5px solid ${interval===v?"var(--accent)":"var(--border)"}`,
              background:interval===v?"var(--accent)":"transparent",
              color:interval===v?"#fff":"var(--text)",fontSize:13,cursor:"pointer",fontWeight:interval===v?600:400,transition:"all .15s"}}>
              ${label}
            </button>
          `)}
        </div>
        <div style=${{fontSize:11,color:"var(--sub)",marginBottom:16,lineHeight:1.6,padding:"8px 10px",background:"var(--bg)",borderRadius:8}}>
          ${interval===1?"毎時間リマインドが届きます":interval===24?"1日の開始時間に1回届きます":`${interval}時間ごとにリマインドが届きます`}（22時以降はレポートのみ）
        </div>
        <button class="btn" onClick=${saveTimeSettings}>保存する</button>
      <//>

      ${GroupLabel("連携")}

      <!-- LINE連携（ワンタイムのことば方式）。
           以前はメールアドレスを送るだけで連携できたが、それだと他人になりすまして
           通知の宛先を奪えたため、アプリで発行したことばでのみ連携する -->
      <${SettingsSec} k="linelink" icon="💬" title="LINE連携" open=${openSec==="linelink"} onToggle=${()=>setOpenSec(openSec==="linelink"?"":"linelink")}>
        <${LineLinkSection} onToast=${onToast} linked=${CURRENT_USER&&CURRENT_USER.lineLinked!==false}/>
      <//>

      <!-- カレンダー -->
      <${SettingsSec} k="calendar" icon="📅" title="Googleカレンダー連携" sub=${(calLinked||isServerCalendar())?"連携済み":""} open=${openSec==="calendar"} onToggle=${()=>setOpenSec(openSec==="calendar"?"":"calendar")}>
        <p style=${{fontSize:13,color:"var(--sub)",lineHeight:1.7,marginBottom:14}}>${calLinked?"連携済みです。ホームに今日の予定が表示され、記録の「何をしましたか？」に予定が自動入力されます。":"連携すると、ホームに今日の予定が表示され、記録の「何をしましたか？」にカレンダーの予定が自動で入ります。記録の手間が大幅に減ります。"}</p>
        ${calLinked
          ? html`<div>
              <div style=${{display:"flex",alignItems:"center",gap:8,color:"var(--accent)",fontWeight:700,fontSize:14,padding:"10px 14px",background:"var(--accent-l)",borderRadius:10,marginBottom:10}}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>連携済み
              </div>
              ${calWriteGranted
                ? html`<div style=${{display:"flex",alignItems:"center",gap:8,color:"var(--sub)",fontWeight:500,fontSize:12.5,padding:"9px 4px",marginBottom:10}}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>記録のカレンダー書き込みも許可済み
                  </div>`
                : html`<button onClick=${linkCalendar} disabled=${calLoading}
                    style=${{width:"100%",padding:"9px",borderRadius:10,border:"1px solid var(--border)",background:"none",color:"var(--text)",fontSize:12.5,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginBottom:10}}>
                    ${calLoading?"連携中...":"記録をカレンダーに書き込む権限を許可する"}
                  </button>`
              }
              ${calList===null
                ? html`<button onClick=${loadCalList} disabled=${calListLoading}
                    style=${{width:"100%",padding:"9px",borderRadius:10,border:"1px solid var(--border)",background:"none",color:"var(--text)",fontSize:12.5,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
                    ${calListLoading?"読み込み中...":"連携するカレンダーを選ぶ（複数可）"}
                  </button>`
                : html`<div>
                    <div style=${{fontSize:12,color:"var(--sub)",marginBottom:8,fontWeight:500}}>予定を読み込むカレンダー（複数選択できます）</div>
                    ${calList.map(c=>{
                      const on=selectedCalIds.includes(c.id);
                      return html`<button key=${c.id} onClick=${()=>toggleCalId(c.id)}
                        style=${{display:"flex",alignItems:"center",gap:8,width:"100%",padding:"9px 11px",marginBottom:6,borderRadius:9,border:`1.5px solid ${on?"var(--accent)":"var(--border)"}`,background:on?"var(--accent-l)":"transparent",cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}>
                        <div style=${{width:16,height:16,borderRadius:5,border:`2px solid ${on?"var(--accent)":"var(--border)"}`,background:on?"var(--accent)":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                          ${on&&html`<svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
                        </div>
                        <span style=${{fontSize:13,color:on?"var(--accent)":"var(--text)",fontWeight:on?600:400,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${c.summary}${c.primary?"（メイン）":""}</span>
                      </button>`;
                    })}
                    <div style=${{fontSize:11,color:"var(--sub)",lineHeight:1.6,marginTop:4}}>別のGoogleアカウントのカレンダーを使いたい場合は、そのカレンダーをこのアカウントに共有すると一覧に表示されます。</div>
                  </div>`}
            </div>`
          : html`<button class="btn" onClick=${linkCalendar} disabled=${calLoading}>${calLoading?"連携中...":"Googleカレンダーを連携する"}</button>`
        }
      <//>

      <!-- プッシュ通知 -->
      <${SettingsSec} k="push" icon="🔔" title="プッシュ通知" sub=${pushEnabled?"有効":""} open=${openSec==="push"} onToggle=${()=>setOpenSec(openSec==="push"?"":"push")}>
        <p style=${{fontSize:13,color:"var(--sub)",lineHeight:1.7,marginBottom:14}}>${pushEnabled?"有効になっています。アプリを閉じていたり画面がロックされていても、タイマー終了・記録リマインダーなどの通知が届きます。":"タイマーの音はアプリを開いている間しか鳴りません。有効にすると、アプリを閉じていてもタイマー終了・記録リマインダーなどの通知が端末に届きます。"}</p>
        ${pushEnabled
          ? html`<div style=${{display:"flex",alignItems:"center",gap:8,color:"var(--accent)",fontWeight:700,fontSize:14,padding:"10px 14px",background:"var(--accent-l)",borderRadius:10}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>有効
            </div>`
          : html`<button class="btn" onClick=${enablePush} disabled=${pushLoading}>${pushLoading?"設定中...":"プッシュ通知を有効にする"}</button>`
        }
      <//>

      ${GroupLabel("データ")}
      <!-- データの書き出し -->
      <${SettingsSec} k="export" icon="📤" title="データの書き出し" open=${openSec==="export"} onToggle=${()=>setOpenSec(openSec==="export"?"":"export")}>
        <div style=${{fontSize:12,color:"var(--sub)",marginBottom:14,lineHeight:1.6}}>あなたの記録・日記はあなたのものです。いつでも自分の端末に書き出せます（Markdown / CSV）。</div>
        <div style=${{display:"flex",gap:8}}>
          <button class="btn" style=${{flex:1,opacity:exporting?0.6:1}} disabled=${!!exporting} onClick=${()=>exportData("markdown")}>${exporting==="markdown"?"書き出し中…":"Markdownで書き出す"}</button>
          <button style=${{flex:1,background:"none",border:"1px solid var(--border)",borderRadius:8,padding:"0 12px",fontSize:14,fontWeight:600,color:"var(--text)",cursor:"pointer",fontFamily:"inherit",opacity:exporting?0.6:1}} disabled=${!!exporting} onClick=${()=>exportData("csv")}>${exporting==="csv"?"書き出し中…":"CSVで書き出す"}</button>
        </div>
      <//>

      ${GroupLabel("情報・ヘルプ")}
      <!-- 階級システム -->
      <${SettingsSec} k="rank" icon="🏆" title="階級システム" open=${openSec==="rank"} onToggle=${()=>setOpenSec(openSec==="rank"?"":"rank")}>
        <div style=${{display:"flex",gap:8,marginBottom:14}}>
          <div style=${{flex:1,background:"var(--bg)",borderRadius:10,padding:"12px",fontSize:12,lineHeight:1.8,color:"var(--sub)"}}>
            <div style=${{fontWeight:700,color:"var(--text)",marginBottom:4,fontSize:13}}>XPの貯め方</div>
            記録した日：<b style=${{color:"var(--accent)"}}>+10〜25 XP</b><br/>
            メモを書く：<b style=${{color:"var(--accent)"}}>+5 XP</b><br/>
            連続ボーナスあり
          </div>
          <div style=${{flex:1,background:"var(--bg)",borderRadius:10,padding:"12px",fontSize:12,lineHeight:1.8,color:"var(--sub)"}}>
            <div style=${{fontWeight:700,color:"var(--text)",marginBottom:4,fontSize:13}}>記録なしの日</div>
            1日：<b style=${{color:"var(--red)"}}>−15 XP</b><br/>
            2日連続：<b style=${{color:"var(--red)"}}>−30 XP</b><br/>
            ストリークリセット
          </div>
        </div>
        <div style=${{display:"flex",flexDirection:"column",gap:6}}>
          ${RANK_RULES.map(r=>html`
            <div key=${r.name} style=${{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:10,background:"var(--bg)",border:"1px solid var(--border)"}}>
              <span style=${{width:8,height:8,borderRadius:"50%",background:r.color,flexShrink:0}}/>
              <div style=${{flex:1}}>
                <span style=${{fontSize:13,fontWeight:700,color:"var(--text)"}}>${r.name}</span>
                <span style=${{fontSize:11,color:"var(--sub)",marginLeft:6}}>${r.sub}</span>
              </div>
              <span style=${{fontSize:11,fontWeight:700,color:r.color,flexShrink:0}}>${r.lv}</span>
            </div>
          `)}
        </div>
      <//>

      <!-- 使い方 Q&A -->
      <${FAQSection}/>

      <!-- ログアウト -->
      <button class="btn-g" onClick=${onLogout} style=${{marginBottom:32}}>ログアウト</button>
    </div>
  </div>`;
}

// ログインした環境と方式の短いラベル。
// ★UAそのものは保存しない★ 個人の特定につながる情報を残さないため、
// 「iPhone/gsi」のような粗い分類だけにする。
// これが無いと「スマホで通ったのか」「公式ボタンだったのか」を
// 毎回口頭で確認するしかない。
function deviceLabel(method){
  const ua = navigator.userAgent || "";
  let env = "PC";
  if (/Line\//i.test(ua)) env = "LINE";
  else if (/iPhone|iPod/i.test(ua)) env = "iPhone";
  else if (/iPad/i.test(ua)) env = "iPad";
  else if (/Android/i.test(ua)) env = "Android";
  let disp = "";
  try { if (window.matchMedia("(display-mode: standalone)").matches || navigator.standalone) disp = "/pwa"; } catch {}
  return env + disp + "/" + (method || "unknown");
}

// ══════════════════════════════════════════════════════════════════
// タスクの識別子（task_id）への一本化 ─ 第1段
//
// いまの「今日のタスク」はタスクが文字列そのもので、完了・想定時間・
// 重要度・期限はすべて「タスク名」をキーにしたマップで持っている。
// そのため:
//   ・名前を変えると付随情報が古い名前に取り残される
//   ・同名のタスクを2件作ると区別できない（片方を完了にすると両方完了）
//   ・日付をまたぐと別物になり、持ち越しを追えない
//
// 名前ではなく id で持つようにする。ただし既に保存されている
// 文字列配列を壊さないよう、読むときは両方の形を受け取る。
// ══════════════════════════════════════════════════════════════════

// 保存されているタスク一覧を、必ず [{id,title}] の形にして返す。
// 旧形式（文字列の配列）なら、その場で id を振る。
function normalizeTaskList(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map(function (v, i) {
    if (v && typeof v === "object") {
      const title = String(v.title != null ? v.title : (v.text != null ? v.text : "")).trim();
      if (!title) return null;
      // ★付随情報も一緒に運ぶ★
      //   重要度・期限・想定時間は端末内にしか無く、
      //   スマホで設定してもPCに出てこなかった（実際にそうなった）。
      //   サーバーへ送っているのはタスク名と完了状態だけだったため。
      //   ここへ載せれば、既にある同期の仕組みにそのまま乗る。
      const o = { id: String(v.id || v.task_id || makeLocalTaskId(title, i)), title: title };
      if (v.imp) o.imp = String(v.imp);
      if (v.due) o.due = String(v.due);
      if (v.est !== undefined && v.est !== "" && v.est !== null) o.est = Number(v.est);
      if (v.memo) o.memo = String(v.memo);
      if (v.stt)  o.stt  = String(v.stt);
      return o;
    }
    const title = String(v || "").trim();
    if (!title) return null;
    return { id: makeLocalTaskId(title, i), title: title };
  }).filter(Boolean);
}

// 旧データへ id を振るときの決め方。
// ★同じ入力からは必ず同じ id になるようにする★
// 端末ごとに違う id を振ると、同じタスクが2つに見える。
// 並び順（i）を混ぜるのは、同名タスクが2件あっても別物として扱うため。
// ★旧形式（文字列一覧）の正規化にだけ使う決定的ID★
//   複数の端末が同じ旧データを見ても同じIDになるので、二重登録にならない。
//   新規作成には使わない（タイトルのハッシュは同名で衝突するため）。
function makeLocalTaskId(title, i) {
  let h = 0;
  const src = String(title) + "|" + i;
  for (let k = 0; k < src.length; k++) { h = ((h << 5) - h + src.charCodeAt(k)) | 0; }
  return "lt_" + (h >>> 0).toString(36);
}
// ★新規タスクのID★ ランダムで一意。タイトル・並び順・日付を材料にしない。
//   オフラインでも発行できる（作成→編集→完了がキューで同じIDのまま並ぶ）。
//   IDは認可の代わりではない。サーバーは必ず持ち主で行を引く。
function makeClientTaskId() {
  try { return "task_c_" + crypto.randomUUID(); } catch (e) {}
  const a = new Uint8Array(16);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_,i)=>a[i]=Math.floor(Math.random()*256));
  return "task_c_" + Array.from(a, b => b.toString(16).padStart(2,"0")).join("");
}

// 2つのタスク一覧を、task_id を頼りに1つにまとめる。
//
// ★これが無いと一覧が同期しない★
//   以前は「端末にタスクが無いときだけサーバーの一覧を受け取る」作りだった。
//   両方の端末にタスクがあると、一生混ざらない。
//   実際、PCには「朝食」だけ、スマホには「AI研究」「読書」があり、
//   どちらも相手のタスクを知らないままだった。
//
// ★消したタスクが復活する問題★
//   単純に足し合わせると、片方で消したタスクがもう片方から戻ってくる。
//   完全に防ぐには「消した記録」が要る（Tasksシートへ移す Phase 3 の仕事）。
//   いまは「消したら即座にサーバーへ送る」ことで、次に相手が読むときには
//   消えた状態になっている、という形にしている。
//   同時に別々の編集をした場合は、足し合わせになる。消えるよりは良い。
function mergeTaskLists(local, server) {
  const out = [], seen = {};
  (local || []).forEach(function (t) { if (!seen[t.id]) { seen[t.id] = 1; out.push(t); } });
  (server || []).forEach(function (t) {
    if (seen[t.id]) return;
    // 同じ名前が既にあるなら、別idでも同じタスクとみなす（重複表示を避ける）
    if (out.some(function (x) { return x.title === t.title; })) return;
    seen[t.id] = 1; out.push(t);
  });
  return out;
}

// 保存済みのマップを id キーへ付け替える（Phase 2 の移行）。
// ★取りこぼしても消さない★
//   キーが既に id ならそのまま。名前なら id へ移す。
//   どちらでもない（今日のタスクから消えた等）ものは、触らずに残す。
//   消すと「昨日つけた重要度が無くなった」になる。判断がつかないものは残す。
function migrateMapKeysToId(map, list) {
  if (!map || typeof map !== "object") return {};
  const byId = {}, byTitle = {};
  (list || []).forEach(function (t) { byId[t.id] = 1; if (!byTitle[t.title]) byTitle[t.title] = t.id; });
  const out = {};
  Object.keys(map).forEach(function (k) {
    if (byId[k]) { out[k] = map[k]; return; }          // 既に id
    const id = byTitle[k];
    if (id && out[id] === undefined) { out[id] = map[k]; return; }  // 名前 → id
    out[k] = map[k];                                   // 判断がつかないものは残す
  });
  return out;
}

// 名前をキーにした古いマップを、id をキーに付け替える。
// 同名が2件あるときは、最初の1件にだけ引き継ぐ（推測で複製しない）。
function remapByTaskId(oldMap, list) {
  const out = {}, used = {};
  (list || []).forEach(function (t) {
    if (used[t.title]) return;
    if (oldMap && Object.prototype.hasOwnProperty.call(oldMap, t.title)) {
      out[t.id] = oldMap[t.title];
      used[t.title] = 1;
    }
  });
  return out;
}

const TASK_LABEL = {

            other: { icon:"📌", label:"予定を決める",   hint:"重要だが急がない。先に時間を取る", color:"#0891b2" } },

};
function taskLabel(importance, urgency){
  const imp = TASK_LABEL[String(importance||"MEDIUM").toUpperCase()] || TASK_LABEL.MEDIUM;
  return String(urgency).toUpperCase()==="HIGH" ? imp.urgent : imp.other;
}
const IMPORTANCE_LABEL = { HIGH:"高", MEDIUM:"中", LOW:"低" };
// 期限の表示。何日後かが一目で分かるようにする
function dueLabel(dueAt, overdue){
  const raw=String(dueAt||"").trim();
  if(!raw) return "";
  const dateOnly=/^\d{4}-\d{2}-\d{2}$/.test(raw);
  const p=raw.substring(0,10).split("-");
  const due=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
  const t=new Date(); const today=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const days=Math.round((due-today)/86400000);
  const time=dateOnly?"":(" "+raw.substring(11,16));
  if(overdue||days<0) return "期限超過（"+(p[1]*1)+"/"+(p[2]*1)+time+"）";
  if(days===0) return "今日まで"+time;
  if(days===1) return "明日まで"+time;
  return days+"日後（"+(p[1]*1)+"/"+(p[2]*1)+time+"）";
}

const XP_THRESHOLDS = [0, 500, 1200, 2200, 3500, 5200, 7500, 10000, 13000, 17000, 21000, 25500, 30500, 36000, 42000, 49000];
const getXpLevel = xp => { let lv=1; for(let i=1;i<XP_THRESHOLDS.length;i++){ if(xp>=XP_THRESHOLDS[i]) lv=i+1; else break; } return lv; };
const getXpInLevel = xp => xp - (XP_THRESHOLDS[getXpLevel(xp)-1]||0);

function parseJwt(token) {
  try {
    const base64 = token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
    const json = decodeURIComponent(atob(base64).split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));
    return JSON.parse(json);
  } catch { return null; }
}

function LoginScreen({onLogin}) {

    const err=hash.get("error");

    // 何も出ていないとログイン画面へ戻ったように見えるため、真っ先に待機表示を出す
    setLoading(true); setError("");
    const payload=parseJwt(res.credential);
    if(!payload) { setLoading(false); setError("ログインに失敗しました"); return; }

    // ★IDトークンをサーバーへ送り、検証してもらってセッションを受け取る。
    //   ここで初めて「本人であること」がサーバー側で確定する。
    //   受け取ったらIDトークンは即座に捨てる（長期保存しない）。
    // stateは "challenge_id~state" の形でGoogleが返してくる。
    // 本人確認は「後で待つ」形にして、下のユーザー情報取得と並行して走らせる
    // （直列にすると2つのGAS呼び出しで合計6〜8秒かかり、待ち時間が長すぎた）
    const raw=String(res.state||"");
    const sep=raw.indexOf("~");
    const strictNow = (AUTH_RANK[rememberedAuthMode()]||0) >= 1;
    const sessionPromise = (sep>0)
      ? fetch(GAS_URL,{ method:"POST", headers:{"Content-Type":"text/plain"},
          body: JSON.stringify({ action:"login", idToken:res.credential,
                                 challenge_id:raw.slice(0,sep), state:raw.slice(sep+1),
                                 device: deviceLabel(res.method) }) })
          .then(r=>r.json())
          .then(j=>{
            if(j&&j.ok&&j.token) setSessionToken(j.token);
            else {
              try{ localStorage.setItem("auth_last_error", String((j&&j.error)||"UNKNOWN")); }catch{}
              // ★合言葉が切れていた場合は、そのまま伝えて取り直させる★
              //   「ログインできませんでした」だけだと、何をすればいいか分からない。
              //   もう一度押せば直る、と分かれば利用者は詰まらない。
              try{ window.dispatchEvent(new CustomEvent("jiroku:loginfail")); }catch{}
            }
          })
          .catch(()=>{ try{ localStorage.setItem("auth_last_error","NETWORK"); }catch{} })
      : Promise.resolve().then(()=>{ try{ localStorage.setItem("auth_last_error","NO_STATE"); }catch{} });
    res.credential=null;   // IDトークンを保持し続けない

    const email=payload.email;
    const name=payload.name||payload.given_name||"";
    try{
      // 既存ユーザー確認
      // ★必ずタイムアウトを付ける★
      // 以前は待ち時間の上限が無く、サーバーの応答が返らないと
      // 「ログインしています…」から永久に動かなくなっていた（2026-08-01に発生）
      const withTimeout=(pr,ms)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);
      // ★セッションを先に受け取る。getUser はそのあと★
      //
      // 以前は「待ち時間を短くする」ために並行して走らせていた。
      // ところが getUser が認証必須になった瞬間、順序が逆になった:
      //   ログイン成功 → トークン未取得のまま getUser → AUTH_REQUIRED
      //   → アプリは「そんな利用者はいない」と解釈 → 新規登録画面へ
      // 2026-08-01、既存利用者に「はじめまして」の画面を出した。
      //
      // 数秒遅くなるが、正しさを優先する。
      // 「速いが、たまに別人として扱う」より「少し遅いが必ず本人」が良い。
      try{ await withTimeout(sessionPromise, 25000); }catch{}

      // トークンを添えて取得する（authedApi が本文へ入れる）。
      // まだセッションを取れていない場合でも、トークン無しで送られるだけなので
      // 互換段階（SESSION_OPTIONAL）ではこれまでどおり通る。
      // ★CURRENT_USER を先に書き換えない★
      //   まだログインが確定していない段階で全体の状態を触ると、
      //   別の画面が中途半端な利用者を掴む。宛先は引数で渡す。
      const r=await withTimeout(authedApi("getUser",{studentEmail:email}), 25000);
      // セッション切れで預かっていた操作を、ログインできたらやり直す
      if(getSessionToken() && pendingOpCount()>0){
        try{ await flushPendingOps(); }catch{}
      }
      // 認証段階が SESSION_OPTIONAL 以上なら、セッションを取れていない状態で
      // 従来のメール方式のまま中へ入れてはいけない
      if(strictNow && !getSessionToken()){
        setLoading(false);
        setError("ログインを確認できませんでした。もう一度お試しください");
        return;
      }
      if(r.ok&&r.data){
        // 既存ユーザー → ログイン
        const u={email,name:r.data.name||name,nickname:r.data.nickname||r.data.name||name,avatar:r.data.avatar||"🦊",coachName:r.data.coachName||"コーチ",coachEmail:r.data.coach_email||""};
        localStorage.setItem("edventure_user",JSON.stringify(u));
        if(!localStorage.getItem("line_prompted")){ setPendingUser(u); setStep("line"); }
        else { CURRENT_USER=u; onLogin(u); }
      } else {
        // 新規ユーザー → プロフィール入力へ
        setPendingUser({email, name});
        setNickname(name);
        setStep("profile");
      }
    }catch(err){
      setError(String(err&&err.message)==="timeout"
        ? "サーバーの応答がありませんでした。通信環境を確認して、もう一度お試しください"
        : "接続エラーが発生しました");
    }
    setLoading(false);
  };

  const confirmProfile=()=>{
    if(!nickname.trim()){ setError("ニックネームを入力してください"); return; }
    setError("");
    setStep("goal");
  };

  const register=async()=>{
    setLoading(true); setError("");
    try{
      const {email,name}=pendingUser;
      // 新規登録はログイン成立前なのでトークンは無いが、経路はPOSTへ揃える。
      // 目標の本文が長いとURLの長さ制限にも当たるため、本文で送るほうが確実
      // ★セッション必須になった★（招待制のため、新規行は作られない）
      //   ログイン時に発行されたセッションで、自分の行を更新する
      const r=await authedApi("registerUser",{

        goal3:goals[2]?.goal.trim()||"", goal_deadline3:goals[2]?.deadline||""

      if(r.ok||r.error==="already_registered"){

  };

  const [checkingLine,setCheckingLine]=useState(false);

  const copyEmail=()=>{

  };

  const openLine=()=>{
    window.open("https://lin.ee/5pElLYY","_blank");
  };

  const proceedWithoutLine=()=>{
    localStorage.setItem("line_prompted","1");
    CURRENT_USER=pendingUser; onLogin(pendingUser);
  };

  // 「アプリを開く」時点でLINE連携が完了しているかGASに確認する。
  // 未連携のまま気づかずスキップしてしまう問題を防ぐため、未連携なら
  // 一度警告を挟み、それでも進みたい場合だけ先へ進めるようにする
  const finishLine=async()=>{
    setCheckingLine(true);
    try{
      // ★トークンを添える★ 認証必須になると publicApiRaw では弾かれ、
      //   「連携できていない」と誤判定してしまう
      const r=await authedApi("getUser",{studentEmail:pendingUser.email});
      if(r.ok && r.data && !r.data.lineLinked && !lineWarning){
        setCheckingLine(false); setLineWarning(true); return;
      }
    }catch(e){ /* 確認できなくても先に進めさせる */ }
    setCheckingLine(false);
    proceedWithoutLine();

  if(step==="line") return html`

      <div class="login-logo" style=${{background:"#06C755"}}>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      </div>
      <div class="login-title">登録完了！🎉</div>
      <div class="login-sub" style=${{marginBottom:28}}>LINEでアカウントを連携しましょう</div>
      <div class="login-box">
        <div style=${{background:"var(--card)",borderRadius:14,padding:"20px 18px",border:"1px solid var(--border)"}}>

            連携すると、毎時間のリマインダーと毎晩のAIレポートがLINEに届きます。<br/>
            <b style=${{color:"var(--text)"}}>設定 →「LINE連携」</b>から連携できます。
          </div>
          <button class="btn" style=${{background:"#06C755",fontSize:15}} onClick=${openLine}>LINEを友だち追加</button>
          <div style=${{fontSize:12,color:"var(--sub)",marginTop:10,lineHeight:1.7}}>
            ① 上のボタンでJIROKUのLINEを友だち追加<br/>
            ② アプリの <b>設定 →「LINE連携」</b>で「連携コード」を出す<br/>
            ③ それをLINEにそのまま送ると連携完了
          </div>
        </div>
        ${lineWarning && html`
          <div style=${{background:"#fff3cd",border:"1px solid #ffe08a",borderRadius:10,padding:"12px 14px",marginTop:12,fontSize:12.5,lineHeight:1.7,color:"#8a6d1f"}}>
            まだLINE連携が完了していないようです。このまま進むと、リマインダーやAIレポートが届きません。<br/>
            上の手順でLINE連携を済ませてから「アプリを開く」を押すことをおすすめします。
          </div>
        `}
        <button class="btn" style=${{marginTop:8}} onClick=${finishLine} disabled=${checkingLine}>${checkingLine?"確認中...":(lineWarning?"連携せずに進む":"アプリを開く")}</button>
        ${!lineWarning && html`<button style=${{background:"none",border:"none",color:"var(--sub)",fontSize:13,cursor:"pointer",marginTop:4}} onClick=${finishLine}>あとで設定する →</button>`}
      </div>
    </div>
  `;

  if(step==="profile") return html`
    <div class="login-wrap" style=${{justifyContent:"flex-start",paddingTop:48}}>
      <div class="login-logo"><svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg"><circle cx="36" cy="36" r="36" fill="#0891B2"/><circle cx="36" cy="36" r="25" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4.5"/><path d="M36 11 A25 25 0 1 1 14.5 50" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="36" cy="36" r="15" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/><line x1="36" y1="36" x2="36" y2="25" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="36" y1="36" x2="43" y2="41" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="36" cy="36" r="2" fill="#fff"/></svg></div>
      <div class="login-title">はじめまして 👋</div>
      <div class="login-sub" style=${{marginBottom:24}}>${pendingUser?.name}さん、プロフィールを設定しましょう</div>
      <div class="login-box">
        <div style=${{background:"var(--card)",borderRadius:12,padding:"14px",border:"1px solid var(--border)"}}>
          <div style=${{fontSize:11,color:"var(--sub)",marginBottom:5}}>ニックネーム（他の人にはこちらが表示されます）</div>
          <input class="login-inp" value=${nickname} maxLength=${20} placeholder="例：じろう" onChange=${e=>setNickname(e.target.value)}/>
        </div>
        <div style=${{background:"var(--card)",borderRadius:12,padding:"14px",border:"1px solid var(--border)"}}>
          <div style=${{fontSize:11,color:"var(--sub)",marginBottom:8}}>アバターを選ぶ</div>
          <div style=${{display:"grid",gridTemplateColumns:"repeat(4, 1fr)",gap:8}}>
            ${(showAllAvatars?AVATAR_OPTIONS:AVATAR_OPTIONS.slice(0,8)).map(a=>html`
              <button key=${a} onClick=${()=>setAvatar(a)}
                style=${{fontSize:24,padding:"8px 0",borderRadius:12,border:`2px solid ${avatar===a?"var(--accent)":"var(--border)"}`,background:avatar===a?"var(--accent-bg, rgba(8,145,178,0.1))":"transparent",cursor:"pointer"}}>
                ${a}
              </button>
            `)}
          </div>
          ${!showAllAvatars&&html`
            <button onClick=${()=>setShowAllAvatars(true)}
              style=${{background:"none",border:"none",color:"var(--accent)",fontSize:12.5,fontWeight:600,cursor:"pointer",padding:"8px 0 0",width:"100%",textAlign:"center"}}>
              もっと見る（他${AVATAR_OPTIONS.length-8}種類）
            </button>
          `}
        </div>
        ${error&&html`<div class="login-err">${error}</div>`}
        <button class="btn" onClick=${confirmProfile}>次へ</button>
      </div>
    </div>
  `;

  if(step==="goal") return html`
    <div class="login-wrap" style=${{justifyContent:"flex-start",paddingTop:48}}>
      <div class="login-logo"><svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg"><circle cx="36" cy="36" r="36" fill="#0891B2"/><circle cx="36" cy="36" r="25" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4.5"/><path d="M36 11 A25 25 0 1 1 14.5 50" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="36" cy="36" r="15" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/><line x1="36" y1="36" x2="36" y2="25" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="36" y1="36" x2="43" y2="41" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="36" cy="36" r="2" fill="#fff"/></svg></div>
      <div class="login-title">はじめまして 👋</div>
      <div class="login-sub" style=${{marginBottom:24}}>${nickname}さん、目標を教えてください（最大3つ）</div>
      <div class="login-box">
        ${goals.map((g,i)=>html`
          <div key=${i} style=${{background:"var(--card)",borderRadius:12,padding:"14px",border:"1px solid var(--border)"}}>
            <div style=${{fontSize:11,color:"var(--sub)",marginBottom:5}}>目標${i+1}${i===0?" （メインの目標）":""}</div>
            <textarea class="txa" placeholder=${i===0?"例：英検2級に合格する":"例：毎月売上100万円達成"} value=${g.goal} onChange=${e=>{updateGoal(i,"goal",e.target.value);e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px";}} ref=${el=>{if(el){el.style.height="auto";el.style.height=el.scrollHeight+"px";}}} style=${{minHeight:70,overflow:"hidden",resize:"none",marginBottom:8}}/>
            <div style=${{fontSize:11,color:"var(--sub)",marginBottom:5}}>達成期限（任意）</div>
            <input type="date" class="login-inp" value=${g.deadline} onChange=${e=>updateGoal(i,"deadline",e.target.value)}/>

            ＋ 目標を追加する
          </button>
        `}
        ${error&&html`<div class="login-err">${error}</div>`}
        <button class="btn" onClick=${register} disabled=${loading}>${loading?"登録中...":"JIROKUをはじめる"}</button>
      </div>
    </div>
  `;

  const isLineWebView = /Line\//i.test(navigator.userAgent);
  const isAndroid = /Android/i.test(navigator.userAgent);

  if(isLineWebView){
    if(isAndroid){
      // AndroidはChromeで自動で開く
      window.location.href=`intent://${location.host}${location.pathname}#Intent;scheme=https;action=android.intent.action.VIEW;package=com.android.chrome;end`;
    }
    return html`
      <div class="login-wrap">
        <div class="login-logo"><svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg"><circle cx="36" cy="36" r="36" fill="#0891B2"/><circle cx="36" cy="36" r="25" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4.5"/><path d="M36 11 A25 25 0 1 1 14.5 50" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="36" cy="36" r="15" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/><line x1="36" y1="36" x2="36" y2="25" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="36" y1="36" x2="43" y2="41" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="36" cy="36" r="2" fill="#fff"/></svg></div>
        <div class="login-title">JIROKU</div>
        <div style=${{textAlign:"center",padding:"0 24px"}}>
          <div style=${{fontSize:48,marginBottom:16}}>🌐</div>
          <div style=${{fontWeight:700,fontSize:17,marginBottom:12,color:"var(--text)"}}>ブラウザで開いてください</div>
          <div style=${{fontSize:14,color:"var(--sub)",lineHeight:1.8,marginBottom:24}}>
            LINEのブラウザではGoogleログインができません。<br/>
            ${isAndroid
              ? html`Chromeが自動で開きます。開かない場合は右上の<b>「…」→「ブラウザで開く」</b>をタップしてください。`
              : html`画面右下の<b>「…」→「ブラウザで開く」</b>をタップして、SafariかChromeで開いてください。`
            }
          </div>
        </div>
      </div>
    `;
  }

  return html`
    <div class="login-wrap">
      <div class="login-logo"><svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg"><circle cx="36" cy="36" r="36" fill="#0891B2"/><circle cx="36" cy="36" r="25" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4.5"/><path d="M36 11 A25 25 0 1 1 14.5 50" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="36" cy="36" r="15" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/><line x1="36" y1="36" x2="36" y2="25" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><line x1="36" y1="36" x2="43" y2="41" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="36" cy="36" r="2" fill="#fff"/></svg></div>
      <div class="login-title">JIROKU</div>
      <div class="login-sub">時間を記録し、目標を達成する</div>
      <div class="login-box" style=${{alignItems:"center"}}>
        ${loading ? "" : html`<div id="gsi-btn-app" style=${{minHeight:44}}></div>`}
        ${loading
          ? html`<${LoginWaiting}/>`
          : html`<button onClick=${handleGoogleSignIn} style=${{display:"flex",alignItems:"center",gap:10,padding:"10px 20px",borderRadius:8,border:gsiReady?"1px solid var(--border)":"1px solid #dadce0",background:gsiReady?"transparent":"#fff",cursor:"pointer",fontSize:gsiReady?12.5:15,fontWeight:500,color:gsiReady?"var(--sub)":"#3c4043",width:280,justifyContent:"center",marginTop:gsiReady?10:0}}>
              ${gsiReady ? "" : html`<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18"/>`}
              ${gsiReady ? "別の方法でログイン" : "Googleでサインイン"}
            </button>`
        }
        ${error&&html`<div class="login-err">${error}</div>`}
      </div>
    </div>
  `;
}

// LINE未連携の生徒に毎回の起動時に気づいてもらうためのバナー。
// 登録直後の「line」ステップはスキップ可能なため、その後も本人が気づけるように
// 連携が完了するまでホーム画面の上に毎回表示する（セッション内での「閉じる」は一時的）
function LineLinkBanner({email, onDismiss, onGoToSettings}) {
  const [copied,setCopied]=useState(false);
  const copyEmail=()=>{
    navigator.clipboard.writeText(email||"").then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2000); });
  };
  return html`
    <div style=${{background:"#fff3cd",borderBottom:"1px solid #ffe08a",padding:"10px 16px",fontSize:12.5,color:"#8a6d1f",position:"relative",zIndex:50}}>
      <div style=${{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
        <div style=${{lineHeight:1.6}}>
          LINE連携が未完了です。連携するとリマインダー・AIレポートが届くようになります。<br/>
          <b>設定 →「LINE連携」</b>から「連携コード」を出して、LINEに送ってください。
        </div>
        <button onClick=${onDismiss} style=${{background:"none",border:"none",color:"#8a6d1f",fontSize:16,cursor:"pointer",flexShrink:0}}>×</button>
      </div>
      <div style=${{display:"flex",gap:8,marginTop:8}}>
        <button onClick=${onGoToSettings} style=${{padding:"6px 12px",borderRadius:7,border:"1px solid #ffe08a",background:"#fff",fontSize:12,cursor:"pointer",fontWeight:600,color:"#8a6d1f"}}>設定を開く</button>
        <button onClick=${()=>window.open("https://lin.ee/5pElLYY","_blank")} style=${{padding:"6px 12px",borderRadius:7,border:"none",background:"#06C755",color:"#fff",fontSize:12,cursor:"pointer",fontWeight:600}}>LINEを開く</button>
      </div>
    </div>
  `;

// 「みんなの頑張り」をアプリを開くたびに賑やかに感じてもらうためのバナー。
// 高スコアレポート等が出た際に自動投稿される達成シェア（getAchievements）のうち、
// まだ見ていない最新の1件だけをホーム上部に表示する。既読管理はlocalStorageのIDで行う
// （プッシュ通知ではなく、アプリを開いた時に気づける「準リアルタイム」通知）
const ACHIEVEMENT_SEEN_KEY = "jiroku_last_seen_achievement";
// achievement_idが無い古いデータ（自己修復前に作られた行）でも「既読」判定できるよう、
// idが無ければnickname・message・dateから代わりのキーを組み立てる
function achievementKey(a) { return a.id || `${a.nickname}|${a.message}|${a.date}`; }
function AchievementBanner({onOpenCommunity}) {
  const [item,setItem]=useState(null);
  useEffect(()=>{
    gasApi("getAchievements").then(r=>{
      if(!r.ok || !r.data || r.data.length===0) return;
      const latest=r.data[0];
      // 「たった今の頑張り」として通知する以上、2日以上前のシェアは古すぎるので対象外にする
      // （これにより既読管理が何らかの理由で効かない端末でも、いつまでも同じ古い通知が
      // 出続けることはなくなる）
      const today=formatDateStr(new Date());
      const cutoff=addDays(today,-1);
      if(latest.date < cutoff) return;
      const lastSeen=localStorage.getItem(ACHIEVEMENT_SEEN_KEY);
      if(achievementKey(latest)===lastSeen) return;
      setItem(latest);
    });
  },[]);
  const dismiss=()=>{
    if(item) localStorage.setItem(ACHIEVEMENT_SEEN_KEY, achievementKey(item));
    setItem(null);
  };
  const open=()=>{ dismiss(); onOpenCommunity(); };
  if(!item) return null;
  return html`
    <div style=${{background:"var(--accent-l)",borderBottom:"1px solid var(--border)",padding:"8px 16px",fontSize:11,color:"var(--text)",position:"relative",zIndex:48}}>
      <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
        <div style=${{lineHeight:1.5,display:"flex",alignItems:"center",gap:7,minWidth:0}}>
          <span style=${{fontSize:15,flexShrink:0}}>${item.avatar}</span>
          <span style=${{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}><b>${item.nickname}</b>さんが${item.message}</span>
        </div>
        <div style=${{display:"flex",gap:6,alignItems:"center",flexShrink:0}}>
          <button onClick=${open} style=${{padding:"5px 10px",borderRadius:7,border:"1px solid var(--accent)",background:"var(--card)",color:"var(--accent)",fontSize:10.5,cursor:"pointer",fontWeight:600}}>見る</button>
          <button onClick=${dismiss} style=${{background:"none",border:"none",color:"var(--sub)",fontSize:14,cursor:"pointer"}}>×</button>
        </div>
      </div>
    </div>
  `;
}

// PWAとしてホーム画面から起動している（=スタンドアロン表示）かどうか。
// iOSは navigator.standalone、その他は display-mode:standalone メディアクエリで判定
const isStandaloneDisplay = () =>
  (window.navigator && window.navigator.standalone === true) ||
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

// 端末・ブラウザの簡易判定（ホーム画面追加の手順を出し分けるため）
function detectDevice(){
  const ua = navigator.userAgent || "";
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  const isAndroid = /Android/.test(ua);
  // iOSのChrome等は「CriOS/FxiOS」、Androidの内蔵ブラウザ差はここでは吸収せずChrome前提
  const iosSafari = isIOS && !/CriOS|FxiOS|EdgiOS/.test(ua);
  const iosOther = isIOS && !iosSafari;
  return { isIOS, isAndroid, iosSafari, iosOther };
}

  { id:"planning", q:"計画を立てるのは得意？", opts:["計画型（きっちり）","だいたい決める","衝動型（その場で）"] },
  { id:"tone", q:"どんな声かけが響く？", opts:["優しく応援してほしい","厳しめに喝を入れて","データで淡々と","一緒に伴走してほしい"], setting:"tone" },
  { id:"notify", q:"通知はどれくらい欲しい？", opts:["こまめに欲しい","ほどほどで","最小限でいい"], setting:"notify" },
  { id:"hours", q:"1日にどれくらい、目標に時間を使いたい？", opts:["30分","1時間","2時間","3時間以上"], setting:"hours" },
  { id:"weekpace", q:"どれくらいのペースで記録を続けたい？", opts:["毎日","週5日","週3日くらい","週2日でゆるく"], setting:"weekpace", hint:"毎日じゃなくて大丈夫。自分のペースで続けるのが一番です。" },
  { id:"future", q:"3ヶ月後、どうなっていたい？", opts:["良い習慣が身についている","目標に向けて成果が出ている","時間の使い方に迷わない","新しいことに挑戦できている"] },
  { id:"selftype", q:"自分を一言でいうと？", opts:["コツコツ型","短距離集中型","気分屋","完璧主義"] },
];
function OnboardingQuiz({onDone}){
  const [step,setStep]=useState(0);       // 0..questions-1, 質問。=length で結果画面
  const [answers,setAnswers]=useState({});
  const [saving,setSaving]=useState(false);
  const total=ONBOARDING_QUESTIONS.length;
  const pick=(qid,opt)=>{
    const next={...answers,[qid]:opt};
    setAnswers(next);
    setTimeout(()=>setStep(s=>s+1),180); // 選んだら少し間を置いて自動で次へ
  };
  const back=()=>setStep(s=>Math.max(0,s-1));

  const finish=async()=>{
    setSaving(true);
    // 読める要約テキストを作ってサーバーへ（AIコーチの文脈に流れる）
    const profileText=ONBOARDING_QUESTIONS.filter(q=>answers[q.id]).map(q=>q.q.replace(/？$/,"")+"："+answers[q.id]).join(" / ");
    const tone=answers.tone||"";
    const notifyMap={"こまめに欲しい":1,"ほどほどで":2,"最小限でいい":6};
    const interval=notifyMap[answers.notify]||2;
    const hoursMap={"30分":0.5,"1時間":1,"2時間":2,"3時間以上":3};
    const goalHours=hoursMap[answers.hours];
    // 設定へ反映（目標時間はローカル、通知間隔はサーバー＋ローカル）
    if(goalHours){ localStorage.setItem("jiroku_daily_goal_hours",String(goalHours)); }
    // 週ペース目標（自分のペースで続ける土台）をローカルに保存
    const paceMap={"毎日":7,"週5日":5,"週3日くらい":3,"週2日でゆるく":2};
    const weekGoal=paceMap[answers.weekpace];
    if(weekGoal){ localStorage.setItem("jiroku_weekly_goal",String(weekGoal)); }
    const savedNotify=JSON.parse(localStorage.getItem("notifySettings")||'{"start":7,"end":23,"interval":2}');
    localStorage.setItem("notifySettings",JSON.stringify({...savedNotify,interval}));
    try{ await gasPostJson("saveOnboarding",{profile_text:profileText,coach_tone:tone,notify_interval:String(interval)}); }catch(e){}
    localStorage.setItem("onboarding_done","1");
    setSaving(false);
    onDone();
  };
  const skip=()=>{ localStorage.setItem("onboarding_done","skip"); onDone(); };

  // 結果画面: 回答に応じた「あなたへの活かし方」を出す
  if(step>=total){
    const lines=[];
    if(answers.motivation==="成長を感じること"||answers.motivation==="達成感") lines.push("毎晩のAIレポートで、あなたの「伸び」を点数と言葉で見える化します。");
    if(answers.struggle==="夜更かし・生活リズム") lines.push("生活リズムの乱れも記録から見えるので、AIコーチが無理なく整える手助けをします。");
    if(answers.struggle==="先延ばししてしまう") lines.push("朝の「今日のフォーカス」で、まず1つに絞って動き出せるようにします。");
    if(answers.tone==="厳しめに喝を入れて") lines.push("あなたの希望どおり、コーチは時にはっきりと喝を入れます。");
    if(answers.tone==="優しく応援してほしい") lines.push("あなたの希望どおり、コーチは優しく応援するトーンで寄り添います。");
    if(answers.weekpace&&answers.weekpace!=="毎日") lines.push(`記録は「${answers.weekpace}」のペースでOK。毎日じゃなくても、あなたが決めたペースを守れたかで見ていきます。`);
    if(lines.length<2) lines.push("記録が溜まるほど、AIがあなたの強み・クセ・時間の使い道を教えてくれます（気づきタブ）。");
    return html`<div style=${{position:"fixed",inset:0,height:"100dvh",background:"var(--bg)",zIndex:400,overflowY:"auto",display:"flex",flexDirection:"column"}}>
      <div style=${{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",padding:"32px 24px",maxWidth:440,margin:"0 auto",width:"100%"}}>
        <div style=${{fontSize:44,textAlign:"center",marginBottom:8}}>🎉</div>
        <div style=${{fontSize:22,fontWeight:800,textAlign:"center",marginBottom:6,color:"var(--text)"}}>ありがとう！準備完了です</div>
        <div style=${{fontSize:13.5,color:"var(--sub)",textAlign:"center",lineHeight:1.7,marginBottom:24}}>あなたのことを踏まえて、JIROKUが今日から伴走します。</div>
        ${lines.map((l,i)=>html`
          <div key=${i} style=${{display:"flex",gap:10,marginBottom:12,background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:"13px 14px"}}>
            <span style=${{color:"var(--accent)",fontWeight:800,flexShrink:0}}>✓</span>
            <span style=${{fontSize:13,color:"var(--text)",lineHeight:1.7}}>${l}</span>
          </div>
        `)}
        <button class="btn" style=${{marginTop:14}} disabled=${saving} onClick=${finish}>${saving?"保存中…":"はじめる"}</button>
      </div>
    </div>`;
  }

  const cur=ONBOARDING_QUESTIONS[step];
  return html`<div style=${{position:"fixed",inset:0,height:"100dvh",background:"var(--bg)",zIndex:400,display:"flex",flexDirection:"column"}}>
    <div style=${{padding:"18px 20px 0",maxWidth:440,margin:"0 auto",width:"100%",boxSizing:"border-box"}}>
      <div style=${{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        ${step>0?html`<button onClick=${back} style=${{background:"none",border:"none",fontSize:20,color:"var(--sub)",cursor:"pointer",padding:0}}>‹</button>`:html`<div style=${{width:20}}/>`}
        <div style=${{flex:1,height:6,background:"var(--border)",borderRadius:99,overflow:"hidden"}}>
          <div style=${{height:"100%",width:((step)/total*100)+"%",background:"var(--accent)",borderRadius:99,transition:"width .3s ease"}}/>
        </div>
        <div style=${{fontSize:12,color:"var(--sub)",fontWeight:600,minWidth:38,textAlign:"right"}}>${step+1}/${total}</div>
      </div>
    </div>
    <div style=${{flex:1,overflowY:"auto",padding:"8px 20px 24px",maxWidth:440,margin:"0 auto",width:"100%",boxSizing:"border-box"}}>
      ${step===0&&html`<div style=${{fontSize:12.5,color:"var(--sub)",lineHeight:1.7,marginBottom:16,background:"var(--accent-l)",borderRadius:12,padding:"12px 14px"}}>最初に、あなたのことを少しだけ教えてください。答えに合わせてコーチングをあなた仕様にします（1〜2分・直感でOK）。</div>`}
      <div style=${{fontSize:19,fontWeight:800,color:"var(--text)",lineHeight:1.5,marginBottom:cur.hint?8:20}}>${cur.q}</div>
      ${cur.hint&&html`<div style=${{fontSize:12.5,color:"var(--sub)",lineHeight:1.6,marginBottom:18}}>${cur.hint}</div>`}
      <div style=${{display:"flex",flexDirection:"column",gap:10}}>
        ${cur.opts.map((o,i)=>{
          const on=answers[cur.id]===o;
          return html`<button key=${i} onClick=${()=>pick(cur.id,o)}
            style=${{textAlign:"left",padding:"15px 16px",borderRadius:14,border:`1.5px solid ${on?"var(--accent)":"var(--border)"}`,background:on?"var(--accent-l)":"var(--card)",color:on?"var(--accent)":"var(--text)",fontSize:15,fontWeight:on?700:500,cursor:"pointer",fontFamily:"inherit",transition:"all .12s"}}>
            ${o}
          </button>`;
        })}
      </div>
    </div>
    <div style=${{padding:"0 20px calc(20px + env(safe-area-inset-bottom))",maxWidth:440,margin:"0 auto",width:"100%",boxSizing:"border-box"}}>
      <button onClick=${skip} style=${{width:"100%",background:"none",border:"none",color:"var(--sub)",fontSize:12.5,cursor:"pointer",fontFamily:"inherit",padding:10}}>スキップして始める</button>
    </div>
  </div>`;
}

const UNSUPPORTED_PUSH_ERROR = "このブラウザはプッシュ通知に対応していません";
function TutorialOverlay({onDone}) {
  // ホーム画面から既に開いている場合は「ホーム画面に追加」の案内を飛ばす
  const [steps] = useState(()=>TUTORIAL_STEPS.filter(s=>!s.skipIf || !s.skipIf()));
  const [step,setStep]=useState(0);
  const [pushDone,setPushDone]=useState(()=>!!localStorage.getItem("push_enabled"));
  const [pushLoading,setPushLoading]=useState(false);
  const [pushError,setPushError]=useState("");
  const isLast = step === steps.length - 1;
  const s = steps[step];
  const Mock = s.mock;
  const isPushStep = !!s.pushStep && !pushDone;
  // ブラウザが技術的に非対応な場合だけ、詰まらないようスキップできるようにする
  const isUnsupported = pushError === UNSUPPORTED_PUSH_ERROR;

  const doEnablePush=async()=>{
    setPushLoading(true); setPushError("");
    try{
      const r=await enablePushNotifications();
      if(r.ok){ setPushDone(true); setStep(step+1); }
      else setPushError(r.error||"有効化に失敗しました。もう一度お試しください");
    }catch(e){
      // ここに来ることは無いはずだが、万一例外が漏れても「設定中...」のまま
      // 固まらないようにする
      setPushError(String(e && e.message || e) || "有効化に失敗しました。もう一度お試しください");
    }
    setPushLoading(false);
  };

  return html`
    <div style=${{position:"fixed",inset:0,background:"var(--bg)",zIndex:400,display:"flex",flexDirection:"column"}}>
      <div style=${{display:"flex",justifyContent:"flex-end",padding:"14px 16px"}}>
        ${!isPushStep&&html`<button onClick=${onDone} style=${{background:"none",border:"none",color:"var(--sub)",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>スキップ</button>`}
      </div>
      <div style=${{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"0 28px",textAlign:"center"}}>
        <div style=${{marginBottom:22}}><${Mock}/></div>
        <div style=${{fontSize:19,fontWeight:800,color:"var(--text)",marginBottom:14}}>${s.title}</div>
        <div style=${{fontSize:14,lineHeight:1.9,color:"var(--sub)",maxWidth:320,whiteSpace:"pre-line"}}>${s.body}</div>
        ${isPushStep&&pushError&&html`<div style=${{marginTop:12,fontSize:12.5,color:"var(--red, #e05555)"}}>${pushError}</div>`}
      </div>
      <div style=${{display:"flex",justifyContent:"center",gap:6,marginBottom:20}}>
        ${steps.map((_,i)=>html`<div key=${i} style=${{width:i===step?18:6,height:6,borderRadius:99,background:i===step?"var(--accent)":"var(--border)",transition:"width .2s"}}/>`)}
      </div>
      <div style=${{padding:"0 24px 32px"}}>
        ${isPushStep
          ? html`<button class="btn" disabled=${pushLoading} onClick=${doEnablePush}>${pushLoading?"設定中...":"プッシュ通知を有効にする"}</button>`
          : html`<button class="btn" onClick=${()=>isLast?onDone():setStep(step+1)}>${isLast?"さっそく記録する":"次へ"}</button>`
        }
        ${isPushStep&&isUnsupported&&html`
          <button onClick=${()=>{setPushError("");setStep(step+1);}}
            style=${{width:"100%",background:"none",border:"none",color:"var(--sub)",fontSize:12.5,padding:"10px",cursor:"pointer",fontFamily:"inherit"}}>
            このブラウザでは使えないので次へ進む
          </button>
        `}
      </div>
    </div>
  `;
}

// 独り言（クイック記録）シート。話す/書くだけで、AIが構造化して即保存する
function QuickLogSheet({onClose,onToast}){
  const [text,setText]=useState("");
  const [saving,setSaving]=useState(false);
  const inputRef=React.useRef(null);
  useEffect(()=>{ setTimeout(()=>{ try{inputRef.current&&inputRef.current.focus();}catch(e){} },200); },[]);
  const save=async()=>{
    const t=text.trim();
    if(!t||saving) return;
    setSaving(true);
    let r;
    try{
      r=await gasPostJson("quickLog",{text:t});
    }catch(e){
      // 通信エラー等でも「保存中…」で固まらないようにし、入力は消さずに残す
      setSaving(false);
      onToast("通信エラーで保存できませんでした。もう一度お試しください");
      return;
    }
    setSaving(false);
    if(r&&r.ok){
      const s=r.saved||{};
      const cnt=r.count||1;
      let msg;
      if(r.fallback){
        // AIで仕分けできなかった場合も、入力はそのまま1件保存されている
        msg="記録しました（内容はそのまま保存しました）";
      } else if(cnt>1){
        msg=`${cnt}件記録しました`;
      } else {
        const focusN=s.focus_level?`（集中${s.focus_level}）`:"";
        msg=`記録しました：${s.task||"記録"}${focusN}`;
      }
      if(r.xp_gained){ msg+=` +${r.xp_gained}XP`; if(r.level_up)msg+=` Lv.${r.level}！`; }
      onToast(msg);
      // 独り言で作った記録も、フォーム/タイマーと同様にGoogleカレンダーへ書き戻す。
      // （以前は独り言だけカレンダー書き込みが漏れており、音声・独り言の記録が
      //  カレンダーに反映されない原因になっていた）。savedAll=保存された各レコード。
      try{
        if(localStorage.getItem("cal_linked") && Array.isArray(r.savedAll)){
          const dateStr = formatDateStr(new Date());
          r.savedAll.forEach(rec=>{
            const tb = String(rec.time_block||""); if(!tb) return;
            const [startHM, endHM] = tb.split("-");
            const stt = new Date(dateStr+"T"+startHM.slice(0,5)+":00"); if(isNaN(stt)) return;
            const ett = endHM ? new Date(dateStr+"T"+endHM.slice(0,5)+":00") : null;
            const endDt = (ett && ett>stt) ? ett : new Date(stt.getTime()+3600000);
            upsertCalendarEvent(dateStr, tb, stt.toISOString(), endDt.toISOString(), rec.task||"記録", null);
          });
        }
      }catch(e){}
      onClose();
    } else {
      // 失敗時はテキストを消さず、モーダルも閉じないので、そのまま再送信できる
      onToast((r&&r.error)||"うまく記録できませんでした。入力はそのまま残っています");
    }
  };
  return ReactDOM.createPortal(html`
    <div style=${{position:"fixed",inset:0,height:"100dvh",background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"flex-end",zIndex:550}}
      onClick=${e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style=${{background:"var(--card)",borderRadius:"20px 20px 0 0",padding:"22px 20px calc(24px + env(safe-area-inset-bottom))",width:"100%",boxSizing:"border-box",maxHeight:"85dvh",overflowY:"auto",overscrollBehavior:"contain",WebkitOverflowScrolling:"touch"}}>
        <div style=${{fontSize:18,fontWeight:800,marginBottom:4,color:"var(--text)"}}>🎙 今なにしてた？</div>

function App() {

  // サーバーがまだ認証段階に入っていない(LEGACY)なら何もしない
  const [needsReauth,setNeedsReauth]=useState(()=>{
    // サーバーに SESSION_INVALID で弾かれた直後は、その場で再ログインへ誘導する。
    // 従来は「トークンを持っていない人」しか対象にしていなかったため、
    // 失効したトークンを持ったまま使い続けられてしまった
    try { return localStorage.getItem("jiroku_reauth_needed")==="1"; } catch { return false; }
  });
  // 通信中に失効した場合も、画面を切り替える（次の操作まで待たせない）
  // ★戻す側も必ず用意する★
  // 出す側だけを作ると、ログインに成功しても再ログイン画面から抜けられない。
  // 2026-08-01、まさにこれで「ログイン → サインイン画面へ戻る」の
  // 無限ループを本番で発生させた。出す条件を書いたら、必ず消す条件も書く。
  useEffect(()=>{
    const on=()=>setNeedsReauth(true);
    const off=()=>setNeedsReauth(false);
    window.addEventListener("jiroku:reauth",on);
    window.addEventListener("jiroku:authed",off);
    return ()=>{ window.removeEventListener("jiroku:reauth",on);
                 window.removeEventListener("jiroku:authed",off); };
  },[]);
  // セッションを持っている状態で預かり分が残っていれば、起動時にやり直す
  useEffect(()=>{
    if(!getSessionToken() || pendingOpCount()===0) return;
    (async()=>{
      const r=await flushPendingOps();
      if(r.done>0) setToast("保存できていなかった記録を"+r.done+"件、反映しました");
    })();
  },[]);
  useEffect(()=>{
    if(getSessionToken()) return;
    (async()=>{
      let mode=rememberedAuthMode();
      try{
        const u=new URL(GAS_URL); u.searchParams.set("action","authConfig");

  function safeReload(){
    if (swReloaded) return;
    if (isUserBusy()){ pendingReload = true; return; }
    swReloaded = true; location.reload();
  }
  // 初回訪問時のSW初回登録(claim)でもcontrollerchangeが発火するため、
  // 「既にSWが制御していた状態からの交代」の時だけ再読み込みする
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swReloaded || !hadController) return;
    if (document.visibilityState === 'visible') safeReload();
  });

  // controllerchangeはsw.js自体が変わった時しか発火しないため、アプリ本体
  // (index.html)だけの更新はこちらで検知する。起動時に自分自身のHTMLを取得して
  // ハッシュを控え、アプリを前面に戻すたび（最短10分間隔）に取り直して比較。
  // 変わっていたら新バージョンが公開されたということなので再読み込みする
  let baselineHtmlHash = null, lastVerCheck = 0;
  async function checkAppUpdate(){
    try{
      const now = Date.now();
      if (now - lastVerCheck < 5*60*1000) return;
      lastVerCheck = now;
      const res = await fetch("index.html", { cache: "no-store" });
      if (!res.ok) return;
      const text = await res.text();
      // ★「今動いている版」と「サーバーにある版」を比べる★
      //   以前は起動時にサーバーのファイルを取って、それを基準にしていた。
      //   古い版で動いていてもサーバーの版と自分を比べるので、
      //   差が出ず永久に更新されなかった（実際にそうなった）。
      //   埋め込んだ版番号どうしを比べれば、確実に分かる。
      const m = text.match(/const APP_BUILD = "([^"]+)"/);
      if (!m) return;
      if (m[1] !== APP_BUILD) { pendingReload = true; safeReload(); }
    }catch(e){}
  }
  checkAppUpdate(); // 起動時に基準ハッシュを取得
  const runUpdateCheck = () => {
    // 新版が見つかっているが入力中で保留していた場合、手が空いた今のタイミングで再読み込み
    if (pendingReload && !swReloaded){ safeReload(); if (swReloaded) return; }
    navigator.serviceWorker.getRegistration().then(reg => { if (reg) reg.update(); }).catch(()=>{});
    checkAppUpdate();
  };
  // スマホはアプリ切替でvisibilitychangeが頻繁に発火し更新されるが、PCでタブを
  // 開きっぱなしにするとvisibilitychangeが起きず、更新が止まって「PCだけ古い」状態に
  // なっていた。①タブ/ウィンドウが可視化された時 ②別ウィンドウから戻って再フォーカス
  // した時（PCの主要ケース）③定期チェック、の3経路で新バージョンを取りに行く
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') runUpdateCheck(); });
  window.addEventListener('focus', runUpdateCheck);
  setInterval(() => { if (document.visibilityState === 'visible') runUpdateCheck(); }, 5*60*1000);
  // 入力欄から手が離れた／モーダルを閉じた直後に、保留していた更新があれば反映する
  document.addEventListener('focusout', () => { if (pendingReload) setTimeout(() => { if (!swReloaded && pendingReload && !isUserBusy()) safeReload(); }, 600); });
}
</script>
</body>
</html>
