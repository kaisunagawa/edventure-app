          .catch(()=>{ try{ localStorage.setItem("auth_last_error","NETWORK"); }catch{} })
      : Promise.resolve().then(()=>{ try{ localStorage.setItem("auth_last_error","NO_STATE"); }catch{} });
    res.credential=null;   // IDトークンを保持し続けない

    const email=payload.email;
    const name=payload.name||payload.given_name||"";
    try{
      // 既存ユーザー確認
      // ★必ずタイムアウトを付ける★
      // 以前は待ち時間の上限が無く、サーバーの応答が返らないと
      // 「ログインしています…」から永久に動かなくなっていた（2026-08-01に発生）
      const withTimeout=(pr,ms)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]);
      // ★セッションを先に受け取る。getUser はそのあと★
      //
      // 以前は「待ち時間を短くする」ために並行して走らせていた。
      // ところが getUser が認証必須になった瞬間、順序が逆になった:
      //   ログイン成功 → トークン未取得のまま getUser → AUTH_REQUIRED
      //   → アプリは「そんな利用者はいない」と解釈 → 新規登録画面へ
      // 2026-08-01、既存利用者に「はじめまして」の画面を出した。
      //
      // 数秒遅くなるが、正しさを優先する。
      // 「速いが、たまに別人として扱う」より「少し遅いが必ず本人」が良い。
      try{ await withTimeout(sessionPromise, 25000); }catch{}

      // トークンを添えて取得する（authedApi が本文へ入れる）。
      // まだセッションを取れていない場合でも、トークン無しで送られるだけなので
      // 互換段階（SESSION_OPTIONAL）ではこれまでどおり通る。
      // ★CURRENT_USER を先に書き換えない★
      //   まだログインが確定していない段階で全体の状態を触ると、
      //   別の画面が中途半端な利用者を掴む。宛先は引数で渡す。
      const r=await withTimeout(authedApi("getUser",{studentEmail:email}), 25000);
      // セッション切れで預かっていた操作を、ログインできたらやり直す
      if(getSessionToken() && pendingOpCount()>0){
        try{ await flushPendingOps(); }catch{}
      }
      // 認証段階が SESSION_OPTIONAL 以上なら、セッションを取れていない状態で
      // 従来のメール方式のまま中へ入れてはいけない
      if(strictNow && !getSessionToken()){
        setLoading(false);
        setError("ログインを確認できませんでした。もう一度お試しください");
        return;
      }
      if(r.ok&&r.data){
        // 既存ユーザー → ログイン
        const u={email,name:r.data.name||name,nickname:r.data.nickname||r.data.name||name,avatar:r.data.avatar||"🦊",coachName:r.data.coachName||"コーチ",coachEmail:r.data.coach_email||""};
        localStorage.setItem("edventure_user",JSON.stringify(u));
        if(!localStorage.getItem("line_prompted")){ setPendingUser(u); setStep("line"); }
        else { CURRENT_USER=u; onLogin(u); }
      } else {
        // 新規ユーザー → プロフィール入力へ
        setPendingUser({email, name});
        setNickname(name);
        setStep("profile");
      }
    }catch(err){
      setError(String(err&&err.message)==="timeout"
        ? "サーバーの応答がありませんでした。通信環境を確認して、もう一度お試しください"
        : "接続エラーが発生しました");
    }
    setLoading(false);
  };

  const confirmProfile=()=>{
    if(!nickname.trim()){ setError("ニックネームを入力してください"); return; }
    setError("");
    setStep("goal");
  };

  const register=async()=>{
    setLoading(true); setError("");
    try{
      const {email,name}=pendingUser;
      // 新規登録はログイン成立前なのでトークンは無いが、経路はPOSTへ揃える。
      // 目標の本文が長いとURLの長さ制限にも当たるため、本文で送るほうが確実
      // ★セッション必須になった★（招待制のため、新規行は作られない）
      //   ログイン時に発行されたセッションで、自分の行を更新する
      const r=await authedApi("registerUser",{
        studentEmail:email, name, nickname:nickname.trim(), avatar,
        goal:goals[0]?.goal.trim()||"",  goal_deadline:goals[0]?.deadline||"",
        goal2:goals[1]?.goal.trim()||"", goal_deadline2:goals[1]?.deadline||"",
        goal3:goals[2]?.goal.trim()||"", goal_deadline3:goals[2]?.deadline||""
      });
      if(r.ok||r.error==="already_registered"){
        const u={email,name,nickname:nickname.trim(),avatar,coachName:"コーチ",coachEmail:""};
        const validGoals=goals.filter(g=>g.goal.trim());
        if(validGoals.length) localStorage.setItem("jiroku_goals",JSON.stringify(validGoals));
        localStorage.setItem("edventure_user",JSON.stringify(u));
        setPendingUser(u); setStep("line");
      } else { setError("登録に失敗しました"); }
    }catch{ setError("接続エラーが発生しました"); }
    setLoading(false);
  };

  const [lineCopied,setLineCopied]=useState(false);
  const [lineWarning,setLineWarning]=useState(false);
  const [checkingLine,setCheckingLine]=useState(false);

  const copyEmail=()=>{
    navigator.clipboard.writeText(pendingUser?.email||"").then(()=>{ setLineCopied(true); setTimeout(()=>setLineCopied(false),2000); });
  };

  };

  const proceedWithoutLine=()=>{
    localStorage.setItem("line_prompted","1");

// 「みんなの頑張り」をアプリを開くたびに賑やかに感じてもらうためのバナー。
// 高スコアレポート等が出た際に自動投稿される達成シェア（getAchievements）のうち、
// まだ見ていない最新の1件だけをホーム上部に表示する。既読管理はlocalStorageのIDで行う
// （プッシュ通知ではなく、アプリを開いた時に気づける「準リアルタイム」通知）
const ACHIEVEMENT_SEEN_KEY = "jiroku_last_seen_achievement";
// achievement_idが無い古いデータ（自己修復前に作られた行）でも「既読」判定できるよう、
// idが無ければnickname・message・dateから代わりのキーを組み立てる
function achievementKey(a) { return a.id || `${a.nickname}|${a.message}|${a.date}`; }
function AchievementBanner({onOpenCommunity}) {
  const [item,setItem]=useState(null);
  useEffect(()=>{
    gasApi("getAchievements").then(r=>{
      if(!r.ok || !r.data || r.data.length===0) return;
      const latest=r.data[0];
      // 「たった今の頑張り」として通知する以上、2日以上前のシェアは古すぎるので対象外にする
      // （これにより既読管理が何らかの理由で効かない端末でも、いつまでも同じ古い通知が
      // 出続けることはなくなる）
      const today=formatDateStr(new Date());
      const cutoff=addDays(today,-1);
      if(latest.date < cutoff) return;
      const lastSeen=localStorage.getItem(ACHIEVEMENT_SEEN_KEY);
      if(achievementKey(latest)===lastSeen) return;
      setItem(latest);
    });
  },[]);
  const dismiss=()=>{
    if(item) localStorage.setItem(ACHIEVEMENT_SEEN_KEY, achievementKey(item));
    setItem(null);
  };
  const open=()=>{ dismiss(); onOpenCommunity(); };
  if(!item) return null;
  return html`
    <div style=${{background:"var(--accent-l)",borderBottom:"1px solid var(--border)",padding:"8px 16px",fontSize:11,color:"var(--text)",position:"relative",zIndex:48}}>
      <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
        <div style=${{lineHeight:1.5,display:"flex",alignItems:"center",gap:7,minWidth:0}}>
          <span style=${{fontSize:15,flexShrink:0}}>${item.avatar}</span>
          <span style=${{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}><b>${item.nickname}</b>さんが${item.message}</span>
        </div>
        <div style=${{display:"flex",gap:6,alignItems:"center",flexShrink:0}}>
          <button onClick=${open} style=${{padding:"5px 10px",borderRadius:7,border:"1px solid var(--accent)",background:"var(--card)",color:"var(--accent)",fontSize:10.5,cursor:"pointer",fontWeight:600}}>見る</button>
          <button onClick=${dismiss} style=${{background:"none",border:"none",color:"var(--sub)",fontSize:14,cursor:"pointer"}}>×</button>
        </div>
      </div>
    </div>
  `;
}

// PWAとしてホーム画面から起動している（=スタンドアロン表示）かどうか。
// iOSは navigator.standalone、その他は display-mode:standalone メディアクエリで判定
const isStandaloneDisplay = () =>
  (window.navigator && window.navigator.standalone === true) ||
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

// 端末・ブラウザの簡易判定（ホーム画面追加の手順を出し分けるため）
function detectDevice(){
  const ua = navigator.userAgent || "";
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  const isAndroid = /Android/.test(ua);
  // iOSのChrome等は「CriOS/FxiOS」、Androidの内蔵ブラウザ差はここでは吸収せずChrome前提
  const iosSafari = isIOS && !/CriOS|FxiOS|EdgiOS/.test(ua);
  const iosOther = isIOS && !iosSafari;
  return { isIOS, isAndroid, iosSafari, iosOther };
}

// ★3か月目標の初回セットアップ★
// 目標が1つも無い人は、ここを通ってからホームへ入る。
// 自己経営OSは3か月目標が起点で、そこが空だと下の層（スプリント・週間目標・
// 今日のタスク）が何にも繋がらないため。
//
// 気をつけたこと:
//   ・目標の取得に失敗したときは出さない（通信が不安定な人を締め出さない）
//   ・保存に失敗したら、その場で理由を出してやり直せるようにする
//     （閉じ込めて記録できなくするのが一番まずい）
//   ・数字を先に聞かない。「どうなったら達成か」を決めてから数えるものを選ぶ
// 3か月目標がまだ無い人に、最初に1つ決めてもらう画面。
// ★閉じ込めない★ 「あとで決める」で記録画面へ進める。決めていない人には
//   ホームの目標ロードマップから、いつでも同じ流れに入れる導線を残す。
function FirstGoalGate({onDone, onToast, onSkip}) {
  const today = formatDateStr(new Date());
  const plusM = (n)=>{ const x=new Date(today+"T00:00:00+09:00"); x.setMonth(x.getMonth()+n); return formatDateStr(x); };
  const [step, setStep] = useState(0);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState("");
  const [d, setD] = useState({ title:"", why:"", success_condition:"", unit:"", 
                               target_value:"", current_value:"",
                               start_date: today, end_date: plusM(3), priority:1, status:"ACTIVE" });
  const set = (k,v)=>setD(p=>({...p,[k]:v}));

  const STEPS = [
    { title:"3か月後、どうなっていたいですか？",
      hint:"まず1つだけ決めます。ここが決まると、2週間でやること・今週やること・今日やることが順に決まります。",
      body: html`<input class="inp" placeholder="例：会社としての売上を月400万円にする"
        value=${d.title} onInput=${e=>set("title",e.target.value)} style=${{marginBottom:8}}/>`,
      ok: ()=>String(d.title).trim().length>0, req:"やりたいことを書いてください" },
    { title:"なぜ、それをやりたい？",
      hint:"きれいな言葉でなくて大丈夫です。しんどい時に自分を戻してくれるのは、この一行です。",
      body: html`<textarea class="inp" placeholder="例：家族に心配をかけずに、来年も同じ働き方を続けたいから"
        value=${d.why} onInput=${e=>set("why",e.target.value)}
        style=${{minHeight:100,resize:"vertical",lineHeight:1.7,fontFamily:"inherit"}}/>`,
      ok: ()=>true },
    { title:"どうなっていたら「できた」と言える？",
      hint:"「がんばる」ではなく、他の人が見ても分かる状態で書きます。ここが決まると、数えるものが決まります。",
      body: html`<textarea class="inp" placeholder="例：3社と継続契約していて、月の売上が400万円を超えている"
        value=${d.success_condition} onInput=${e=>set("success_condition",e.target.value)}
        style=${{minHeight:100,resize:"vertical",lineHeight:1.7,fontFamily:"inherit"}}/>`,
      ok: ()=>String(d.success_condition).trim().length>0, req:"どうなったら達成かを書いてください" },
    { title:"では、何を数えますか？",
      hint:"上の状態に近づいたかを測れる数字を1つだけ選びます。増えるほど良い数字にしてください。",
      body: html`
        <div style=${{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
          ${["万円","件","回","時間","日","kg","%","点"].map(u=>html`
            <button key=${u} onClick=${()=>set("unit",u)}
              style=${{padding:"7px 14px",borderRadius:20,fontSize:12.5,cursor:"pointer",fontFamily:"inherit",
                       border:`1.5px solid ${d.unit===u?"var(--accent)":"var(--border)"}`,
                       background:d.unit===u?"var(--accent-l)":"transparent",
                       color:d.unit===u?"var(--accent)":"var(--sub)",fontWeight:d.unit===u?700:500}}>${u}</button>`)}
        </div>
        <input class="inp" placeholder="ほかの単位（例：社、本、ページ）" value=${d.unit}
          onInput=${e=>set("unit",e.target.value)} style=${{marginBottom:12}}/>
        <div style=${{display:"flex",gap:10}}>
          <label style=${{flex:1}}><span class="form-lbl">3か月後にいくつ？</span>
            <input class="inp" type="number" inputmode="decimal" value=${d.target_value}
              onInput=${e=>set("target_value",e.target.value)} style=${{margin:0,textAlign:"right"}}/></label>
          <label style=${{flex:1}}><span class="form-lbl">いまはいくつ？</span>
            <input class="inp" type="number" inputmode="decimal" value=${d.current_value}
              onInput=${e=>set("current_value",e.target.value)} style=${{margin:0,textAlign:"right"}}/></label>
        </div>
        <div style=${{fontSize:11.5,color:"var(--sub)",lineHeight:1.7,marginTop:8}}>
          いまが0でも書いてください。空欄だと「まだ測っていない」扱いになり、進み具合を出せません。
        </div>`,
      ok: ()=>String(d.unit).trim() && String(d.target_value).trim(),
      req:"単位と、3か月後の数字を入れてください" },
    { title:"いつまで？",
      hint:"3か月が基本です。長すぎると今日が変わらず、短すぎると形になりません。",
      body: html`
        <div style=${{display:"flex",gap:6,marginBottom:12}}>
          ${[["3か月",3],["2か月",2],["1か月",1]].map(([lb,n])=>html`
            <button key=${lb} onClick=${()=>set("end_date", plusM(n))}
              style=${{flex:1,padding:"11px 4px",borderRadius:10,fontSize:13,cursor:"pointer",fontFamily:"inherit",fontWeight:700,
                       border:`1.5px solid ${d.end_date===plusM(n)?"var(--accent)":"var(--border)"}`,
                       background:d.end_date===plusM(n)?"var(--accent-l)":"transparent",
                       color:d.end_date===plusM(n)?"var(--accent)":"var(--sub)"}}>${lb}</button>`)}
        </div>
        <div style=${{display:"flex",gap:10}}>
          <label style=${{flex:1}}><span class="form-lbl">はじめ</span>
            <input class="inp" type="date" value=${d.start_date} onInput=${e=>set("start_date",e.target.value)} style=${{margin:0}}/></label>
          <label style=${{flex:1}}><span class="form-lbl">おわり</span>
            <input class="inp" type="date" value=${d.end_date} onInput=${e=>set("end_date",e.target.value)} style=${{margin:0}}/></label>
        </div>`,
      ok: ()=>String(d.end_date).trim(), req:"いつまでかを決めてください" }
  ];
  const cur = STEPS[step];
  const last = step === STEPS.length - 1;

  const next = async () => {
    if (!cur.ok()) { setErr(cur.req || "入力してください"); return; }
    setErr("");
    if (!last) { setStep(step+1); return; }
    setSaving(true);
    const r = await gasPostJson("saveGoal", d);
    setSaving(false);
    if (r && r.ok) { onToast && onToast("目標を決めました"); onDone(); }
    // ★閉じ込めない★ 失敗したら理由を出してやり直せるようにする
    else setErr((r && r.error) || "保存できませんでした。通信を確かめて、もう一度お試しください");
  };

  return html`
    <div style=${{position:"fixed",inset:0,height:"100dvh",zIndex:600,background:"var(--bg)",display:"flex",flexDirection:"column"}}>
      <div style=${{padding:"18px 16px 12px",flexShrink:0,paddingTop:"calc(18px + var(--safe-top, 0px))"}}>
        <div style=${{fontSize:10.5,color:"var(--sub)",fontWeight:700,marginBottom:3}}>はじめの設定　${step+1} / ${STEPS.length}</div>
        <div style=${{height:3,background:"var(--border)",borderRadius:99}}>
          <div style=${{height:"100%",width:((step+1)/STEPS.length*100)+"%",background:"var(--accent)",borderRadius:99,transition:"width .3s"}}/>
        </div>
      </div>
      <div style=${{flex:1,minHeight:0,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"8px 16px calc(28px + var(--safe-bottom, 0px))"}}>
        <div style=${{fontSize:19,fontWeight:800,lineHeight:1.5,marginBottom:8}}>${cur.title}</div>
        <div style=${{fontSize:12.5,color:"var(--sub)",lineHeight:1.8,marginBottom:16}}>${cur.hint}</div>
        ${cur.body}
        ${err&&html`<div style=${{fontSize:12.5,color:"var(--red,#d33)",lineHeight:1.7,marginTop:10}}>${err}</div>`}
        <div style=${{display:"flex",gap:8,marginTop:18}}>
          ${step>0&&html`<button onClick=${()=>{setErr("");setStep(step-1);}}
            style=${{flex:1,padding:"13px",borderRadius:10,border:"1.5px solid var(--border)",background:"none",color:"var(--sub)",fontSize:13.5,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>もどる</button>`}
          <button disabled=${saving} onClick=${next}
            style=${{flex:2,padding:"13px",borderRadius:10,border:"none",background:"var(--accent)",color:"#fff",fontSize:13.5,fontWeight:700,cursor:"pointer",fontFamily:"inherit",opacity:saving?0.6:1}}>
            ${saving?"保存中…":(last?"はじめる":"次へ")}</button>
        </div>
        ${step===1&&html`<button onClick=${()=>{setErr("");setStep(step+1);}}
          style=${{width:"100%",marginTop:10,background:"none",border:"none",color:"var(--sub)",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>
          ここは飛ばす</button>`}
        ${onSkip&&html`
          <button onClick=${onSkip}
            style=${{width:"100%",marginTop:14,background:"none",border:"none",color:"var(--sub)",fontSize:12.5,cursor:"pointer",fontFamily:"inherit",textDecoration:"underline"}}>
            あとで決める（先に記録をはじめる）</button>
          <div style=${{fontSize:11,color:"var(--sub)",lineHeight:1.7,marginTop:6,textAlign:"center"}}>
            ホームの「目標ロードマップ」から、いつでも決められます</div>`}
      </div>
    </div>`;
}

        <button onClick=${onSkip} style=${{display:"block",width:"100%",marginTop:8,background:"none",border:"none",color:"var(--faint)",fontSize:11.5,cursor:"pointer",fontFamily:"inherit",padding:6}}>パソコンで見ている / うまくできない → あとで設定する</button>

// 初回オンボーディング（自己分析12問・選択式）。回答はAIコーチの文脈と一部の設定に反映される
const ONBOARDING_QUESTIONS = [
  { id:"reason", q:"時間管理をしたい、一番の理由は？", opts:["就活・キャリアのため","仕事で成果を出したい","良い習慣を身につけたい","自分を理解したい","やりたいことを実現したい"] },
  { id:"struggle", q:"今いちばん困っていることは？", opts:["先延ばししてしまう","夜更かし・生活リズム","集中が続かない","優先順位がつけられない","そもそも時間が足りない"] },
  { id:"chronotype", q:"朝型？夜型？", opts:["朝型","夜型","日による"] },
  { id:"focus_when", q:"集中できるのはどんな時？", opts:["一人で静かな時","誰かと一緒の時","場所を変えた時","締切が近い時"] },
  { id:"motivation", q:"やる気の源は？", opts:["達成感","成長を感じること","人に認められること","ゲームのような楽しさ","締切のプレッシャー"] },
  { id:"quit_reason", q:"続かなくなるのは、たいてい？", opts:["完璧を求めすぎる","飽きてしまう","忙しくて忘れる","気分が乗らない"] },
  { id:"planning", q:"計画を立てるのは得意？", opts:["計画型（きっちり）","だいたい決める","衝動型（その場で）"] },
  { id:"tone", q:"どんな声かけが響く？", opts:["優しく応援してほしい","厳しめに喝を入れて","データで淡々と","一緒に伴走してほしい"], setting:"tone" },
  { id:"notify", q:"通知はどれくらい欲しい？", opts:["こまめに欲しい","ほどほどで","最小限でいい"], setting:"notify" },
  { id:"hours", q:"1日にどれくらい、目標に時間を使いたい？", opts:["30分","1時間","2時間","3時間以上"], setting:"hours" },
  { id:"weekpace", q:"どれくらいのペースで記録を続けたい？", opts:["毎日","週5日","週3日くらい","週2日でゆるく"], setting:"weekpace", hint:"毎日じゃなくて大丈夫。自分のペースで続けるのが一番です。" },
  { id:"future", q:"3ヶ月後、どうなっていたい？", opts:["良い習慣が身についている","目標に向けて成果が出ている","時間の使い方に迷わない","新しいことに挑戦できている"] },
  { id:"selftype", q:"自分を一言でいうと？", opts:["コツコツ型","短距離集中型","気分屋","完璧主義"] },
];
function OnboardingQuiz({onDone}){
  const [step,setStep]=useState(0);       // 0..questions-1, 質問。=length で結果画面
  const [answers,setAnswers]=useState({});
  const [saving,setSaving]=useState(false);
  const total=ONBOARDING_QUESTIONS.length;
  const pick=(qid,opt)=>{
    const next={...answers,[qid]:opt};
    setAnswers(next);
    setTimeout(()=>setStep(s=>s+1),180); // 選んだら少し間を置いて自動で次へ
  };
  const back=()=>setStep(s=>Math.max(0,s-1));

  const finish=async()=>{
    setSaving(true);
    // 読める要約テキストを作ってサーバーへ（AIコーチの文脈に流れる）
    const profileText=ONBOARDING_QUESTIONS.filter(q=>answers[q.id]).map(q=>q.q.replace(/？$/,"")+"："+answers[q.id]).join(" / ");
    const tone=answers.tone||"";
    const notifyMap={"こまめに欲しい":1,"ほどほどで":2,"最小限でいい":6};
    const interval=notifyMap[answers.notify]||2;
    const hoursMap={"30分":0.5,"1時間":1,"2時間":2,"3時間以上":3};
    const goalHours=hoursMap[answers.hours];
    // 設定へ反映（目標時間はローカル、通知間隔はサーバー＋ローカル）
    if(goalHours){ localStorage.setItem("jiroku_daily_goal_hours",String(goalHours)); }
    // 週ペース目標（自分のペースで続ける土台）をローカルに保存
    const paceMap={"毎日":7,"週5日":5,"週3日くらい":3,"週2日でゆるく":2};
    const weekGoal=paceMap[answers.weekpace];
    if(weekGoal){ localStorage.setItem("jiroku_weekly_goal",String(weekGoal)); }
    const savedNotify=JSON.parse(localStorage.getItem("notifySettings")||'{"start":7,"end":23,"interval":2}');
    localStorage.setItem("notifySettings",JSON.stringify({...savedNotify,interval}));
    try{ await gasPostJson("saveOnboarding",{profile_text:profileText,coach_tone:tone,notify_interval:String(interval)}); }catch(e){}
    localStorage.setItem("onboarding_done","1");
    setSaving(false);
    onDone();
  };
  const skip=()=>{ localStorage.setItem("onboarding_done","skip"); onDone(); };

  // 結果画面: 回答に応じた「あなたへの活かし方」を出す
  if(step>=total){
    const lines=[];
    if(answers.motivation==="成長を感じること"||answers.motivation==="達成感") lines.push("毎晩のAIレポートで、あなたの「伸び」を点数と言葉で見える化します。");
    if(answers.struggle==="夜更かし・生活リズム") lines.push("生活リズムの乱れも記録から見えるので、AIコーチが無理なく整える手助けをします。");
    if(answers.struggle==="先延ばししてしまう") lines.push("朝の「今日のフォーカス」で、まず1つに絞って動き出せるようにします。");
    if(answers.tone==="厳しめに喝を入れて") lines.push("あなたの希望どおり、コーチは時にはっきりと喝を入れます。");
    if(answers.tone==="優しく応援してほしい") lines.push("あなたの希望どおり、コーチは優しく応援するトーンで寄り添います。");
    if(answers.weekpace&&answers.weekpace!=="毎日") lines.push(`記録は「${answers.weekpace}」のペースでOK。毎日じゃなくても、あなたが決めたペースを守れたかで見ていきます。`);
    if(lines.length<2) lines.push("記録が溜まるほど、AIがあなたの強み・クセ・時間の使い道を教えてくれます（気づきタブ）。");
    return html`<div style=${{position:"fixed",inset:0,height:"100dvh",background:"var(--bg)",zIndex:400,overflowY:"auto",display:"flex",flexDirection:"column"}}>
      <div style=${{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",padding:"32px 24px",maxWidth:440,margin:"0 auto",width:"100%"}}>
        <div style=${{fontSize:44,textAlign:"center",marginBottom:8}}>🎉</div>
        <div style=${{fontSize:22,fontWeight:800,textAlign:"center",marginBottom:6,color:"var(--text)"}}>ありがとう！準備完了です</div>
        <div style=${{fontSize:13.5,color:"var(--sub)",textAlign:"center",lineHeight:1.7,marginBottom:24}}>あなたのことを踏まえて、JIROKUが今日から伴走します。</div>
        ${lines.map((l,i)=>html`
          <div key=${i} style=${{display:"flex",gap:10,marginBottom:12,background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,padding:"13px 14px"}}>
            <span style=${{color:"var(--accent)",fontWeight:800,flexShrink:0}}>✓</span>
            <span style=${{fontSize:13,color:"var(--text)",lineHeight:1.7}}>${l}</span>
          </div>
        `)}
        <button class="btn" style=${{marginTop:14}} disabled=${saving} onClick=${finish}>${saving?"保存中…":"はじめる"}</button>
      </div>
    </div>`;
  }

  const cur=ONBOARDING_QUESTIONS[step];
  return html`<div style=${{position:"fixed",inset:0,height:"100dvh",background:"var(--bg)",zIndex:400,display:"flex",flexDirection:"column"}}>
    <div style=${{padding:"18px 20px 0",maxWidth:440,margin:"0 auto",width:"100%",boxSizing:"border-box"}}>
      <div style=${{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
        ${step>0?html`<button onClick=${back} style=${{background:"none",border:"none",fontSize:20,color:"var(--sub)",cursor:"pointer",padding:0}}>‹</button>`:html`<div style=${{width:20}}/>`}
        <div style=${{flex:1,height:6,background:"var(--border)",borderRadius:99,overflow:"hidden"}}>
          <div style=${{height:"100%",width:((step)/total*100)+"%",background:"var(--accent)",borderRadius:99,transition:"width .3s ease"}}/>
        </div>
        <div style=${{fontSize:12,color:"var(--sub)",fontWeight:600,minWidth:38,textAlign:"right"}}>${step+1}/${total}</div>
      </div>
    </div>
    <div style=${{flex:1,overflowY:"auto",padding:"8px 20px 24px",maxWidth:440,margin:"0 auto",width:"100%",boxSizing:"border-box"}}>
      ${step===0&&html`<div style=${{fontSize:12.5,color:"var(--sub)",lineHeight:1.7,marginBottom:16,background:"var(--accent-l)",borderRadius:12,padding:"12px 14px"}}>最初に、あなたのことを少しだけ教えてください。答えに合わせてコーチングをあなた仕様にします（1〜2分・直感でOK）。</div>`}
      <div style=${{fontSize:19,fontWeight:800,color:"var(--text)",lineHeight:1.5,marginBottom:cur.hint?8:20}}>${cur.q}</div>
      ${cur.hint&&html`<div style=${{fontSize:12.5,color:"var(--sub)",lineHeight:1.6,marginBottom:18}}>${cur.hint}</div>`}
      <div style=${{display:"flex",flexDirection:"column",gap:10}}>
        ${cur.opts.map((o,i)=>{
          const on=answers[cur.id]===o;
          return html`<button key=${i} onClick=${()=>pick(cur.id,o)}
            style=${{textAlign:"left",padding:"15px 16px",borderRadius:14,border:`1.5px solid ${on?"var(--accent)":"var(--border)"}`,background:on?"var(--accent-l)":"var(--card)",color:on?"var(--accent)":"var(--text)",fontSize:15,fontWeight:on?700:500,cursor:"pointer",fontFamily:"inherit",transition:"all .12s"}}>
            ${o}
          </button>`;
        })}
      </div>
    </div>
    <div style=${{padding:"0 20px calc(20px + env(safe-area-inset-bottom))",maxWidth:440,margin:"0 auto",width:"100%",boxSizing:"border-box"}}>
      <button onClick=${skip} style=${{width:"100%",background:"none",border:"none",color:"var(--sub)",fontSize:12.5,cursor:"pointer",fontFamily:"inherit",padding:10}}>スキップして始める</button>
    </div>
  </div>`;
}

const UNSUPPORTED_PUSH_ERROR = "このブラウザはプッシュ通知に対応していません";
function TutorialOverlay({onDone}) {
  // ホーム画面から既に開いている場合は「ホーム画面に追加」の案内を飛ばす
  const [steps] = useState(()=>TUTORIAL_STEPS.filter(s=>!s.skipIf || !s.skipIf()));
  const [step,setStep]=useState(0);
  const [pushDone,setPushDone]=useState(()=>!!localStorage.getItem("push_enabled"));
  const [pushLoading,setPushLoading]=useState(false);
  const [pushError,setPushError]=useState("");
  const isLast = step === steps.length - 1;
  const s = steps[step];
  const Mock = s.mock;
  const isPushStep = !!s.pushStep && !pushDone;
  // ブラウザが技術的に非対応な場合だけ、詰まらないようスキップできるようにする
  const isUnsupported = pushError === UNSUPPORTED_PUSH_ERROR;

  const doEnablePush=async()=>{
    setPushLoading(true); setPushError("");
    try{
      const r=await enablePushNotifications();
      if(r.ok){ setPushDone(true); setStep(step+1); }
      else setPushError(r.error||"有効化に失敗しました。もう一度お試しください");
    }catch(e){
      // ここに来ることは無いはずだが、万一例外が漏れても「設定中...」のまま
      // 固まらないようにする
      setPushError(String(e && e.message || e) || "有効化に失敗しました。もう一度お試しください");
    }
    setPushLoading(false);
  };

  return html`
    <div style=${{position:"fixed",inset:0,background:"var(--bg)",zIndex:400,display:"flex",flexDirection:"column"}}>
      <div style=${{display:"flex",justifyContent:"flex-end",padding:"14px 16px"}}>
        ${!isPushStep&&html`<button onClick=${onDone} style=${{background:"none",border:"none",color:"var(--sub)",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>スキップ</button>`}
      </div>
      <div style=${{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"0 28px",textAlign:"center"}}>
        <div style=${{marginBottom:22}}><${Mock}/></div>
        <div style=${{fontSize:19,fontWeight:800,color:"var(--text)",marginBottom:14}}>${s.title}</div>
        <div style=${{fontSize:14,lineHeight:1.9,color:"var(--sub)",maxWidth:320,whiteSpace:"pre-line"}}>${s.body}</div>
        ${isPushStep&&pushError&&html`<div style=${{marginTop:12,fontSize:12.5,color:"var(--red, #e05555)"}}>${pushError}</div>`}
      </div>
      <div style=${{display:"flex",justifyContent:"center",gap:6,marginBottom:20}}>
        ${steps.map((_,i)=>html`<div key=${i} style=${{width:i===step?18:6,height:6,borderRadius:99,background:i===step?"var(--accent)":"var(--border)",transition:"width .2s"}}/>`)}
      </div>
      <div style=${{padding:"0 24px 32px"}}>
        ${isPushStep
          ? html`<button class="btn" disabled=${pushLoading} onClick=${doEnablePush}>${pushLoading?"設定中...":"プッシュ通知を有効にする"}</button>`
          : html`<button class="btn" onClick=${()=>isLast?onDone():setStep(step+1)}>${isLast?"さっそく記録する":"次へ"}</button>`
        }
        ${isPushStep&&isUnsupported&&html`
          <button onClick=${()=>{setPushError("");setStep(step+1);}}
            style=${{width:"100%",background:"none",border:"none",color:"var(--sub)",fontSize:12.5,padding:"10px",cursor:"pointer",fontFamily:"inherit"}}>
            このブラウザでは使えないので次へ進む
          </button>
        `}
      </div>
    </div>
  `;
}

// 月1回の満足度アンケート。星1〜5＋任意コメントだけの30秒設計。
// 結果はコーチCRMの管理者ダッシュボード（運営メトリクス）に集計される
function SurveyModal({onDone,onLater}){
  const [stars,setStars]=useState(0);
  const [comment,setComment]=useState("");
  const [sending,setSending]=useState(false);
  const submit=async()=>{
    if(!stars||sending) return;
    setSending(true);
    const r=await gasPostJson("submitSurvey",{satisfaction:String(stars),comment});
    setSending(false);
    if(r.ok) onDone();
    else onLater(); // 失敗時は静かに閉じて後日再表示（ユーザーを煩わせない）
  };
  return html`
    <div style=${{position:"fixed",inset:0,height:"100dvh",background:"rgba(0,0,0,0.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:600,padding:20}}
      onClick=${e=>{if(e.target===e.currentTarget)onLater();}}>
      <div style=${{background:"var(--card)",borderRadius:20,width:"100%",maxWidth:360,padding:"26px 22px 22px",textAlign:"center"}}>
        <div style=${{fontSize:34,marginBottom:8}}>💬</div>
        <div style=${{fontSize:17,fontWeight:800,color:"var(--text)",marginBottom:6}}>JIROKU、最近どうですか？</div>
        <div style=${{fontSize:12.5,color:"var(--sub)",lineHeight:1.7,marginBottom:16}}>月1回だけの簡単アンケートです。<br/>30秒で終わります🙏</div>
        <div style=${{display:"flex",justifyContent:"center",gap:8,marginBottom:16}}>
          ${[1,2,3,4,5].map(n=>html`
            <button key=${n} onClick=${()=>setStars(n)}
              style=${{background:"none",border:"none",fontSize:32,cursor:"pointer",padding:2,filter:n<=stars?"none":"grayscale(1) opacity(0.35)",transition:"filter .15s"}}>⭐</button>
          `)}
        </div>
        <textarea value=${comment} onInput=${e=>setComment(e.target.value)}
          placeholder="改善してほしいこと・気に入っている点など（任意）"
          style=${{width:"100%",boxSizing:"border-box",minHeight:70,border:"1.5px solid var(--border)",borderRadius:12,padding:"10px 12px",fontSize:13,fontFamily:"inherit",color:"var(--text)",background:"var(--bg)",resize:"none",marginBottom:14}}/>
        <button class="btn" disabled=${!stars||sending} onClick=${submit} style=${{opacity:stars?1:0.5}}>
          ${sending?"送信中...":"送信する"}
        </button>
        <button onClick=${onLater}
          style=${{display:"block",width:"100%",marginTop:8,background:"none",border:"none",color:"var(--sub)",fontSize:12.5,cursor:"pointer",fontFamily:"inherit",padding:8}}>あとで</button>
      </div>
    </div>
  `;
}

// 独り言（クイック記録）シート。話す/書くだけで、AIが構造化して即保存する
// ★話したら、待たせない★（2026-08-18 Kai指摘）
//   これまでは「送る」を押してから、AIの仕分けとシートへの書き込みが
//   全部終わるまで画面が止まっていた（実測で15〜21秒）。
//   手入力の記録はとっくに裏送りにしてあったのに、独り言だけ待たせていた。
//   ここでは送った瞬間に画面を返し、書き込みはうしろで続ける。
//   失敗したときだけ、話した文をそのまま戻して出し直せるようにする。
const QL_FAILED_LS = "ql_failed";
function runQuickLogInBackground(t, date, onToast){
  gasPostJson("quickLog", date ? {text:t, date:date} : {text:t}).then(r=>{
    if(!(r&&r.ok)){
      try{ localStorage.setItem(QL_FAILED_LS, JSON.stringify({text:t, date:date||""})); }catch(e){}
      onToast((r&&r.error)||"記録できませんでした。🎙をもう一度押すと、話した内容が残っています");
      return;
    }
    try{ localStorage.removeItem(QL_FAILED_LS); }catch(e){}
    const s=r.saved||{}, cnt=r.count||1;
    let msg;
    if(r.fallback) msg="記録しました（内容はそのまま保存しました）";
    else if(cnt>1) msg=cnt+"件記録しました";
    else msg="記録しました："+(s.task||"記録")+(s.focus_level?"（集中"+s.focus_level+"）":"");
    if(r.xp_gained){ msg+=" +"+r.xp_gained+"XP"; if(r.level_up)msg+=" Lv."+r.level+"！"; }
    onToast(msg);
    setTimeout(()=>announceJiroFound(r), 1200);
    // 記録一覧・ホームを、書き終わった時点で取り直す
    try{ window.dispatchEvent(new CustomEvent("jiroku:logsaved")); }catch(e){}
    try{
      if(localStorage.getItem("cal_linked") && Array.isArray(r.savedAll)){
        r.savedAll.forEach(rec=>{
          const tb = String(rec.time_block||""); if(!tb) return;
          const dateStr = String(rec.date||"").slice(0,10) || formatDateStr(new Date());
          const [startHM, endHM] = tb.split("-");
          const stt = new Date(dateStr+"T"+startHM.slice(0,5)+":00"); if(isNaN(stt)) return;
          const ett = endHM ? new Date(dateStr+"T"+endHM.slice(0,5)+":00") : null;
          const endDt = (ett && ett>stt) ? ett : new Date(stt.getTime()+3600000);
          upsertCalendarEvent(dateStr, tb, stt.toISOString(), endDt.toISOString(), rec.task||"記録", null, false, rec.time_classification||"");
        });
      }
    }catch(e){}
  }).catch(()=>{
    try{ localStorage.setItem(QL_FAILED_LS, JSON.stringify({text:t, date:date||""})); }catch(e){}
    onToast("通信が届きませんでした。🎙をもう一度押すと、話した内容が残っています");
  });
}

        <div style=${{background:"var(--bg)",border:"1px solid var(--border)",borderRadius:11,

          ${dayBack>0&&html`

function App() {
  // 起動を速くするため、ログイン済みキャッシュがあれば即アプリを表示する。
  // アカウントの存在確認はバックグラウンドで行い、消えていた場合だけログアウトさせる
  const [user,setUser]=useState(CURRENT_USER);
  const [tab,setTab]=useState("home");
  // セッションを持っていない既存ログイン者に、一度だけ入り直してもらう。
  // サーバーがまだ認証段階に入っていない(LEGACY)なら何もしない
  const [needsReauth,setNeedsReauth]=useState(()=>{
    // サーバーに SESSION_INVALID で弾かれた直後は、その場で再ログインへ誘導する。
    // 従来は「トークンを持っていない人」しか対象にしていなかったため、
    // 失効したトークンを持ったまま使い続けられてしまった
    try { return localStorage.getItem("jiroku_reauth_needed")==="1"; } catch { return false; }
  });
  // 通信中に失効した場合も、画面を切り替える（次の操作まで待たせない）
  // ★戻す側も必ず用意する★
  // 出す側だけを作ると、ログインに成功しても再ログイン画面から抜けられない。
  // 2026-08-01、まさにこれで「ログイン → サインイン画面へ戻る」の
  // 無限ループを本番で発生させた。出す条件を書いたら、必ず消す条件も書く。
  useEffect(()=>{
    const on=()=>setNeedsReauth(true);
    const off=()=>setNeedsReauth(false);
    window.addEventListener("jiroku:reauth",on);
    window.addEventListener("jiroku:authed",off);
    return ()=>{ window.removeEventListener("jiroku:reauth",on);
                 window.removeEventListener("jiroku:authed",off); };
  },[]);
  // セッションを持っている状態で預かり分が残っていれば、起動時にやり直す
  useEffect(()=>{
    if(!getSessionToken() || pendingOpCount()===0) return;
    (async()=>{
      const r=await flushPendingOps();
      if(r.done>0) setToast("保存できていなかった記録を"+r.done+"件、反映しました");
    })();
  },[]);
  // 3か月目標があるかを確かめる。取得できたときだけ判定する
  useEffect(()=>{
    if(!user || needsReauth) return;
    let alive = true;
    gasApi("getGoalTree").then(r=>{
      if(!alive) return;
      if(r && r.ok && r.data && Array.isArray(r.data.goals)){
        const n = r.data.goals.filter(g=>String(g.status||"ACTIVE").toUpperCase()!=="ARCHIVED").length;
        setGoalsProbe(n);
      }
      // 失敗時は null のまま＝ゲートを出さない（締め出さない）
    }).catch(()=>{});
    return ()=>{ alive = false; };
  },[user, needsReauth]);

  useEffect(()=>{
    if(getSessionToken()) return;
    (async()=>{
      let mode=rememberedAuthMode();
      try{
        const u=new URL(GAS_URL); u.searchParams.set("action","authConfig");
        const cfg=await (await fetch(u.toString())).json();
        if(cfg&&cfg.ok&&cfg.auth_mode) mode=noteAuthMode(cfg.auth_mode);
      }catch{ return; }   // 通信できない時は促さない（オフラインで締め出さない）
      // ★この判定は通信を挟むので、その間にログインが完了していることがある★
      // 開始時点では未ログインでも、応答が返る頃には成功しているという順序。
      // 確認し直さないと、ログイン直後に再ログイン画面を出してしまう。
      if(getSessionToken()) return;
      if((AUTH_RANK[mode]||0)>=1) setNeedsReauth(true);
    })();
  },[]);
  const [toast,setToast]=useState(null);
  const [bannerDismissed,setBannerDismissed]=useState(false);
  // ★連携が終わったら、案内はひとりでに消える★
  //   以前は連携が完了しても、アプリを開き直すまで黄色い帯が出たままだった。
  //   未連携のあいだだけ、画面に戻ったときと30秒ごとに状態を見に行く。
  useEffect(()=>{
    if(!user || user.lineLinked!==false) return;
    let alive=true;
    const check=async()=>{ if(!alive) return; const linked=await recheckUser(); if(linked) alive=false; };
    const onVis=()=>{ if(!document.hidden) check(); };
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("focus", check);
    const t=setInterval(check, 30000);
    return ()=>{ alive=false; clearInterval(t); document.removeEventListener("visibilitychange", onVis); window.removeEventListener("focus", check); };
  },[user && user.lineLinked]);
  // 学生向け必須セットアップ（ホーム画面追加＋LINE連携）。PC等でどうしてもできない人用に
  // 目立たないスキップだけ用意（セッション内のみ・次回開くとまた出る）
  const [setupSkipped,setSetupSkipped]=useState(false);
  // 3か月目標があるか。null=未確認（この間はゲートを出さない）
  const [goalsProbe,setGoalsProbe]=useState(null);
  // 「あとで決める」を選んだ人には、しばらく出さない（7日）。
  // 閉じ込めないための猶予であって、目標が要らないという意味ではない
  const [firstGoalDone,setFirstGoalDone]=useState(()=>{
    try{
      const d=localStorage.getItem("first_goal_skipped");
      if(!d) return false;
      return (Date.now()-new Date(d+"T00:00:00+09:00").getTime()) < 7*86400000;
    }catch(e){ return false; }
  });
  // LINE連携できたかをその場で再確認して、ゲートを進めるための再取得
  const recheckUser = async () => {
    try {
      const r=await authedApi("getUser");
      if(r.ok&&r.data){
        const u={...CURRENT_USER, lineLinked:r.data.lineLinked===undefined?true:!!r.data.lineLinked, cohort:r.data.cohort||"", recordDays:(r.data.recordDays===undefined?null:r.data.recordDays), goalsV1:!!r.data.goalsV1};
        CURRENT_USER=u; localStorage.setItem("edventure_user",JSON.stringify(u)); setUser(u);

    pendingReload = true; safeReload();
  }
  // ★起動直後にも必ず確認する★（2026-08-05 Kai報告「アプリが変わってない」）
  //
  //   Service Workerをキャッシュ優先にしたので、起動時に表示されるのは
  //   「前回の版」で、新しい版は裏で取り直して次回に回る。
  //   そこで起動直後の確認まで外してしまったため、直したものが
  //   次に開き直すまで届かなくなっていた（実際にそうなった）。
  //
  //   確認するのは version.json（数十バイト）だけなので、起動を邪魔しない。
  //   画面を出しきってから動くよう、少しだけ遅らせて実行する。
  setTimeout(function(){ checkAppUpdate(); }, 1500);
  const runUpdateCheck = () => {
    // 新版が見つかっているが入力中で保留していた場合、手が空いた今のタイミングで再読み込み
    if (pendingReload && !swReloaded){ safeReload(); if (swReloaded) return; }
    navigator.serviceWorker.getRegistration().then(reg => { if (reg) reg.update(); }).catch(()=>{});
    checkAppUpdate();
  };
  // スマホはアプリ切替でvisibilitychangeが頻繁に発火し更新されるが、PCでタブを
  // 開きっぱなしにするとvisibilitychangeが起きず、更新が止まって「PCだけ古い」状態に
  // なっていた。①タブ/ウィンドウが可視化された時 ②別ウィンドウから戻って再フォーカス
  // した時（PCの主要ケース）③定期チェック、の3経路で新バージョンを取りに行く
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') runUpdateCheck(); });
  window.addEventListener('focus', runUpdateCheck);
  setInterval(() => { if (document.visibilityState === 'visible') runUpdateCheck(); }, 5*60*1000);
  // 入力欄から手が離れた／モーダルを閉じた直後に、保留していた更新があれば反映する
  document.addEventListener('focusout', () => { if (pendingReload) setTimeout(() => { if (!swReloaded && pendingReload && !isUserBusy()) safeReload(); }, 600); });
}
</script>
</body>
</html>
